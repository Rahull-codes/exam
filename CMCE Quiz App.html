<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMCE Quiz App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#eef1f7;--sf:#fff;--sf2:#f5f7fc;--ink:#10192e;--mut:#5b6784;--ln:#d9dfec;--ac:#2b4bff;--acs:#e6ebff;--ok:#0f8a5f;--oks:#dcf5ea;--bad:#c62f3a;--bads:#fde6e8;--wn:#a8620a;--wns:#fff0d6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1120;--sf:#151c30;--sf2:#1b2440;--ink:#e8ecf7;--mut:#9aa6c4;--ln:#2a3556;--ac:#8aa0ff;--acs:#222d5a;--ok:#46d39c;--oks:#12382d;--bad:#ff7b86;--bads:#40181d;--wn:#f0b45a;--wns:#3b2a10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1120;--sf:#151c30;--sf2:#1b2440;--ink:#e8ecf7;--mut:#9aa6c4;--ln:#2a3556;--ac:#8aa0ff;--acs:#222d5a;--ok:#46d39c;--oks:#12382d;--bad:#ff7b86;--bads:#40181d;--wn:#f0b45a;--wns:#3b2a10;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px;padding:10px 16px}
header h1{font-size:1.1rem;margin:0;flex:1;cursor:pointer;letter-spacing:-.01em}
header h1 span{color:var(--ac)}
main{max-width:860px;margin:0 auto;padding:16px}
h2{font-size:1.2rem;margin:28px 0 12px}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
:root[data-theme="dark"] .btn{color:#0c1120}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0c1120}}
.btn.g{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5rem}.stat small,.mut{color:var(--mut)}
.sub h3{margin:0 0 2px;font-size:1.05rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
select{background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:8px;max-width:100%;flex:1;min-width:120px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--sf2);border:1px solid var(--ln)}
.l0{background:var(--oks);color:var(--ok)}.l1{background:var(--wns);color:var(--wn)}.l2{background:var(--bads);color:var(--bad)}
.bar{height:8px;background:var(--sf2);border-radius:9px;overflow:hidden;border:1px solid var(--ln)}
.bar i{display:block;height:100%;background:var(--ac)}
.qh{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.qt{font-size:1.12rem;font-weight:500;margin:12px 0;white-space:pre-wrap}
pre{background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:12px;overflow-x:auto;font:.9rem/1.5 "IBM Plex Mono",ui-monospace,Consolas,monospace;margin:8px 0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:12px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--ac)}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt.sel{border-color:var(--ac);background:var(--acs)}.opt.sel .bub{background:var(--ac);border-color:var(--ac);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--oks)}.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bads)}.opt.bad .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.gone{opacity:.35;text-decoration:line-through}
.opt span:last-child{white-space:pre-wrap;word-break:break-word;min-width:0}
.hint{background:var(--wns);color:var(--wn);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.sol{background:var(--oks);border-left:6px solid var(--ok);border-radius:10px;padding:16px;margin:14px 0}
.sol .sa{font-size:1.2rem;font-weight:700;margin-bottom:8px}
.sol .se{font-size:1.1rem;line-height:1.65}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:14px}
.pal button{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:6px 0;font-weight:600}
.pal .a{background:var(--acs);border-color:var(--ac)}.pal .f{background:var(--wns);border-color:var(--wn)}.pal .c{outline:2px solid var(--ink)}
.timer{font:600 1rem "IBM Plex Mono",monospace;background:var(--sf2);border:1px solid var(--ln);padding:4px 10px;border-radius:8px}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto}
.ring div{width:114px;height:114px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-size:1.9rem;font-weight:700}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.br{display:grid;grid-template-columns:minmax(120px,1.4fr) 2fr 52px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.rv{margin:12px 0}.rv.w{border-left:5px solid var(--bad)}.rv.r{border-left:5px solid var(--ok)}.rv.s{border-left:5px solid var(--wn)}
.hr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:.92rem}
@media(max-width:520px){main{padding:12px}.br{grid-template-columns:1fr 52px}.br .bar{grid-column:1/-1;order:3}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style></head><body>
<header><h1 id="home">CMCE <span>Quiz</span></h1><button class="btn g" id="th" aria-label="Toggle theme">🌓</button></header>
<main id="app"></main>
<script>
const D={"s":{"ads":{"n":"Algorithms & Data Structures","i":"🌲"},"cpp":{"n":"C++ Programming","i":"⚙️"},"dbms":{"n":"DBMS (MySQL / MongoDB)","i":"🗄️"},"java":{"n":"Core Java","i":"☕"},"web":{"n":"Web Technology","i":"🌐"}},"q":[["ads","Problem Solving & Computational Thinking","","Which of the following best describes Computational Thinking?","","",["Writing code in a programming language","A problem-solving approach using abstraction, decomposition, pattern recognition, and algorithms","Using a computer to perform calculations","Designing hardware circuits for computation"],1,"Computational Thinking is a methodology, not coding. Its four pillars are decomposition, pattern recognition, abstraction, and algorithm design — applicable even without a computer.",1],["ads","Problem Solving & Computational Thinking","","What is the FIRST step in a structured problem-solving process?","","",["Designing an algorithm","Testing the solution","Defining and understanding the problem","Writing pseudocode"],2,"You cannot solve what you haven't clearly defined. Problem definition includes identifying inputs, outputs, constraints, and goals before any solution is attempted.",2],["ads","Problem Solving & Computational Thinking","","Decomposition in computational thinking means:","","",["Breaking a complex problem into smaller, manageable sub-problems","Removing unnecessary variables from code","Sorting data into components","Compiling source code into bytecode"],0,"Decomposition divides a large problem into sub-problems that are easier to understand, solve, and maintain independently — one of the four pillars of computational thinking.",3],["ads","Problem Solving & Computational Thinking","","A student builds a library system by splitting it into: book search, member registration, and fine calculation. Which CT technique is this?","","",["Pattern Recognition","Abstraction","Decomposition","Algorithm Design"],2,"Breaking the system into independent functional modules is classic Decomposition — dividing the whole problem into smaller, solvable units.",4],["ads","Problem Solving & Computational Thinking","","Abstraction in computational thinking refers to:","","",["Writing abstract classes in Java","Focusing on essential details while hiding irrelevant complexity","Converting high-level code to machine code","Storing data in abstract data types only"],1,"Abstraction filters out unnecessary details and focuses only on what is relevant to solving the problem. A map, for example, abstracts real geography to just roads and landmarks.",5],["ads","Problem Solving & Computational Thinking","","Which is the CORRECT order of a structured problem-solving approach?","","",["Code → Test → Define → Design","Define → Analyze → Design Solution → Implement → Test","Test → Implement → Analyze → Define","Design → Define → Implement → Analyze"],1,"The standard lifecycle is: Define → Analyze → Design → Implement → Test & Evaluate. Skipping steps leads to flawed or unscalable solutions.",6],["ads","Problem Solving & Computational Thinking","","Pattern Recognition helps in problem solving because:","","",["It eliminates the need for loops in code","Identifying similarities with solved problems allows reuse of known solutions","It automatically generates algorithms","It reduces memory usage in programs"],1,"When you recognize that a new problem resembles a past one, you can adapt existing solutions. E.g., recognizing a scheduling problem as a graph problem lets you apply known graph algorithms.",7],["ads","Problem Solving & Computational Thinking","","A developer uses GPS coordinates via an API without knowing how satellites work internally. This is an example of:","","",["Decomposition","Pattern Recognition","Abstraction","Algorithm Design"],2,"She hides irrelevant complexity (satellite mechanics) and focuses on what matters (coordinates). This is real-world abstraction in problem solving.",8],["ads","Problem Solving & Computational Thinking","","When evaluating multiple solutions, which criterion is LEAST important during initial selection?","","",["Correctness of the solution","Efficiency (time and space)","The programmer's favorite language","Feasibility within given constraints"],2,"Solution selection must be based on correctness, efficiency, and feasibility — not personal preference for a language or tool. Bias toward a language is not a valid technical criterion.",9],["ads","Problem Solving & Computational Thinking","","A team maps the current bank process, finds bottlenecks, and lists budget/staff constraints before writing any code. Which phase are they in?","","",["Implementation","Testing","Problem Identification and Analysis","Deployment"],2,"Mapping current processes, finding bottlenecks, and listing constraints are all part of Problem Identification and Analysis — the critical phase before solution design begins.",10],["ads","Algorithms & Data Structures","","What is the Big O notation of accessing an element in an array by index?","","",["O(n)","O(log n)","O(1)","O(n²)"],2,"Array index access is O(1) — constant time — because arrays store elements in contiguous memory, allowing direct address calculation: base_address + index × element_size.",1],["ads","Algorithms & Data Structures","","An Abstract Data Type (ADT) is best described as:","","",["A data structure implemented in C++","A mathematical model specifying data and operations without implementation details","A primitive data type like int or float","A class that uses abstract keyword"],1,"An ADT defines WHAT operations are supported and their behavior, not HOW they are implemented. Stack as an ADT defines push/pop/peek without dictating array or linked-list use.",2],["ads","Algorithms & Data Structures","","Which data structure follows the LIFO (Last In, First Out) principle?","","",["Queue","Array","Stack","Circular Queue"],2,"A Stack follows LIFO — the last element pushed is the first to be popped. Real-world analogy: a stack of plates. Used in function call management, undo operations, expression evaluation.",3],["ads","Algorithms & Data Structures","","What is the time complexity of push and pop operations on a stack implemented using an array?","","",["O(n) for both","O(1) for both","O(log n) for both","O(n) push, O(1) pop"],1,"Both push and pop in an array-based stack are O(1) — they always operate on the top element (tracked by a 'top' pointer), requiring no traversal.",4],["ads","Algorithms & Data Structures","","In a standard Queue, elements are inserted at the _____ and removed from the _____.","","",["Front, Rear","Rear, Front","Front, Front","Rear, Rear"],1,"Queue follows FIFO: enqueue (insert) happens at the Rear, dequeue (remove) happens at the Front — just like a real-world checkout line.",5],["ads","Algorithms & Data Structures","","What problem does a Circular Queue solve over a linear queue implemented with an array?","","",["It allows LIFO ordering","It prevents false overflow by reusing vacated front positions","It increases the size dynamically","It allows random access to elements"],1,"In a linear queue, after multiple dequeues, front slots are wasted even when the array isn't full — causing false overflow. A circular queue reuses these positions by wrapping the rear pointer using modulo arithmetic.",6],["ads","Algorithms & Data Structures","","Worst-case time complexity of: for(i=0;i<n;i++) { for(j=0;j<n;j++) { print(i+j); } }","","",["O(n)","O(n log n)","O(n²)","O(2n)"],2,"Two nested loops each running n times gives n × n = n² iterations. This is O(n²) — quadratic time complexity. Each additional nesting multiplies the complexity by n.",7],["ads","Algorithms & Data Structures","","Which of the following correctly implements a stack push operation using an array in Java?","","",["arr[++top] = data;","arr[top++] = data;","arr[top] = data; top--;","arr[--top] = data;"],0,"arr[++top] = data first increments top (pre-increment), then stores data at the new top position. Option B stores first, then increments — placing data at the old top (index 0 initially), which is also acceptable but arr[++top] is the classic approach when top starts at -1.",8],["ads","Algorithms & Data Structures","","An OS uses a data structure to manage function calls — when a function is called, its","context is saved; when it returns, the previous context is restored. Which data structure is\nused?","",["Queue","Call Stack","Circular Queue","Array"],1,"The Call Stack uses LIFO — each function call pushes a frame, and returning pops it. This is why in recursion, the call chain grows the stack and unwinds on returns.",9],["ads","Algorithms & Data Structures","","What is the space complexity of an array-based circular queue of fixed capacity n?","","",["O(1)","O(log n)","O(n)","O(n²)"],2,"A circular queue allocates a fixed array of size n regardless of the number of elements currently stored. Hence, space complexity is O(n) — linear in the capacity of the queue.",10],["ads","Linked List Data Structures","","What is the primary advantage of a Linked List over an Array?","","",["Faster random access by index","Dynamic size — no need to declare size in advance","Better cache performance","Constant time search"],1,"Linked lists allocate memory dynamically per node, so size can grow/shrink at runtime. Arrays require size declaration upfront and have fixed capacity unless resized (costly).",1],["ads","Linked List Data Structures","","In a Singly Linked List, each node contains:","","",["Only data","Data and a pointer to the previous node","Data and a pointer to the next node","Data and pointers to both next and previous nodes"],2,"A singly linked list node has two parts: data and a 'next' pointer pointing to the subsequent node. The last node's next is null, marking the end of the list.",2],["ads","Linked List Data Structures","","What distinguishes a Doubly Linked List from a Singly Linked List?","","",["Doubly linked list stores more data per node","Each node has pointers to both next and previous nodes","Doubly linked list can only traverse forward","Doubly linked list uses arrays internally"],1,"In a doubly linked list, each node has both a 'next' and 'prev' pointer, enabling bidirectional traversal. This allows efficient deletion without traversing from the head.",3],["ads","Linked List Data Structures","","In a Circular Linked List, the last node's next pointer points to:","","",["null","Itself","The head node","The second node"],2,"In a circular linked list, the last node's next pointer points back to the head, forming a circle. There is no null terminator, making it useful for round-robin scheduling.",4],["ads","Linked List Data Structures","","What is the time complexity of inserting a node at the beginning of a Singly Linked List?","","",["O(n)","O(log n)","O(1)","O(n²)"],2,"Inserting at the beginning only requires: create new node, set new.next = head, update head = new node. This is O(1) — no traversal needed.",5],["ads","Linked List Data Structures","","You need to implement a Stack using a Linked List. Which end of the list should be the 'top' of the stack for O(1) push and pop?","","",["The tail (last node)","The head (first node)","The middle node","Either end, both are O(1)"],1,"Using the head as the top: push = insert at head (O(1)), pop = remove head (O(1)). Using the tail for pop on a singly linked list requires O(n) traversal to find the second-to-last node.",6],["ads","Linked List Data Structures","","When should you prefer an Array over a Linked List?","","",["When frequent insertions/deletions at middle positions are needed","When size is unknown at compile time","When frequent random access by index is required","When memory overhead must be minimized for pointers"],2,"Arrays provide O(1) random access by index. Linked lists require O(n) traversal to reach the nth element. For read-heavy, index-based access, arrays are superior.",7],["ads","Linked List Data Structures","","What is the output direction when traversing a Singly Linked List with head → 10 → 20 → 30 → null?","","",["30 → 20 → 10","10 → 20 → 30","20 → 10 → 30","30 → 10 → 20"],1,"Traversal starts at head and follows 'next' pointers sequentially: 10 → 20 → 30. To reverse traversal order in a singly linked list, you'd need to reverse the list or use a stack.",8],["ads","Linked List Data Structures","","To implement a Circular Queue using a Linked List, which condition indicates the queue is EMPTY?","","",["front == rear","front == null","rear.next == front","rear == null"],1,"When front is null, there are no nodes in the queue — it's empty. When the queue has elements, front points to the first node and rear.next points back to front (circular linkage).",9],["ads","Linked List Data Structures","","A memory-constrained embedded system needs a fixed-size buffer for streaming audio data with FIFO access. Which is the BEST data structure?","","",["Singly Linked List","Doubly Linked List","Array-based Circular Queue","Binary Search Tree"],2,"A circular queue uses a fixed array (no pointer overhead per element), provides O(1) enqueue/dequeue, and naturally reuses buffer slots — ideal for streaming/buffering in memory-constrained systems.",10],["ads","Recursion","","What is recursion in programming?","","",["A loop that repeats a block of code","A function that calls itself directly or indirectly to solve a problem","A method that calls another class's method","A way to define multiple constructors"],1,"Recursion is a technique where a function solves a problem by calling itself with a smaller/simpler version of the same problem, until a base condition terminates the calls.",1],["ads","Recursion","","What is the BASE CONDITION in recursion?","","",["The first recursive call","The condition that stops the recursion and returns a value without further calls","The largest input the function can handle","The condition that triggers the recursive call"],1,"Without a base condition, recursion never terminates, causing a StackOverflowError. The base case is the simplest problem instance that can be solved directly — e.g., factorial(0) = 1.",2],["ads","Recursion","","What is DIRECT recursion?","","",["Function A calls function B which calls function A","A function calls itself directly","A loop calling a function repeatedly","A function calling a built-in library function"],1,"Direct recursion: function f() calls f() within its own body. Indirect recursion: f() calls g() which calls f(). Both require base conditions to terminate.",3],["ads","Recursion","","What happens to the call stack when a recursive function is called?","","",["A new stack frame is pushed for each recursive call","All calls share a single stack frame","The stack is cleared before each recursive call","The heap is used to store recursive calls"],0,"Each recursive call creates a new stack frame containing the function's local variables and return address. Frames are pushed on call and popped on return — this is why deep recursion can cause StackOverflow.",4],["ads","Recursion","","What is the output? — void f(int n){ if(n==0) return; print(n); f(n-1); } called as f(3):","","",["1 2 3","3 2 1","0 1 2 3","3 3 3"],1,"f(3) prints 3, then calls f(2) which prints 2, then f(1) prints 1, then f(0) hits base case and returns. Output: 3 2 1. The print is BEFORE the recursive call.",5],["ads","Recursion","","What is the time complexity of a naive recursive Fibonacci — fib(n) = fib(n-1) + fib(n-2)?","","",["O(n)","O(n log n)","O(2^n) exponential","O(log n)"],2,"Each call branches into two sub-calls. The recursion tree has approximately 2^n nodes, making it exponential — O(2^n). Many sub-problems are recomputed, which is why memoization is needed.",6],["ads","Recursion","","Which of the following correctly computes factorial recursively in Java?","","",["int f(int n){ return n * f(n); }","int f(int n){ if(n==0) return 1; return n * f(n-1); }","int f(int n){ if(n==1) return n; return f(n+1); }","int f(int n){ return f(n) * f(n-1); }"],1,"Option B has a correct base case (n==0 → 1) and correct recursive step (n * f(n-1)). Option A has no base case (infinite), C increments n (never reaches base), D is infinite recursion.",7],["ads","Recursion","","What is INDIRECT recursion?","","",["A function calling itself","Function A calling function B which eventually calls function A again","Using a loop inside a recursive function","A recursive function without a base case"],1,"Indirect recursion involves a cycle: A → B → A (or longer chains). Both functions must have base conditions. Used in mutual parsing scenarios like grammar evaluation.",8],["ads","Recursion","","What is a key DISADVANTAGE of recursion compared to iteration?","","",["Recursion cannot solve tree problems","Recursion uses more memory due to stack frames for each call","Recursive code is always slower for all problems","Recursion cannot implement Fibonacci"],1,"Each recursive call occupies a stack frame (local variables, return address, parameters). Deep recursion uses O(n) stack space, whereas iterative solutions can often operate in O(1) space.",9],["ads","Recursion","","Tail recursion is significant because:","","",["It always runs faster than loops","The compiler/JVM can optimize it to avoid adding new stack frames, reducing stack overflow risk","It doesn't require a base condition","It only works with primitive data types"],1,"In tail recursion, the recursive call is the LAST operation in the function. Some compilers replace the stack frame instead of stacking a new one (tail-call optimization), making it as memory-efficient as a loop.",10],["ads","Trees & Applications","","In a tree with n nodes, how many edges are there?","","",["n","n+1","n-1","2n"],2,"A tree with n nodes always has exactly n-1 edges. Every node except the root has exactly one parent edge. This is a fundamental property of trees as acyclic connected graphs.",1],["ads","Trees & Applications","","What is the property of a Binary Search Tree (BST)?","","",["Left child > parent, Right child < parent","Left child < parent, Right child > parent","All nodes have exactly two children","The tree is always balanced"],1,"BST property: for every node, all values in the LEFT subtree are LESS than the node, and all values in the RIGHT subtree are GREATER. This enables O(log n) average search.",2],["ads","Trees & Applications","","Which traversal of a BST produces elements in sorted (ascending) order?","","",["Preorder","Postorder","Inorder","Level-order (BFS)"],2,"Inorder traversal visits: Left → Root → Right. In a BST, this always produces values in ascending sorted order — a key property used in BST-based sorting.",3],["ads","Trees & Applications","","What is the WORST-CASE time complexity for searching in a BST?","","",["O(1)","O(log n)","O(n)","O(n log n)"],2,"In a degenerate BST (all nodes inserted in sorted order), the tree becomes a linear chain. Searching requires visiting all n nodes — O(n). AVL trees solve this by maintaining balance.",4],["ads","Trees & Applications","","In Preorder traversal, the visit order is:","","",["Left → Root → Right","Left → Right → Root","Root → Left → Right","Right → Root → Left"],2,"Preorder: Root first, then Left subtree, then Right subtree. Used for copying/cloning trees and serialization. Memory tip: 'Pre' = Root comes before children.",5],["ads","Trees & Applications","","An Almost Complete Binary Tree (ACBT) is best stored using:","","",["Linked list","Hash table","Array (1-indexed)","Stack"],2,"In an ACBT stored in a 1-indexed array: for node at index i, left child = 2i, right child = 2i+1, parent = i/2. No pointers needed, making it memory-efficient. Heaps use this structure.",6],["ads","Trees & Applications","","What problem does an AVL Tree solve compared to a regular BST?","","",["AVL allows duplicate values","AVL maintains balance (|height difference| ≤ 1) ensuring O(log n) operations always","AVL stores more data per node","AVL allows more than 2 children per node"],1,"A regular BST degrades to O(n) for skewed inputs. An AVL tree self-balances after insertions/deletions using rotations, maintaining height ≤ 1.44 log n, guaranteeing O(log n) for all operations.",7],["ads","Trees & Applications","","Breadth First Search (BFS) on a tree uses which data structure internally?","","",["Stack","Queue","Array","Hash Table"],1,"BFS visits nodes level by level. A Queue (FIFO) ensures nodes at the current level are processed before the next level. DFS uses a Stack (LIFO) to go deep before backtracking.",8],["ads","Trees & Applications","","For a BST with values inserted in order 50, 30, 70, 20, 40, what does Inorder traversal produce?","","",["50 30 70 20 40","20 30 40 50 70","70 50 40 30 20","50 70 30 40 20"],1,"Inorder (Left→Root→Right) of this BST: leftmost (20) → 30 → 40 → root (50) → 70. Inorder of any BST always produces sorted ascending output.",9],["ads","Trees & Applications","","What rotation is applied when an AVL tree is right-heavy (right child's right subtree causes imbalance)?","","",["Right rotation (LL rotation)","Left rotation (RR rotation)","Left-Right rotation (LR rotation)","Right-Left rotation (RL rotation)"],1,"RR imbalance (right-right heavy) is fixed with a single LEFT rotation — the right child becomes the new root, and the unbalanced node becomes its left child. LL imbalance uses a right rotation.",10],["ads","Searching and Sorting Algorithms","","What is the time complexity of Sequential (Linear) Search in the worst case?","","",["O(1)","O(log n)","O(n)","O(n²)"],2,"Sequential search checks each element one by one. Worst case: the element is at the end or absent — requiring n comparisons. Hence O(n).",1],["ads","Searching and Sorting Algorithms","","What is the prerequisite for Binary Search to work correctly?","","",["The array must have an even number of elements","The array must be sorted","The array must contain unique elements","The array must be stored in a linked list"],1,"Binary search halves the search space by comparing the target with the middle element. This logic only works if the array is sorted — otherwise the elimination decision is invalid.",2],["ads","Searching and Sorting Algorithms","","What is the time complexity of Binary Search?","","",["O(n)","O(n²)","O(log n)","O(n log n)"],2,"Each comparison halves the search space. Starting with n elements: n → n/2 → n/4 → ... → 1. This takes log(n) steps, giving O(log n) time complexity.",3],["ads","Searching and Sorting Algorithms","","Which sorting algorithm works by repeatedly finding the minimum element from the unsorted portion and placing it at the beginning?","","",["Bubble Sort","Insertion Sort","Selection Sort","Merge Sort"],2,"Selection sort: scan unsorted portion for minimum, swap it with first unsorted element. Repeat. Always O(n²) comparisons regardless of input — no best-case optimization.",4],["ads","Searching and Sorting Algorithms","","What is the BEST-case time complexity of Bubble Sort (with optimization)?","","",["O(n²)","O(n log n)","O(n)","O(1)"],2,"Optimized Bubble Sort with a 'swapped' flag: if no swaps occur in a pass, the array is already sorted — it exits early. Best case (already sorted): O(n) — one pass confirms it.",5],["ads","Searching and Sorting Algorithms","","Which sorting algorithm uses the Divide and Conquer strategy and has O(n log n) worst-case complexity?","","",["Bubble Sort","Selection Sort","Insertion Sort","Merge Sort"],3,"Merge Sort divides the array into halves recursively (log n levels), merges sorted halves (O(n) each level) → O(n log n) always. Unlike QuickSort, worst case is also O(n log n).",6],["ads","Searching and Sorting Algorithms","","What is the worst-case time complexity of QuickSort and what causes it?","","",["O(n log n), caused by equal elements","O(n²), caused by always picking the smallest or largest element as pivot","O(n), caused by random pivot selection","O(log n), caused by balanced partitions"],1,"QuickSort worst case O(n²) occurs when the pivot is always the min/max (e.g., already sorted array with first-element pivot) — creating partitions of size 0 and n-1 every time.",7],["ads","Searching and Sorting Algorithms","","Insertion Sort is most efficient when:","","",["The array is in reverse sorted order","The array has more than 10,000 elements","The array is nearly sorted (few inversions)","The array has all duplicate elements"],2,"Insertion sort is adaptive — fewer inversions mean fewer shifts. For nearly sorted data, it approaches O(n). This is why TimSort (used in Java/Python) uses insertion sort for small chunks.",8],["ads","Searching and Sorting Algorithms","","HeapSort uses which data structure and what is its time complexity?","","",["BST, O(n log n)","Max-Heap (ACBT), O(n log n)","Stack, O(n²)","Queue, O(n)"],1,"HeapSort: build max-heap from array (O(n)), then repeatedly extract max and heapify (O(log n) each, n times) → O(n log n) overall. In-place and O(1) extra space, unlike Merge Sort.",9],["ads","Searching and Sorting Algorithms","","You must sort 1 million nearly-sorted integers with minimal extra memory. Which algorithm is MOST appropriate?","","",["Merge Sort","QuickSort","Insertion Sort","Selection Sort"],2,"Insertion sort is O(n) for nearly-sorted data, operates in-place (O(1) space). Merge Sort needs O(n) extra space. QuickSort has O(n²) worst case. For nearly-sorted, large datasets, Insertion Sort is optimal.",10],["ads","Hash Functions and Hash Tables","","What is the average-case time complexity for search, insert, and delete in a Hash Table?","","",["O(n)","O(log n)","O(1)","O(n log n)"],2,"Hash tables provide O(1) average time for all three operations by computing an index directly from the key using a hash function — no traversal needed, unlike BST (O(log n)) or array search (O(n)).",1],["ads","Hash Functions and Hash Tables","","What is a COLLISION in hashing?","","",["When two hash tables are merged","When two different keys produce the same hash index","When the hash table is full","When a key is deleted from the table"],1,"A collision occurs when hash(key1) == hash(key2) but key1 ≠ key2. Since hash functions map a large key space to a smaller index space, collisions are inevitable and must be resolved.",2],["ads","Hash Functions and Hash Tables","","A common hash function for integer keys with table size m is:","","",["h(k) = k + m","h(k) = k mod m","h(k) = k * m","h(k) = m / k"],1,"The modulo method h(k) = k mod m is the most widely used hash function. It maps any integer key to a valid index in range [0, m-1]. m should ideally be a prime number to reduce clustering.",3],["ads","Hash Functions and Hash Tables","","In Linear Probing, when a collision occurs at index h, the next probe checks:","","",["h + 2, h + 4, h + 8 ...","h + 1, h + 2, h + 3 ... (mod m)","A random index","h² + 1, h² + 4 ... (mod m)"],1,"Linear Probing: on collision at h, probe h+1, h+2, h+3... (all mod m) until an empty slot is found. Simple but suffers from primary clustering — long runs of filled slots forming.",4],["ads","Hash Functions and Hash Tables","","What problem does Quadratic Probing solve compared to Linear Probing?","","",["It eliminates all collisions","It reduces primary clustering by using quadratic increments (1, 4, 9, 16...)","It allows two keys to share the same slot","It reduces the hash table size requirement"],1,"Quadratic probing uses h + 1², h + 2², h + 3²... (mod m), spreading probes wider to avoid primary clustering. However, it can suffer from secondary clustering — same initial hash → same probe sequence.",5],["ads","Hash Functions and Hash Tables","","Double Hashing uses the probe sequence:","","",["h(k) + i mod m","(h1(k) + i * h2(k)) mod m","(h(k) + i²) mod m","h(k) * i mod m"],1,"Double hashing: probe = (h1(k) + i * h2(k)) mod m. A second hash function h2(k) determines the step size, giving a unique probe sequence per key. Avoids both primary and secondary clustering.",6],["ads","Hash Functions and Hash Tables","","Which collision resolution technique uses a linked list at each hash table slot?","","",["Linear Probing","Quadratic Probing","Separate Chaining","Double Hashing"],2,"Separate Chaining stores a linked list (or other structure) at each index. All keys hashing to the same index are stored in that chain. Avoids the 'table full' problem but uses extra memory.",7],["ads","Hash Functions and Hash Tables","","Why is memoization (using a hash table) effective for improving recursive Fibonacci?","","",["It reduces the number of recursive parameters","It stores previously computed results, converting O(2^n) to O(n)","It sorts the Fibonacci sequence before computing","It replaces recursion with iteration automatically"],1,"Naive recursive Fibonacci recomputes fib(n-2), fib(n-3)... multiple times: O(2^n). Memoization stores each fib(i) result in a hash map after first computation — each sub-problem solved once: O(n).",8],["ads","Hash Functions and Hash Tables","","What is the LOAD FACTOR of a hash table?","","",["The number of collisions","The ratio of stored elements to table size (n/m)","The time to compute the hash function","The number of hash functions used"],1,"Load factor λ = n/m (n = elements stored, m = table size). As λ increases toward 1, collision probability increases and performance degrades toward O(n). Rehashing is triggered when λ exceeds a threshold (e.g., 0.75).",9],["ads","Hash Functions and Hash Tables","","Why should the table size m in a hash table ideally be a PRIME number?","","",["Prime numbers are easier to compute modulo of","It ensures keys are distributed more uniformly, reducing clustering","Prime-sized tables can never have collisions","Prime sizes allow O(log n) search always"],1,"Prime m ensures h(k) = k mod m distributes keys more evenly across the table. Non-prime sizes (especially powers of 2) can cause many keys to map to the same few indices if keys share common factors with m.",10],["ads","Graphs and Applications","","What makes a Graph the most GENERIC data structure?","","",["It can only store integers","It can model any relationship between any entities — trees, linked lists, and networks are all special cases of graphs","It uses less memory than arrays","It always provides O(1) access"],1,"Trees are acyclic connected graphs. Linked lists are graphs with one edge per node. Graphs model roads, social networks, web links, dependencies — any pairwise relationship. Hence the most generic DS.",1],["ads","Graphs and Applications","","What is the difference between a DIRECTED and UNDIRECTED graph?","","",["Directed graphs cannot have cycles","In a directed graph, edges have a direction (A→B ≠ B→A); undirected edges have no direction","Undirected graphs can have more nodes","Directed graphs use adjacency lists only"],1,"In a directed graph (digraph), edge A→B means you can go from A to B but not necessarily B to A. Undirected edges represent a mutual connection: A—B means both directions are valid.",2],["ads","Graphs and Applications","","For a graph with V vertices, the adjacency matrix has size:","","",["V × 1","V × V","V × E (edges)","E × E"],1,"An adjacency matrix is a V×V 2D array where matrix[i][j] = 1 (or weight) if edge exists between vertex i and j, else 0. Space complexity: O(V²). Suitable for dense graphs.",3],["ads","Graphs and Applications","","Which graph representation is more space-efficient for SPARSE graphs?","","",["Adjacency Matrix","Adjacency List","Edge Matrix","Incidence Matrix"],1,"Adjacency list stores only existing edges: O(V + E) space. Adjacency matrix always uses O(V²). For sparse graphs (E << V²), adjacency list is far more space-efficient.",4],["ads","Graphs and Applications","","BFS traversal of a graph uses which data structure and what is its primary use?","","",["Stack — find shortest path in weighted graphs","Queue — find shortest path (fewest edges) in unweighted graphs","Priority Queue — traverse all nodes","Stack — level-order traversal"],1,"BFS uses a Queue (FIFO) to explore all neighbors at distance 1 before distance 2, etc. In unweighted graphs, BFS guarantees finding the shortest path (fewest edges) between source and destination.",5],["ads","Graphs and Applications","","DFS traversal uses which data structure and is useful for:","","",["Queue — shortest path","Stack (or recursion) — detecting cycles, topological sort, connected components","Heap — minimum spanning tree","Hash table — weighted shortest path"],1,"DFS uses a Stack (explicitly or via recursion) to go as deep as possible before backtracking. Applications: cycle detection, topological ordering, connected components, maze solving.",6],["ads","Graphs and Applications","","Dijkstra's algorithm finds:","","",["Minimum spanning tree of a graph","Shortest path from a single source to all other vertices in a weighted graph with non-negative edges","All pairs shortest path","Maximum flow in a network"],1,"Dijkstra's is a single-source shortest path algorithm using a greedy approach with a priority queue. It only works with NON-NEGATIVE edge weights. For negative weights, use Bellman-Ford.",7],["ads","Graphs and Applications","","Floyd-Warshall algorithm computes:","","",["Single-source shortest path","Minimum spanning tree","All-pairs shortest path (shortest path between every pair of vertices)","Topological ordering"],2,"Floyd-Warshall uses dynamic programming to compute shortest paths between ALL pairs of vertices in O(V³) time. It handles negative edges (but not negative cycles). Dijkstra must be run V times for the same result.",8],["ads","Graphs and Applications","","What is a Minimum Spanning Tree (MST)?","","",["A tree connecting all vertices with maximum total edge weight","A subgraph connecting all vertices with minimum total edge weight and no cycles","The shortest path tree from a single source","A tree with minimum number of nodes"],1,"MST spans all V vertices with exactly V-1 edges, no cycles, and minimizes total edge weight. Used in network design (minimum cable to connect all cities). Prim's and Kruskal's algorithms find MST.",9],["ads","Graphs and Applications","","Kruskal's algorithm builds an MST by:","","",["Starting from a vertex and greedily picking the cheapest adjacent edge","Sorting all edges by weight and adding the cheapest edge that doesn't form a cycle","Running BFS from the source vertex","Using dynamic programming on the adjacency matrix"],1,"Kruskal's: sort edges by weight, iterate through them, add to MST if it doesn't create a cycle (checked via Union-Find/Disjoint Set). Time: O(E log E). Prim's grows the MST from a starting vertex.",10],["ads","Algorithm Design Techniques","","Which algorithm design technique breaks a problem into independent sub-problems, solves them recursively, and combines the results?","","",["Greedy","Dynamic Programming","Divide and Conquer","Backtracking"],2,"Divide and Conquer: Divide (split problem), Conquer (solve sub-problems recursively), Combine (merge results). Examples: Merge Sort, Quick Sort, Binary Search. Sub-problems are independent.",1],["ads","Algorithm Design Techniques","","Dynamic Programming differs from Divide and Conquer because:","","",["DP uses recursion; D&C; uses iteration","DP solves overlapping sub-problems and stores results (memoization/tabulation) to avoid recomputation","DP is always faster than D&C;","DP cannot solve optimization problems"],1,"DP applies when sub-problems OVERLAP (same sub-problem appears multiple times). Storing results (memoization = top-down, tabulation = bottom-up) avoids recomputation. Examples: Fibonacci, Knapsack, LCS.",2],["ads","Algorithm Design Techniques","","A Greedy algorithm makes decisions by:","","",["Exploring all possible solutions","Always choosing the locally optimal choice at each step, hoping it leads to a global optimum","Dividing the problem into halves","Storing sub-problem solutions in a table"],1,"Greedy picks the best immediate option without reconsidering past choices. Works for: Dijkstra's, Prim's, Kruskal's, Huffman Coding, Activity Selection. Does NOT always yield global optimum for all problems.",3],["ads","Algorithm Design Techniques","","What is the key characteristic of a Brute Force algorithm?","","",["Uses mathematical optimization","Tries all possible solutions exhaustively until the correct one is found","Divides the problem recursively","Uses randomness to find approximate solutions"],1,"Brute Force exhaustively tries all possibilities. Simple to implement but often inefficient (exponential time). Example: trying all permutations for TSP. Used as a baseline to compare optimized algorithms.",4],["ads","Algorithm Design Techniques","","Backtracking is best described as:","","",["A greedy approach that never revisits choices","Trying a solution path and abandoning it (backtracking) as soon as a violation is detected","Solving sub-problems bottom-up","Dividing the problem into two equal halves"],1,"Backtracking explores choices and prunes dead ends early ('branch and prune'). Examples: N-Queens, Sudoku solver, subset sum. More efficient than brute force as it avoids exploring all invalid paths.",5],["ads","Algorithm Design Techniques","","What is the difference between Backtracking and Branch-and-Bound?","","",["Both are identical algorithms","Backtracking is for feasibility problems; Branch-and-Bound is for optimization, pruning branches that cannot beat the current best solution","Branch-and-Bound uses BFS; Backtracking uses DFS always","Branch-and-Bound is slower than Backtracking always"],1,"Backtracking finds any valid solution. Branch-and-Bound finds the OPTIMAL solution by maintaining a bound (best known value) and pruning branches that cannot improve it. Used for: TSP, 0/1 Knapsack optimization.",6],["ads","Algorithm Design Techniques","","What does the 'Optimal Substructure' property mean in Dynamic Programming?","","",["Sub-problems must be independent","The optimal solution to the whole problem contains optimal solutions to its sub-problems","The problem can be divided into equal halves","The algorithm always runs in polynomial time"],1,"Optimal Substructure: if the global optimal solution can be constructed from optimal solutions of sub-problems, DP can be applied. Both DP and Greedy require this property; DP additionally requires overlapping sub-problems.",7],["ads","Algorithm Design Techniques","","What is the space complexity of an iterative (bottom-up) DP solution for Fibonacci?","","",["O(n) — stores all n values","O(1) — only two previous values needed","O(n²) — 2D table required","O(log n) — binary decomposition"],1,"Bottom-up Fibonacci: fib[i] = fib[i-1] + fib[i-2]. We only need the last two values at any time. Using two variables instead of an array: O(1) space, O(n) time.",8],["ads","Algorithm Design Techniques","","Which algorithm class would you use to solve the 0/1 Knapsack problem optimally?","","",["Greedy","Divide and Conquer","Dynamic Programming","Binary Search"],2,"0/1 Knapsack has overlapping sub-problems and optimal substructure — DP builds a 2D table of [items][capacity] to find the maximum value. Greedy (by value/weight ratio) doesn't guarantee optimality for 0/1 Knapsack.",9],["ads","Algorithm Design Techniques","","In asymptotic analysis, which correctly orders these complexities from FASTEST to SLOWEST?","","",["O(n²) < O(n log n) < O(n) < O(log n) < O(1)","O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(2^n)","O(log n) < O(1) < O(n) < O(2^n) < O(n²)","O(n) < O(log n) < O(1) < O(n²) < O(2^n)"],1,"Correct order (best to worst): O(1) constant < O(log n) logarithmic < O(n) linear < O(n log n) linearithmic < O(n²) quadratic < O(2^n) exponential. This ordering determines scalability of algorithms.",10],["cpp","Getting Started","Installation & Setup · Need of C++ · Features · C++ vs C · History · First Program","Who developed C++ and in which year was it first released?","","",["Dennis Ritchie, 1972","Bjarne Stroustrup, 1983","James Gosling, 1995","Guido van Rossum, 1991"],1,"Bjarne Stroustrup developed C++ at Bell Labs around 1979–1983. It was originally called 'C with Classes' and was renamed C++ in 1983. Dennis Ritchie developed C, not C++.",1],["cpp","Getting Started","Installation & Setup · Need of C++ · Features · C++ vs C · History · First Program","Which of the following is the correct extension for a C++ source file?","","",[".c",".java",".cpp",".py"],2,".cpp is the standard extension for C++ source files. The .c extension is used for C source files. Compilers like g++ recognize .cpp, .cxx, .cc, and .C as valid C++ extensions.",2],["cpp","Getting Started","Installation & Setup · Need of C++ · Features · C++ vs C · History · First Program","What is the output of the following program?","#include<iostream>\nusing namespace std;\nint main(){\ncout << \"Hello, World!\";\nreturn 0;\n}","",["Hello World","Hello, World!","hello, world!","Compilation Error"],1,"cout is the standard output stream in C++. The string literal 'Hello, World!' is printed exactly as-is. The comma and exclamation mark are part of the string, so the output is exactly: Hello, World!",3],["cpp","Getting Started","Installation & Setup · Need of C++ · Features · C++ vs C · History · First Program","Which header file is required to use cin and cout in C++?","","",["","","",""],2,"defines the standard input/output stream objects: cin (standard input), cout (standard output), cerr (standard error), and clog. is the C-style I/O header for printf and scanf.",4],["cpp","Getting Started","Installation & Setup · Need of C++ · Features · C++ vs C · History · First Program","What does 'using namespace std;' do in a C++ program?","","",["Imports all standard C libraries","Allows use of standard library names without the std:: prefix","Defines a new namespace called std","Links the standard template library"],1,"'using namespace std;' tells the compiler to look in the std namespace for identifiers. Without it, you'd need to write std::cout, std::cin, etc. It does not import C libraries or define a namespace.",5],["cpp","Getting Started","Installation & Setup · Need of C++ · Features · C++ vs C · History · First Program","Which of the following is a key feature that C++ adds over C?","","",["Loops","Functions","Object-Oriented Programming","Arrays"],2,"C++ was designed as an extension of C to support Object-Oriented Programming (OOP) — including classes, inheritance, polymorphism, and encapsulation. Loops, functions, and arrays all exist in C.",6],["cpp","Getting Started","Installation & Setup · Need of C++ · Features · C++ vs C · History · First Program","What is the correct way to add two integers and print the result in C++?","","",["int a=5,b=3; printf(a+b);","int a=5,b=3; cout << a+b;","int a=5,b=3; print(a+b);","int a=5,b=3; Console.Write(a+b);"],1,"In C++, cout with the << (insertion) operator is used for output. printf is C-style (needs format string), print() is Python, and Console.Write() is C#. The correct C++ syntax is: cout << a+b;",7],["cpp","Getting Started","Installation & Setup · Need of C++ · Features · C++ vs C · History · First Program","The compound interest formula is A = P(1 + r/n)^(nt). Which C++ library function is used to compute the power?","","",["sqrt()","pow()","exp()","abs()"],1,"The pow(base, exponent) function from computes the power of a number. For compound interest, you'd use pow(1 + r/n, n*t). sqrt() is square root, exp() is e^x, abs() is absolute value.",8],["cpp","Getting Started","Installation & Setup · Need of C++ · Features · C++ vs C · History · First Program","To swap two numbers WITHOUT a temporary variable in C++, which approach is valid?","","",["a = a + b; b = a - b; a = a - b;","a = b; b = a;","swap = a; swap = b;","a == b; b == a;"],0,"The arithmetic swap method works: a = a+b stores the sum, b = a-b recovers original a, a = a-b recovers original b. Option B loses the original value of a before assigning to b. == is comparison, not assignment.",9],["cpp","Getting Started","Installation & Setup · Need of C++ · Features · C++ vs C · History · First Program","What is the return type of the main() function in a standard C++ program?","","",["void","float","int","char"],2,"According to the C++ standard (ISO/IEC 14882), main() must return int. A return value of 0 signals successful execution to the operating system. While some compilers accept void main(), it is non-standard and should be avoided.",10],["cpp","Beginning with C++","Program Structure · Tokens · Initialization · Static & Constant Members · Operators · C++17","Which of the following is NOT a valid C++ token?","","",["Keyword","Identifier","Comment","Literal"],2,"C++ tokens are the smallest meaningful units: keywords, identifiers, literals, operators, and punctuators. Comments are stripped by the preprocessor before tokenization and are therefore NOT tokens.",1],["cpp","Beginning with C++","Program Structure · Tokens · Initialization · Static & Constant Members · Operators · C++17","What is the output?","int x = 10;\nint& ref = x;\nref = 20;\ncout << x;","",["10","20","Compilation Error","Undefined"],1,"ref is a reference to x — it is an alias, not a copy. Assigning 20 to ref directly modifies x. Therefore, cout << x outputs 20. This illustrates reference initialization in C++.",2],["cpp","Beginning with C++","Program Structure · Tokens · Initialization · Static & Constant Members · Operators · C++17","Which keyword is used to declare a class-level variable shared among all instances?","","",["const","extern","static","mutable"],2,"The static keyword makes a data member belong to the class itself rather than any individual object. All instances share the same static variable. It must be defined outside the class body (in C++ prior to C++17 inline variables).",3],["cpp","Beginning with C++","Program Structure · Tokens · Initialization · Static & Constant Members · Operators · C++17","What does the following declaration mean?","const int MAX = 100;","",["MAX is a variable that can be changed once","MAX is a constant whose value cannot be modified after initialization","MAX is a static class member","MAX is a preprocessor macro"],1,"const declares a constant — the value must be initialized and cannot be changed afterward. Any attempt to modify MAX will result in a compile-time error. This is preferred over #define as it is type-safe.",4],["cpp","Beginning with C++","Program Structure · Tokens · Initialization · Static & Constant Members · Operators · C++17","What is the result of: 7 % 3 in C++?","","",["2","1","3","0"],1,"The % operator gives the remainder of integer division. 7 / 3 = 2 remainder 1. So 7 % 3 = 1. The modulo operator is an arithmetic operator that works on integer types only in C++.",5],["cpp","Beginning with C++","Program Structure · Tokens · Initialization · Static & Constant Members · Operators · C++17","What is the value of x after: int x = 5; x += 3; x *= 2;","","",["13","16","11","10"],1,"x starts at 5. x += 3 makes x = 8. x *= 2 makes x = 16. Assignment operators modify the variable in place. The operations are applied sequentially left-to-right as written.",6],["cpp","Beginning with C++","Program Structure · Tokens · Initialization · Static & Constant Members · Operators · C++17","Which C++17 feature allows declaring variables in an if-statement's condition?","","",["Structured Bindings","if constexpr","if with initializer","Fold Expressions"],2,"C++17 introduced the 'if with initializer' syntax: if (int x = getValue(); x > 0) { }. The variable x is scoped to the if-else block. Structured bindings unpack tuples; if constexpr is for compile-time branching.",7],["cpp","Beginning with C++","Program Structure · Tokens · Initialization · Static & Constant Members · Operators · C++17","What is the output?","int a = 5, b = 10;\ncout << (a > b ? a : b);","",["5","10","15","0"],1,"The ternary operator ?: evaluates the condition (a > b), which is false (5 > 10 is false), so it returns the second operand b = 10. The ternary operator is a concise alternative to if-else for simple expressions.",8],["cpp","Beginning with C++","Program Structure · Tokens · Initialization · Static & Constant Members · Operators · C++17","In C++, what is the difference between pre-increment (++x) and post-increment (x++)?","","",["No difference","++x increments then returns the new value; x++ returns old value then increments","x++ increments then returns the new value; ++x returns old value then increments","++x works only on pointers"],1,"++x (pre-increment) increments the variable and returns the updated value. x++ (post-increment) returns the current value first, then increments. Example: int x=5; cout << x++; prints 5, but cout << ++x; (starting fresh) prints 6.",9],["cpp","Beginning with C++","Program Structure · Tokens · Initialization · Static & Constant Members · Operators · C++17","What does the structured binding in C++17 do in this code?","auto [a, b] = std::make_pair(1, 2);","",["Creates a struct with fields a and b","Binds a=1 and b=2 from the pair","Compilation error — invalid syntax","Creates a pointer to a pair"],1,"C++17 structured bindings (auto [a, b] = ...) allow decomposing structured types like pairs, tuples, and structs directly into named variables. Here a becomes 1 and b becomes 2. This is a major C++17 readability feature.",10],["cpp","Conditional and Looping Statements","if/else/switch · for/while/do-while · break/continue/return · Arrays (1D & 2D)","What is the output of the following code?","int x = 10;\nif(x > 5)\ncout << \"A\";\nelse\ncout << \"B\";","",["A","B","AB","Compilation Error"],0,"x = 10 which is greater than 5, so the if-branch executes and prints 'A'. The else branch is skipped. This is fundamental if-else conditional logic — only one branch executes.",1],["cpp","Conditional and Looping Statements","if/else/switch · for/while/do-while · break/continue/return · Arrays (1D & 2D)","Which loop guarantees at least one execution of its body?","","",["for loop","while loop","do-while loop","All of the above"],2,"The do-while loop checks its condition AFTER the loop body executes. This guarantees the body runs at least once even if the condition is initially false. for and while loops check the condition before executing the body.",2],["cpp","Conditional and Looping Statements","if/else/switch · for/while/do-while · break/continue/return · Arrays (1D & 2D)","What is the output?","for(int i=0; i<5; i++){\nif(i==3) break;\ncout << i;\n}","",["01234","0123","012","01230"],2,"The loop runs for i=0,1,2,3... When i=3, the break statement exits the loop immediately. So only 0, 1, 2 are printed before the break occurs. break transfers control out of the innermost enclosing loop.",3],["cpp","Conditional and Looping Statements","if/else/switch · for/while/do-while · break/continue/return · Arrays (1D & 2D)","What is the output?","for(int i=0; i<5; i++){\nif(i==3) continue;\ncout << i;\n}","",["01234","0124","012","01234 skipping 3"],1,"continue skips the remaining statements in the current iteration and goes to the next iteration. When i=3, cout is skipped, but the loop continues with i=4. Output is: 0, 1, 2, 4.",4],["cpp","Conditional and Looping Statements","if/else/switch · for/while/do-while · break/continue/return · Arrays (1D & 2D)","How do you declare a 1D integer array of 5 elements in C++?","","",["int arr{5};","int arr[5];","array int arr(5);","int[5] arr;"],1,"int arr[5]; declares a 1D array of 5 integers with indices 0 through 4. The size must be a compile-time constant (or VLA in some compilers). int arr{5} initializes a single integer with value 5.",5],["cpp","Conditional and Looping Statements","if/else/switch · for/while/do-while · break/continue/return · Arrays (1D & 2D)","What is the index of the last element of int arr[10];?","","",["10","9","1","-1"],1,"C++ arrays are zero-indexed. For int arr[10], valid indices are 0 through 9. arr[10] is out-of-bounds and causes undefined behavior. This is a classic off-by-one error source.",6],["cpp","Conditional and Looping Statements","if/else/switch · for/while/do-while · break/continue/return · Arrays (1D & 2D)","Which statement about switch-case in C++ is TRUE?","","",["switch works with float types","Each case must have a break to prevent fall-through","default is mandatory","switch cannot handle char types"],1,"Without a break, execution 'falls through' to subsequent cases. switch works with integral types (int, char, enum) but NOT float/double. The default case is optional. char is an integral type, so it works with switch.",7],["cpp","Conditional and Looping Statements","if/else/switch · for/while/do-while · break/continue/return · Arrays (1D & 2D)","What does this 2D array declaration mean?","int matrix[3][4];","",["3 arrays each of size 4 integers — total 12 elements","4 arrays each of size 3 integers — total 12 elements","A 7-element array","Compilation Error"],0,"int matrix[3][4] declares a 2D array with 3 rows and 4 columns, totalling 12 integers. Access is via matrix[row][col]. In memory, it is laid out in row-major order (all elements of row 0, then row 1, etc.).",8],["cpp","Conditional and Looping Statements","if/else/switch · for/while/do-while · break/continue/return · Arrays (1D & 2D)","What is the command-line argument signature for main() in C++?","","",["int main(int args, char argv)","int main(int argc, char* argv[])","void main(string args[])","int main(char** args, int argc)"],1,"The standard signature is int main(int argc, char* argv[]). argc is the argument count (including program name), argv is an array of C-strings. argv[0] is the program name, argv[1] is the first argument.",9],["cpp","Conditional and Looping Statements","if/else/switch · for/while/do-while · break/continue/return · Arrays (1D & 2D)","What is the output of this nested loop?","for(int i=1;i<=3;i++)\nfor(int j=1;j<=3;j++)\nif(i==j) cout<<i<<\" \";","",["1 2 3","1 1 2 2 3 3","1 4 9","9"],0,"The inner loop runs j from 1 to 3 for each i. cout executes only when i==j: (1,1)→1, (2,2)→2, (3,3)→3. Output is '1 2 3'. This is the classic diagonal pattern of a nested loop with equality condition.",10],["cpp","Functions in C++","Function Prototyping · Call by Reference · Inline Functions · Math Library","What is a function prototype in C++?","","",["The complete definition of a function","A declaration that tells the compiler the function's name, return type, and parameter types","A call to a function before its definition","An overloaded version of a function"],1,"A function prototype (forward declaration) informs the compiler of the function's signature — name, return type, and parameter types — before the actual definition. This allows calling functions defined later in the file.",1],["cpp","Functions in C++","Function Prototyping · Call by Reference · Inline Functions · Math Library","What is the output?","void add(int &a, int &b){\na = a + b;\n}\nint x=3, y=4;\nadd(x, y);\ncout << x;","",["3","4","7","0"],2,"The function takes a and b by reference. Inside the function, a = a + b modifies x directly (since a is a reference to x). After the call, x = 3+4 = 7. Call by reference allows functions to modify the caller's variables.",2],["cpp","Functions in C++","Function Prototyping · Call by Reference · Inline Functions · Math Library","What is the difference between call by value and call by reference?","","",["No difference","Call by value passes a copy; call by reference passes the actual variable","Call by reference is slower than call by value always","Call by value can modify the original variable"],1,"Call by value copies the argument — changes inside the function don't affect the original. Call by reference passes an alias (reference) to the original variable, so changes inside the function ARE reflected outside.",3],["cpp","Functions in C++","Function Prototyping · Call by Reference · Inline Functions · Math Library","Which keyword is used to suggest to the compiler to expand a function inline?","","",["macro","register","inline","expand"],2,"The inline keyword suggests to the compiler to replace the function call with the function body directly. This can reduce function call overhead for small, frequently called functions. Note: it's a hint, not a command — the compiler may ignore it.",4],["cpp","Functions in C++","Function Prototyping · Call by Reference · Inline Functions · Math Library","When is using inline functions preferred?","","",["For large functions with complex logic","For recursive functions","For small, frequently called functions","For functions with many parameters"],2,"Inline functions are preferred for small, frequently called functions (e.g., getters, simple arithmetic). Inlining large functions increases code size (code bloat). Recursive functions cannot be meaningfully inlined.",5],["cpp","Functions in C++","Function Prototyping · Call by Reference · Inline Functions · Math Library","What is the output?","#include<cmath>\ncout << pow(2, 10);","",["20","512","1024","210"],2,"pow(2, 10) computes 2 raised to the power 10 = 1024. The pow() function is in . Note: pow returns a double, so the output is 1024 (as a floating-point value printed without decimal by default in some contexts).",6],["cpp","Functions in C++","Function Prototyping · Call by Reference · Inline Functions · Math Library","What is the default argument feature in C++?","","",["A function that takes no arguments","Assigning default values to parameters so they can be omitted in calls","Automatically detecting argument types","Passing arguments by default by reference"],1,"Default arguments allow specifying default values: void display(int x, int y=10). If y is not provided in the call, it defaults to 10. Default arguments must be specified from right to left (trailing parameters first).",7],["cpp","Functions in C++","Function Prototyping · Call by Reference · Inline Functions · Math Library","What is function overloading in C++?","","",["Calling a function more than once","Defining multiple functions with the same name but different parameter lists","A function that calls itself","A function with too many parameters"],1,"Function overloading allows multiple functions with the same name but different signatures (number/types of parameters). The compiler selects the appropriate version based on the arguments at compile-time. Return type alone is not sufficient to overload.",8],["cpp","Functions in C++","Function Prototyping · Call by Reference · Inline Functions · Math Library","Which <cmath> function returns the square root of a number?","","",["pow()","ceil()","sqrt()","abs()"],2,"sqrt(x) from returns the square root of x. pow(x,0.5) also computes square root but is less efficient. ceil() rounds up, abs() returns absolute value. Always include for math functions.",9],["cpp","Functions in C++","Function Prototyping · Call by Reference · Inline Functions · Math Library","What happens if a function declared with return type int does not return a value?","","",["It returns 0 by default","It returns -1","It is undefined behavior (except main which returns 0 implicitly)","Compilation always fails"],2,"For functions with non-void return types (other than main), failing to return a value results in undefined behavior. The special case is main(), which implicitly returns 0 if no return statement is present. Good compilers warn about this.",10],["cpp","Memory Management and Pointers","Pointers · Arrays & Pointers · new/delete · this pointer · Enumeration · Typedef","What does a pointer store?","","",["A copy of a variable's value","The memory address of a variable","The type of a variable","A reference to a variable"],1,"A pointer is a variable that stores the memory address of another variable. Declared as int* ptr, it holds the address. Use & to get an address (ptr = &x;) and * to dereference it (access the value at the address).",1],["cpp","Memory Management and Pointers","Pointers · Arrays & Pointers · new/delete · this pointer · Enumeration · Typedef","What is the output?","int x = 42;\nint* p = &x;\ncout << *p;","",["Address of x","42","p","Garbage value"],1,"*p dereferences the pointer p, giving the value stored at the address p points to. Since p = &x; (address of x) and x = 42, *p gives 42. The & operator gives the address, * dereferences it.",2],["cpp","Memory Management and Pointers","Pointers · Arrays & Pointers · new/delete · this pointer · Enumeration · Typedef","What is the key advantage of new over malloc() in C++?","","",["new is faster than malloc","new calls the constructor and is type-safe; malloc only allocates raw memory","new works only for primitive types","malloc returns a typed pointer"],1,"new allocates memory AND calls the constructor for objects, returning a properly-typed pointer. malloc only allocates raw bytes and returns void*, requiring a cast. new/delete are preferred in C++ for type safety and OOP compatibility.",3],["cpp","Memory Management and Pointers","Pointers · Arrays & Pointers · new/delete · this pointer · Enumeration · Typedef","Which operator is used to free memory allocated by new?","","",["free()","remove()","delete","clear()"],2,"delete is used to free single objects allocated with new. delete[] is used for arrays allocated with new[]. Using free() on new-allocated memory is undefined behavior. Always pair new with delete and new[] with delete[].",4],["cpp","Memory Management and Pointers","Pointers · Arrays & Pointers · new/delete · this pointer · Enumeration · Typedef","What does 'this' pointer refer to in a class member function?","","",["The base class object","The current object on which the member function is called","A static class member","The next object in memory"],1,"The 'this' pointer is an implicit parameter in all non-static member functions. It points to the object that invoked the function. this->member accesses the current object's member. It is used to resolve ambiguity between member names and parameter names.",5],["cpp","Memory Management and Pointers","Pointers · Arrays & Pointers · new/delete · this pointer · Enumeration · Typedef","What is the relationship between arrays and pointers in C++?","","",["Arrays and pointers are completely unrelated","The array name acts as a pointer to the first element","Pointers cannot point to arrays","Arrays are always allocated on the heap"],1,"In C++, the name of an array decays to a pointer to its first element. So int arr[5]; means arr is equivalent to &arr;[0]. You can use pointer arithmetic to traverse arrays: *(arr+i) is equivalent to arr[i].",6],["cpp","Memory Management and Pointers","Pointers · Arrays & Pointers · new/delete · this pointer · Enumeration · Typedef","What is the output?","int arr[] = {10, 20, 30};\nint* p = arr;\ncout << *(p+2);","",["10","20","30","Garbage"],2,"p points to arr[0] (value 10). p+1 points to arr[1] (value 20). p+2 points to arr[2] (value 30). *(p+2) dereferences that address, giving 30. Pointer arithmetic moves by the size of the pointed-to type.",7],["cpp","Memory Management and Pointers","Pointers · Arrays & Pointers · new/delete · this pointer · Enumeration · Typedef","What is an enumeration (enum) in C++?","","",["A function that lists elements","A user-defined type with named integer constants","A dynamic array","A type alias"],1,"enum defines a set of named integer constants. Example: enum Color {RED, GREEN, BLUE}; Here RED=0, GREEN=1, BLUE=2 by default. C++11 introduced enum class (scoped enumerations) for stronger type safety.",8],["cpp","Memory Management and Pointers","Pointers · Arrays & Pointers · new/delete · this pointer · Enumeration · Typedef","What does typedef do in C++?","","",["Defines a new data type from scratch","Creates an alias for an existing type","Converts one type to another","Removes a type definition"],1,"typedef creates an alias (alternate name) for an existing type. Example: typedef unsigned long ulong; Now ulong can be used instead of unsigned long. In C++11, 'using' is the preferred alternative: using ulong = unsigned long;",9],["cpp","Memory Management and Pointers","Pointers · Arrays & Pointers · new/delete · this pointer · Enumeration · Typedef","What is a memory leak in C++?","","",["When a pointer goes out of scope without freeing the allocated memory","When stack memory overflows","When delete is called twice on the same pointer","When a null pointer is dereferenced"],0,"A memory leak occurs when dynamically allocated memory (via new) is not freed (via delete) before the pointer goes out of scope. The memory remains allocated but becomes inaccessible. Double deletion is 'double free', null dereference is a different bug.",10],["cpp","OOP Concepts","Classes & Objects · Access Specifiers · Overloading · Inheritance · Polymorphism · Namespaces","Which access specifier makes class members accessible only within the class itself?","","",["public","protected","private","internal"],2,"private members are accessible only within the class. public members are accessible from anywhere. protected members are accessible within the class and its derived classes. There is no 'internal' specifier in C++.",1],["cpp","OOP Concepts","Classes & Objects · Access Specifiers · Overloading · Inheritance · Polymorphism · Namespaces","What is encapsulation in OOP?","","",["Hiding implementation details and exposing only necessary interfaces","Inheriting features from a parent class","Having multiple forms of a function","Creating multiple objects from a class"],0,"Encapsulation bundles data (members) and methods (functions) together and restricts direct access to internal details. In C++, this is achieved using access specifiers (private/protected/public) and providing public getter/setter methods.",2],["cpp","OOP Concepts","Classes & Objects · Access Specifiers · Overloading · Inheritance · Polymorphism · Namespaces","What is a namespace used for in C++?","","",["Allocating memory for objects","Organizing code to avoid name conflicts","Defining access control for class members","Importing external libraries"],1,"Namespaces group identifiers (functions, classes, variables) under a named scope to avoid name collisions. For example, std is the standard library namespace. You access members with :: operator: std::cout or using using namespace std;",3],["cpp","OOP Concepts","Classes & Objects · Access Specifiers · Overloading · Inheritance · Polymorphism · Namespaces","What is the output?","class A {\npublic:\nint x = 10;\n};\nA obj;\ncout << obj.x;","",["0","10","Compilation Error","Garbage"],1,"x is a public data member initialized to 10. obj is an object of class A. obj.x accesses the public member x, which is 10. The dot (.) operator accesses members of an object.",4],["cpp","OOP Concepts","Classes & Objects · Access Specifiers · Overloading · Inheritance · Polymorphism · Namespaces","Which OOP concept allows a class to acquire properties of another class?","","",["Polymorphism","Encapsulation","Abstraction","Inheritance"],3,"Inheritance allows a derived class to acquire (inherit) data members and member functions from a base class. This promotes code reuse. In C++: class Derived : public Base { }; The colon and access specifier define the inheritance.",5],["cpp","OOP Concepts","Classes & Objects · Access Specifiers · Overloading · Inheritance · Polymorphism · Namespaces","In C++, what is the default access specifier for class members?","","",["public","protected","private","none"],2,"In a class declaration, members are private by default if no specifier is given. This is a difference from struct, where members are public by default. This default supports the encapsulation principle.",6],["cpp","OOP Concepts","Classes & Objects · Access Specifiers · Overloading · Inheritance · Polymorphism · Namespaces","What is polymorphism in C++?","","",["The ability of a class to have multiple constructors","The ability of different objects to respond differently to the same function call","The ability to hide class members","Creating multiple namespaces"],1,"Polymorphism means 'many forms' — the same interface (function name/operator) behaves differently based on context. Compile-time polymorphism: function/operator overloading. Runtime polymorphism: virtual functions with inheritance.",7],["cpp","OOP Concepts","Classes & Objects · Access Specifiers · Overloading · Inheritance · Polymorphism · Namespaces","What does the scope resolution operator (::) do in C++?","","",["Accesses a member of an object","Accesses a member of a pointer to an object","Specifies the scope (namespace or class) of an identifier","Defines a new class"],2,"The :: operator specifies scope. Uses: std::cout (namespace scope), ClassName::member (class scope), ::globalVar (global scope). It is essential when the same name exists in multiple scopes.",8],["cpp","OOP Concepts","Classes & Objects · Access Specifiers · Overloading · Inheritance · Polymorphism · Namespaces","A class Student has: int rollNo; string name; float marks;. To create 10 student objects, which is best?","","",["Student s1, s2, s3, s4, s5, s6, s7, s8, s9, s10;","Student students[10];","Student* s = new Student;","int students[10];"],1,"Student students[10]; declares an array of 10 Student objects efficiently. Each element is a full Student object accessed via students[i]. Declaring 10 separate variables is redundant and hard to manage programmatically.",9],["cpp","OOP Concepts","Classes & Objects · Access Specifiers · Overloading · Inheritance · Polymorphism · Namespaces","What is abstraction in OOP?","","",["Exposing all internal implementation details","Hiding complex implementation and showing only relevant features","Making all class members public","Preventing class inheritance"],1,"Abstraction means showing only the necessary aspects and hiding the complexity. In C++, it is achieved through abstract classes and interfaces (pure virtual functions). Users interact with the interface without needing to know the implementation details.",10],["cpp","Constructors and Destructor","Constructors · Parameterized · Multiple Constructors · Copy Constructor · Destructor · Inner Class","When is a constructor automatically called in C++?","","",["When the class is defined","When an object of the class is created","When a member function is called","When the program ends"],1,"A constructor is automatically called when an object is instantiated (created). It initializes the object. The constructor has the same name as the class, no return type, and can be overloaded.",1],["cpp","Constructors and Destructor","Constructors · Parameterized · Multiple Constructors · Copy Constructor · Destructor · Inner Class","What is a parameterized constructor?","","",["A constructor with no parameters","A constructor that accepts arguments to initialize members","A constructor that copies another object","A destructor with parameters"],1,"A parameterized constructor takes arguments to initialize member variables with specific values at object creation. Example: Student(int r, string n) { rollNo=r; name=n; }. This allows creating objects with different initial states.",2],["cpp","Constructors and Destructor","Constructors · Parameterized · Multiple Constructors · Copy Constructor · Destructor · Inner Class","What is a copy constructor?","","",["A constructor that deletes an object","A constructor that creates a new object as a copy of an existing object","A constructor called automatically at program exit","A constructor with no body"],1,"A copy constructor creates a new object as a copy of an existing object. Signature: ClassName(const ClassName& obj). It is called when: passing objects by value, returning objects, or explicitly initializing with another object.",3],["cpp","Constructors and Destructor","Constructors · Parameterized · Multiple Constructors · Copy Constructor · Destructor · Inner Class","What is the output?","class A {\npublic:\nA() { cout << \"C\"; }\n~A() { cout << \"D\"; }\n};\nint main() { A obj; }","",["C","D","CD","DC"],2,"When obj is created, the constructor A() runs, printing 'C'. When main() ends, obj goes out of scope and the de
