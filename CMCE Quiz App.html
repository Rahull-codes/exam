Map(f) applies f returning Stream> then flattens to Stream. Example: ['Hello','World'].stream().map(s->s.chars()) gives Stream. flatMap gives one flat IntStream of all characters.",10],["java","Multithreading — Thread Class & Runnable Interface","Thread Class · Runnable Interface · sleep/join/yield/setPriority · ThreadGroup","What are the two main ways to create a thread in Java?","","",["Extending Thread class OR implementing Runnable interface","Using Runnable OR Callable interface (both for threads)","Extending Thread OR extending Object","Implementing Runnable OR implementing Iterable"],0,"Two ways: 1) Extend Thread and override run(). 2) Implement Runnable, pass to Thread constructor: new Thread(runnableObj).start(). Runnable is preferred as Java supports single inheritance — implementing Runnable allows the class to extend another class. Callable is for threads that return a result.",1],["java","Multithreading — Thread Class & Runnable Interface","Thread Class · Runnable Interface · sleep/join/yield/setPriority · ThreadGroup","What is the difference between calling `thread.start()` and `thread.run()`?","","",["They are identical — both start a new thread","start() creates a new thread and calls run() in that thread; run() executes in the current thread","run() creates a new thread; start() executes the thread","start() is asynchronous; run() is for testing only"],1,"start() tells JVM to create a new OS thread and execute run() in it — TRUE multithreading. Calling run() directly is just a normal method call — executes sequentially in the calling thread, NO new thread is created. This is a classic interview question.",2],["java","Multithreading — Thread Class & Runnable Interface","Thread Class · Runnable Interface · sleep/join/yield/setPriority · ThreadGroup","What does `Thread.sleep(1000)` do?","","",["Pauses all threads for 1000 milliseconds","Pauses the currently executing thread for 1000 milliseconds without releasing locks","Pauses the thread and releases all synchronized locks","Terminates the thread after 1000 milliseconds"],1,"Thread.sleep(ms) causes the current thread to pause (go to TIMED_WAITING state) for the specified time. Critically, it does NOT release any synchronized locks it holds. It throws InterruptedException if another thread calls interrupt(). wait() does release locks.",3],["java","Multithreading — Thread Class & Runnable Interface","Thread Class · Runnable Interface · sleep/join/yield/setPriority · ThreadGroup","What is the purpose of `thread.join()`?","","",["Merges two threads into one","Makes the calling thread wait until the joined thread completes","Adds the thread to a thread group","Connects a thread to a network socket"],1,"join() causes the calling (current) thread to wait until the specified thread finishes execution. Use case: main thread must wait for worker threads to complete before processing results. join(timeoutMs) has a timeout. Without join, main might finish before workers complete.",4],["java","Multithreading — Thread Class & Runnable Interface","Thread Class · Runnable Interface · sleep/join/yield/setPriority · ThreadGroup","What is thread priority in Java, and what is the range?","","",["Priority ranges from 0 to 10; higher = more CPU time","Priority ranges from 1 to 10; used as hint to the thread scheduler","Priority ranges from 1 to 100; determines exact execution order","Priority is not supported in Java — all threads have equal priority"],1,"Thread priority: 1 (MIN_PRIORITY) to 10 (MAX_PRIORITY), default 5 (NORM_PRIORITY). Higher priority threads are preferred by the scheduler, but this is a hint — not a guarantee. Behavior is platform-dependent. setPriority(int) and getPriority() manage priorities.",5],["java","Multithreading — Thread Class & Runnable Interface","Thread Class · Runnable Interface · sleep/join/yield/setPriority · ThreadGroup","What does `Thread.yield()` do?","","",["Terminates the current thread","Pauses the current thread and gives other threads of the same priority a chance to execute","Releases all locks held by the current thread","Puts the thread into a waiting state indefinitely"],1,"yield() is a hint to the scheduler that the current thread is willing to give up CPU time, allowing other threads of equal (or higher) priority to run. It moves the thread from RUNNING to RUNNABLE state. It's a hint — the scheduler may ignore it.",6],["java","Multithreading — Thread Class & Runnable Interface","Thread Class · Runnable Interface · sleep/join/yield/setPriority · ThreadGroup","What are the thread states in Java?","","",["Created, Running, Sleeping, Dead","NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, TERMINATED","STARTED, ACTIVE, PAUSED, FINISHED","READY, RUNNING, SUSPENDED, STOPPED"],1,"Java thread states (Thread.State enum): NEW (created, not started), RUNNABLE (running/ready to run), BLOCKED (waiting for monitor lock), WAITING (waiting indefinitely — wait()/join()), TIMED_WAITING (sleeping/timed wait), TERMINATED (finished). Thread.getState() returns current state.",7],["java","Multithreading — Thread Class & Runnable Interface","Thread Class · Runnable Interface · sleep/join/yield/setPriority · ThreadGroup","What is a daemon thread in Java?","","",["A thread with the highest priority","A background service thread that JVM terminates when all non-daemon threads finish","A thread that cannot be interrupted","The main application thread"],1,"Daemon threads: background threads (GC, JIT compiler are daemon threads). JVM exits when all non-daemon threads finish, regardless of daemon thread state. Set before starting: thread.setDaemon(true). Use for background cleanup tasks that shouldn't prevent JVM shutdown.",8],["java","Multithreading — Thread Class & Runnable Interface","Thread Class · Runnable Interface · sleep/join/yield/setPriority · ThreadGroup","What is the purpose of `ThreadGroup` in Java?","","",["To synchronize multiple threads","To organize threads into a hierarchical group for bulk management (interrupt all, set max priority, etc.)","To allow threads to share memory directly","To schedule threads in a fixed rotation"],1,"ThreadGroup provides a tree structure for grouping threads. Operations can be applied to the entire group: interrupt(), setMaxPriority(). JVM's main thread is in the 'main' group. However, modern Java prefers ExecutorService for thread management over ThreadGroup.",9],["java","Multithreading — Thread Class & Runnable Interface","Thread Class · Runnable Interface · sleep/join/yield/setPriority · ThreadGroup","What is the output of the following multithreading code?","public class Test extends Thread {\npublic void run() { System.out.print(\"T \"); }\npublic static void main(String[] args) {\nTest t = new Test();\nt.start();\nSystem.out.print(\"M \");\n}\n}","",["Always: T M","Always: M T","Either 'T M' or 'M T' — non-deterministic","Compilation Error"],2,"After t.start(), both the main thread and thread T run concurrently. The OS scheduler decides which runs first — this is non-deterministic. The output could be 'T M', 'M T', or even 'TM' or 'MT' (interleaved). This demonstrates the fundamental non-determinism of multithreading.",10],["java","Synchronization, Deadlock & Inter-Thread Communication","Synchronization · Deadlock · wait/notify/notifyAll · Producer-Consumer Problem","What is a race condition in multithreading?","","",["When two threads race to finish first for performance benchmarking","When multiple threads access shared data concurrently without synchronization, causing unpredictable results","When a thread is blocked waiting for a lock held by another thread","When threads have different priorities and the higher-priority thread always wins"],1,"Race condition: the outcome depends on the non-deterministic ordering of thread execution. E.g., two threads incrementing a shared counter without synchronization — both read the same value, both increment, both write — net effect: +1 instead of +2. Synchronization prevents this.",1],["java","Synchronization, Deadlock & Inter-Thread Communication","Synchronization · Deadlock · wait/notify/notifyAll · Producer-Consumer Problem","What does the `synchronized` keyword on a method provide?","","",["It makes the method run faster by using multiple threads","Only one thread can execute the method on a given object at a time","The method becomes read-only","All threads execute the method in the order they requested it"],1,"synchronized acquires the object's intrinsic monitor (lock) before entering the method and releases it on exit. Only one thread holds the lock at a time — other threads block waiting. For static synchronized methods, the lock is on the Class object.",2],["java","Synchronization, Deadlock & Inter-Thread Communication","Synchronization · Deadlock · wait/notify/notifyAll · Producer-Consumer Problem","What is a deadlock in Java multithreading?","","",["A thread that runs indefinitely without terminating","A situation where two or more threads are permanently blocked, each waiting for a lock held by the other","A thread that is too slow and blocks other faster threads","JVM running out of memory due to too many threads"],1,"Deadlock: Thread A holds Lock1, waits for Lock2. Thread B holds Lock2, waits for Lock1. Neither can proceed. Conditions: mutual exclusion, hold-and-wait, no preemption, circular wait. Prevention: always acquire locks in the same order. Detection: jstack tool.",3],["java","Synchronization, Deadlock & Inter-Thread Communication","Synchronization · Deadlock · wait/notify/notifyAll · Producer-Consumer Problem","What is the difference between `wait()` and `sleep()`?","","",["Both release the lock; only sleep() has a timeout","wait() releases the lock and waits for notify; sleep() pauses without releasing the lock","sleep() releases the lock; wait() does not","They are identical — both cause the thread to pause"],1,"wait() RELEASES the intrinsic lock and enters WAITING state until notify()/notifyAll() is called. Must be called inside synchronized block. sleep() does NOT release any locks — thread pauses in TIMED_WAITING. wait() is for inter-thread communication; sleep() is for timing delays.",4],["java","Synchronization, Deadlock & Inter-Thread Communication","Synchronization · Deadlock · wait/notify/notifyAll · Producer-Consumer Problem","In the Producer-Consumer problem, what role does `notify()` play?","","",["Terminates the consumer thread after production is complete","Wakes up one thread that is waiting on the same object's monitor","Sends a message to all threads in the application","Creates a new consumer thread when the queue is full"],1,"notify() wakes up ONE arbitrary thread waiting on the object's monitor. notifyAll() wakes up ALL waiting threads. In Producer-Consumer: producer calls notify() after adding to queue (wake consumer), consumer calls notify() after removing (wake producer if buffer was full).",5],["java","Synchronization, Deadlock & Inter-Thread Communication","Synchronization · Deadlock · wait/notify/notifyAll · Producer-Consumer Problem","What is a synchronized block and how does it differ from a synchronized method?","","",["Synchronized block locks the entire class; method locks the object","Synchronized block allows locking on a specific object; reduces the locked code scope for better performance","They are identical in functionality and performance","Synchronized method is preferred; synchronized blocks are deprecated"],1,"synchronized(lockObject) { /* critical section */ } locks only the specified object for only the enclosed code. This is more flexible and efficient than synchronizing the entire method (which locks 'this'). Smaller critical sections = less contention = better throughput.",6],["java","Synchronization, Deadlock & Inter-Thread Communication","Synchronization · Deadlock · wait/notify/notifyAll · Producer-Consumer Problem","What is the `volatile` keyword in Java used for?","","",["To make a variable constant","To ensure visibility of changes to a variable across threads (reads/writes go directly to main memory)","To synchronize access to a method","To prevent a variable from being garbage collected"],1,"volatile ensures that reads/writes to a variable go directly to main memory (not CPU cache). This solves visibility issues — changes by one thread are immediately visible to others. However, volatile doesn't ensure atomicity for compound operations (i++). Use AtomicInteger for that.",7],["java","Synchronization, Deadlock & Inter-Thread Communication","Synchronization · Deadlock · wait/notify/notifyAll · Producer-Consumer Problem","What must be true before calling `wait()`, `notify()`, or `notifyAll()` on an object?","","",["The thread must have the highest priority","The thread must own the object's monitor (be inside a synchronized block on that object)","The object must be serializable","The object must be in the heap"],1,"wait(), notify(), notifyAll() are defined in Object and must be called from within a synchronized block/method on the same object. If called outside synchronized context, IllegalMonitorStateException is thrown at runtime.",8],["java","Synchronization, Deadlock & Inter-Thread Communication","Synchronization · Deadlock · wait/notify/notifyAll · Producer-Consumer Problem","What is livelock in multithreading?","","",["Threads are blocked forever (same as deadlock)","Threads are not blocked but continuously changing state in response to each other without making progress","A single thread executing infinitely","Multiple threads competing for CPU time"],1,"Livelock: threads are active (not blocked) but keep responding to each other's actions without progressing — like two people in a hallway each stepping aside to let the other pass, but always in the same direction. Unlike deadlock, threads aren't waiting — they're actively but futilely responding.",9],["java","Synchronization, Deadlock & Inter-Thread Communication","Synchronization · Deadlock · wait/notify/notifyAll · Producer-Consumer Problem","What does `notifyAll()` do compared to `notify()`?","","",["notifyAll() terminates all waiting threads; notify() terminates one","notifyAll() wakes ALL threads waiting on the monitor; notify() wakes ONE arbitrary thread","They are identical in Java","notifyAll() is faster than notify()"],1,"notify() wakes one arbitrary waiting thread — if multiple threads are waiting, you can't control which one is chosen. notifyAll() wakes all waiting threads — they compete for the lock. notifyAll() is safer in most cases to avoid situations where the wrong thread is notified.",10],["java","Generics & Reflection API","Generic Classes & Methods · Wildcards (Upper/Lower Bound) · Metadata & Reflection API","What is the primary purpose of Generics in Java?","","",["To improve runtime performance","To provide compile-time type safety and eliminate the need for explicit casting","To allow classes to have multiple inheritance","To make Java dynamically typed"],1,"Generics (Java 5) provide type parameters for classes, interfaces, and methods. List ensures only Strings can be added — type errors caught at compile time, not runtime. Eliminates ClassCastException. Type erasure: generic type info is removed at runtime — JVM sees raw types.",1],["java","Generics & Reflection API","Generic Classes & Methods · Wildcards (Upper/Lower Bound) · Metadata & Reflection API","What is type erasure in Java Generics?","","",["Removing generic types from source code during compilation","The compiler removes generic type information and replaces type parameters with Object (or bounds) in bytecode","Preventing generics from being used at runtime","Erasing type information from the Class object"],1,"Type erasure: at compile time, List and List both become List in bytecode. Type parameters T are replaced with Object (or the bound: T extends Number → Number). This maintains backward compatibility with pre-generics code but prevents runtime generic type checks.",2],["java","Generics & Reflection API","Generic Classes & Methods · Wildcards (Upper/Lower Bound) · Metadata & Reflection API","What is the difference between `List` and `List`?","","",["Both accept only Number objects","? extends Number: accepts Number or subtype (read/producer); ? super Number: accepts Number or supertype (write/consumer)","? extends is for input parameters; ? super is for output","They are identical wildcards"],1,"PECS principle (Producer Extends, Consumer Super). ? extends Number: upper bound — safe to read as Number, cannot add (except null). ? super Number: lower bound — safe to add Numbers, cannot read with type safety (get returns Object). This enables flexible, type-safe generic APIs.",3],["java","Generics & Reflection API","Generic Classes & Methods · Wildcards (Upper/Lower Bound) · Metadata & Reflection API","What is the Reflection API in Java used for?","","",["To reflect light patterns for graphics rendering","To inspect and manipulate class structure (fields, methods, constructors) at runtime","To compare two objects structurally","To create thread-safe reflective copies of objects"],1,"Reflection (java.lang.reflect) lets programs examine and modify class structure and behavior at runtime: get/set fields (even private), invoke methods, create instances, inspect annotations. Used in frameworks (Spring, Hibernate, JUnit). Has performance overhead and bypasses access control.",4],["java","Generics & Reflection API","Generic Classes & Methods · Wildcards (Upper/Lower Bound) · Metadata & Reflection API","How do you get the Class object for a class using Reflection?","","",["Only: String.class","Only: obj.getClass()","Only: Class.forName(\"fully.qualified.ClassName\")","All three: ClassName.class, obj.getClass(), and Class.forName(\"...\") are valid"],3,"Three ways to get Class object: 1) ClassName.class (compile-time literal — most common). 2) obj.getClass() (runtime — when you have an instance). 3) Class.forName('fully.qualified.Name') (runtime — when class name is in a String, e.g., from config file). forName() triggers class loading.",5],["java","Generics & Reflection API","Generic Classes & Methods · Wildcards (Upper/Lower Bound) · Metadata & Reflection API","What is the output of this generic method?","public static void printType(T item) {\nSystem.out.println(item.getClass().getSimpleName());\n}\nprintType(42);\nprintType(\"Hello\");","",["int, String","Integer, String","T, T","Object, Object"],1,"Autoboxing converts 42 to Integer before passing to the generic method. T is inferred as Integer for the first call and String for the second. getSimpleName() returns 'Integer' and 'String' (not 'int' — getClass() works on objects, not primitives).",6],["java","Generics & Reflection API","Generic Classes & Methods · Wildcards (Upper/Lower Bound) · Metadata & Reflection API","How do you invoke a private method of another class using Reflection?","Class cls = SomeClass.class;\nMethod m = cls.getDeclaredMethod(\"privateMethod\");\n// What's the next critical step?","",["m.invoke(obj); // directly works","m.setAccessible(true); then m.invoke(obj);","m.makePublic(); then m.invoke(obj);","Use getMethod() instead of getDeclaredMethod()"],1,"getDeclaredMethod() gets the method regardless of access modifier. setAccessible(true) bypasses Java's access control for this Method object. Without it, invoking a private method throws IllegalAccessException. This is a powerful but use-with-caution feature — breaks encapsulation.",7],["java","Generics & Reflection API","Generic Classes & Methods · Wildcards (Upper/Lower Bound) · Metadata & Reflection API","What does the following unbounded wildcard `List` mean?","","",["A list of any subtype of Object — but you can add any element to it","A list of an unknown type — you can only read elements as Object; you cannot add (except null)","A list that accepts null only","An empty list placeholder"],1,"List is an unbounded wildcard — the element type is unknown. Safe to read (elements come out as Object). CANNOT add elements (except null) because the actual type is unknown — adding could violate type safety. Useful for methods that work with any type: void print(List list).",8],["java","Generics & Reflection API","Generic Classes & Methods · Wildcards (Upper/Lower Bound) · Metadata & Reflection API","What is the purpose of `Class.getDeclaredFields()` vs `Class.getFields()` in Reflection?","","",["They return identical results","getDeclaredFields(): all fields of THIS class (including private) but not inherited; getFields(): only public fields including inherited","getFields(): all fields of this class; getDeclaredFields(): only public fields","getDeclaredFields() is for static fields; getFields() is for instance fields"],1,"getDeclared*() methods return members declared in the class itself (all access levels, not inherited). get*() methods return public members including inherited ones. Similarly: getDeclaredMethods() vs getMethods(), getDeclaredConstructors() vs getConstructors().",9],["java","Generics & Reflection API","Generic Classes & Methods · Wildcards (Upper/Lower Bound) · Metadata & Reflection API","What is a generic class and which syntax correctly defines one? // Define a generic Pair class holding two values of types A and B","","",["class Pair { A first; B second; }","class Pair { A first; B second; Pair(A a, B b){first=a; second=b;} }","class Pair[A, B] { A first; B second; }","generic class Pair { A first; B second; }"],1,"Generic classes use angle brackets after the class name. Multiple type parameters are comma-separated. By convention: T (type), E (element), K (key), V (value), N (number). At usage: Pair p = new Pair<>(\"Age\", 30); Type inference with diamond <> since Java 7.",10],["web","Architecture of the Web","Internet History · HTTP (1.0/1.1/2.0) · Methods · Status Codes · HTTPS · Web Servers","Which HTTP method is used to request data from a server without modifying it?","","",["POST","PUT","GET","DELETE"],2,"GET retrieves data from the server. It is idempotent and safe — repeated calls produce the same result without side effects. Parameters are sent in the URL query string. POST sends data in the request body and can modify server state.",1],["web","Architecture of the Web","Internet History · HTTP (1.0/1.1/2.0) · Methods · Status Codes · HTTPS · Web Servers","What is the key improvement of HTTP/2.0 over HTTP/1.1?","","",["HTTP/2 uses plain text; HTTP/1.1 uses binary","HTTP/2 supports multiplexing — multiple requests over a single TCP connection","HTTP/2 removes the concept of headers","HTTP/2 only works with HTTPS"],1,"HTTP/2 introduces multiplexing (multiple concurrent request/response streams over one TCP connection), header compression (HPACK), server push, and binary framing. HTTP/1.1 opens a new connection per request or uses pipelining (which has head-of-line blocking issues).",2],["web","Architecture of the Web","Internet History · HTTP (1.0/1.1/2.0) · Methods · Status Codes · HTTPS · Web Servers","What does HTTP status code 404 mean?","","",["Internal Server Error","Unauthorized","Resource Not Found","Bad Request"],2,"404 Not Found: the server cannot find the requested resource. Common HTTP codes: 200 OK, 201 Created, 301 Moved Permanently, 302 Found, 400 Bad Request, 401 Unauthorized, 403 Forbidden, 500 Internal Server Error.",3],["web","Architecture of the Web","Internet History · HTTP (1.0/1.1/2.0) · Methods · Status Codes · HTTPS · Web Servers","What makes HTTP a 'stateless' protocol?","","",["It uses UDP instead of TCP","Each request is independent — the server retains no memory of previous requests","It cannot maintain sessions","It only supports GET requests"],1,"HTTP is stateless: each request is self-contained and independent. The server does not remember previous requests. State management is handled at the application level using cookies, sessions, tokens, or URL parameters.",4],["web","Architecture of the Web","Internet History · HTTP (1.0/1.1/2.0) · Methods · Status Codes · HTTPS · Web Servers","What is HTTPS?","","",["A faster version of HTTP","HTTP secured with TLS/SSL encryption","HTTP version 2.0","HTTP for mobile devices"],1,"HTTPS (HTTP Secure) uses TLS (Transport Layer Security, formerly SSL) to encrypt communication between client and server. It ensures confidentiality, integrity, and server authentication. It uses port 443 by default (HTTP uses port 80).",5],["web","Architecture of the Web","Internet History · HTTP (1.0/1.1/2.0) · Methods · Status Codes · HTTPS · Web Servers","What does DNS (Domain Name Service) do?","","",["Encrypts web traffic","Translates human-readable domain names to IP addresses","Routes packets across the internet","Manages HTTP sessions"],1,"DNS translates domain names (e.g., www.example.com) into IP addresses (e.g., 93.184.216.34). Without DNS, users would need to remember IP addresses. DNS is a hierarchical, distributed naming system.",6],["web","Architecture of the Web","Internet History · HTTP (1.0/1.1/2.0) · Methods · Status Codes · HTTPS · Web Servers","Which HTTP method is used to submit form data to a server to create/update a resource?","","",["GET","HEAD","POST","OPTIONS"],2,"POST sends data in the request body to create or process a resource. Unlike GET, POST data is not visible in the URL and is not cached by default. POST is not idempotent — calling it multiple times may create multiple resources.",7],["web","Architecture of the Web","Internet History · HTTP (1.0/1.1/2.0) · Methods · Status Codes · HTTPS · Web Servers","What is the difference between Apache and IIS web servers?","","",["Apache runs only on Windows; IIS on Linux","Apache is open-source and cross-platform; IIS is Microsoft's web server for Windows","IIS is faster than Apache in all scenarios","Apache supports only static files"],1,"Apache HTTP Server is open-source, cross-platform (Linux/Windows/macOS), and highly configurable. IIS (Internet Information Services) is Microsoft's proprietary web server for Windows. Apache is the most widely deployed web server globally.",8],["web","Architecture of the Web","Internet History · HTTP (1.0/1.1/2.0) · Methods · Status Codes · HTTPS · Web Servers","HTTP/1.0 vs HTTP/1.1 — which feature does HTTP/1.1 introduce?","","",["Request methods like GET and POST","Persistent connections (keep-alive) by default","TLS encryption","Binary protocol"],1,"HTTP/1.1 introduced persistent connections (keep-alive) — the TCP connection stays open for multiple requests, reducing latency. HTTP/1.0 opened a new TCP connection for every request. HTTP/1.1 also added chunked transfer encoding and virtual hosting.",9],["web","Architecture of the Web","Internet History · HTTP (1.0/1.1/2.0) · Methods · Status Codes · HTTPS · Web Servers","What is the purpose of the HTTP HEAD method?","","",["Retrieves the HTML head section only","Same as GET but returns only headers, not the response body","Deletes a resource","Updates a resource header"],1,"HEAD is identical to GET but the server returns only the response headers without the body. It is used to check if a resource exists, retrieve metadata (content-type, content-length), or check if a cached resource has changed — without downloading the full content.",10],["web","HTML","HTML5 Tags · Forms · DOM Introduction · New HTML5 Features · Audio/Video/Geolocation","Which HTML5 element is used to draw graphics via JavaScript?","","",["<svg>","<canvas>","<figure>","<graphic>"],1,"<canvas> provides a drawing surface for 2D graphics via JavaScript's Canvas API. SVG is also for graphics but is XML-based (vector). <canvas> is used for dynamic rendering, games, and data visualizations.",1],["web","HTML","HTML5 Tags · Forms · DOM Introduction · New HTML5 Features · Audio/Video/Geolocation","Which HTML tag creates a hyperlink?","","",["<link>","<href>","<a>","<nav>"],2,"The <a> (anchor) tag creates hyperlinks. The href attribute specifies the URL: <a href='https://example.com'>Link<\/a>. <link> is used in the <head> to link external resources (CSS). href is an attribute, not a tag.",2],["web","HTML","HTML5 Tags · Forms · DOM Introduction · New HTML5 Features · Audio/Video/Geolocation","What is the DOM (Document Object Model)?","","",["A CSS styling framework","A programming interface representing HTML/XML as a tree of objects that can be manipulated","The HTML document itself","A server-side rendering engine"],1,"The DOM is a tree-structured representation of an HTML/XML document where each node is an object. JavaScript can access and manipulate the DOM to dynamically change content, structure, and styles. Every HTML element becomes a DOM node.",3],["web","HTML","HTML5 Tags · Forms · DOM Introduction · New HTML5 Features · Audio/Video/Geolocation","Which input type in HTML5 allows selecting a date using a date picker?","","",["<input type='text'>","<input type='calendar'>","<input type='date'>","<input type='datetime'>"],2,"<input type='date'> renders a browser-native date picker control. HTML5 added many new input types: email, url, number, range, color, date, time, datetime-local, month, week, search — reducing the need for JavaScript validation.",4],["web","HTML","HTML5 Tags · Forms · DOM Introduction · New HTML5 Features · Audio/Video/Geolocation","What is the purpose of the HTML5 <article> element?","","",["Creates an ordered list","Defines independent, self-contained content (like a blog post or news article)","Creates a navigation menu","Defines a table row"],1,"HTML5 semantic elements: <article> (independent content), <section> (thematic grouping), <nav> (navigation links), <header> (introductory content), <footer> (footer content), <aside> (sidebar), <main> (main content). These improve accessibility and SEO.",5],["web","HTML","HTML5 Tags · Forms · DOM Introduction · New HTML5 Features · Audio/Video/Geolocation","What attribute makes an HTML form field required before submission?","","",["mandatory","required","validate","notnull"],1,"The required attribute (HTML5) prevents form submission if the field is empty and triggers browser-native validation. Example: <input type='email' required>. This provides client-side validation without JavaScript.",6],["web","HTML","HTML5 Tags · Forms · DOM Introduction · New HTML5 Features · Audio/Video/Geolocation","What does the HTML5 Geolocation API do?","","",["Displays a map on the webpage","Retrieves the user's geographic location (latitude/longitude) with their permission","Tracks server location","Provides IP-based location"],1,"The Geolocation API (navigator.geolocation.getCurrentPosition()) retrieves the device's geographic coordinates. The browser prompts the user for permission. It uses GPS, WiFi, or IP-based geolocation depending on device capabilities.",7],["web","HTML","HTML5 Tags · Forms · DOM Introduction · New HTML5 Features · Audio/Video/Geolocation","Which HTML5 element is used to embed audio without plugins?","","",["<media>","<sound>","<audio>","<embed>"],2,"HTML5 <audio> embeds audio natively without Flash or plugins. Example: <audio controls><source src='music.mp3' type='audio/mpeg'><\/audio>. Similarly, <video> embeds video. Supported formats vary by browser (MP3, OGG, WAV for audio).",8],["web","HTML","HTML5 Tags · Forms · DOM Introduction · New HTML5 Features · Audio/Video/Geolocation","What is the difference between an ordered list <ol> and unordered list <ul>?","","",["<ol> uses bullets; <ul> uses numbers","<ol> uses numbers/letters (sequential); <ul> uses bullets (no sequence)","No difference","<ul> is for navigation only"],1,"<ol> (ordered list) displays items with sequential numbers or letters — used when order matters. <ul> (unordered list) displays items with bullet points — used when order doesn't matter. Both contain <li> (list item) elements.",9],["web","HTML","HTML5 Tags · Forms · DOM Introduction · New HTML5 Features · Audio/Video/Geolocation","Which HTML attribute is used to specify alternative text for an image?","","",["title","src","alt","caption"],2,"The alt attribute provides alternative text for an image when it cannot be displayed. It is essential for accessibility (screen readers) and SEO. Example: <img src='logo.png' alt='Company Logo'>. Never leave alt empty for meaningful images.",10],["web","CSS (Cascading Style Sheets)","Inline/Internal/External CSS · Box Model · Selectors · id/class · Fonts · Linking","What is the correct order of CSS specificity (lowest to highest)?","","",["Inline > ID > Class > Element","Element < Class < ID < Inline","Class > ID > Inline > Element","All have equal specificity"],1,"CSS specificity hierarchy (lowest to highest): Element/Type selectors (p, div) < Class selectors (.class), attribute, pseudo-class < ID selectors (#id) < Inline styles. !important overrides all. Higher specificity wins when rules conflict.",1],["web","CSS (Cascading Style Sheets)","Inline/Internal/External CSS · Box Model · Selectors · id/class · Fonts · Linking","What does the CSS Box Model consist of?","","",["Content, Padding, Border, Margin","Width, Height, Color, Font","Header, Body, Footer, Sidebar","Display, Position, Float, Clear"],0,"The CSS Box Model: Content (innermost — text/images), Padding (space between content and border), Border (line around padding), Margin (space outside the border). box-sizing: border-box includes padding and border in the element's total width/height.",2],["web","CSS (Cascading Style Sheets)","Inline/Internal/External CSS · Box Model · Selectors · id/class · Fonts · Linking","What is the difference between id and class selectors in CSS?","","",["No difference","id (#) is unique per page — one element; class (.) can apply to multiple elements","class is unique; id applies to multiple elements","id is for JavaScript only; class is for CSS only"],1,"id (#id) must be unique per HTML document — targets a single element. class (.class) can be reused across multiple elements. An element can have multiple classes (class='btn primary') but only one id. id has higher CSS specificity than class.",3],["web","CSS (Cascading Style Sheets)","Inline/Internal/External CSS · Box Model · Selectors · id/class · Fonts · Linking","Which CSS property controls the space INSIDE an element between content and border?","","",["margin","spacing","padding","border-space"],2,"padding is the space between the content and the border (inside the element). margin is the space outside the border (between elements). Example: padding: 10px 20px; sets 10px top/bottom and 20px left/right padding.",4],["web","CSS (Cascading Style Sheets)","Inline/Internal/External CSS · Box Model · Selectors · id/class · Fonts · Linking","How do you link an external CSS file to an HTML document?","","",["<style src='styles.css'>","<link rel='stylesheet' href='styles.css'>","<css href='styles.css'>","@import 'styles.css' in body"],1,"<link rel='stylesheet' href='styles.css'> in the <head> section links an external CSS file. This is the preferred method for maintainability. You can also use @import inside a <style> tag or CSS file, but <link> is faster (parallel download).",5],["web","CSS (Cascading Style Sheets)","Inline/Internal/External CSS · Box Model · Selectors · id/class · Fonts · Linking","What does 'cascading' mean in CSS?","","",["Styles flow downward in the HTML structure","Multiple style sheets cascade — rules are applied based on specificity, origin, and importance","CSS files load in sequence","Styles are applied alphabetically"],1,"Cascading refers to the algorithm that determines which CSS rule applies when multiple rules target the same element. The cascade considers: origin (browser default < author < user), specificity, and order (later rules win for equal specificity).",6],["web","CSS (Cascading Style Sheets)","Inline/Internal/External CSS · Box Model · Selectors · id/class · Fonts · Linking","What is the difference between inline, internal, and external CSS?","","",["They differ only in file size","Inline: style attribute on element; Internal: <style> in <head>; External: separate .css file linked via <link>","Inline is the most maintainable","External CSS has the highest specificity"],1,"Inline CSS (style='...'): highest specificity, least reusable. Internal CSS (<style> in <head>): applies to one page. External CSS (linked .css file): best for maintainability and reuse across pages. External CSS is the recommended approach for real projects.",7],["web","CSS (Cascading Style Sheets)","Inline/Internal/External CSS · Box Model · Selectors · id/class · Fonts · Linking","What CSS property makes text bold?","","",["text-style: bold","font-weight: bold","text-decoration: bold","font-style: bold"],1,"font-weight: bold; (or font-weight: 700;) makes text bold. font-style: italic; makes text italic. text-decoration: underline; underlines text. font-size sets size. These are distinct font/text properties.",8],["web","CSS (Cascading Style Sheets)","Inline/Internal/External CSS · Box Model · Selectors · id/class · Fonts · Linking","What does the CSS property 'display: flex' enable?","","",["Makes an element invisible","Enables the Flexbox layout model for flexible, responsive one-dimensional layouts","Makes an element float left","Creates a CSS grid layout"],1,"display: flex turns the element into a flex container. Its children become flex items that can be aligned, distributed, and ordered flexibly. Flexbox is one-dimensional (row or column). CSS Grid (display: grid) is two-dimensional.",9],["web","CSS (Cascading Style Sheets)","Inline/Internal/External CSS · Box Model · Selectors · id/class · Fonts · Linking","Which CSS selector targets ALL <p> elements inside a <div>?","","",["div + p { }","div > p { }","div p { }","div ~ p { }"],2,"div p { } (descendant selector) targets ALL <p> elements inside a <div> at any nesting level. div > p { } targets only DIRECT children. div + p { } targets the immediately following sibling. div ~ p { } targets all following siblings.",10],["web","Responsive Web Design & Bootstrap","Responsive Design · Bootstrap Grid · Components · Typography · Forms","What is Responsive Web Design?","","",["A design that responds to user mouse clicks","A design approach where layouts adapt to different screen sizes using flexible grids and media queries","A design that loads faster","A design that uses only Bootstrap"],1,"Responsive Web Design (RWD) ensures web pages render well on all devices (desktop, tablet, mobile). It uses fluid grids, flexible images, and CSS media queries to adapt layouts. The term was coined by Ethan Marcotte in 2010.",1],["web","Responsive Web Design & Bootstrap","Responsive Design · Bootstrap Grid · Components · Typography · Forms","How many columns does the Bootstrap grid system use?","","",["10","16","12","8"],2,"Bootstrap's grid system divides the page into 12 equal columns. You specify how many columns an element spans at different breakpoints: col-sm-6 (6/12 = half width on small screens), col-md-4 (4/12 = one-third on medium), etc.",2],["web","Responsive Web Design & Bootstrap","Responsive Design · Bootstrap Grid · Components · Typography · Forms","What Bootstrap class creates a responsive full-width container with padding?","","",[".wrapper",".container",".grid",".layout"],1,".container creates a fixed-width responsive container centered on the page. .container-fluid spans the full viewport width. Both add horizontal padding and are required to use the Bootstrap grid system properly.",3],["web","Responsive Web Design & Bootstrap","Responsive Design · Bootstrap Grid · Components · Typography · Forms","What does the Bootstrap class 'col-md-6' mean?","","",["Column with 6px margin on medium screens","Column spanning 6 of 12 grid columns on medium (md) and larger screens","Column with 6% width","6th column in a table"],1,"col-md-6 means: on medium screens (768px+), this column spans 6 of 12 columns (50% width). Bootstrap breakpoints: xs (<576px), sm (576px+), md (768px+), lg (992px+), xl (1200px+), xxl (1400px+ in Bootstrap 5).",4],["web","Responsive Web Design & Bootstrap","Responsive Design · Bootstrap Grid · Components · Typography · Forms","What is the purpose of Bootstrap's 'navbar' component?","","",["Creates a vertical sidebar","Creates a responsive navigation bar that collapses into a hamburger menu on small screens","Creates a page footer","Creates a dropdown menu only"],1,"Bootstrap's navbar component creates a responsive navigation header. On small screens, it collapses into a hamburger menu icon (toggler). It supports branding, links, dropdowns, forms, and other components within the nav.",5],["web","Responsive Web Design & Bootstrap","Responsive Design · Bootstrap Grid · Components · Typography · Forms","Which CSS feature allows different styles to be applied at different screen widths?","","",["CSS Variables","CSS Animations","CSS Media Queries","CSS Transitions"],2,"Media queries apply CSS rules conditionally based on viewport characteristics (width, height, orientation). Example: @media (max-width: 768px) { .sidebar { display: none; } }. They are the foundation of responsive design.",6],["web","Responsive Web Design & Bootstrap","Responsive Design · Bootstrap Grid · Components · Typography · Forms","What Bootstrap utility class hides an element on small screens but shows it on large screens?","","",[".hide-sm",".d-none d-lg-block",".invisible-sm",".sm-hidden lg-show"],1,"Bootstrap 4/5 display utilities: .d-none hides an element (display:none). .d-lg-block shows it as block on large screens. Combined: .d-none .d-lg-block hides on xs/sm/md, shows on lg+. Similarly .d-lg-none hides on lg+.",7],["web","Responsive Web Design & Bootstrap","Responsive Design · Bootstrap Grid · Components · Typography · Forms","What is a Bootstrap 'Jumbotron' (Bootstrap 4)?","","",["A large hero image","A large, padded display component for showcasing key content or calls to action","A Bootstrap navigation component","A Bootstrap form component"],1,"Jumbotron is a Bootstrap component that creates a large grey box for highlighting key content, typically at the top of a page. Note: Jumbotron was removed in Bootstrap 5 — replaced by using utility classes (padding, background-color) directly.",8],["web","Responsive Web Design & Bootstrap","Responsive Design · Bootstrap Grid · Components · Typography · Forms","How does the Bootstrap grid system achieve responsiveness?","","",["By using JavaScript to detect screen size","By using CSS media queries and percentage-based column widths","By generating different HTML for each device","By using server-side rendering based on user agent"],1,"Bootstrap's grid uses CSS media queries to apply percentage-based column widths at different breakpoints. Columns use float (Bootstrap 3) or flexbox (Bootstrap 4+) for layout. This is purely CSS — no JavaScript needed for the grid.",9],["web","Responsive Web Design & Bootstrap","Responsive Design · Bootstrap Grid · Components · Typography · Forms","What is the 'mobile-first' approach in Bootstrap?","","",["Designing only for mobile devices","Starting CSS design for the smallest screens and adding complexity for larger screens using min-width media queries","Hiding all content on desktop","Using smaller font sizes by default"],1,"Mobile-first means the base CSS styles are designed for the smallest (mobile) screens. Media queries with min-width add styles for larger screens. Bootstrap 3+ uses this approach. The opposite (desktop-first) uses max-width queries and is considered less efficient.",10],["web","JavaScript Fundamentals","Variables · Operators · Scope · Strings · Numbers · Arrays · Control Structures","What is the difference between var, let, and const in JavaScript?","","",["They are identical","var is function-scoped; let and const are block-scoped; const cannot be reassigned","let is function-scoped; var is block-scoped","const can be reassigned once"],1,"var: function-scoped, hoisted, can be redeclared. let: block-scoped, not hoisted (TDZ), can be reassigned. const: block-scoped, must be initialized, cannot be reassigned (but object properties can be mutated). Prefer const > let > var in modern JS.",1],["web","JavaScript Fundamentals","Variables · Operators · Scope · Strings · Numbers · Arrays · Control Structures","What is the output of: console.log(typeof null)?","","",["'null'","'object'","'undefined'","'boolean'"],1,"typeof null returns 'object' — this is a famous JavaScript bug from its early design that was kept for backward compatibility. null is its own primitive type. To check for null, use === null comparison: if (x === null).",2],["web","JavaScript Fundamentals","Variables · Operators · Scope · Strings · Numbers · Arrays · Control Structures","What does the Array method .map() do?","","",["Filters elements based on a condition","Creates a new array by applying a function to each element of the original array","Reduces the array to a single value","Sorts the array elements"],1,".map(callback) returns a new array where each element is transformed by the callback: [1,2,3].map(x => x*2) returns [2,4,6]. .filter() returns elements matching a condition. .reduce() accumulates to a single value. .sort() sorts in place.",3],["web","JavaScript Fundamentals","Variables · Operators · Scope · Strings · Numbers · Arrays · Control Structures","What is JavaScript hoisting?","","",["Moving code to the top of the file manually","JavaScript's behavior of moving variable/function declarations to the top of their scope during compilation","Copying a variable to global scope","A performance optimization technique"],1,"Hoisting moves declarations (not initializations) to the top of their scope. var declarations are hoisted and initialized to undefined. function declarations are fully hoisted. let/const are hoisted but not initialized (Temporal Dead Zone — accessing them before declaration throws ReferenceError).",4],["web","JavaScript Fundamentals","Variables · Operators · Scope · Strings · Numbers · Arrays · Control Structures","What is the difference between == and === in JavaScript?","","",["No difference","== compares values with type coercion; === compares value AND type without coercion","=== is for strings only","== is the assignment operator"],1,"== (loose equality) performs type coercion before comparison: 0 == '0' is true, null == undefined is true. === (strict equality) requires same type AND value: 0 === '0' is false. Always prefer === to avoid unexpected coercion bugs.",5],["web","JavaScript Fundamentals","Variables · Operators · Scope · Strings · Numbers · Arrays · Control Structures","What is the output of: console.log(0.1 + 0.2 === 0.3)?","","",["true","false","undefined","NaN"],1,"0.1 + 0.2 === 0.3 is false because JavaScript uses IEEE 754 floating-point arithmetic: 0.1 + 0.2 = 0.30000000000000004. To compare floats, use: Math.abs(0.1 + 0.2 - 0.3) < Number.EPSILON.",6],["web","JavaScript Fundamentals","Variables · Operators · Scope · Strings · Numbers · Arrays · Control Structures","What does the JavaScript 'use strict' directive do?","","",["Makes code run faster","Enables strict mode — catches silent errors, prevents use of undeclared variables, and restricts certain syntax","Enables ES6 features","Disables type coercion"],1,"'use strict'; enables JavaScript strict mode. It: prevents use of undeclared variables, disallows duplicate parameter names, prevents assignments to read-only properties, disables with statement, and makes this undefined in global functions. Placed at top of file or function.",7],["web","JavaScript Fundamentals","Variables · Operators · Scope · Strings · Numbers · Arrays · Control Structures","What is a JavaScript closure?","","",["A way to close browser windows","A function that retains access to its outer scope's variables even after the outer function has returned","A method to end a loop","An error handling mechanism"],1,"A closure is created when an inner function remembers variables from its outer (enclosing) function's scope even after the outer function has finished executing. Closures enable data privacy, factory functions, and callback patterns in JavaScript.",8],["web","JavaScript Fundamentals","Variables · Operators · Scope · Strings · Numbers · Arrays · Control Structures","Which JavaScript method removes the last element from an array and returns it?","","",[".shift()",".splice()",".pop()",".remove()"],2,".pop() removes and returns the last element. .shift() removes and returns the first element. .push() adds to the end. .unshift() adds to the beginning. .splice(index, n) removes n elements from index. .slice() returns a portion without modifying.",9],["web","JavaScript Fundamentals","Variables · Operators · Scope · Strings · Numbers · Arrays · Control Structures","What does the spread operator (...) do in JavaScript?","","",["Multiplies array elements","Expands an iterable (array, string) into individual elements","Creates a deep copy of all objects","Merges two functions"],1,"The spread operator (...) expands iterables: [...arr1, ...arr2] merges arrays, Math.max(...arr) spreads array as arguments, {...obj1, ...obj2} merges objects (shallow copy). Rest parameter (...args) collects multiple arguments into an array.",10],["web","JavaScript — OOP & Objects","Objects · Prototypes · Functions · Closures · OOP in JS · Inheritance","What is a JavaScript prototype?","","",["The first version of a class","An object from which other objects inherit properties and methods","A copy of an object","A JavaScript design pattern"],1,"Every JavaScript object has a prototype — an object it inherits properties from. When accessing a property, JS looks up the prototype chain. Object.prototype is at the top. Prototypal inheritance is the foundation of OOP in JavaScript.",1],["web","JavaScript — OOP & Objects","Objects · Prototypes · Functions · Closures · OOP in JS · Inheritance","What is the difference between a constructor function and a class in JavaScript?","","",["Classes are faster than constructor functions","ES6 classes are syntactic sugar over constructor functions and prototypes — functionally equivalent","Classes don't support inheritance","Constructor functions cannot have methods"],1,"ES6 classes (class Foo { }) are syntactic sugar over the prototype-based constructor function pattern. Internally, they both use prototypes. Classes add cleaner syntax, static methods, private fields (#), and the super keyword for inheritance.",2],["web","JavaScript — OOP & Objects","Objects · Prototypes · Functions · Closures · OOP in JS · Inheritance","What does the 'this' keyword refer to in a regular function in non-strict mode?","","",["The current function","The global object (window in browsers)","The enclosing class","undefined"],1,"In a regular function in non-strict mode, this refers to the global object (window in browsers, global in Node.js). In strict mode, this is undefined inside standalone functions. In methods, this refers to the object that called the method.",3],["web","JavaScript — OOP & Objects","Objects · Prototypes · Functions · Closures · OOP in JS · Inheritance","What is the purpose of the 'bind()' method in JavaScript?","","",["Combines two arrays","Creates a new function with 'this' bound to a specified object","Attaches event listeners","Validates function parameters"],1,"bind(thisArg, ...args) creates a new function with this permanently bound to thisArg. Unlike call()/apply() which invoke immediately, bind() returns a new function. Useful for callbacks and event handlers where this context is lost.",4],["web","JavaScript — OOP & Objects","Objects · Prototypes · Functions · Closures · OOP in JS · Inheritance","What is the output of:","const obj = { x: 10 };\nconst copy = Object.assign({}, obj);\ncopy.x = 20;\nconsole.log(obj.x);","",["20","10","undefined","Error"],1,"Object.assign({}, obj) creates a shallow copy. Changing copy.x = 20 does NOT affect obj.x because x is a primitive (number). However, if x were an object/array, changing its properties WOULD affect both (shallow copy shares nested references).",5],["web","JavaScript — OOP & Objects","Objects · Prototypes · Functions · Closures · OOP in JS · Inheritance","What is the prototype chain?","","",["A chain of constructor functions","The series of linked prototype objects that JavaScript traverses to find a property or method","A list of class inheritance","A chain of event listeners"],1,"When accessing a property on an object, JavaScript first checks the object itself, then its prototype (__proto__), then the prototype's prototype, and so on until Object.prototype (which has a null prototype). This traversal is the prototype chain.",6],["web","JavaScript — OOP & Objects","Objects · Prototypes · Functions · Closures · OOP in JS · Inheritance","Which ES6 feature allows extracting values from objects/arrays into variables?","","",["Spread operator","Destructuring assignment","Template literals","Arrow functions"],1,"Destructuring: const {name, age} = person; extracts object properties. const [first, second] = arr; extracts array elements. Supports default values, renaming, and rest patterns: const {a, ...rest} = obj;. A major ES6 productivity feature.",7],["web","JavaScript — OOP & Objects","Objects · Prototypes · Functions · Closures · OOP in JS · Inheritance","What is encapsulation in JavaScript OOP?","","",["Wrapping code in a function","Bundling data and methods together while restricting direct access to internal state","Copying objects","Creating multiple instances"],1,"Encapsulation bundles data (properties) and methods in an object/class and controls access. In ES2022+, private class fields (#privateProp) truly prevent external access. Previously, closures or naming conventions (_private) were used.",8],["web","JavaScript — OOP & Objects","Objects · Prototypes · Functions · Closures · OOP in JS · Inheritance","What is the difference between call(), apply(), and bind()?","","",["They are identical","call(thisArg, arg1, arg2) and apply(thisArg, [args]) invoke immediately; bind(thisArg) returns a new function","apply() is for arrays only","bind() invokes immediately"],1,"call(thisArg, a, b): invokes with this=thisArg, args individually. apply(thisArg, [a, b]): invokes with this=thisArg, args as array. bind(thisArg): returns NEW function with this bound. Call=Comma, Apply=Array (memory aid).",9],["web","JavaScript — OOP & Objects","Objects · Prototypes · Functions · Closures · OOP in JS · Inheritance","What is function currying in JavaScript?","","",["Passing a function as a callback","Transforming a function with multiple args into a sequence of functions each taking one arg","Combining two functions","A recursive function pattern"],1,"Currying transforms f(a, b, c) into f(a)(b)(c). Example: const add = a => b => a + b; add(2)(3) returns 5. Currying enables partial application (creating specialized functions from general ones) and is used heavily in functional programming.",10],["web","JavaScript — DOM, Forms & RegEx","DOM Manipulation · Events · Forms Validation · Regular Expressions · Debugging","Which method selects a DOM element by its id?","","",["document.querySelector('.id')","document.getElementByClass('id')","document.getElementById('id')","document.selectById('id')"],2,"document.getElementById('id') returns the element with that id. document.querySelector('#id') also works. document.getElementsByClassName() selects by class (returns HTMLCollection). document.querySelectorAll() uses CSS selectors and returns NodeList.",1],["web","JavaScript — DOM, Forms & RegEx","DOM Manipulation · Events · Forms Validation · Regular Expressions · Debugging","What is event bubbling in the DOM?","","",["Events that occur in an animation loop","An event triggered on a child element propagates up through all ancestor elements","Events that fire multiple times","Mouse events only"],1,"Event bubbling: when an event fires on an element, it propagates upward through ancestor elements (child → parent → grandparent → document). Use event.stopPropagation() to prevent bubbling. The opposite is event capturing (top-down phase).",2],["web","JavaScript — DOM, Forms & RegEx","DOM Manipulation · Events · Forms Validation · Regular Expressions · Debugging","What does event.preventDefault() do?","","",["Stops event bubbling","Prevents the browser's default behavior for an event (e.g., stops form submission or link navigation)","Removes the event listener","Prevents the event from firing"],1,"event.preventDefault() prevents the browser's default action: stops form submission, prevents link navigation, stops checkbox toggling. It does NOT stop event bubbling (use stopPropagation() for that). Commonly used in form validation.",3],["web","JavaScript — DOM, Forms & RegEx","DOM Manipulation · Events · Forms Validation · Regular Expressions · Debugging","Which JavaScript regex method tests if a pattern matches a string and returns true/false?","","",["regex.match()","regex.test()","regex.search()","regex.exec()"],1,"regex.test(string) returns true if the regex matches the string, false otherwise. string.match(regex) returns match results. regex.exec(string) returns detailed match info. string.search(regex) returns match index or -1.",4],["web","JavaScript — DOM, Forms & RegEx","DOM Manipulation · Events · Forms Validation · Regular Expressions · Debugging","How do you add an event listener to a button click in JavaScript?","","",["button.onclick = function() { }","button.addEventListener('click', function() { })","Both A and B are valid","button.on('click', function() { })"],2,"Both approaches work. addEventListener is preferred as it allows multiple listeners for the same event, provides more control (capture/bubble), and can be removed with removeEventListener. The onclick property replaces any previously assigned handler.",5],["web","JavaScript — DOM, Forms & RegEx","DOM Manipulation · Events · Forms Validation · Regular Expressions · Debugging","What is the difference between innerHTML and textContent?","","",["No difference","innerHTML parses HTML tags; textContent treats everything as plain text (safer, faster)","textContent includes HTML tags","innerHTML is read-only"],1,"innerHTML sets/gets HTML content (parses tags, can create elements). textContent sets/gets plain text (ignores HTML tags, safer against XSS). For user-supplied content, always use textContent to prevent cross-site scripting attacks.",6],["web","JavaScript — DOM, Forms & RegEx","DOM Manipulation · Events · Forms Validation · Regular Expressions · Debugging","What does document.createElement('div') do?","","",["Selects an existing div","Creates a new <div> DOM element in memory (not yet added to the document)","Replaces the first div on the page","Creates a div in the HTML file"],1,"createElement() creates a new DOM element in memory. To add it to the page, use appendChild(), prepend(), insertBefore(), or append(). Example: const div = document.createElement('div'); div.textContent = 'Hello'; document.body.appendChild(div);",7],["web","JavaScript — DOM, Forms & RegEx","DOM Manipulation · Events · Forms Validation · Regular Expressions · Debugging","What JavaScript regex pattern validates an email address format?","","",["/[a-z]+@[a-z]+/","/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/","/email@domain.com/","/\\w+@\\w+/"],1,"A basic email regex: /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/ checks: no whitespace or @, then @, then no whitespace or @, then dot, then no whitespace or @. HTML5 type='email' provides built-in validation as a simpler alternative.",8],["web","JavaScript — DOM, Forms & RegEx","DOM Manipulation · Events · Forms Validation · Regular Expressions · Debugging","What is the browser developer tool (DevTools) used for?","","",["Writing and compiling JavaScript","Inspecting HTML/CSS, debugging JavaScript, monitoring network requests, and analyzing performance","Designing responsive layouts only","Testing cross-browser compatibility automatically"],1,"Browser DevTools (F12) provides: Elements panel (inspect/edit HTML/CSS), Console (run JS, see errors), Sources (debug JS with breakpoints), Network (monitor requests), Performance (profile), Application (storage), Lighthouse (audit).",9],["web","JavaScript — DOM, Forms & RegEx","DOM Manipulation · Events · Forms Validation · Regular Expressions · Debugging","What does JSLint do?","","",["Compiles JavaScript to native code","A static code analysis tool that identifies problematic patterns and enforces code quality standards","Minifies JavaScript files","Converts ES6 to ES5"],1,"JSLint (created by Douglas Crockford) is a static analysis tool that checks JS code for potential bugs, style issues, and problematic patterns. Modern alternatives: ESLint (more configurable), JSHint. These are 'linters' that catch issues before runtime.",10],["web","JSON & jQuery","JSON Syntax · Parsing · jQuery Selectors · Events · DOM Manipulation · Animations","What does JSON stand for?","","",["JavaScript Object Notation","Java Syntax Object Network","JavaScript Open Network","Java Standard Object Node"],0,"JSON (JavaScript Object Notation) is a lightweight data interchange format. It is human-readable, language-independent, and based on a subset of JavaScript syntax. It has replaced XML in most web APIs due to its simplicity and smaller size.",1],["web","JSON & jQuery","JSON Syntax · Parsing · jQuery Selectors · Events · DOM Manipulation · Animations","Which of these is valid JSON?","","",["{name: 'Alice', age: 25}","{'name': 'Alice', 'age': 25}","{\"name\": \"Alice\", \"age\": 25}","{\"name\"= \"Alice\"}"],2,"JSON requires: double quotes for all keys and string values (not single quotes), no trailing commas, no comments, no functions. Valid types: string (\"...\"), number, boolean (true/false), null, array, object. Option A has unquoted keys (invalid).",2],["web","JSON & jQuery","JSON Syntax · Parsing · jQuery Selectors · Events · DOM Manipulation · Animations","How do you parse a JSON string into a JavaScript object?","","",["JSON.stringify(jsonString)","JSON.parse(jsonString)","eval(jsonString)","Object.fromJSON(jsonString)"],1,"JSON.parse(string) converts a JSON string to a JS object. JSON.stringify(object) converts a JS object to a JSON string. Avoid eval() for parsing JSON — it's a security risk (executes arbitrary code). JSON.parse() is safe and validates the format.",3],["web","JSON & jQuery","JSON Syntax · Parsing · jQuery Selectors · Events · DOM Manipulation · Animations","What is the jQuery selector equivalent to document.getElementById('myId')?","","",["$('.myId')","$('#myId')","$('myId')","$('[id=myId]')"],1,"jQuery uses CSS selector syntax: $('#myId') selects by id (like #id in CSS). $('.myClass') selects by class. $('p') selects all <p> elements. $('[href]') selects elements with href attribute. jQuery wraps DOM elements in a jQuery object.",4],["web","JSON & jQuery","JSON Syntax · Parsing · jQuery Selectors · Events · DOM Manipulation · Animations","What does the jQuery .hide() method do?","","",["Removes the element from DOM","Sets the element's display to 'none' (hiding it visually but keeping it in DOM)","Makes the element transparent","Moves the element off-screen"],1,"$('.el').hide() sets CSS display:none — the element is hidden but remains in the DOM. .show() restores display. .toggle() alternates between hide/show. .fadeOut() and .slideUp() are animated alternatives. .remove() actually removes from DOM.",5],["web","JSON & jQuery","JSON Syntax · Parsing · jQuery Selectors · Events · DOM Manipulation · Animations","What is jQuery's document.ready equivalent?","","",["window.onload = function() { }","$(document).ready(function() { }) or $(function() { })","DOMContentLoaded event","jQuery.start(function() { })"],1,"$(document).ready() (shorthand: $(function(){})) executes when the DOM is ready (not waiting for images). window.onload fires after ALL resources (images, stylesheets) are loaded. DOMContentLoaded is the native equivalent. jQuery's ready() is cross-browser compatible.",6],["web","JSON & jQuery","JSON Syntax · Parsing · jQuery Selectors · Events · DOM Manipulation · Animations","How do you attach a click event to all <p> elements using jQuery?","","",["$('p').click(function() { });","$('p').on('click', function() { });","Both A and B are valid","$('p').addEventListener('click', fn)"],2,"Both .click(fn) (shorthand) and .on('click', fn) work. .on() is the preferred modern method as it supports dynamic elements (event delegation): $(document).on('click', 'p', fn) catches clicks on future <p> elements too. .click() does not support delegation.",7],["web","JSON & jQuery","JSON Syntax · Parsing · jQuery Selectors · Events · DOM Manipulation · Animations","What does the jQuery .css() method do?","","",["Links an external CSS file","Gets or sets CSS properties of selected elements","Adds a class to elements","Removes inline styles"],1,"$('.el').css('color') gets the color. $('.el').css('color', 'red') sets it. $('.el').css({color: 'red', fontSize: '16px'}) sets multiple properties. For class-based styling, prefer .addClass()/.removeClass()/.toggleClass() over .css().",8],["web","JSON & jQuery","JSON Syntax · Parsing · jQuery Selectors · Events · DOM Manipulation · Animations","What is a jQuery plugin?","","",["A jQuery file that replaces the main library","A reusable extension that adds custom methods to the jQuery object","A browser extension for jQuery","A jQuery performance optimization"],1,"jQuery plugins extend jQuery's functionality by adding custom methods to $.fn (the jQuery prototype). Popular plugins: DataTables (rich tables), Select2 (fancy dropdowns), jQuery UI (widgets). Created as: $.fn.myPlugin = function() { return this.each(...); };",9],["web","JSON & jQuery","JSON Syntax · Parsing · jQuery Selectors · Events · DOM Manipulation · Animations","What does JSON.stringify() do?","","",["Validates a JSON string","Converts a JavaScript object to a JSON-formatted string","Parses a JSON string to an object","Creates a JSON file"],1,"JSON.stringify(obj) serializes a JavaScript object to a JSON string. Optional parameters: JSON.stringify(obj, replacer, space) — space adds pretty-printing indentation. Useful for: sending data to APIs, storing in localStorage, debugging objects.",10],["web","AJAX & Axios","AJAX Architecture · XMLHttpRequest · Axios · Promises · Error Handling","What does AJAX stand for?","","",["Asynchronous JavaScript and XML","Advanced JavaScript and XHTML","Automated JavaScript Action Exchange","Asynchronous Java Application XML"],0,"AJAX (Asynchronous JavaScript and XML) is a technique for making web pages dynamic by sending/receiving data from a server in the background without reloading the page. Despite the name, JSON is now more commonly used than XML.",1],["web","AJAX & Axios","AJAX Architecture · XMLHttpRequest · Axios · Promises · Error Handling","What object is used for traditional AJAX requests in JavaScript?","","",["HttpRequest","XMLHttpRequest","AjaxRequest","FetchRequest"],1,"XMLHttpRequest (XHR) is the original browser API for AJAX. The modern alternatives are the Fetch API (native Promise-based) and Axios (Promise-based library). XHR uses callback-based event handlers (onreadystatechange, onload, onerror).",2],["web","AJAX & Axios","AJAX Architecture · XMLHttpRequest · Axios · Promises · Error Handling","What is Axios?","","",["A JavaScript framework like React","A Promise-based HTTP client for making HTTP requests from browsers and Node.js","A CSS animation library","A Node.js web server"],1,"Axios is a popular Promise-based HTTP client that works in both browsers (using XHR) and Node.js (using http module). It automatically transforms JSON data, supports request/response interceptors, cancellation, and better error handling than raw Fetch.",3],["web","AJAX & Axios","AJAX Architecture · XMLHttpRequest · Axios · Promises · Error Handling","What is the key difference between synchronous and asynchronous requests?","","",["Asynchronous requests are faster","Synchronous blocks execution until the response arrives; asynchronous allows code to continue while waiting","Synchronous supports JSON; asynchronous supports XML","No difference in practice"],1,"Synchronous: execution pauses waiting for the response — blocks the UI (browser appears frozen). Asynchronous: request is sent, code continues executing, a callback/promise handles the response when it arrives — non-blocking, required for responsive UIs.",4],["web","AJAX & Axios","AJAX Architecture · XMLHttpRequest · Axios · Promises · Error Handling","What does axios.get(url) return?","","",["The response data directly","A Promise that resolves to the response object","An XMLHttpRequest object","A JSON string"],1,"axios.get(url) returns a Promise. On success, it resolves with a response object: {data, status, headers, config}. The actual data is in response.data (already parsed as JSON). Use .then(res => res.data) or async/await to access it.",5],["web","AJAX & Axios","AJAX Architecture · XMLHttpRequest · Axios · Promises · Error Handling","How do you handle errors in Axios?","","",["Using try-catch only","Using .catch() or try-catch with await; axios.isAxiosError() identifies Axios-specific errors","Errors don't occur in Axios","Using onerror callback"],1,"Axios errors can be caught with .catch(err => { }) or try-catch with async/await. error.response exists for HTTP errors (4xx/5xx). error.request exists if no response received. error.message for other errors. axios.isAxiosError(err) checks if it's an Axios error.",6],["web","AJAX & Axios","AJAX Architecture · XMLHttpRequest · Axios · Promises · Error Handling","What is the purpose of AJAX in a web application?","","",["To style web pages dynamically","To update parts of a webpage without full page reload, enabling dynamic and responsive UIs","To connect to a database directly","To handle CSS animations"],1,"AJAX enables partial page updates: loading new content, submitting forms, refreshing data — all without a full page reload. This creates SPA-like experiences. Examples: Google Search autocomplete, Facebook infinite scroll, Gmail real-time updates.",7],["web","AJAX & Axios","AJAX Architecture · XMLHttpRequest · Axios · Promises · Error Handling","Which HTTP method in Axios is used to send data to create a resource on the server?","","",["axios.get()","axios.fetch()","axios.post()","axios.send()"],2,"axios.post(url, data, config) sends a POST request with data in the request body. Other methods: axios.get(), axios.put(), axios.patch(), axios.delete(). Data is automatically serialized to JSON and Content-Type header is set to application/json.",8],["web","AJAX & Axios","AJAX Architecture · XMLHttpRequest · Axios · Promises · Error Handling","What is a request interceptor in Axios?","","",["A middleware that blocks all requests","A function that runs before every request — used to add headers, tokens, or modify the request config","A function that caches request responses","An error handler for network failures"],1,"Axios interceptors run before requests/after responses. Request interceptors: add auth tokens, log requests. Response interceptors: transform data, handle global errors. axios.interceptors.request.use(config => { config.headers.Authorization = 'Bearer ' + token; return config; });",9],["web","AJAX & Axios","AJAX Architecture · XMLHttpRequest · Axios · Promises · Error Handling","What does the Fetch API's response.json() method do?","","",["Converts the response to a JSON string","Parses the response body as JSON and returns a Promise resolving to the parsed data","Sends JSON data to the server","Validates the JSON response"],1,"The Fetch API: fetch(url) returns a Promise resolving to a Response object. Response.json() is a method on the Response that reads the body stream and parses it as JSON — it also returns a Promise. Always chain .then(res => res.json()) before accessing data.",10],["web","Introduction to Node.js","Node.js Intro · Browser JS vs Node.js · ES6 · REPL · Event-driven Architecture","What is Node.js?","","",["A JavaScript framework like Angular","A JavaScript runtime built on Chrome's V8 engine that executes JS outside the browser","A web server like Apache","A JavaScript package manager"],1,"Node.js is a JavaScript runtime environment built on Google's V8 engine. It enables JavaScript to run server-side (outside browsers). It is event-driven, non-blocking I/O, and single-threaded — ideal for scalable network applications.",1],["web","Introduction to Node.js","Node.js Intro · Browser JS vs Node.js · ES6 · REPL · Event-driven Architecture","What is the key architectural difference between Node.js and traditional web servers?","","",["Node.js is faster because it uses multiple threads","Node.js uses a single-threaded event loop with non-blocking I/O vs multi-threaded blocking I/O in traditional servers","Node.js supports more programming languages","Traditional servers use JavaScript too"],1,"Traditional servers (Apache/IIS): one thread per request — blocks while waiting for I/O. Node.js: single thread + event loop — I/O operations are non-blocking (callbacks/promises). Under heavy concurrent I/O, Node.js scales better with fewer resources.",2],["web","Introduction to Node.js","Node.js Intro · Browser JS vs Node.js · ES6 · REPL · Event-driven Architecture","What is the Node.js REPL?","","",["A package manager","Read-Eval-Print Loop — an interactive command-line environment for executing JavaScript","A real-time event processing library","A Node.js web framework"],1,"REPL (Read-Eval-Print Loop): type node in the terminal to enter. Read: reads your JS input. Eval: evaluates (executes) it. Print: prints the result. Loop: repeats. Useful for quick experiments, testing snippets, and learning JS/Node.js.",3],["web","Introduction to Node.js","Node.js Intro · Browser JS vs Node.js · ES6 · REPL · Event-driven Architecture","What is a key feature introduced in ES6 (ECMAScript 2015)?","","",["var declarations","Arrow functions, template literals, destructuring, classes, let/const, modules","alert() function","Array.prototype.forEach"],1,"ES6/ES2015 introduced: let/const, arrow functions (=>), template literals (`${}`), destructuring, default parameters, rest/spread, classes, modules (import/export), Promises, Map/Set, Symbol, generators, and more. A major upgrade to the language.",4],["web","Introduction to Node.js","Node.js Intro · Browser JS vs Node.js · ES6 · REPL · Event-driven Architecture","What is the difference between Browser JavaScript and Node.js?","","",["They use different JavaScript engines","Browser JS has DOM/window/document APIs; Node.js has file system, HTTP, OS, process APIs but no DOM","Node.js is faster than browser JS","Browser JS supports ES6; Node.js does not"],1,"Browser JS: has DOM, BOM (window, document, navigator), and is sandboxed for security. Node.js: no DOM/window, but has file system (fs), HTTP, OS, crypto, process, streams, child_process APIs. Both use the same JavaScript syntax (ES specifications).",5],["web","Introduction to Node.js","Node.js Intro · Browser JS vs Node.js · ES6 · REPL · Event-driven Architecture","What is the purpose of process.argv in Node.js?","","",["Gets the Node.js version","An array containing command-line arguments passed to the Node.js process","Manages environment variables","Terminates the Node.js process"],1,"process.argv is an array: [0] = path to node, [1] = path to script, [2...n] = user arguments. Example: node app.js hello world → process.argv[2]='hello', process.argv[3]='world'. Used to pass configuration to Node scripts.",6],["web","Introduction to Node.js","Node.js Intro · Browser JS vs Node.js · ES6 · REPL · Event-driven Architecture","What is an arrow function in ES6 and how does it differ from a regular function?","","",["Arrow functions are faster","Arrow functions have shorter syntax and do NOT have their own 'this', 'arguments', or 'super'","Arrow functions support generators","Arrow functions can be constructors"],1,"Arrow functions: const fn = (x) => x * 2; They don't have their own this (lexically inherited from enclosing scope), no arguments object, cannot be used as constructors (no new), and no prototype property. Ideal for callbacks.",7],["web","Introduction to Node.js","Node.js Intro · Browser JS vs Node.js · ES6 · REPL · Event-driven Architecture","What is npm?","","",["Node Package Module","Node Process Manager","Node Package Manager — the default package manager for Node.js","New Programming Method"],2,"npm (Node Package Manager) is the default package manager for Node.js. It manages package installation (npm install), version management (package.json), and publishing. The npm registry hosts 2M+ packages. Yarn and pnpm are alternative package managers.",8],["web","Introduction to Node.js","Node.js Intro · Browser JS vs Node.js · ES6 · REPL · Event-driven Architecture","What does the 'require()' function do in Node.js?","","",["Validates package dependencies","Imports a module — loads and caches the module, returning its exported object","Installs npm packages","Requires strict mode"],1,"require('module') is CommonJS module loading: const fs = require('fs'). It loads the module file, executes it, caches it (subsequent requires return cached version), and returns the module.exports object. ES6 modules use import/export instead.",9],["web","Introduction to Node.js","Node.js Intro · Browser JS vs Node.js · ES6 · REPL · Event-driven Architecture","What is a template literal in ES6?","","",["An HTML template tag","A string enclosed in backticks allowing embedded expressions (${}) and multi-line strings","A CSS template","A function template"],1,"Template literals use backticks: `Hello ${name}!`. Features: embedded expressions (${expr}), multi-line strings (no \\n needed), tagged templates. Example: `${a} + ${b} = ${a+b}`. Much cleaner than string concatenation.",10],["web","Node.js Async Programming","Callbacks · Promises · async/await · Event Loop · Timers","What is the Node.js Event Loop?","","",["A loop that iterates over DOM elements","The mechanism that enables Node.js to perform non-blocking I/O despite being single-threaded","A timer that runs code every second","A module for handling events"],1,"The Event Loop is Node.js's core mechanism: it continuously checks the call stack (execute code) and event queue (pending callbacks). When the stack is empty, it picks up the next callback. This enables non-blocking async I/O on a single thread.",1],["web","Node.js Async Programming","Callbacks · Promises · async/await · Event Loop · Timers","What is callback hell?","","",["Too many event listeners","Deeply nested callback functions that become hard to read and maintain","A Node.js performance issue","An error thrown when a callback fails"],1,"Callback hell (pyramid of doom): multiple nested async callbacks create deeply indented, hard-to-read code. Solution: named functions, Promises (.then() chains), or async/await syntax — all improve readability and error handling.",2],["web","Node.js Async Programming","Callbacks · Promises · async/await · Event Loop · Timers","What does a Promise represent?","","",["A guarantee that code will run","A proxy for a value that will be resolved in the future — either fulfilled (success) or rejected (failure)","A synchronous function wrapper","An event emitter"],1,"A Promise is an object representing an asynchronous operation's eventual result. States: pending (initial), fulfilled (resolved with value), rejected (with reason). Methods: .then(onFulfilled), .catch(onRejected), .finally(). Replaces callback patterns.",3],["web","Node.js Async Programming","Callbacks · Promises · async/await · Event Loop · Timers","What is the output order?","console.log('A');\nsetTimeout(() => console.log('B'), 0);\nconsole.log('C');","",["A B C","A C B","B A C","C A B"],1,"A is logged (synchronous). setTimeout with 0ms puts callback in the timer queue (macrotask). C is logged (synchronous). After the call stack is empty, the event loop picks up the setTimeout callback and logs B. Output: A C B.",4],["web","Node.js Async Prog
