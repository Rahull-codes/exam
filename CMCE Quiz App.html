s by Value vs Reference · Re-assigning References · Heap","Which of the following demonstrates correct constructor overloading?","class Person {\nString name; int age;\n//---\n}","",["Person() {} and person(String n) {}","Person() {} and Person(String n) {} and Person(String n, int a) {}","void Person() {} and Person(String n) {}","Person(String n) {} and Person(String n) {} // same signature"],1,"Constructor overloading means multiple constructors with different parameter lists (different number, type, or order of parameters). Option B shows 3 valid overloaded constructors. Option A has lowercase 'person' (not a constructor). Option C has void (makes it a method). Option D has duplicate signatures.",7],["java","Constructors, Pass by Value vs Reference & Memory","Constructors · Initializing Reference Variables · Pass by Value vs Reference · Re-assigning References · Heap","When an object is created with `new`, where is it stored?","","",["Stack memory","Method Area","Heap memory","Registers"],2,"All objects created with 'new' are stored in the heap. The heap is managed by the garbage collector. The reference variable (e.g., Dog d) is stored in the stack, but it points to the Dog object in the heap.",8],["java","Constructors, Pass by Value vs Reference & Memory","Constructors · Initializing Reference Variables · Pass by Value vs Reference · Re-assigning References · Heap","What is the effect of re-assigning a reference variable in Java?","String s = \"Hello\";\ns = \"World\";","",["The original \"Hello\" object is modified to \"World\"","s now points to a new \"World\" object; \"Hello\" object becomes eligible for GC","Both \"Hello\" and \"World\" objects exist and s references both","Compilation error — strings are immutable and cannot be reassigned"],1,"Re-assigning a reference doesn't modify the original object. s now points to \"World\". The \"Hello\" object, if no other reference points to it, becomes eligible for garbage collection. Strings are immutable (content can't change) but variables can be reassigned.",9],["java","Constructors, Pass by Value vs Reference & Memory","Constructors · Initializing Reference Variables · Pass by Value vs Reference · Re-assigning References · Heap","In the context of heap and stack memory, which statement is TRUE?","","",["Stack memory is slower than heap memory","Objects are stored in stack; primitives in heap","Stack is thread-specific; heap is shared among all threads","Garbage collector manages stack memory"],2,"Each thread in Java has its own stack (thread-safe by isolation). The heap is shared across all threads in the same JVM process (requires synchronization for thread safety). The garbage collector manages the heap, not the stack. Stack access is faster than heap access.",10],["java","Inheritance, Association & Polymorphism","Single/Multilevel/Hierarchical Inheritance · Association/Aggregation/Composition · Overriding & Overloading","What is the output of the following multilevel inheritance example?","class A {\nvoid show() { System.out.println(\"A\"); }\n}\nclass B extends A {\nvoid show() { System.out.println(\"B\"); }\n}\nclass C extends B {\nvoid show() { System.out.println(\"C\"); }\n}\npublic class Test {\npublic static void main(String[] args) {\nA obj = new C();\nobj.show();\n}\n}","",["A","B","C","A B C"],2,"Runtime polymorphism: the reference is of type A but the object is of type C. JVM resolves the method at runtime by traversing up the inheritance chain from the actual object type (C). Since C overrides show(), C's version is called.",1],["java","Inheritance, Association & Polymorphism","Single/Multilevel/Hierarchical Inheritance · Association/Aggregation/Composition · Overriding & Overloading","Which keyword is used to call the parent class constructor from a child class constructor?","","",["this()","super()","parent()","base()"],1,"super() calls the parent class constructor and must be the FIRST statement in the child constructor. If not explicitly called, Java inserts super() (no-arg) implicitly. this() calls another constructor in the same class (constructor chaining) and is also the first statement.",2],["java","Inheritance, Association & Polymorphism","Single/Multilevel/Hierarchical Inheritance · Association/Aggregation/Composition · Overriding & Overloading","What is the difference between Aggregation and Composition?","","",["They are identical — just different terms for HAS-A relationship","Aggregation is a weak HAS-A (child can exist independently); Composition is a strong HAS-A (child cannot exist without parent)","Composition uses inheritance; Aggregation uses interfaces","Aggregation is IS-A; Composition is HAS-A"],1,"Aggregation: Department HAS-A Professor — a professor can exist without the department. Composition: House HAS-A Room — rooms don't exist independently from the house. In Composition, the lifecycle of the child depends entirely on the parent.",3],["java","Inheritance, Association & Polymorphism","Single/Multilevel/Hierarchical Inheritance · Association/Aggregation/Composition · Overriding & Overloading","Which rule about method overriding is INCORRECT?","","",["Return type must be the same or a covariant (subtype)","Overriding method can have a more restrictive access modifier","Method signature (name + params) must be identical","@Override annotation helps catch errors at compile time"],1,"Overriding rules: the access modifier CANNOT be more restrictive (can be same or more permissive). E.g., if parent has protected, child cannot override with private. This preserves the Liskov Substitution Principle. Return type can be covariant (subtype since Java 5).",4],["java","Inheritance, Association & Polymorphism","Single/Multilevel/Hierarchical Inheritance · Association/Aggregation/Composition · Overriding & Overloading","What is covariant return type in Java method overriding?","","",["The overriding method can return any unrelated type","The overriding method can return a subtype of the parent method's return type","The overriding method must return the exact same type as parent","Covariant return types are not supported in Java"],1,"Since Java 5, covariant return types allow the overriding method to return a more specific (subtype) return type. E.g., if parent returns Animal, child can return Dog (subtype of Animal). This improves type safety without needing explicit casting.",5],["java","Inheritance, Association & Polymorphism","Single/Multilevel/Hierarchical Inheritance · Association/Aggregation/Composition · Overriding & Overloading","What is the purpose of the `this` keyword in Java?","","",["Refers to the parent class object","Refers to the current class object/instance","Creates a new instance of the current class","Calls the parent class constructor"],1,"The 'this' keyword refers to the current instance of the class. Uses: 1) Distinguish instance variables from local/parameter variables (this.name = name), 2) Call another constructor in the same class: this(), 3) Pass current object as argument. It cannot be used in static context.",6],["java","Inheritance, Association & Polymorphism","Single/Multilevel/Hierarchical Inheritance · Association/Aggregation/Composition · Overriding & Overloading","In hierarchical inheritance, which of the following is TRUE?","","",["One child class has multiple parent classes","Multiple child classes inherit from a single parent class","Classes form a chain: A→B→C","Multiple classes inherit from multiple parents"],1,"Hierarchical inheritance: one parent → multiple children. E.g., Animal is parent; Dog, Cat, Bird all extend Animal. This is different from Single (one parent → one child), Multilevel (A→B→C chain), and Multiple (multiple parents, not directly supported in Java).",7],["java","Inheritance, Association & Polymorphism","Single/Multilevel/Hierarchical Inheritance · Association/Aggregation/Composition · Overriding & Overloading","What does the `@Override` annotation do?","","",["Forces the compiler to create a new method","Tells the compiler to verify that the method truly overrides a parent method","Makes the method final and cannot be overridden further","Automatically calls the parent's method before the overriding method"],1,"@Override is an informational annotation. If the annotated method does NOT actually override any parent method (e.g., typo in method name), the compiler throws an error. It's a safety net — it doesn't change runtime behavior but prevents silent bugs.",8],["java","Inheritance, Association & Polymorphism","Single/Multilevel/Hierarchical Inheritance · Association/Aggregation/Composition · Overriding & Overloading","Which of the following method pairs represents valid method OVERLOADING (not overriding)?","class Calc {\n// which pair?\n}","",["int add(int a, int b) and int add(int a, int b) // identical","int add(int a, int b) and double add(int a, int b) // only return type differs","int add(int a, int b) and int add(double a, double b) // parameter types differ","int add(int a, int b) in parent and double add(int a, int b) in child"],2,"Method overloading requires the same method name but different parameter list (number, type, or order). Return type alone does NOT distinguish overloaded methods. Option C has different parameter types (int vs double). Option B fails — Java cannot distinguish methods by return type only.",9],["java","Inheritance, Association & Polymorphism","Single/Multilevel/Hierarchical Inheritance · Association/Aggregation/Composition · Overriding & Overloading","What is the output of the following code using `super`?","class Vehicle {\nString type = \"Vehicle\";\n}\nclass Car extends Vehicle {\nString type = \"Car\";\nvoid display() {\nSystem.out.println(super.type + \" \" + this.type);\n}\n}\npublic class Test {\npublic static void main(String[] args) {\nnew Car().display();\n}\n}","",["Vehicle Vehicle","Car Car","Vehicle Car","Car Vehicle"],2,"super.type refers to the parent class's (Vehicle's) instance variable 'type' = \"Vehicle\". this.type refers to the current class's (Car's) instance variable 'type' = \"Car\". Note: instance variable hiding (not overriding) is happening here.",10],["java","Upcasting, Downcasting, Abstract Classes & Interfaces","Upcasting & Downcasting · Abstract Classes & Methods · Interface & Multiple Interface Implementation","Which of the following is a correct example of upcasting?","","",["Dog d = (Dog) new Animal();","Animal a = new Dog();","Dog d = new Dog();","Animal a = (Animal) new Animal();"],1,"Upcasting is assigning a subclass object to a superclass reference. It happens implicitly (no cast needed). Animal a = new Dog() — Dog IS-A Animal, so this is safe. Downcasting is the reverse (Animal to Dog) and requires an explicit cast with risk of ClassCastException.",1],["java","Upcasting, Downcasting, Abstract Classes & Interfaces","Upcasting & Downcasting · Abstract Classes & Methods · Interface & Multiple Interface Implementation","What exception is thrown when incorrect downcasting is performed?","","",["NullPointerException","ArrayIndexOutOfBoundsException","ClassCastException","IllegalArgumentException"],2,"When you attempt to downcast an object to a type it's not an instance of, Java throws ClassCastException at runtime. Use the 'instanceof' operator to safely check the type before downcasting: if (a instanceof Dog) { Dog d = (Dog) a; }",2],["java","Upcasting, Downcasting, Abstract Classes & Interfaces","Upcasting & Downcasting · Abstract Classes & Methods · Interface & Multiple Interface Implementation","Which statement about abstract classes in Java is FALSE?","","",["Abstract classes can have constructors","Abstract classes can have both abstract and concrete methods","You can instantiate an abstract class directly","A subclass must implement all abstract methods or itself be declared abstract"],2,"Abstract classes cannot be instantiated directly (new AbstractClass() causes compile error). They serve as templates. They CAN have constructors (called via super() from subclass). They can mix abstract and concrete methods. Subclasses must implement all abstract methods or be abstract themselves.",3],["java","Upcasting, Downcasting, Abstract Classes & Interfaces","Upcasting & Downcasting · Abstract Classes & Methods · Interface & Multiple Interface Implementation","What is the key difference between an abstract class and an interface in Java (pre-Java 8)?","","",["Abstract classes can have state (fields); interfaces can only have constants","Interfaces can have constructors; abstract classes cannot","Abstract classes support multiple inheritance; interfaces do not","There is no practical difference"],0,"Pre-Java 8: abstract classes can have instance variables, constructors, and concrete/abstract methods. Interfaces could only have public static final constants and public abstract methods. Java 8 added default/static methods; Java 9 added private methods to interfaces.",4],["java","Upcasting, Downcasting, Abstract Classes & Interfaces","Upcasting & Downcasting · Abstract Classes & Methods · Interface & Multiple Interface Implementation","How does Java achieve multiple inheritance through interfaces?","interface Flyable { void fly(); }\ninterface Swimmable { void swim(); }\nclass Duck implements Flyable, Swimmable {\npublic void fly() { System.out.println(\"Flying\"); }\npublic void swim() { System.out.println(\"Swimming\"); }\n}","",["Duck extends both interfaces (not allowed in Java)","Duck implements both interfaces and provides concrete implementations for all methods","Duck only needs to implement one method from each interface","This code will cause a compilation error"],1,"Java allows a class to implement multiple interfaces (comma-separated), achieving multiple inheritance of type. The class must provide implementations for all abstract methods from all interfaces. This avoids the diamond problem because interfaces don't carry instance state.",5],["java","Upcasting, Downcasting, Abstract Classes & Interfaces","Upcasting & Downcasting · Abstract Classes & Methods · Interface & Multiple Interface Implementation","What is the default access modifier for methods in an interface (Java 7 and earlier)?","","",["private","protected","package-private (default)","public"],3,"All methods in an interface are implicitly public and abstract (pre-Java 8). All fields are implicitly public, static, and final (constants). You don't need to specify these modifiers explicitly, though you can. Java 8 introduced default and static methods; Java 9 added private methods.",6],["java","Upcasting, Downcasting, Abstract Classes & Interfaces","Upcasting & Downcasting · Abstract Classes & Methods · Interface & Multiple Interface Implementation","What is the purpose of using `instanceof` before downcasting?","","",["To improve performance of the downcast","To prevent ClassCastException by checking the actual type at runtime","It is required syntax for all downcasting","To call the constructor of the subclass"],1,"instanceof is a runtime type-check operator. 'obj instanceof Dog' returns true if obj's actual type is Dog or a subtype. Using it before casting prevents ClassCastException. Java 16+ introduced pattern matching: if (a instanceof Dog d) { d.bark(); } — combines check and cast.",7],["java","Upcasting, Downcasting, Abstract Classes & Interfaces","Upcasting & Downcasting · Abstract Classes & Methods · Interface & Multiple Interface Implementation","Can an abstract class implement an interface without providing method implementations?","","",["No — it must implement all interface methods","Yes — an abstract class can leave interface methods unimplemented (they become abstract methods)","No — interfaces and abstract classes cannot interact","Yes, but only for static methods"],1,"An abstract class that implements an interface does NOT need to implement all of the interface's methods. The unimplemented methods become abstract methods of the abstract class. The first concrete (non-abstract) subclass must then implement all remaining abstract methods.",8],["java","Upcasting, Downcasting, Abstract Classes & Interfaces","Upcasting & Downcasting · Abstract Classes & Methods · Interface & Multiple Interface Implementation","What is the output of the following code?","abstract class Shape {\nabstract double area();\nvoid display() { System.out.println(\"Area: \" + area()); }\n}\nclass Circle extends Shape {\ndouble r;\nCircle(double r) { this.r = r; }\ndouble area() { return 3.14 * r * r; }\n}\npublic class Test {\npublic static void main(String[] args) {\nShape s = new Circle(5);\ns.display();\n}\n}","",["Area: 0.0","Area: 78.5","Compilation Error","Area: 3.14"],1,"The abstract class has a concrete display() method that calls the abstract area(). The actual object is Circle (r=5). At runtime, Circle's area() is called: 3.14 × 5 × 5 = 78.5. This is the Template Method pattern — abstract class defines the skeleton, subclass fills in details.",9],["java","Upcasting, Downcasting, Abstract Classes & Interfaces","Upcasting & Downcasting · Abstract Classes & Methods · Interface & Multiple Interface Implementation","What happens if a class implements two interfaces that have a method with the same signature?","","",["Compilation error — ambiguous method","The class needs to provide only one implementation that satisfies both interfaces","The class must provide separate implementations for each","Only the first interface's method is used"],1,"If two interfaces declare a method with identical signature, the implementing class provides one implementation that satisfies both. There is no ambiguity because both interfaces require the same contract. If they have different return types that are incompatible, it would be a compilation error.",10],["java","Final, Functional Interfaces, Lambda, Inner Classes & Enum","final Variables/Methods/Classes · Functional Interfaces · Java 8/11 Interface Features · Lambda Expressions ·","Which statement about `final` keyword usage is INCORRECT?","","",["A final variable's value cannot be changed once assigned","A final method can be overridden in a subclass","A final class cannot be subclassed","A final method can be inherited but not overridden"],1,"final methods CANNOT be overridden — that is the entire point of final on methods. final variables = constants (cannot reassign). final classes = cannot extend (e.g., String, Integer). final methods can be inherited and used, but the implementation cannot be overridden by subclasses.",1],["java","Final, Functional Interfaces, Lambda, Inner Classes & Enum","final Variables/Methods/Classes · Functional Interfaces · Java 8/11 Interface Features · Lambda Expressions ·","What is a Functional Interface in Java?","","",["An interface with no methods","An interface with exactly one abstract method (SAM — Single Abstract Method)","An interface with only static methods","An interface annotated with @Interface"],1,"A Functional Interface has exactly one abstract method (SAM). It can have multiple default/static methods. The @FunctionalInterface annotation is optional but recommended — it causes a compile error if more than one abstract method is added. Examples: Runnable, Callable, Comparator, Predicate.",2],["java","Final, Functional Interfaces, Lambda, Inner Classes & Enum","final Variables/Methods/Classes · Functional Interfaces · Java 8/11 Interface Features · Lambda Expressions ·","What does the following lambda expression represent? (int a, int b) -> a + b","","",["A method that returns void","An implementation of a functional interface with a method taking two ints and returning their sum","A static method definition","A constructor call"],1,"Lambda expressions provide concise implementation of functional interfaces. (int a, int b) -> a + b is equivalent to implementing a method like int add(int a, int b) { return a + b; }. The arrow (->) separates parameters from the body. No return keyword needed for single-expression body.",3],["java","Final, Functional Interfaces, Lambda, Inner Classes & Enum","final Variables/Methods/Classes · Functional Interfaces · Java 8/11 Interface Features · Lambda Expressions ·","What is the output of the following lambda expression?","Runnable r = () -> System.out.println(\"Lambda Running\");\nr.run();","",["Compilation Error — Runnable requires a class","Lambda Running","Nothing — lambda doesn't execute until called with invoke()","Runtime Exception"],1,"Runnable is a functional interface with one abstract method: run(). The lambda () -> System.out.println(...) implements run(). Calling r.run() executes the lambda body. This replaces the verbose anonymous inner class: new Runnable() { public void run() {...} }.",4],["java","Final, Functional Interfaces, Lambda, Inner Classes & Enum","final Variables/Methods/Classes · Functional Interfaces · Java 8/11 Interface Features · Lambda Expressions ·","Which of the following is NOT a type of inner class in Java?","","",["Regular (member) inner class","Static nested class","Anonymous inner class","Protected inner class"],3,"'Protected inner class' is not a type of inner class — it's an access modifier. Java inner class types are: Regular (non-static member) inner class, Static nested class, Method-local inner class (defined inside a method), and Anonymous inner class (no name, defined and instantiated together).",5],["java","Final, Functional Interfaces, Lambda, Inner Classes & Enum","final Variables/Methods/Classes · Functional Interfaces · Java 8/11 Interface Features · Lambda Expressions ·","What is a key characteristic of a static nested class compared to a regular inner class?","","",["Static nested class can access outer class instance members directly","Static nested class does NOT need an outer class instance to be created","Static nested class cannot have its own static members","Regular inner class is created without an outer class instance"],1,"Static nested classes are associated with the outer class but not with any outer instance. You can create them as: OuterClass.NestedClass obj = new OuterClass.NestedClass(). Regular inner classes require an outer instance: Outer.Inner inner = outerObj.new Inner(). Static nested classes can only access static members of the outer class.",6],["java","Final, Functional Interfaces, Lambda, Inner Classes & Enum","final Variables/Methods/Classes · Functional Interfaces · Java 8/11 Interface Features · Lambda Expressions ·","Which Java 8 interface feature allows adding method implementations to interfaces without breaking existing implementations?","","",["Abstract methods","Default methods","Static methods","Final methods"],1,"Java 8 introduced default methods (using 'default' keyword) in interfaces to add new functionality without breaking existing implementations. If a class doesn't override the default method, the interface's implementation is used. This solved the problem of evolving interfaces in backward-compatible ways.",7],["java","Final, Functional Interfaces, Lambda, Inner Classes & Enum","final Variables/Methods/Classes · Functional Interfaces · Java 8/11 Interface Features · Lambda Expressions ·","What is the output of this enum usage?","enum Day { MON, TUE, WED, THU, FRI, SAT, SUN }\npublic class Test {\npublic static void main(String[] args) {\nDay d = Day.WED;\nSystem.out.println(d.ordinal() + \" \" + d.name());\n}\n}","",["3 WED","2 WED","WED 2","3 Wednesday"],1,"ordinal() returns the 0-based position of the enum constant. WED is at index 2 (MON=0, TUE=1, WED=2). name() returns the exact string name of the constant as declared. toString() also returns the name by default. The first constant's ordinal is always 0.",8],["java","Final, Functional Interfaces, Lambda, Inner Classes & Enum","final Variables/Methods/Classes · Functional Interfaces · Java 8/11 Interface Features · Lambda Expressions ·","Which of the following correctly creates an anonymous inner class?","interface Greeter { void greet(); }","",["Greeter g = Greeter() { public void greet() { System.out.println(\"Hi\"); } };","Greeter g = new Greeter() { public void greet() { System.out.println(\"Hi\"); } };","class g implements Greeter { void greet() { System.out.println(\"Hi\"); } }","Greeter g = new class Greeter { public void greet() { } };"],1,"Anonymous inner class syntax: new InterfaceOrClass() { /* method implementations */ }. It simultaneously defines and instantiates a class with no name. Lambda expressions (Java 8+) are a cleaner alternative for functional interfaces: Greeter g = () -> System.out.println(\"Hi\");",9],["java","Final, Functional Interfaces, Lambda, Inner Classes & Enum","final Variables/Methods/Classes · Functional Interfaces · Java 8/11 Interface Features · Lambda Expressions ·","What does `@FunctionalInterface` annotation enforce?","","",["The interface must extend another functional interface","The interface must have exactly one abstract method — compile error if not","All methods in the interface must be lambda-compatible","The interface can only be used with lambda expressions"],1,"@FunctionalInterface is a compile-time annotation that enforces the SAM (Single Abstract Method) constraint. If you accidentally add a second abstract method, the compiler reports an error. Without this annotation, an interface with one abstract method is still functionally valid for lambdas — the annotation is a safety guard.",10],["java","Access Modifiers, Packages & Constructor Chaining","public/private/protected/default · Packages & Import · Static Imports · Constructor Chaining · Protected Access","Which access modifier makes a member accessible only within the same class?","","",["default (package-private)","protected","private","public"],2,"Access levels (from most to least restrictive): private (same class only) → default/package-private (same package) → protected (same package + subclasses anywhere) → public (everywhere). private is the most restrictive — not even subclasses can directly access private members.",1],["java","Access Modifiers, Packages & Constructor Chaining","public/private/protected/default · Packages & Import · Static Imports · Constructor Chaining · Protected Access","A `protected` member in class A (package com.app) can be accessed by class B in package com.test ONLY IF:","","",["B imports com.app.A","B is a subclass of A","com.test is a sub-package of com.app","A's protected member is also static"],1,"protected access: accessible within the same package AND in subclasses (even across packages). If B in com.test is NOT a subclass of A, it cannot access A's protected members. Sub-packages in Java have NO special relationship — com.test is unrelated to com.app unless inheritance is used.",2],["java","Access Modifiers, Packages & Constructor Chaining","public/private/protected/default · Packages & Import · Static Imports · Constructor Chaining · Protected Access","What is the purpose of `import static` in Java?","","",["To import static classes from other packages","To access static members (fields/methods) of another class without the class name prefix","To make all members of a class static","To prevent class loading for static members"],1,"import static java.lang.Math.*; allows you to write sqrt(16) instead of Math.sqrt(16), or PI instead of Math.PI. It imports static members of a class into the current namespace. Use judiciously — overuse reduces readability.",3],["java","Access Modifiers, Packages & Constructor Chaining","public/private/protected/default · Packages & Import · Static Imports · Constructor Chaining · Protected Access","What is constructor chaining and which keyword enables it within the same class?","","",["Calling a parent constructor using super()","Calling another constructor in the same class using this()","Calling any method from a constructor","Automatically linking constructors during inheritance"],1,"Constructor chaining within the same class uses this() to call another constructor. It must be the very first statement. This avoids code duplication when constructors have overlapping initialization logic. super() chains to the parent's constructor.",4],["java","Access Modifiers, Packages & Constructor Chaining","public/private/protected/default · Packages & Import · Static Imports · Constructor Chaining · Protected Access","What is the default (package-private) access level?","","",["Accessible only within the class itself","Accessible within the same package, not accessible outside the package","Accessible by all subclasses anywhere","Accessible everywhere"],1,"The default access (no modifier specified) restricts visibility to the same package. Classes in other packages cannot access default members, even through subclassing. This is also called 'package-private'. It's the default for class members when no modifier is written.",5],["java","Access Modifiers, Packages & Constructor Chaining","public/private/protected/default · Packages & Import · Static Imports · Constructor Chaining · Protected Access","What will happen at compile time for the following code?","package com.a;\npublic class Parent {\nprotected int x = 10;\n}\npackage com.b;\nimport com.a.Parent;\npublic class Child extends Parent {\nvoid show() { System.out.println(x); }\n}","",["Compilation error — protected not accessible outside package","Compiles successfully — protected is accessible in subclass","Compilation warning — not an error","Compiles but throws runtime error"],1,"Child in com.b extends Parent in com.a. Even though they're in different packages, protected members are accessible in subclasses. Child accesses 'x' through inheritance (as if it were its own field). However, if a non-subclass in com.b tried to access x via a Parent object, it would fail.",6],["java","Access Modifiers, Packages & Constructor Chaining","public/private/protected/default · Packages & Import · Static Imports · Constructor Chaining · Protected Access","In which order are constructor calls executed for the following hierarchy?","class A { A() { System.out.print(\"A \"); } }\nclass B extends A { B() { System.out.print(\"B \"); } }\nclass C extends B { C() { System.out.print(\"C \"); } }\n// new C() is called","",["C B A","A B C","B A C","C A B"],1,"Constructor chaining through inheritance always goes top-down in execution: C's constructor implicitly calls super() → B's constructor, which implicitly calls super() → A's constructor. A runs first, then B, then C. So output is: A B C.",7],["java","Access Modifiers, Packages & Constructor Chaining","public/private/protected/default · Packages & Import · Static Imports · Constructor Chaining · Protected Access","What is a Java package primarily used for?","","",["To compress Java source files","To organize classes into namespaces and control access","To speed up compilation","To bundle classes into executable JARs"],1,"Packages provide namespace management (avoid naming conflicts), access control (package-private and protected), and logical organization of related classes. Example: java.util, java.io, java.lang. java.lang is auto-imported. For other packages, explicit import is required.",8],["java","Access Modifiers, Packages & Constructor Chaining","public/private/protected/default · Packages & Import · Static Imports · Constructor Chaining · Protected Access","Can a private method be inherited by a subclass?","","",["Yes, but it cannot be overridden","Yes, and it can be overridden","No — private methods are not inherited","Yes, if the subclass is in the same package"],2,"Private members are not inherited. They are not visible to subclasses. If a subclass defines a method with the same signature as a parent's private method, it's a new independent method (not overriding). This is often asked in interview questions.",9],["java","Access Modifiers, Packages & Constructor Chaining","public/private/protected/default · Packages & Import · Static Imports · Constructor Chaining · Protected Access","What does the following static import enable?","import static java.lang.System.out;\n// Then in code:\nout.println(\"Hello\");","",["Imports the System class statically","Allows using 'out' directly instead of 'System.out'","Creates a new static variable 'out'","This is invalid syntax"],1,"import static java.lang.System.out imports the static field 'out' (which is a PrintStream) from System. You can then use out.println() directly. Similarly, import static java.lang.Math.sqrt allows sqrt(x) instead of Math.sqrt(x).",10],["java","Garbage Collection in Java","Garbage Collection · Requesting GC · Object Eligibility · Nulling/Reassigning References · Island of Isolation ·","When does an object become eligible for garbage collection in Java?","","",["When the programmer explicitly calls delete on it","When no live thread can reach the object through any chain of references","When the object's method finishes executing","When the JVM's memory is full"],1,"An object is GC-eligible when it's unreachable — no active reference in any running thread points to it. Java uses reachability analysis (not reference counting, which fails for cycles). GC runs automatically; programmers don't manually free memory.",1],["java","Garbage Collection in Java","Garbage Collection · Requesting GC · Object Eligibility · Nulling/Reassigning References · Island of Isolation ·","Which method can be used to REQUEST (not guarantee) the JVM to run garbage collection?","","",["System.delete()","System.gc()","Runtime.deleteObjects()","JVM.runGC()"],1,"System.gc() is a hint/request to the JVM to run garbage collection. The JVM may or may not honor it. Similarly, Runtime.getRuntime().gc() does the same. GC timing is non-deterministic — it runs based on JVM's internal heuristics (heap pressure, etc.).",2],["java","Garbage Collection in Java","Garbage Collection · Requesting GC · Object Eligibility · Nulling/Reassigning References · Island of Isolation ·","In which of the following scenarios does an object become eligible for GC?","Animal a = new Animal();\na = null;","",["Never — the object persists in memory","The original Animal object becomes GC-eligible after a = null","Only when System.gc() is called","When the Animal class is unloaded"],1,"Setting a reference to null removes the link between the variable and the object. If no other reference points to that Animal object, it becomes unreachable and GC-eligible. This is the 'nulling the reference' technique for making objects eligible for GC.",3],["java","Garbage Collection in Java","Garbage Collection · Requesting GC · Object Eligibility · Nulling/Reassigning References · Island of Isolation ·","What is an 'Island of Isolation' in the context of Java GC?","","",["An object with no methods","A group of objects that reference each other but are unreachable from any live thread","An isolated thread with its own memory","A class with no subclasses"],1,"Island of Isolation: two or more objects reference each other (circular reference) but no external active reference points to any of them. They form an 'island' that's unreachable. Java's GC handles this correctly (unlike simple reference counting algorithms).",4],["java","Garbage Collection in Java","Garbage Collection · Requesting GC · Object Eligibility · Nulling/Reassigning References · Island of Isolation ·","What is the `finalize()` method in Java?","","",["A method called when the class is loaded","A method called by the GC before reclaiming the object's memory","A method to explicitly free memory","A final method that cannot be overridden"],1,"finalize() is defined in Object class and called by the GC before an object is reclaimed. It can be overridden for cleanup. However, it's deprecated since Java 9 — it's non-deterministic, can delay GC, and cause issues. Use try-with-resources or AutoCloseable instead.",5],["java","Garbage Collection in Java","Garbage Collection · Requesting GC · Object Eligibility · Nulling/Reassigning References · Island of Isolation ·","How many objects are eligible for GC after the following code executes?","Animal a1 = new Animal();\nAnimal a2 = new Animal();\nAnimal a3 = a1;\na1 = a2;\na2 = null;","",["0","1","2","3"],0,"Object1 (original a1): a3 still references it. a1 now points to Object2. Object2: a1 references it. a2=null but a1 still points to it. Both objects are reachable. Result: 0 objects eligible for GC. a3=original a1's object; a1=original a2's object; a2=null (but a1 still holds the reference).",6],["java","Garbage Collection in Java","Garbage Collection · Requesting GC · Object Eligibility · Nulling/Reassigning References · Island of Isolation ·","What is the correct statement about Java's garbage collection?","","",["Garbage collection is synchronous and deterministic","Programmers have full control over when GC runs","Java uses automatic memory management — GC is non-deterministic","GC only runs when the application is idle"],2,"Java's GC is automatic and non-deterministic — you cannot predict exactly when it will run. JVM decides based on heap usage and GC algorithm (G1, ZGC, Shenandoah, etc.). System.gc() is only a suggestion. This is a fundamental advantage over manual memory management (C/C++).",7],["java","Garbage Collection in Java","Garbage Collection · Requesting GC · Object Eligibility · Nulling/Reassigning References · Island of Isolation ·","Which GC event makes an object eligible for collection through 're-assigning a reference'?","StringBuilder sb = new StringBuilder(\"Old\");\nsb = new StringBuilder(\"New\");","",["The 'New' object is eligible for GC","The 'Old' object is eligible for GC","Both objects are eligible for GC","Neither — both remain reachable"],1,"When sb is reassigned to new StringBuilder(\"New\"), the 'Old' StringBuilder object loses its only reference and becomes GC-eligible. The 'New' object is referenced by sb and stays reachable. Re-assigning a reference = implicit nulling of the old reference.",8],["java","Garbage Collection in Java","Garbage Collection · Requesting GC · Object Eligibility · Nulling/Reassigning References · Island of Isolation ·","How many times is `finalize()` called for an object in Java?","","",["Every time GC runs","Once — at most — before the object is reclaimed","Twice — once when eligible, once when collected","Never — finalize() is never called automatically"],1,"finalize() is called at most once per object by the GC before it's reclaimed. There's no guarantee it will be called at all (if JVM exits before GC runs). An object can 'resurrect' itself in finalize() by assigning 'this' to a static reference — but finalize() won't be called again.",9],["java","Garbage Collection in Java","Garbage Collection · Requesting GC · Object Eligibility · Nulling/Reassigning References · Island of Isolation ·","What is the recommended modern alternative to `finalize()` for resource cleanup in Java?","","",["destroy() method","close() method with try-with-resources (AutoCloseable interface)","cleanup() static method","dispose() method"],1,"Since Java 7, try-with-resources automatically calls close() on AutoCloseable objects when the block exits. This is deterministic, efficient, and predictable — unlike finalize(). Java 9 deprecated finalize(). Examples: FileInputStream, Connection implement AutoCloseable.",10],["java","Wrapper Classes & String Classes","Wrapper Classes · Constant Pools · Autoboxing/Unboxing · String · StringBuffer · StringBuilder · String Pool","What is autoboxing in Java?","","",["Automatic conversion of String to int","Automatic conversion of primitive to its corresponding wrapper class object","Automatic memory allocation for arrays","Automatic casting between numeric types"],1,"Autoboxing (Java 5+): automatic conversion of primitive → wrapper (int → Integer, double → Double, etc.). Unboxing: wrapper → primitive. This allows primitives to be used in collections (List). Internally: Integer x = 5 becomes Integer x = Integer.valueOf(5).",1],["java","Wrapper Classes & String Classes","Wrapper Classes · Constant Pools · Autoboxing/Unboxing · String · StringBuffer · StringBuilder · String Pool","What is the output of the following code?","String s1 = \"Hello\";\nString s2 = \"Hello\";\nString s3 = new String(\"Hello\");\nSystem.out.println(s1 == s2);\nSystem.out.println(s1 == s3);","",["true, true","true, false","false, false","false, true"],1,"String literals are interned — s1 and s2 point to the same object in the String Pool (s1 == s2 is true). new String() creates a new object in heap (outside the pool), so s1 == s3 is false. Use equals() for content comparison, never == for String objects.",2],["java","Wrapper Classes & String Classes","Wrapper Classes · Constant Pools · Autoboxing/Unboxing · String · StringBuffer · StringBuilder · String Pool","Which class is thread-safe for mutable string operations?","","",["String","StringBuilder","StringBuffer","StringTokenizer"],2,"StringBuffer is synchronized (thread-safe) — all methods are synchronized, making it safe for concurrent use but slower. StringBuilder (Java 5+) is NOT synchronized — faster but not thread-safe. String is immutable. Use StringBuilder in single-threaded contexts for performance.",3],["java","Wrapper Classes & String Classes","Wrapper Classes · Constant Pools · Autoboxing/Unboxing · String · StringBuffer · StringBuilder · String Pool","What is the output of the following String operation?","String s = \"Hello World\";\nSystem.out.println(s.substring(6));\nSystem.out.println(s.substring(0, 5));","",["World, Hello","orld, Hello","World, Hello","\"World\", \"Hello\""],0,"substring(beginIndex): from index 6 to end → 'World' (H=0,e=1,l=2,l=3,o=4, =5,W=6). substring(beginIndex, endIndex): from 0 inclusive to 5 exclusive → 'Hello'. substring uses 0-based indexing; end index is exclusive.",4],["java","Wrapper Classes & String Classes","Wrapper Classes · Constant Pools · Autoboxing/Unboxing · String · StringBuffer · StringBuilder · String Pool","Why is String immutable in Java?","","",["To save memory through the String Pool","For security, caching hashCode, thread safety, and String Pool optimization","Because Java doesn't support mutable strings","Only A is correct"],1,"String immutability benefits: 1) Security — strings used as class names, passwords can't be changed in transit. 2) Caching — hashCode computed once and cached. 3) Thread safety — immutable objects are inherently safe across threads. 4) String Pool — safe to share across references.",5],["java","Wrapper Classes & String Classes","Wrapper Classes · Constant Pools · Autoboxing/Unboxing · String · StringBuffer · StringBuilder · String Pool","What is the output of the following Integer comparison?","Integer a = 127;\nInteger b = 127;\nInteger c = 128;\nInteger d = 128;\nSystem.out.println(a == b);\nSystem.out.println(c == d);","",["true, true","false, false","true, false","false, true"],2,"Integer caches values from -128 to 127. Integer.valueOf(127) returns the same cached object, so a == b is true. 128 is outside the cache range — new Integer objects are created, so c == d is false (different references). This is the Integer constant pool/cache.",6],["java","Wrapper Classes & String Classes","Wrapper Classes · Constant Pools · Autoboxing/Unboxing · String · StringBuffer · StringBuilder · String Pool","What is the difference between `String.equals()` and `String.equalsIgnoreCase()`?","","",["equals() compares references; equalsIgnoreCase() compares content","equals() is case-sensitive content comparison; equalsIgnoreCase() ignores case differences","They produce identical results for all inputs","equalsIgnoreCase() also compares the string length first"],1,"String.equals(Object o) compares content character by character with case sensitivity. \"Hello\".equals(\"hello\") returns false. equalsIgnoreCase(String s) compares content ignoring case differences. \"Hello\".equalsIgnoreCase(\"hello\") returns true.",7],["java","Wrapper Classes & String Classes","Wrapper Classes · Constant Pools · Autoboxing/Unboxing · String · StringBuffer · StringBuilder · String Pool","What is the performance advantage of `StringBuilder` over `String` for concatenation in a loop? // Approach 1:","String s = \"\";\nfor(int i=0; i<1000; i++) s += i; // String\n// Approach 2:\nStringBuilder sb = new StringBuilder();\nfor(int i=0; i<1000; i++) sb.append(i); // StringBuilder","",["No difference — compiler optimizes both equally","StringBuilder creates one mutable object; String creates 1000 intermediate immutable objects","String concatenation is faster because it uses the String pool","StringBuilder approach uses more memory"],1,"String concatenation (+=) creates a new String object each iteration — 1000 iterations = 1000 objects, massive GC pressure. StringBuilder maintains a mutable char array and only creates the final String once via toString(). This is O(n) vs O(n²) for String concatenation in loops.",8],["java","Wrapper Classes & String Classes","Wrapper Classes · Constant Pools · Autoboxing/Unboxing · String · StringBuffer · StringBuilder · String Pool","Which wrapper class method converts a String to an int?","","",["Integer.toString(\"42\")","Integer.parseInt(\"42\")","Integer.valueOf(42).intValue()","Integer.toInt(\"42\")"],1,"Integer.parseInt(String s) converts a String to primitive int. Integer.valueOf(String s) converts String to Integer object. Integer.toString(int i) converts int to String (reverse). If the string is not a valid integer, NumberFormatException is thrown.",9],["java","Wrapper Classes & String Classes","Wrapper Classes · Constant Pools · Autoboxing/Unboxing · String · StringBuffer · StringBuilder · String Pool","Where is the String Pool located in modern Java (Java 8+)?","","",["PermGen (Permanent Generation)","Stack Memory","Heap Memory (regular heap, inside Metaspace conceptually managed)","Native Memory"],2,"In Java 7+, the String Pool was moved from PermGen to the regular Heap. In Java 8, PermGen was replaced by Metaspace (uses native memory), but the String Pool remains in the heap. This allows the pool to benefit from garbage collection, unlike PermGen which had a fixed size.",10],["java","Exception Handling","Exception Hierarchy · Checked vs Unchecked · try-catch-finally · throws & throw · Multi-catch · Custom","What is the root class of all exceptions and errors in Java?","","",["Exception","Error","Throwable","RuntimeException"],2,"The hierarchy: Throwable → Exception and Error. Exception → RuntimeException (unchecked) and checked exceptions. Error represents serious JVM-level issues (OutOfMemoryError, StackOverflowError) that applications shouldn't catch. RuntimeException (and subclasses) are unchecked.",1],["java","Exception Handling","Exception Hierarchy · Checked vs Unchecked · try-catch-finally · throws & throw · Multi-catch · Custom","Which of the following is a CHECKED exception?","","",["NullPointerException","ArrayIndexOutOfBoundsException","IOException","ClassCastException"],2,"Checked exceptions must be declared (throws) or handled (try-catch) at compile time. Examples: IOException, SQLException, ClassNotFoundException. Unchecked (RuntimeException subclasses): NullPointerException, ArrayIndexOutOfBoundsException, ClassCastException. They don't require explicit handling.",2],["java","Exception Handling","Exception Hierarchy · Checked vs Unchecked · try-catch-finally · throws & throw · Multi-catch · Custom","What is the output of the following try-catch-finally?","try {\nSystem.out.print(\"try \");\nint x = 1/0;\n} catch(ArithmeticException e) {\nSystem.out.print(\"catch \");\n} finally {\nSystem.out.print(\"finally\");\n}","",["try finally","try catch","try catch finally","catch finally"],2,"Execution: try block starts → prints 'try' → 1/0 throws ArithmeticException → catch block executes → prints 'catch' → finally always executes → prints 'finally'. finally block ALWAYS runs (except System.exit() or JVM crash), regardless of exception.",3],["java","Exception Handling","Exception Hierarchy · Checked vs Unchecked · try-catch-finally · throws & throw · Multi-catch · Custom","What is the difference between `throw` and `throws` in Java?","","",["They are synonyms with identical functionality","throw is used to explicitly throw an exception; throws declares potential exceptions in method signature","throws is used inside a method; throw is used in method declaration","throw handles exceptions; throws propagates them"],1,"throw: statement inside a method to explicitly create and throw an exception: throw new IllegalArgumentException('msg'). throws: declaration in method signature indicating the method might throw that exception: void read() throws IOException. throw is action; throws is declaration.",4],["java","Exception Handling","Exception Hierarchy · Checked vs Unchecked · try-catch-finally · throws & throw · Multi-catch · Custom","What is exception propagation in Java?","","",["Converting a checked exception to unchecked","An unhandled exception moving up the call stack until caught or reaching main()","Throwing multiple exceptions simultaneously","Creating a chain of exception handlers"],1,"If a method doesn't catch an exception, it propagates to the caller. This continues up the call stack. If no method handles it, it reaches the JVM's default handler, which prints the stack trace and terminates the program. Checked exceptions must be declared at each level with 'throws'.",5],["java","Exception Handling","Exception Hierarchy · Checked vs Unchecked · try-catch-finally · throws & throw · Multi-catch · Custom","What is a multi-catch block? Which syntax is correct (Java 7+)?","try { ... }","",["catch(IOException e) catch(SQLException e) { ... }","catch(IOException | SQLException e) { ... }","catch(IOException, SQLException e) { ... }","multicatch(IOException, SQLException) { ... }"],1,"Java 7 introduced multi-catch using the pipe (|) operator: catch(ExType1 | ExType2 e). The exception variable is implicitly final. This reduces code duplication when handling multiple exceptions with the same logic. The caught types must not be related by inheritance.",6],["java","Exception Handling","Exception Hierarchy · Checked vs Unchecked · try-catch-finally · throws & throw · Multi-catch · Custom","Is it possible for the `finally` block to NOT execute?","","",["No — finally always executes in all scenarios","Yes — if System.exit() is called or the JVM crashes","Yes — if a return statement is in the try block","Yes — if an exception is thrown in the catch block"],1,"finally almost always executes. Exceptions: 1) System.exit() terminates JVM immediately. 2) JVM crash/kill signal (kill -9). A return in try doesn't prevent finally — finally executes before the return. An exception in catch doesn't prevent finally either — finally runs, then the exception propagates.",7],["java","Exception Handling","Exception Hierarchy · Checked vs Unchecked · try-catch-finally · throws & throw · Multi-catch · Custom","How do you create a custom checked exception in Java?","","",["class MyException extends RuntimeException { }","class MyException implements Exception { }","class MyException extends Exception { }","class MyException extends Error { }"],2,"Custom checked exception: extend Exception (or its checked subclasses). Custom unchecked exception: extend RuntimeException. Extending Error is not recommended (for JVM-level issues). Implementing Exception is wrong — Exception is a class, not an interface.",8],["java","Exception Handling","Exception Hierarchy · Checked vs Unchecked · try-catch-finally · throws & throw · Multi-catch · Custom","What is the output of the following code?","try {\nreturn \"try\";\n} finally {\nreturn \"finally\";\n}","",["\"try\"","\"finally\"","Compilation Error","Both \"try\" and \"finally\" are returned"],1,"When return is in both try and finally, the finally's return overrides the try's return. finally always executes last. This is considered bad practice — avoid return in finally blocks as it can swallow exceptions and override try's return values unexpectedly.",9],["java","Exception Handling","Exception Hierarchy · Checked vs Unchecked · try-catch-finally · throws & throw · Multi-catch · Custom","What is exception chaining (cause) in Java?","try { ... }\ncatch(IOException e) {\nthrow new RuntimeException(\"Failed\", e);\n}","",["Catching and re-throwing the same exception","Wrapping one exception inside another, preserving the original cause","Throwing multiple exceptions at once","Converting checked to unchecked without cause"],1,"Exception chaining wraps the original exception (e) as the cause of a new exception. The Throwable constructor accepts a cause parameter. getCause() retrieves the original. This preserves the full diagnostic information across exception type conversions.",10],["java","java.io & java.nio Package","InputStream/OutputStream · Reader/Writer · NIO Package · Serialization & Deserialization · Shallow & Deep","What is the main distinction between `InputStream`/`OutputStream` and `Reader`/`Writer` in Java I/O?","","",["InputStream reads bytes; Reader reads characters (Unicode)","InputStream is faster than Reader","They handle identical data but with different syntax","Reader handles files; InputStream handles network streams"],0,"InputStream/OutputStream work with raw bytes (8-bit) — suitable for binary data (images, audio). Reader/Writer work with characters (16-bit Unicode) — suitable for text data. InputStreamReader bridges byte and character streams. FileInputStream (bytes) vs FileReader (chars).",1],["java","java.io & java.nio Package","InputStream/OutputStream · Reader/Writer · NIO Package · Serialization & Deserialization · Shallow & Deep","What is the purpose of serialization in Java?","","",["Converting bytecode to machine code","Converting an object's state to a byte stream for storage or transmission","Compressing files to reduce size","Encrypting sensitive data before storage"],1,"Serialization converts an object to a byte stream (ObjectOutputStream). Deserialization reconstructs the object from the byte stream (ObjectInputStream). Used for: persisting objects, sending objects over networks (RMI), deep copying. The class must implement Serializable marker interface.",2],["java","java.io & java.nio Package","InputStream/OutputStream · Reader/Writer · NIO Package · Serialization & Deserialization · Shallow & Deep","What does the `transient` keyword do in serialization?","","",["Makes a field mandatory during deserialization","Excludes a field from serialization — it won't be written to the byte stream","Makes the object temporarily serializable","Marks the class as serializable"],1,"transient fields are skipped during serialization. Use for: sensitive data (passwords), derived/calculated fields, non-serializable objects. During deserialization, transient fields get default values (null for objects, 0 for numbers, false for boolean).",3],["java","java.io & java.nio Package","InputStream/OutputStream · Reader/Writer · NIO Package · Serialization & Deserialization · Shallow & Deep","What is the difference between shallow copy and deep copy?","","",["Shallow copy copies object and all nested objects recursively; deep copy only copies the top-level object","Shallow copy copies only the top-level object (references to nested objects are shared); deep copy recursively copies all nested objects","They are identical operations","Shallow copy uses serialization; deep copy uses clone()"],1,"Shallow copy: a new object is created, but its fields that are references point to the same objects as the original. Deep copy: creates new objects for all nested objects recursively — fully independent. Serialization/deserialization is a common deep copy technique.",4],["java","java.io & java.nio Package","InputStream/OutputStream · Reader/Writer · NIO Package · Serialization & Deserialization · Shallow & Deep","What must a class implement to support serialization?","","",["java.io.Serializable interface and implement its methods","java.io.Serializable marker interface (no methods to implement)","java.io.Externalizable and its writeExternal/readExternal methods","Both A and C"],1,"Serializable is a marker interface — it has no methods. It simply signals the JVM that this class's objects can be serialized. Externalizable (extends Serializable) requires implementing writeExternal() and readExternal() for custom serialization control.",5],["java","java.io & java.nio Package","InputStream/OutputStream · Reader/Writer · NIO Package · Serialization & Deserialization · Shallow & Deep","What is the advantage of NIO (java.nio) over traditional IO (java.io)?","","",["NIO is simpler to use for beginners","NIO supports non-blocking I/O, channels, and buffers for higher scalability","NIO handles text files better than IO","NIO automatically handles serialization"],1,"Java NIO (New I/O) introduced Channels (bidirectional), Buffers (data containers), and Selectors (monitoring multiple channels). Key advantage: non-blocking I/O — a single thread can manage multiple connections. Essential for high-performance network applications (servers, etc.).",6],["java","java.io & java.nio Package","InputStream/OutputStream · Reader/Writer · NIO Package · Serialization & Deserialization · Shallow & Deep","What is `serialVersionUID` and why is it important?","","",["A random ID assigned to each serialized object","A version identifier used during deserialization to verify class compatibility","An encryption key for the serialized byte stream","A counter for the number of times an object has been serialized"],1,"serialVersionUID is a static final long field. During deserialization, Java checks if the serialVersionUID in the byte stream matches the loaded class. If not, InvalidClassException is thrown. If you don't declare it, Java computes one from class structure — risky if class changes.",7],["java","java.io & java.nio Package","InputStream/OutputStream · Reader/Writer · NIO Package · Serialization & Deserialization · Shallow & Deep","Which stream class is used to write objects to a file in Java?","","",["FileOutputStream","DataOutputStream","ObjectOutputStream","PrintWriter"],2,"ObjectOutputStream writes Java objects to an underlying stream (commonly wrapped around FileOutputStream). Use writeObject(Object obj). ObjectInputStream reads them back with readObject(). FileOutputStream writes raw bytes; DataOutputStream writes primitive Java types.",8],["java","java.io & java.nio Package","InputStream/OutputStream · Reader/Writer · NIO Package · Serialization & Deserialization · Shallow & Deep","What is a `BufferedReader` and why is it used?","","",["A reader for binary files only","A character stream reader that buffers input for efficient reading","A reader that automatically handles Unicode conversion","A reader that reads one byte at a time for precision"],1,"BufferedReader wraps another Reader and buffers characters, reducing disk/network access. readLine() reads a full line at once — very convenient for text processing. Without buffering, each character read might cause a system call. BufferedWriter similarly buffers writes.",9],["java","java.io & java.nio Package","InputStream/OutputStream · Reader/Writer · NIO Package · Serialization & Deserialization · Shallow & Deep","What happens during deserialization if the class definition has changed (new fields added) but serialVersionUID is the same?","","",["InvalidClassException — always fails on any class change","New fields get their default values; extra fields in the stream are ignored","The deserialization always succeeds perfectly","The JVM automatically updates the class definition"],1,"If serialVersionUID matches, Java is lenient about class evolution: fields added to the class after serialization get default values. Fields in the stream that no longer exist in the class are ignored. This allows backward-compatible class evolution when versions are managed carefully.",10],["java","Object Class & java.util Package","Date/DateTime/Calendar · SimpleDateFormat · Object.toString() · equals() · hashCode()","What is the contract between `equals()` and `hashCode()` in Java?","","",["If two objects are equal via equals(), they must have the same hashCode","If two objects have the same hashCode, they must be equal via equals()","equals() and hashCode() are independent — no relationship","hashCode() must always return unique values"],0,"The contract: 1) If a.equals(b) is true, a.hashCode() must equal b.hashCode(). 2) If a.hashCode() == b.hashCode(), a.equals(b) may or may not be true (hash collision). This contract is critical for correct behavior in HashMap, HashSet, etc. Always override both together.",1],["java","Object Class & java.util Package","Date/DateTime/Calendar · SimpleDateFormat · Object.toString() · equals() · hashCode()","What does the default `toString()` method of Object return?","","",["The class name only","ClassName@HexHashCode","null","The values of all fields"],1,"Default Object.toString() returns: getClass().getName() + '@' + Integer.toHexString(hashCode()). Example: 'com.app.Employee@1a2b3c'. Override toString() to return meaningful object representation for debugging and logging.",2],["java","Object Class & java.util Package","Date/DateTime/Calendar · SimpleDateFormat · Object.toString() · equals() · hashCode()","Which class is recommended for date/time operations in modern Java (Java 8+)?","","",["java.util.Date","java.util.Calendar","java.time.LocalDate, LocalDateTime (java.time package)","java.sql.Date"],2,"Java 8 introduced the java.time API (based on Joda-Time): LocalDate, LocalTime, LocalDateTime, ZonedDateTime, Instant, etc. These are immutable, thread-safe, and much easier to use than the legacy Date/Calendar classes which are mutable and have notorious design issues.",3],["java","Object Class & java.util Package","Date/DateTime/Calendar · SimpleDateFormat · Object.toString() · equals() · hashCode()","What is the output of the following code if `equals()` is NOT overridden?","Employee e1 = new Employee(\"John\", 101);\nEmployee e2 = new Employee(\"John\", 101);\nSystem.out.println(e1.equals(e2));","",["true — same field values","false — default equals() compares references, not content","Compilation Error","true — Java auto-compares field values"],1,"Default Object.equals() uses reference equality (==). e1 and e2 are two different objects on the heap, so e1.equals(e2) returns false even with identical content. Override equals() to implement value-based comparison (compare id, name, etc.).",4],["java","Object Class & java.util Package","Date/DateTime/Calendar · SimpleDateFormat · Object.toString() · equals() · hashCode()","Using `SimpleDateFormat`, how do you convert a Date to String in the format 'dd-MM-yyyy'?","","",["date.toString(\"dd-MM-yyyy\")","SimpleDateFormat sdf = new SimpleDateFormat(\"dd-MM-yyyy\"); sdf.format(date);","DateFormat.format(date, \"dd-MM-yyyy\");","date.format(\"dd-MM-yyyy\");"],1,"SimpleDateFormat.format(Date d) converts a Date object to formatted String. parse(String s) converts formatted String back to Date. Note: SimpleDateFormat is NOT thread-safe — use DateTimeFormatter (java.time) for thread-safe formatting in modern Java.",5],["java","Object Class & java.util Package","Date/DateTime/Calendar · SimpleDateFormat · Object.toString() · equals() · hashCode()","What is the purpose of overriding `hashCode()` when overriding `equals()`?","","",["To improve comparison speed","To ensure correct behavior in hash-based collections like HashMap and HashSet","To make the object immutable","hashCode() is optional to override"],1,"HashMap and HashSet use hashCode() to find the bucket, then equals() to find the exact entry. If equals() says objects are equal but hashCode() differs, the same 'equal' key could end up in different buckets — completely breaking HashMap lookups. Always override both.",6],["java","Object Class & java.util Package","Date/DateTime/Calendar · SimpleDateFormat · Object.toString() · equals() · hashCode()","What does `Object.getClass()` return?","","",["The name of the class as a String","The Class object representing the runtime class of the object","The superclass of the object","The package name of the class"],1,"getClass() returns the runtime Class object (from java.lang.Class). Use getName() for the fully qualified class name. It's a final method from Object — cannot be overridden. Essential for reflection. Example: employee.getClass().getName() returns 'com.app.Employee'.",7],["java","Object Class & java.util Package","Date/DateTime/Calendar · SimpleDateFormat · Object.toString() · equals() · hashCode()","What is the issue with using `java.util.Date` for date calculations?","","",["It doesn't support time zones","Date is mutable, its API is confusing (months are 0-indexed), and it's not thread-safe","It can only store dates up to year 2038","It has no way to format dates"],1,"java.util.Date problems: mutable (can lead to bugs), confusing API (getYear() returns years since 1900, getMonth() is 0-indexed), not thread-safe, many methods deprecated. Calendar is slightly better but still mutable. java.time (Java 8) addresses all these.",8],["java","Object Class & java.util Package","Date/DateTime/Calendar · SimpleDateFormat · Object.toString() · equals() · hashCode()","What happens when two different objects return the same `hashCode()`?","","",["An exception is thrown","A hash collision occurs — both end up in the same bucket; equals() is used to differentiate them","One object overwrites the other in HashMap","hashCode values are always unique, so this cannot happen"],1,"Hash collisions are possible (by pigeonhole principle). HashMap handles them by chaining (linked list or tree in Java 8+) within the same bucket. When retrieving, hashCode() finds the bucket, equals() identifies the exact key. Good hashCode() minimizes collisions for performance.",9],["java","Object Class & java.util Package","Date/DateTime/Calendar · SimpleDateFormat · Object.toString() · equals() · hashCode()","Which Object method is called when an object is printed using `System.out.println(obj)`?","","",["equals()","hashCode()","toString()","getClass()"],2,"System.out.println(obj) internally calls obj.toString(). PrintStream.println(Object) calls String.valueOf(obj), which calls obj.toString(). If toString() is not overridden, the default ClassName@hashCode representation is printed. Override toString() for meaningful debug output.",10],["java","Collections — List, Queue & Sorting","Collection Hierarchy · ArrayList · LinkedList · Vector · Collections Class · Comparable · Comparator · Queue","What is the key structural difference between `ArrayList` and `LinkedList`?","","",["ArrayList uses a doubly linked list; LinkedList uses a dynamic array","ArrayList uses a dynamic array (O(1) random access); LinkedList uses a doubly linked list (O(n) random access, O(1) head/tail insertion)","ArrayList is synchronized; LinkedList is not","They have identical internal structures"],1,"ArrayList: backed by array → fast get(i) = O(1), slow mid-insert/delete = O(n) (shifting). LinkedList: doubly-linked → fast addFirst/addLast = O(1), slow get(i) = O(n) (traversal). Choose based on access pattern: read-heavy → ArrayList; insert-heavy at ends → LinkedList.",1],["java","Collections — List, Queue & Sorting","Collection Hierarchy · ArrayList · LinkedList · Vector · Collections Class · Comparable · Comparator · Queue","What is the difference between `Comparable` and `Comparator` interfaces?","","",["Comparable is for external comparison classes; Comparator is implemented within the class","Comparable is implemented within the class (natural order); Comparator is an external comparison class (custom order)","They are identical and interchangeable","Comparable uses compare(); Comparator uses compareTo()"],1,"Comparable: implemented in the class itself, defines natural ordering: int compareTo(T other). Comparator: external class, defines custom ordering: int compare(T o1, T o2). Use Comparable for one natural sort order; use Comparator for multiple/alternate sort orders without modifying the class.",2],["java","Collections — List, Queue & Sorting","Collection Hierarchy · ArrayList · LinkedList · Vector · Collections Class · Comparable · Comparator · Queue","What is the initial capacity and growth factor of `ArrayList` in Java?","","",["Initial capacity: 0; grows by 5 each time","Initial capacity: 10; grows by 50% (newCapacity = oldCapacity * 3/2 + 1)","Initial capacity: 16; grows by doubling","Initial capacity: 10; grows by doubling"],1,"ArrayList default initial capacity is 10. When it needs to grow, the new capacity = (oldCapacity * 3/2) + 1 ≈ 1.5× growth. This differs from HashMap's doubling. Pre-sizing with new ArrayList<>(expectedSize) avoids costly array copies during growth.",3],["java","Collections — List, Queue & Sorting","Collection Hierarchy · ArrayList · LinkedList · Vector · Collections Class · Comparable · Comparator · Queue","What is the output of the following Collections operation?","List list = new ArrayList<>(Arrays.asList(3, 1, 4, 1, 5));\nCollections.sort(list);\nSystem.out.println(list);","",["[3, 1, 4, 1, 5]","[1, 1, 3, 4, 5]","[5, 4, 3, 1, 1]","[1, 3, 4, 5] (duplicates removed)"],1,"Collections.sort() sorts in natural (ascending) order using the element's Comparable implementation. Integer's natural order is ascending numeric. Duplicates are preserved in sorted order. The list is modified in-place. Result: [1, 1, 3, 4, 5].",4],["java","Collections — List, Queue & Sorting","Collection Hierarchy · ArrayList · LinkedList · Vector · Collections Class · Comparable · Comparator · Queue","What is `Vector` and how does it differ from `ArrayList`?","","",["Vector is faster than ArrayList","Vector is synchronized (thread-safe, slower); ArrayList is not synchronized (faster)","Vector uses linked nodes; ArrayList uses arrays","Vector allows null elements; ArrayList does not"],1,"Vector is the legacy synchronized dynamic array from Java 1.0. All methods are synchronized — thread-safe but slower due to locking overhead. ArrayList (Java 2) is unsynchronized — faster for single-threaded use. Use Collections.synchronizedList(new ArrayList<>()) or CopyOnWriteArrayList for concurrent use.",5],["java","Collections — List, Queue & Sorting","Collection Hierarchy · ArrayList · LinkedList · Vector · Collections Class · Comparable · Comparator · Queue","What interface should a class implement to define natural sorting order for use with `Collections.sort()`?","","",["Comparator","Comparable","Sortable","Ordered"],1,"Implementing Comparable and its compareTo() method defines the natural order. Collections.sort(list) and Arrays.sort() use this natural order. The compareTo() contract: return negative if this < other, 0 if equal, positive if this > other.",6],["java","Collections — List, Queue & Sorting","Collection Hierarchy · ArrayList · LinkedList · Vector · Collections Class · Comparable · Comparator · Queue","Which data structure best implements a FIFO Queue in Java Collections?","","",["ArrayList","TreeSet","LinkedList implementing Queue interface","HashMap"],2,"Queue interface defines FIFO: offer() adds to tail, poll() removes from head. LinkedList implements both List and Queue. ArrayDeque is faster for pure Queue use. PriorityQueue is a heap-based priority queue (not strictly FIFO). For concurrent use: LinkedBlockingQueue.",7],["java","Collections — List, Queue & Sorting","Collection Hierarchy · ArrayList · LinkedList · Vector · Collections Class · Comparable · Comparator · Queue","What does `Collections.unmodifiableList()` return?","","",["A new copy of the list that is sorted","A view of the list that throws UnsupportedOperationException on modification","A null-safe version of the list","A thread-safe version of the list"],1,"Collections.unmodifiableList(list) returns a read-only wrapper — add(), remove(), set() throw UnsupportedOperationException. Note: the underlying list can still be modified through the original reference. For a truly immutable list, use List.of() (Java 9+) or List.copyOf().",8],["java","Collections — List, Queue & Sorting","Collection Hierarchy · ArrayList · LinkedList · Vector · Collections Class · Comparable · Comparator · Queue","What is the output of the following Comparator lambda usage?","List names = Arrays.asList(\"Charlie\", \"Alice\", \"Bob\");\nnames.sort((a, b) -> a.compareTo(b));\nSystem.out.println(names);","",["[Charlie, Alice, Bob]","[Alice, Bob, Charlie]","[Bob, Alice, Charlie]","[Charlie, Bob, Alice]"],1,"The lambda (a, b) -> a.compareTo(b) is a Comparator that sorts strings in natural (alphabetical/lexicographic) ascending order. String.compareTo() uses Unicode values. 'Alice' < 'Bob' < 'Charlie' alphabetically. Result: [Alice, Bob, Charlie].",9],["java","Collections — List, Queue & Sorting","Collection Hierarchy · ArrayList · LinkedList · Vector · Collections Class · Comparable · Comparator · Queue","How do you create an immutable List of elements in Java 9+?","","",["new ArrayList<>(Arrays.asList(1, 2, 3))","Collections.unmodifiableList(list)","List.of(1, 2, 3)","Arrays.asList(1, 2, 3)"],2,"List.of() (Java 9+) creates a truly immutable list — no add/remove/set, and null elements are disallowed. Arrays.asList() allows set() but not add/remove, and allows null. Collections.unmodifiableList() prevents modification through the wrapper but the underlying list can still change.",10],["java","Collections — Set, Map, Concurrent & Streams","HashSet/LinkedHashSet/TreeSet · HashMap/LinkedHashMap/TreeMap · Concurrent Collections · Java 8","How does `HashSet` determine uniqueness of elements?","","",["By comparing element references","By using hashCode() to find bucket, then equals() for exact match","By sorting elements and comparing adjacent ones","By maintaining a count of each element"],1,"HashSet is backed by a HashMap. For uniqueness: 1) hashCode() determines the bucket. 2) equals() checks if an equal element already exists in that bucket. Both must be correctly overridden for custom objects. This is why always override hashCode() with equals().",1],["java","Collections — Set, Map, Concurrent & Streams","HashSet/LinkedHashSet/TreeSet · HashMap/LinkedHashMap/TreeMap · Concurrent Collections · Java 8","What ordering does each Set implementation maintain? HashSet / LinkedHashSet / TreeSet","","",["All three maintain insertion order","HashSet: no order; LinkedHashSet: insertion order; TreeSet: natural/comparator sorted order","HashSet: sorted; LinkedHashSet: no order; TreeSet: insertion order","All three are sorted automatically"],1,"HashSet: hash-based, no predictable order. LinkedHashSet: extends HashSet + linked list = maintains insertion order. TreeSet: backed by TreeMap (Red-Black tree) = always sorted (natural order or custom Comparator). TreeSet requires elements to be Comparable.",2],["java","Collections — Set, Map, Concurrent & Streams","HashSet/LinkedHashSet/TreeSet · HashMap/LinkedHashMap/TreeMap · Concurrent Collections · Java 8","What is the time complexity of `get()` and `put()` in a `HashMap` under normal conditions?","","",["O(log n) for both","O(n) for both","O(1) average for both","O(1) for get, O(n) for put"],2,"HashMap uses hash-based bucketing: hashCode() maps key to bucket → O(1) average. In worst case (all keys in same bucket): O(n) (linked list) or O(log n) (Java 8+ converts to tree when bucket size > 8). TreeMap is O(log n) for all operations.",3],["java","Collections — Set, Map, Concurrent & Streams","HashSet/LinkedHashSet/TreeSet · HashMap/LinkedHashMap/TreeMap · Concurrent Collections · Java 8","What is the key difference between `HashMap` and `LinkedHashMap`?","","",["HashMap is slower; LinkedHashMap is faster","HashMap: no order guarantee; LinkedHashMap: maintains insertion order","HashMap allows null keys; LinkedHashMap does not","They are identical in behavior"],1,"LinkedHashMap extends HashMap and maintains a doubly linked list across entries to preserve insertion order (or access order if constructed with accessOrder=true for LRU cache). Both allow one null key. TreeMap maintains sorted order but with O(log n) operations.",4],["java","Collections — Set, Map, Concurrent & Streams","HashSet/LinkedHashSet/TreeSet · HashMap/LinkedHashMap/TreeMap · Concurrent Collections · Java 8","What does the following Stream operation produce?","List nums = Arrays.asList(1, 2, 3, 4, 5);\nint sum = nums.stream()\n.filter(n -> n % 2 == 0)\n.mapToInt(Integer::intValue)\n.sum();\nSystem.out.println(sum);","",["6","15","9","2"],0,"filter(n -> n % 2 == 0) keeps only even numbers: [2, 4]. mapToInt converts to IntStream. sum() = 2 + 4 = 6. Stream pipeline: source → intermediate operations (lazy) → terminal operation (triggers execution). filter and map are intermediate; sum is terminal.",5],["java","Collections — Set, Map, Concurrent & Streams","HashSet/LinkedHashSet/TreeSet · HashMap/LinkedHashMap/TreeMap · Concurrent Collections · Java 8","What is `ConcurrentHashMap` and why is it preferred over `Hashtable`?","","",["They are identical — both synchronize all methods","ConcurrentHashMap uses segment-level locking (Java 7) / CAS + bin-level locking (Java 8) — better concurrency than Hashtable's full-table locking","ConcurrentHashMap is not thread-safe; Hashtable is","ConcurrentHashMap doesn't allow null; Hashtable allows null keys"],1,"Hashtable synchronizes every method on the entire table — only one thread at a time. ConcurrentHashMap: Java 7 used 16 segments; Java 8 uses CAS operations and bin-level locking, allowing multiple concurrent readers and fine-grained writers. Neither allows null keys/values.",6],["java","Collections — Set, Map, Concurrent & Streams","HashSet/LinkedHashSet/TreeSet · HashMap/LinkedHashMap/TreeMap · Concurrent Collections · Java 8","What is the wildcard `? extends T` used for in Java Generics?","","",["Accepts T or any superclass of T (lower bound)","Accepts T or any subclass of T (upper bound)","Accepts any type regardless of T","Restricts the collection to exactly type T"],1,"? extends T is an upper-bounded wildcard: the unknown type is T or a subtype. E.g., List accepts List, List. Use for reading (producer). ? super T is a lower bound: T or supertype. PECS: Producer → Extends, Consumer → Super.",7],["java","Collections — Set, Map, Concurrent & Streams","HashSet/LinkedHashSet/TreeSet · HashMap/LinkedHashMap/TreeMap · Concurrent Collections · Java 8","What does the `Stream.collect(Collectors.groupingBy(...))` operation do?","","",["Sorts the stream by the grouping key","Groups stream elements into a Map based on a classifier function","Filters stream elements by a predicate","Reduces all elements to a single value"],1,"Collectors.groupingBy(Function) groups elements by a key function into a Map>. E.g., employees.stream().collect(Collectors.groupingBy(Employee::getDept)) produces Map>. Useful for aggregations, analytics.",8],["java","Collections — Set, Map, Concurrent & Streams","HashSet/LinkedHashSet/TreeSet · HashMap/LinkedHashMap/TreeMap · Concurrent Collections · Java 8","Which collection should be used when you need a thread-safe list where reads vastly outnumber writes?","","",["Vector","Collections.synchronizedList(ArrayList)","CopyOnWriteArrayList","LinkedList"],2,"CopyOnWriteArrayList: every write (add/set/remove) creates a new copy of the underlying array. Reads are lock-free — concurrent reads are always safe. Ideal for read-heavy scenarios (event listeners, etc.). Vector locks on every read AND write — poor concurrency.",9],["java","Collections — Set, Map, Concurrent & Streams","HashSet/LinkedHashSet/TreeSet · HashMap/LinkedHashMap/TreeMap · Concurrent Collections · Java 8","What is the difference between `Stream.map()` and `Stream.flatMap()`?","","",["map() for collections; flatMap() for primitives","map() transforms each element 1-to-1; flatMap() transforms each element to a stream and flattens the result","They are identical operations","flatMap() filters while mapping"],1,"map(f) applies f to each element, returning Stream. flat
