ramming","Callbacks · Promises · async/await · Event Loop · Timers","What does async/await do?","","",["Makes synchronous code run asynchronously","Syntactic sugar over Promises — async functions return a Promise; await pauses execution until the Promise resolves","Creates multiple threads","Replaces the event loop"],1,"async functions return a Promise automatically. await pauses the function (not the thread) until the awaited Promise resolves. Async/await makes asynchronous code look and behave synchronously, improving readability and error handling (try-catch works).",5],["web","Node.js Async Programming","Callbacks · Promises · async/await · Event Loop · Timers","What is Promise.all() used for?","","",["Runs promises sequentially","Runs multiple Promises in parallel and resolves when ALL have fulfilled (rejects if any one rejects)","Resolves the first fulfilled Promise","Cancels all running promises"],1,"Promise.all([p1, p2, p3]) runs all promises in parallel. Resolves with an array of results when ALL fulfill. Rejects immediately if ANY promise rejects (fail-fast). Use when you need all results. Promise.allSettled() waits for all regardless of rejection.",6],["web","Node.js Async Programming","Callbacks · Promises · async/await · Event Loop · Timers","What does setTimeout(callback, 1000) do?","","",["Runs the callback every 1000ms","Runs the callback once after at least 1000ms (1 second)","Runs the callback exactly 1000 times","Pauses execution for 1 second"],1,"setTimeout(fn, delay) schedules fn to run ONCE after at least delay milliseconds. The actual delay may be longer if the event loop is busy. setInterval(fn, delay) runs repeatedly. clearTimeout(id) cancels it. clearInterval(id) cancels an interval.",7],["web","Node.js Async Programming","Callbacks · Promises · async/await · Event Loop · Timers","What is the difference between microtasks and macrotasks in the event loop?","","",["No difference","Microtasks (Promises) run before macrotasks (setTimeout) after each task in the event loop","Macrotasks run first, then microtasks","They run in parallel on separate threads"],1,"Microtask queue (Promises, queueMicrotask): processed after each macrotask, emptying completely before the next macrotask. Macrotask queue (setTimeout, setInterval, I/O): runs one at a time. Microtasks have priority over macrotasks.",8],["web","Node.js Async Programming","Callbacks · Promises · async/await · Event Loop · Timers","Which method creates a Promise that resolves with a given value?","","",["new Promise(resolve => resolve(value))","Promise.resolve(value)","Both A and B","Promise.fulfill(value)"],2,"Both work. Promise.resolve(value) is the shorthand static method. Promise.reject(reason) creates a rejected promise. These are useful for wrapping synchronous values in promises for consistent async interfaces.",9],["web","Node.js Async Programming","Callbacks · Promises · async/await · Event Loop · Timers","What happens if an error is thrown inside an async function without try-catch?","","",["The error is silently ignored","The returned Promise is rejected with the error","Node.js crashes immediately","The error is caught by the global error handler"],1,"In an async function, uncaught errors (thrown or rejected awaited promises) cause the function's returned Promise to reject. The caller should handle it with .catch() or try-catch. Unhandled promise rejections in Node.js emit an 'unhandledRejection' event (and may crash in newer versions).",10],["web","Node.js Modules","CommonJS Modules · exports · require · npm · package.json · Dependencies","What is a Node.js module?","","",["A JavaScript class","A reusable, encapsulated unit of code in a separate file with its own scope","An npm package only","A web server component"],1,"In Node.js, each file is a module with its own scope (variables are not global by default). You explicitly export what you want to share (module.exports) and import others (require()). Node uses the CommonJS module system by default.",1],["web","Node.js Modules","CommonJS Modules · exports · require · npm · package.json · Dependencies","What is the difference between module.exports and exports in Node.js?","","",["They are identical","module.exports is the actual exported object; exports is a reference to it — replacing exports loses the reference","exports is for functions only","module.exports is deprecated"],1,"exports is initially a reference to module.exports. Adding properties works: exports.fn = fn (same as module.exports.fn = fn). But reassigning exports = { } breaks the reference — use module.exports = { } to export a new object.",2],["web","Node.js Modules","CommonJS Modules · exports · require · npm · package.json · Dependencies","What does the package.json file contain?","","",["The compiled JavaScript code","Project metadata: name, version, description, scripts, dependencies, devDependencies","Environment variables","Database configuration"],1,"package.json is the project manifest: name, version, main, scripts (npm run commands), dependencies (production), devDependencies (development-only like testing/linting tools), engines (Node version), license, etc. Created with npm init.",3],["web","Node.js Modules","CommonJS Modules · exports · require · npm · package.json · Dependencies","What is the difference between npm install --save and npm install --save-dev?","","",["No difference","--save (default) adds to dependencies (production); --save-dev adds to devDependencies (development only)","--save-dev installs globally","--save installs locally; --save-dev installs globally"],1,"npm install package (--save is default in npm 5+) adds to dependencies — packages needed at runtime. --save-dev adds to devDependencies — packages only needed during development (testing, building, linting). Production deployments often skip devDependencies.",4],["web","Node.js Modules","CommonJS Modules · exports · require · npm · package.json · Dependencies","What is the node_modules folder?","","",["Node.js source code","The directory where npm installs all package dependencies","A cache directory for built files","The project's compiled output"],1,"node_modules stores all installed npm packages. It's generated by npm install based on package.json. It should NOT be committed to version control (add to .gitignore) — recreate it with npm install. It can be very large (hundreds of MB).",5],["web","Node.js Modules","CommonJS Modules · exports · require · npm · package.json · Dependencies","What does the package-lock.json file do?","","",["Locks the Node.js version","Records the exact version tree of all installed dependencies for reproducible installs","Prevents new packages from being installed","Stores API keys"],1,"package-lock.json records the exact versions of ALL installed packages (including transitive dependencies). This ensures npm install produces the same node_modules on any machine. Always commit it to version control for reproducible builds.",6],["web","Node.js Modules","CommonJS Modules · exports · require · npm · package.json · Dependencies","Which Node.js module provides access to the file system?","","",["path","os","fs","io"],2,"The built-in 'fs' (file system) module provides file I/O: fs.readFile(), fs.writeFile(), fs.appendFile(), fs.unlink(), fs.mkdir(). Both callback-based and Promise-based (fs.promises) APIs are available. Import with: const fs = require('fs').",7],["web","Node.js Modules","CommonJS Modules · exports · require · npm · package.json · Dependencies","What does npm run start typically do?","","",["Installs all packages","Runs the script defined as 'start' in the scripts section of package.json","Starts the npm registry","Creates a new Node project"],1,"npm run <script-name> executes the corresponding script in package.json's 'scripts' section. The 'start' script is special — you can run it with just npm start. Other scripts require npm run: npm run build, npm run test, npm run dev.",8],["web","Node.js Modules","CommonJS Modules · exports · require · npm · package.json · Dependencies","What is the difference between local and global npm package installation?","","",["No difference","Local (npm install): installs in project's node_modules, available only to that project; Global (npm install -g): system-wide, usable as CLI commands","Global packages are added to package.json","Local packages are faster to load"],1,"Local install (npm install pkg): installs in ./node_modules, listed in package.json — for project dependencies. Global install (npm install -g pkg): installs system-wide — for CLI tools like nodemon, create-react-app, typescript. Don't use -g for project libraries.",9],["web","Node.js Modules","CommonJS Modules · exports · require · npm · package.json · Dependencies","What is semantic versioning (semver) in package.json?","","",["A way to name packages descriptively","A versioning scheme: MAJOR.MINOR.PATCH — where MAJOR=breaking changes, MINOR=new features, PATCH=bug fixes","A security standard for packages","A testing methodology"],1,"Semver: MAJOR.MINOR.PATCH (e.g., 2.1.3). ^ (caret): allows minor+patch updates (^2.1.3 → 2.x.x). ~ (tilde): allows patch updates (~2.1.3 → 2.1.x). Exact: 2.1.3. Breaking changes = bump MAJOR. New backward-compatible features = MINOR. Bug fixes = PATCH.",10],["web","Node.js — fs and http Modules","File I/O (Sync/Async) · HTTP Module · Building HTTP Servers · Node Web App","What is the difference between fs.readFileSync() and fs.readFile()?","","",["readFileSync reads binary; readFile reads text","readFileSync blocks execution until file is read; readFile is asynchronous (non-blocking) with a callback","readFile is synchronous; readFileSync is async","No difference"],1,"fs.readFileSync(path, encoding) blocks the event loop until the file is read — simpler but blocks all other operations. fs.readFile(path, encoding, callback) is async — reads in background, calls callback when done. For servers, always prefer async to avoid blocking.",1],["web","Node.js — fs and http Modules","File I/O (Sync/Async) · HTTP Module · Building HTTP Servers · Node Web App","How do you create a basic HTTP server in Node.js?","","",["const s = new Server(8080)","const http = require('http'); http.createServer((req,res)=>{res.end('Hello')}).listen(3000)","app.listen(3000)","server.start(3000)"],1,"Node.js built-in http module: const http = require('http'); const server = http.createServer((req, res) => { res.writeHead(200); res.end('Hello'); }); server.listen(3000); This creates an HTTP server handling all requests with the callback.",2],["web","Node.js — fs and http Modules","File I/O (Sync/Async) · HTTP Module · Building HTTP Servers · Node Web App","What is the req object in an HTTP server callback?","","",["The response sent to the client","The incoming HTTP request with url, method, headers, and data properties","A database request","A file system request"],1,"req (IncomingMessage): contains incoming request data — req.url (requested path), req.method (GET/POST/etc.), req.headers (request headers), req.on('data') (request body chunks). It's a readable stream for POST body data.",3],["web","Node.js — fs and http Modules","File I/O (Sync/Async) · HTTP Module · Building HTTP Servers · Node Web App","What does res.writeHead(200, {'Content-Type': 'text/html'}) do?","","",["Reads response headers","Writes the HTTP status code and response headers before sending the body","Ends the response","Sets a cookie"],1,"res.writeHead(statusCode, headers) sets the HTTP status code and response headers. Must be called before res.write() or res.end(). If not called, headers are automatically sent with the first res.write()/end(). res.setHeader() sets individual headers.",4],["web","Node.js — fs and http Modules","File I/O (Sync/Async) · HTTP Module · Building HTTP Servers · Node Web App","What does res.end() do in an HTTP server?","","",["Closes the server","Signals that the response is complete and sends it to the client","Ends the current session","Closes the database connection"],1,"res.end([data]) signals the end of the response. Optionally, data can be passed as the final chunk. Always call res.end() to complete the response — without it, the client waits indefinitely. res.write() can send chunks before res.end().",5],["web","Node.js — fs and http Modules","File I/O (Sync/Async) · HTTP Module · Building HTTP Servers · Node Web App","How do you read POST request body data in Node.js http module?","","",["req.body","Collect 'data' events on req and concatenate, then process in the 'end' event","req.getData()","fs.readFile(req)"],1,"POST body comes in chunks: let body=''; req.on('data', chunk => body+=chunk); req.on('end', () => { const data = JSON.parse(body); }). Express simplifies this with body-parser middleware (req.body). Raw Node requires manual stream reading.",6],["web","Node.js — fs and http Modules","File I/O (Sync/Async) · HTTP Module · Building HTTP Servers · Node Web App","Which Node.js method writes content to a new file?","","",["fs.writeFile(path, data, callback)","fs.createFile(path, data)","fs.saveFile(path, data)","fs.write(data, path)"],0,"fs.writeFile(path, data, encoding, callback) creates the file if it doesn't exist (or overwrites it). fs.appendFile() appends without overwriting. fs.writeFileSync() is the synchronous version. Use encoding 'utf8' for text files.",7],["web","Node.js — fs and http Modules","File I/O (Sync/Async) · HTTP Module · Building HTTP Servers · Node Web App","What is the path module used for in Node.js?","","",["Setting URL paths for routes","Cross-platform file path manipulation — joining, parsing, and resolving file paths","URL routing","Reading environment variables"],1,"The built-in 'path' module provides utilities for working with file paths: path.join() combines paths, path.resolve() creates absolute paths, path.basename() gets the filename, path.dirname() gets the directory, path.extname() gets the extension.",8],["web","Node.js — fs and http Modules","File I/O (Sync/Async) · HTTP Module · Building HTTP Servers · Node Web App","What does __dirname provide in a Node.js module?","","",["The name of the current module","The absolute path of the directory containing the current module file","The root directory of the project","The npm installation directory"],1,"__dirname is a Node.js global providing the absolute directory path of the current file. __filename gives the full file path. Useful for: path.join(__dirname, 'views', 'index.html') to construct file paths relative to the current file.",9],["web","Node.js — fs and http Modules","File I/O (Sync/Async) · HTTP Module · Building HTTP Servers · Node Web App","What is the difference between http and https modules in Node.js?","","",["https is faster","https adds TLS/SSL encryption on top of http — requires SSL certificate key and cert files","http supports POST; https only GET","No functional difference"],1,"http creates plain HTTP servers. https.createServer(options, callback) requires options containing key (private key) and cert (certificate). For development, use self-signed certs. In production, use Let's Encrypt or other CAs. All data is encrypted with TLS.",10],["web","Express.js","Express Intro · Application/Request/Response Objects · Routes · Middleware · Templates","What is Express.js?","","",["A JavaScript testing framework","A minimal, fast, and unopinionated web framework for Node.js","A database ORM for Node.js","A CSS framework for Node.js"],1,"Express.js is the most popular Node.js web framework. It provides: routing, middleware support, request/response handling, template engine integration, and error handling. 'Unopinionated' means it doesn't enforce project structure.",1],["web","Express.js","Express Intro · Application/Request/Response Objects · Routes · Middleware · Templates","What is middleware in Express.js?","","",["The HTML template engine","Functions with access to req, res, and next — executing in sequence between request reception and response sending","Database connection handlers","CSS stylesheet processors"],1,"Middleware functions have the signature (req, res, next). They can: execute code, modify req/res, end the request-response cycle, or call next() to pass control to the next middleware. Examples: body-parser, morgan (logging), cors, authentication middleware.",2],["web","Express.js","Express Intro · Application/Request/Response Objects · Routes · Middleware · Templates","How do you define a GET route in Express for the path '/users'?","","",["app.route('GET', '/users', handler)","app.get('/users', (req, res) => { })","app.on('GET /users', handler)","router.GET('/users', handler)"],1,"Express routing: app.get(path, handler) for GET, app.post() for POST, app.put() for PUT, app.delete() for DELETE. The handler receives (req, res) and optionally (req, res, next). app.use() registers middleware for all methods.",3],["web","Express.js","Express Intro · Application/Request/Response Objects · Routes · Middleware · Templates","What does app.use(express.json()) do?","","",["Renders JSON views","Middleware that parses incoming JSON request bodies and populates req.body","Converts responses to JSON automatically","Validates JSON schema"],1,"express.json() is built-in Express middleware (since Express 4.16+) that parses incoming requests with JSON payload, populating req.body. Without it, req.body is undefined for JSON POST requests. express.urlencoded() parses HTML form data.",4],["web","Express.js","Express Intro · Application/Request/Response Objects · Routes · Middleware · Templates","What is a route parameter in Express?","","",["A URL query string parameter","A named segment in the URL path prefixed with : that captures values (e.g., /users/:id)","A POST body parameter","A middleware configuration parameter"],1,"Route parameters: app.get('/users/:id', (req, res) => { const id = req.params.id; }). The :id captures the dynamic segment. For /users/42, req.params.id = '42'. Query strings (?key=val) are in req.query. POST body in req.body.",5],["web","Express.js","Express Intro · Application/Request/Response Objects · Routes · Middleware · Templates","What does next() do in Express middleware?","","",["Goes to the next page","Passes control to the next middleware or route handler in the stack","Completes the response","Skips to the next request"],1,"next() passes control to the next middleware function. Without calling next() (or sending a response), the request hangs. next(error) passes to error-handling middleware (4-parameter: (err, req, res, next)). Calling next('route') skips to the next route.",6],["web","Express.js","Express Intro · Application/Request/Response Objects · Routes · Middleware · Templates","What are template engines used for in Express?","","",["Styling HTML pages","Rendering dynamic HTML pages by combining HTML templates with data on the server","Compiling JavaScript files","Managing static files"],1,"Template engines (EJS, Pug/Jade, Handlebars) allow generating dynamic HTML on the server by combining templates with data. Express: app.set('view engine', 'ejs'). Then: res.render('home', {user: req.user}) renders home.ejs with user data.",7],["web","Express.js","Express Intro · Application/Request/Response Objects · Routes · Middleware · Templates","What does res.json() do in Express?","","",["Reads JSON from request","Sends a JSON response with the appropriate Content-Type header set to application/json","Parses JSON request body","Saves JSON to a file"],1,"res.json(data) serializes data to JSON and sends it with Content-Type: application/json. It also handles circular references and calls JSON.stringify internally. Used for REST API endpoints. res.send() is more general (auto-detects type).",8],["web","Express.js","Express Intro · Application/Request/Response Objects · Routes · Middleware · Templates","What is the purpose of express.Router()?","","",["Creates a new Express application","Creates a mini-application for modular route handling — routes can be grouped and mounted","Handles URL parsing","Creates HTTP server"],1,"Router allows splitting routes into separate files: const router = express.Router(); router.get('/profile', handler); app.use('/users', router). This mounts the router at /users — /users/profile matches. Promotes modular, maintainable route organization.",9],["web","Express.js","Express Intro · Application/Request/Response Objects · Routes · Middleware · Templates","How do you serve static files (HTML, CSS, JS, images) in Express?","","",["app.static('public')","app.use(express.static('public'))","app.serve('public')","app.files('public')"],1,"app.use(express.static('public')) serves files from the 'public' directory. A file at public/style.css is available at /style.css. You can serve multiple directories and set a virtual path prefix: app.use('/static', express.static('public')).",10],["web","Introduction to React","React Intro · JSX · Elements · Components · Props · Function vs Class Components","What is React?","","",["A full-stack web framework","A JavaScript library for building user interfaces, specifically component-based UIs","A CSS framework","A JavaScript runtime"],1,"React is a JavaScript library (not a framework) developed by Facebook for building UI components. It uses a virtual DOM for efficient rendering, a component-based architecture, and unidirectional data flow. It focuses only on the View layer.",1],["web","Introduction to React","React Intro · JSX · Elements · Components · Props · Function vs Class Components","What is JSX?","","",["A new programming language","JavaScript XML — a syntax extension that allows HTML-like code inside JavaScript, transpiled to React.createElement() calls","A templating engine like Pug","A JSON format for React"],1,"JSX is syntactic sugar: <h1>Hello<\/h1> transpiles to React.createElement('h1', null, 'Hello'). Babel handles the transpilation. JSX is optional but widely used for readability. Key rules: className instead of class, htmlFor instead of for, camelCase event names.",2],["web","Introduction to React","React Intro · JSX · Elements · Components · Props · Function vs Class Components","What is a React component?","","",["A CSS class","A reusable, self-contained piece of UI that can accept inputs (props) and return React elements","A Node.js module","A JavaScript function with no return value"],1,"React components are the building blocks of React UIs. They accept props (inputs) and return React elements (JSX) describing what to display. Components can be function-based (modern) or class-based. They should be named with capital letters (MyComponent).",3],["web","Introduction to React","React Intro · JSX · Elements · Components · Props · Function vs Class Components","What are props in React?","","",["Component's internal mutable state","Read-only inputs passed from parent to child components","JavaScript properties","CSS properties"],1,"Props (properties) are the mechanism for passing data from parent to child components. They are read-only (immutable) in the child — the child should never modify its own props. Props flow downward (parent to child) — unidirectional data flow.",4],["web","Introduction to React","React Intro · JSX · Elements · Components · Props · Function vs Class Components","What is the difference between a function component and a class component?","","",["Function components can't use state","Function components are simpler and use Hooks; class components use this.state and lifecycle methods","Class components are faster","Function components don't support props"],1,"Class components: extend React.Component, use this.props/this.state, lifecycle methods. Function components: plain JS functions returning JSX, use Hooks (useState, useEffect) for state and side effects. React 16.8+ Hooks made function components the preferred choice.",5],["web","Introduction to React","React Intro · JSX · Elements · Components · Props · Function vs Class Components","What does ReactDOM.render() do?","","",["Creates a React component","Renders a React element into a real DOM node in the browser","Updates component state","Creates a virtual DOM"],1,"ReactDOM.render(<App />, document.getElementById('root')) mounts the React component tree into the real DOM element with id='root'. In React 18, this is replaced by createRoot(element).render(<App />). Used once to bootstrap the app.",6],["web","Introduction to React","React Intro · JSX · Elements · Components · Props · Function vs Class Components","How do you pass data from a parent to a child component?","","",["Using global variables","Through props: <Child name='Alice' age={25} />","Using state","Using context only"],1,"Props pass data parent-to-child: <Child name='Alice' age={25} />. In the child: function Child({name, age}) { return <p>{name} is {age}<\/p>; } or with props.name and props.age. Props flow down the component tree.",7],["web","Introduction to React","React Intro · JSX · Elements · Components · Props · Function vs Class Components","What is the virtual DOM in React?","","",["The actual browser DOM","A lightweight JavaScript copy of the real DOM that React uses to compute minimal DOM update operations","A DOM manipulation library","A shadow DOM variant"],1,"The virtual DOM is an in-memory representation of the real DOM. When state/props change, React creates a new virtual DOM, diffs it against the previous one (reconciliation), and applies only the minimal necessary changes to the real DOM — efficient updates.",8],["web","Introduction to React","React Intro · JSX · Elements · Components · Props · Function vs Class Components","In JSX, how do you render a dynamic JavaScript expression?","","",["{#expression}","{{expression}}","{expression}","<%=expression%>"],2,"In JSX, wrap JavaScript expressions in single curly braces: {variable}, {2+2}, {user.name}, {condition ? 'Yes' : 'No'}. Double braces {{}} are for style objects: style={{color: 'red'}} (outer {} = JSX expression, inner {} = JS object).",9],["web","Introduction to React","React Intro · JSX · Elements · Components · Props · Function vs Class Components","What is component composition in React?","","",["Combining CSS and JavaScript","Building complex UIs by nesting and combining smaller, reusable components","Inheriting from other components","Compiling components to native code"],1,"React favors composition over inheritance. Complex UIs are built by composing smaller components: <App> contains <Header>, <Main>, <Footer>. <Main> contains <Sidebar>, <Content>. Each component is responsible for a small, focused piece of the UI.",10],["web","React — State, Lifecycle & Events","State · Lifecycle Methods · Props vs State · Event Handling · Conditional Rendering","What is state in React?","","",["Data passed from parent to child","A component's internal, mutable data that triggers re-rendering when updated","A CSS styling object","A global store"],1,"State is local, mutable data managed inside a component. When state changes (via setState or useState setter), React re-renders the component. Unlike props (external, immutable), state is internal and controlled by the component itself.",1],["web","React — State, Lifecycle & Events","State · Lifecycle Methods · Props vs State · Event Handling · Conditional Rendering","What is the correct way to update state in a React function component?","","",["state.count = state.count + 1","const [count, setCount] = useState(0); setCount(count + 1);","this.setState({count: count + 1})","React.updateState(count + 1)"],1,"useState(initialValue) returns [currentValue, setterFunction]. Always use the setter (setCount) to update state — never mutate state directly. Direct mutation doesn't trigger re-render. this.setState() is for class components.",2],["web","React — State, Lifecycle & Events","State · Lifecycle Methods · Props vs State · Event Handling · Conditional Rendering","What does useEffect() hook do?","","",["Creates component state","Performs side effects (data fetching, subscriptions, DOM manipulation) after rendering","Handles click events","Creates context"],1,"useEffect(fn, deps) runs side effects after render. Empty deps []: runs once (componentDidMount). [dep1]: runs when dep1 changes. No deps array: runs after every render. Cleanup: return a function from useEffect for subscriptions/timers.",3],["web","React — State, Lifecycle & Events","State · Lifecycle Methods · Props vs State · Event Handling · Conditional Rendering","What is the component lifecycle in class-based React components?","","",["Constructor → render → componentDidUpdate → componentWillUnmount","Constructor → componentWillMount → render → componentDidMount → componentDidUpdate → componentWillUnmount","render → constructor → componentDidMount","render → componentWillMount → constructor"],1,"Class component lifecycle: constructor (initialize), componentWillMount (deprecated), render (required — returns JSX), componentDidMount (after first render — ideal for API calls), componentDidUpdate (after updates), componentWillUnmount (cleanup before removal).",4],["web","React — State, Lifecycle & Events","State · Lifecycle Methods · Props vs State · Event Handling · Conditional Rendering","How do you handle a button click event in React?","","",["<button onclick='handleClick()'>","<button onClick={handleClick}>","<button @click='handleClick'>","<button on-click={handleClick}>"],1,"React uses camelCase event handlers: onClick, onChange, onSubmit, onKeyDown. Pass function reference (not call): onClick={handleClick} (not onClick={handleClick()}). The event handler receives a SyntheticEvent (React's cross-browser event wrapper).",5],["web","React — State, Lifecycle & Events","State · Lifecycle Methods · Props vs State · Event Handling · Conditional Rendering","What is the difference between controlled and uncontrolled components in React?","","",["Controlled components use class syntax","Controlled: form data managed by React state; Uncontrolled: form data managed by the DOM (via refs)","Uncontrolled components are faster","No practical difference"],1,"Controlled: input value is bound to state (<input value={state} onChange={fn}>) — React is the 'single source of truth'. Uncontrolled: DOM manages its own state, accessed via refs (React.createRef()). Controlled components are preferred for form validation.",6],["web","React — State, Lifecycle & Events","State · Lifecycle Methods · Props vs State · Event Handling · Conditional Rendering","What does conditional rendering mean in React?","","",["Rendering components only on certain browsers","Rendering different UI elements based on conditions — using if/else, ternary (?:), or && operator","Server-side conditional rendering","Lazy loading components"],1,"Conditional rendering: {isLoggedIn ? <UserDashboard /> : <Login />} (ternary), {error && <ErrorMessage />} (&&), or if/else in the component function. Components can return null to render nothing. React 18 adds Suspense for async conditional rendering.",7],["web","React — State, Lifecycle & Events","State · Lifecycle Methods · Props vs State · Event Handling · Conditional Rendering","Why should you not mutate state directly in React?","","",["It causes syntax errors","React doesn't detect direct mutations — no re-render occurs; always use setState/setter functions","Direct mutation is slower","It causes memory leaks"],1,"React detects state changes by reference comparison. const arr = [...state.arr]; arr.push(item); setState(arr) creates a new reference, triggering re-render. state.arr.push(item) mutates in place — same reference, React doesn't re-render. Always create new state objects/arrays.",8],["web","React — State, Lifecycle & Events","State · Lifecycle Methods · Props vs State · Event Handling · Conditional Rendering","What is lifting state up in React?","","",["Moving state to a global store","Moving shared state to the closest common ancestor component so multiple child components can share it","Upgrading to a newer React version","Converting class components to function components"],1,"When multiple components need the same state, lift it to their common parent. The parent manages state and passes it as props to children. Children receive callback props to update the parent's state. This maintains single source of truth.",9],["web","React — State, Lifecycle & Events","State · Lifecycle Methods · Props vs State · Event Handling · Conditional Rendering","What is the purpose of the key prop in React lists?","","",["A unique CSS identifier","A unique identifier that helps React efficiently identify which items have changed, been added, or removed in a list","A mandatory prop for all components","A performance hint for the browser"],1,"key helps React's reconciliation algorithm identify list items. Without keys (or with index as key), React may re-render unnecessarily or incorrectly. Keys must be stable, unique within the list, and not use array index when items can be reordered.",10],["web","React — Lists, Forms & Refs","List Rendering · Keys · Controlled Forms · Refs · Lifting State","How do you render a list of items in React?","","",["Use a for loop inside JSX","Use Array.map() to transform data array into an array of JSX elements","Use React.renderList()","Use a <list> JSX element"],1,"JSX doesn't support for loops directly. Use .map(): const items = data.map(item => <li key={item.id}>{item.name}<\/li>). The key prop is required for each element. Other array methods like .filter() can pre-filter before mapping.",1],["web","React — Lists, Forms & Refs","List Rendering · Keys · Controlled Forms · Refs · Lifting State","What is the recommended key for list items in React?","","",["Array index (0, 1, 2...)","Stable, unique identifier from the data (like database ID)","Random number generated on each render","The item's text content"],1,"Use stable, unique IDs from data (e.g., item.id from a database). Array index can work for static lists but causes bugs for dynamic lists (add/remove/reorder items). React uses keys to match list items between renders for efficient updates.",2],["web","React — Lists, Forms & Refs","List Rendering · Keys · Controlled Forms · Refs · Lifting State","What is a React ref?","","",["A reference to a parent component","A way to access and interact with DOM elements directly or store mutable values that don't trigger re-renders","A prop reference","A Redux reference"],1,"useRef() returns a mutable ref object: const inputRef = useRef(null). Attach to DOM: <input ref={inputRef}/>. Access DOM: inputRef.current.focus(). Refs also store mutable values (like timers, previous state) that don't cause re-renders when changed.",3],["web","React — Lists, Forms & Refs","List Rendering · Keys · Controlled Forms · Refs · Lifting State","How do you handle form input changes in a controlled React component?","","",["Read input on form submit only","Use onChange handler to update state on every keystroke: onChange={e => setState(e.target.value)}","Use document.getElementById to read the value","Forms auto-sync with React state"],1,"Controlled input: <input value={name} onChange={e => setName(e.target.value)} />. Every keystroke updates state; state updates re-render input. This makes React the single source of truth for form data, enabling real-time validation and formatting.",4],["web","React — Lists, Forms & Refs","List Rendering · Keys · Controlled Forms · Refs · Lifting State","What is the purpose of onSubmit in React forms?","","",["Automatically sends form data to a server","A React event handler called when the form is submitted — used to process form data and prevent default browser submission","Validates form fields automatically","Resets the form"],1,"<form onSubmit={handleSubmit}> — in handleSubmit: e.preventDefault() prevents default browser form submission (page reload), then process the controlled state values (validation, API call, etc.). This is the standard pattern for handling forms in React.",5],["web","React — Lists, Forms & Refs","List Rendering · Keys · Controlled Forms · Refs · Lifting State","What does React.Fragment (or <>) do?","","",["Creates a new component","Allows returning multiple elements without adding an extra DOM node (wrapper element)","Creates a code split boundary","Is required for list rendering"],1,"Components must return a single root element. React.Fragment (shorthand: <><\/>) groups multiple elements without adding a real DOM wrapper: <><p>A<\/p><p>B<\/p><\/> renders two <p> tags without a wrapping <div>. Avoids unnecessary DOM nesting.",6],["web","React — Lists, Forms & Refs","List Rendering · Keys · Controlled Forms · Refs · Lifting State","How do you focus an input element automatically when a component mounts?","","",["<input autofocus>","Use useRef and useEffect: const ref = useRef(); useEffect(() => ref.current.focus(), []);","document.querySelector('input').focus()","Both A and B"],3,"Both work: HTML autofocus attribute works for simple cases on initial page load. React way: const inputRef = useRef(null); useEffect(() => inputRef.current.focus(), []); <input ref={inputRef} />. The React approach is preferred for conditional/dynamic focusing.",7],["web","React — Lists, Forms & Refs","List Rendering · Keys · Controlled Forms · Refs · Lifting State","What is prop drilling?","","",["A performance optimization technique","Passing props through multiple levels of components just to reach a deeply nested child","Validating prop types","Passing functions as props"],1,"Prop drilling: passing data A → B → C → D where only D needs it. B and C just pass it through. Solutions: React Context API (useContext), Redux/state management libraries, component composition. Context is built into React and avoids drilling for global data.",8],["web","React — Lists, Forms & Refs","List Rendering · Keys · Controlled Forms · Refs · Lifting State","What does the useContext hook do?","","",["Creates a new context","Subscribes a component to a React context, providing access to context value without prop drilling","Manages global state like Redux","Creates a custom hook"],1,"const value = useContext(MyContext) reads the current context value provided by the nearest <MyContext.Provider value={...}> ancestor. Changes to provider value trigger re-render of consuming components. Ideal for: themes, auth state, locale.",9],["web","React — Lists, Forms & Refs","List Rendering · Keys · Controlled Forms · Refs · Lifting State","What does the second argument to useEffect represent?","","",["The initial state value","The dependency array — the effect runs when any value in this array changes","A cleanup function","The component props"],1,"useEffect(fn, deps): No deps: runs after every render. [] empty array: runs once on mount (like componentDidMount). [a, b]: runs when a or b changes. The effect re-runs only when its dependencies change, preventing infinite loops or unnecessary side effects.",10],["web","React — Error Boundaries & Composition","Error Boundaries · Composition vs Inheritance · Containment · Specialization · Thinking in React","What is an Error Boundary in React?","","",["A try-catch block in JSX","A class component that catches JavaScript errors in child component trees and renders fallback UI","A JavaScript error handler","A React hook for error handling"],1,"Error Boundaries are class components implementing componentDidCatch() and/or getDerivedStateFromError(). They catch errors in the component tree below them and render fallback UI instead of crashing the whole app. Function components cannot be Error Boundaries (as of React 18).",1],["web","React — Error Boundaries & Composition","Error Boundaries · Composition vs Inheritance · Containment · Specialization · Thinking in React","Which lifecycle methods make a class component an Error Boundary?","","",["componentDidMount and componentWillUnmount","getDerivedStateFromError (render fallback) and componentDidCatch (log error)","shouldComponentUpdate and componentDidUpdate","constructor and render"],1,"getDerivedStateFromError(error): static method, called during render phase to update state for fallback UI. componentDidCatch(error, info): called during commit phase for logging. A component implementing either (or both) is an Error Boundary.",2],["web","React — Error Boundaries & Composition","Error Boundaries · Composition vs Inheritance · Containment · Specialization · Thinking in React","What events do Error Boundaries NOT catch?","","",["Errors during rendering","Errors in event handlers, async code, and server-side rendering","Errors in child component lifecycle methods","All of the above"],1,"Error Boundaries only catch errors during: rendering, lifecycle methods, and constructors of child components. They do NOT catch: event handler errors (use try-catch), asynchronous code (setTimeout, promises), SSR errors, or errors in the boundary itself.",3],["web","React — Error Boundaries & Composition","Error Boundaries · Composition vs Inheritance · Containment · Specialization · Thinking in React","Why does React prefer composition over inheritance?","","",["JavaScript doesn't support inheritance","Composition is more flexible and avoids tight coupling — components can be combined in many ways without complex inheritance hierarchies","Inheritance is slower in React","Inheritance conflicts with JSX"],1,"React's documentation explicitly recommends composition over inheritance. Inheritance creates tight coupling. Composition (using props.children, render props, HOCs, hooks) is more flexible and reusable. React itself uses composition extensively.",4],["web","React — Error Boundaries & Composition","Error Boundaries · Composition vs Inheritance · Containment · Specialization · Thinking in React","What is 'containment' in React composition?","","",["Limiting the number of child components","Passing JSX/components as children (props.children) to create generic container components","Restricting component access","CSS overflow containment"],1,"Containment: generic components (Dialog, Card, Panel) don't know their children ahead of time. They use props.children: function Dialog({children}) { return <div className='dialog'>{children}<\/div>; }. Multiple slots: custom props like leftPanel and rightPanel.",5],["web","React — Error Boundaries & Composition","Error Boundaries · Composition vs Inheritance · Containment · Specialization · Thinking in React","What is 'specialization' in React composition?","","",["Creating specialized CSS styles","Creating a more specific component by rendering a generic one with specific props","Optimizing component performance","Adding TypeScript types to components"],1,"Specialization: function WelcomeDialog() { return <Dialog title='Welcome' message='Thank you for visiting!' />; }. WelcomeDialog is a specialized Dialog. This is React's alternative to class inheritance — compose generic components into specific ones.",6],["web","React — Error Boundaries & Composition","Error Boundaries · Composition vs Inheritance · Containment · Specialization · Thinking in React","What is the 'Thinking in React' process?","","",["A performance optimization technique","A methodology: start with a mock, break UI into components, build static version, identify state, add inverse data flow","React's official style guide","A state management pattern"],1,"Thinking in React (from React docs): 1) Start with a UI mock 2) Break into component hierarchy 3) Build static version with props (no state) 4) Identify minimal state 5) Identify where state lives 6) Add inverse data flow (callbacks). A systematic approach to React app design.",7],["web","React — Error Boundaries & Composition","Error Boundaries · Composition vs Inheritance · Containment · Specialization · Thinking in React","What is a Higher-Order Component (HOC) in React?","","",["A component with more than 10 props","A function that takes a component and returns a new enhanced component","A component with more than 5 levels of nesting","A class component only pattern"],1,"HOC: const EnhancedComponent = higherOrderComponent(WrappedComponent). The HOC wraps the component to add functionality (auth checking, logging, data fetching). Examples: connect() from Redux, withRouter from React Router. Modern alternatives: custom hooks.",8],["web","React — Error Boundaries & Composition","Error Boundaries · Composition vs Inheritance · Containment · Specialization · Thinking in React","What are Render Props in React?","","",["Props that contain render instructions","A pattern where a prop is a function that a component calls to determine what to render","The return value of the render method","Props with default values"],1,"Render props: <Mouse render={position => <Cat position={position} />} />. The Mouse component calls its render prop with mouse position data. This shares behavior/logic between components. Modern equivalent: custom hooks, which are generally preferred.",9],["web","React — Error Boundaries & Composition","Error Boundaries · Composition vs Inheritance · Containment · Specialization · Thinking in React","What does React.memo() do?","","",["Creates a memoized state value","Wraps a function component to prevent re-rendering if props haven't changed (shallow comparison)","Caches API responses","Memoizes a function's return value"],1,"React.memo(Component) is a HOC that memoizes the component — skips re-rendering if props are shallowly equal. Useful for performance optimization when a component renders the same output for the same props. Use useMemo() for expensive calculations, useCallback() for functions.",10],["web","React-Redux","Redux Intro · Actions · Reducers · Store · Provider · connect · useSelector/useDispatch","What problem does Redux solve?","","",["CSS styling in React","Predictable state management — centralizes application state, making it easier to manage and debug in large apps","API request handling","Component performance optimization"],1,"Redux solves complex state management: as apps grow, state spread across many components becomes hard to manage. Redux centralizes state in a single store, with predictable state changes via pure functions (reducers), enabling powerful debugging (time-travel) and testing.",1],["web","React-Redux","Redux Intro · Actions · Reducers · Store · Provider · connect · useSelector/useDispatch","What is a Redux Action?","","",["A React event handler","A plain JavaScript object with a 'type' property describing what happened","A function that modifies the store","A Redux middleware"],1,"An action is a plain JS object: { type: 'INCREMENT', payload: 1 }. type is mandatory (string constant). payload carries data. Action creators are functions that return actions: const increment = (n) => ({ type: 'INCREMENT', payload: n }).",2],["web","React-Redux","Redux Intro · Actions · Reducers · Store · Provider · connect · useSelector/useDispatch","What is a Redux Reducer?","","",["A function that creates the Redux store","A pure function (state, action) => newState that specifies how state changes in response to an action","A React component connected to Redux","Redux middleware for async actions"],1,"A reducer is a pure function: (currentState, action) => newState. Pure means: no side effects, no mutations, same input always produces same output. Switch on action.type and return new state. Never mutate state directly — return new objects/arrays.",3],["web","React-Redux","Redux Intro · Actions · Reducers · Store · Provider · connect · useSelector/useDispatch","What is the Redux Store?","","",["A database for the application","The single, centralized state container for the entire application","A React component","An API endpoint"],1,"The Redux store: holds the complete application state tree, allows reading state via store.getState(), allows state updates via store.dispatch(action), allows subscribing to changes via store.subscribe(). Created with createStore(rootReducer).",4],["web","React-Redux","Redux Intro · Actions · Reducers · Store · Provider · connect · useSelector/useDispatch","What is the Provider component in React-Redux?","","",["A HOC for connecting components","A React component that makes the Redux store available to all nested components via React Context","Redux middleware","An action creator helper"],1,"<Provider store={store}><App /><\/Provider> wraps the root component, making the Redux store available throughout the tree via React Context. Without Provider, useSelector() and useDispatch() hooks won't work in child components.",5],["web","React-Redux","Redux Intro · Actions · Reducers · Store · Provider · connect · useSelector/useDispatch","What does the useSelector hook do in React-Redux?","","",["Selects a DOM element","Reads/subscribes to the Redux store state — extracts data and re-renders when it changes","Dispatches actions","Creates a selector function"],1,"const count = useSelector(state => state.counter.value) extracts data from the Redux store. The component re-renders only when the selected value changes. Replaces the mapStateToProps pattern from the older connect() API.",6],["web","React-Redux","Redux Intro · Actions · Reducers · Store · Provider · connect · useSelector/useDispatch","What does the useDispatch hook return?","","",["The current Redux state","The store's dispatch function, used to send actions to the Redux store","A selector function","The Redux reducer"],1,"const dispatch = useDispatch() returns the store's dispatch function. Use it to dispatch actions: dispatch({ type: 'INCREMENT' }) or dispatch(incrementAction()). Replaces mapDispatchToProps from the older connect() API. Modern Redux Toolkit uses createSlice.",7],["web","React-Redux","Redux Intro · Actions · Reducers · Store · Provider · connect · useSelector/useDispatch","What is Redux Toolkit (RTK)?","","",["A UI component library","The official, opinionated toolset for efficient Redux development — simplifies store setup, reducers, and actions","A testing library for Redux","Redux's CLI tool"],1,"Redux Toolkit (RTK) is the modern, recommended way to write Redux. It simplifies: store setup (configureStore), creating reducers + actions (createSlice), async thunks (createAsyncThunk), and includes Immer (allows 'mutating' syntax in reducers — safely copies).",8],["web","React-Redux","Redux Intro · Actions · Reducers · Store · Provider · connect · useSelector/useDispatch","What is the Flux data flow pattern that Redux is based on?","","",["Two-way data binding","Unidirectional data flow: Action → Dispatcher → Store → View → Action","MVC pattern","Observer pattern"],1,"Redux follows unidirectional data flow: UI dispatches an Action → Reducer processes it → Store updates → React components re-render. This predictable one-way flow makes state changes traceable and debuggable. Contrast with two-way binding (Angular, Vue).",9],["web","React-Redux","Redux Intro · Actions · Reducers · Store · Provider · connect · useSelector/useDispatch","What is a Redux Thunk middleware used for?","","",["Logging Redux actions","Enabling action creators to return functions (for async operations like API calls) instead of plain action objects","Combining multiple reducers","Time-travel debugging"],1,"redux-thunk middleware allows action creators to return a function instead of a plain action: const fetchUser = id => async dispatch => { const user = await api.getUser(id); dispatch({ type: 'SET_USER', payload: user }); }. Enables async logic in Redux. RTK includes thunk by default.",10]]};

function home(){stop();S={mode:'home'};scrollTo(0,0);
 const H=ls.get('cmce_h',[]),C=ls.get('cmce_c',{});
 const avg=H.length?Math.round(H.reduce((a,x)=>a+x.pct,0)/H.length):0,best=H.length?Math.max(...H.map(x=>x.pct)):0;
 const weak=Object.entries(C).filter(([k,v])=>v[1]>=3).map(([k,v])=>[k,pct(v[0],v[1]),v[1]]).sort((a,b)=>a[1]-b[1]).slice(0,5);
 let h=`<div class="stats"><div class="stat"><b>${H.length}</b><small>Attempts</small></div><div class="stat"><b>${avg}%</b><small>Average</small></div><div class="stat"><b>${best}%</b><small>Best</small></div></div>`;
 if(weak.length)h+=`<h2>Your weak spots</h2><div class="card">${weak.map(([k,p,n])=>{const[a,s]=k.split('|');return`<div class="hr"><span>${D.s[a].i} ${esc(s)} <span class="mut">(${n} answered)</span></span><span><b>${p}%</b> <button class="btn g" data-wk="${esc(k)}">Practice</button></span></div>`}).join('')}</div>`;
 h+=`<h2>Practice by topic</h2><p class="mut" style="margin-top:-6px">Each chapter's questions run from basic to advanced. First 3 = Easy, next 4 = Intermediate, last 3 = Tough. Hints and full solutions are built in.</p><div class="grid">`;
 for(const k in D.s){const qs=Q.filter(q=>q.k==k),ch=[...new Set(qs.map(q=>q.s))],n=[0,1,2].map(l=>qs.filter(q=>q.l==l).length);
  h+=`<div class="card sub"><h3>${D.s[k].i} ${esc(D.s[k].n)}</h3><div class="mut">${qs.length} questions · ${ch.length} chapters</div>
  <div class="row"><span class="pill l0">Easy ${n[0]}</span><span class="pill l1">Inter. ${n[1]}</span><span class="pill l2">Tough ${n[2]}</span></div>
  <div class="row"><select id="lv-${k}" aria-label="Level"><option value="-1">All levels</option>${LV.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select>
  <select id="ch-${k}" aria-label="Chapter"><option value="">All chapters</option>${ch.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
  <div class="row"><button class="btn" data-pr="${k}">Start practice</button></div></div>`}
 h+=`</div><h2>Mock tests</h2><p class="mut" style="margin-top:-6px">40 questions · 1 mark each · 40 minutes · no negative marking.</p><div class="grid">`;
 for(const k in D.s)h+=`<div class="card sub"><h3>${D.s[k].i} ${esc(D.s[k].n)}</h3><div class="row">${[1,2,3].map(m=>`<button class="btn g" data-mk="${k}" data-m="${m}">Mock ${m}</button>`).join('')}</div></div>`;
 h+=`<div class="card sub" style="border-color:var(--ac)"><h3>🎯 Full CMCE mix</h3><div class="mut">8 random questions from each subject, new every time.</div><div class="row"><button class="btn" data-mix="1">Start mixed mock</button></div></div></div>`;
 if(H.length)h+=`<h2>Recent attempts</h2><div class="card">${H.slice(0,8).map(x=>`<div class="hr"><span>${esc(x.t)}<br><small class="mut">${new Date(x.d).toLocaleDateString()}</small></span><span><b>${x.sc}/${x.tot}</b> · ${x.pct}%</span></div>`).join('')}<div class="row"><button class="btn g" id="clr">Clear history</button></div></div>`;
 app.innerHTML=h;
 app.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{const k=b.dataset.pr,l=+$('#lv-'+k).value,c=$('#ch-'+k).value;startPractice(Q.filter(q=>q.k==k&&(l<0||q.l==l)&&(!c||q.s==c)),D.s[k].n+(l>=0?' · '+LV[l]:'')+(c?' · '+c:''))});
 app.querySelectorAll('[data-wk]').forEach(b=>b.onclick=()=>{const[k,s]=b.dataset.wk.split('|');startPractice(Q.filter(q=>q.k==k&&q.s==s),s)});
 app.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{const k=b.dataset.mk,m=+b.dataset.m,p=shuf(Q.filter(q=>q.k==k),7);let l=[];for(let i=0;i<40;i++)l.push(p[((m-1)*40+i)%p.length]);startMock(l,D.s[k].n+' · Mock '+m)});
 app.querySelectorAll('[data-mix]').forEach(b=>b.onclick=()=>{let l=[];for(const k in D.s)l=l.concat(shuf(Q.filter(q=>q.k==k)).slice(0,8));startMock(shuf(l),'Full CMCE mix')});
 const c=$('#clr');if(c)c.onclick=()=>{if(confirm('Delete all attempts and weak-spot data?')){ls.set('cmce_h',[]);ls.set('cmce_c',{});home()}};
}
function startPractice(qs,title){if(!qs.length)return alert('No questions match.');S={mode:'practice',qs:shuf(qs),i:0,ans:{},hint:{},title,start:Date.now()};quiz()}
function startMock(qs,title){S={mode:'mock',qs,i:0,ans:{},flag:{},title,start:Date.now(),end:Date.now()+40*60000};stop();tmr=setInterval(tick,1000);quiz()}
function tick(){const r=Math.max(0,Math.round((S.end-Date.now())/1000)),t=$('#tm');if(t)t.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');if(!r){stop();alert('Time is up. Submitting your test.');finish()}}
const body=q=>`<div class="qt">${esc(q.p)}</div>${q.c?`<pre>${esc(q.c)}</pre>`:''}${q.z?`<div class="qt">${esc(q.z)}</div>`:''}`;
const sol=q=>`<div class="sol"><div class="sa">✔ Correct answer: ${L[q.a]}) ${esc(q.o[q.a])}</div><div class="se">${esc(q.e)}</div></div>`;
function gone(q){const w=[0,1,2,3].filter(i=>i!=q.a&&i<q.o.length);const keep=w[q.id%w.length];return w.filter(i=>i!=keep)}
function quiz(){const q=S.qs[S.i],n=S.qs.length,a=S.ans[S.i],P=S.mode=='practice',done=P&&a!=null,hs=P?S.hint[S.i]||0:0,g=hs>1?gone(q):[];
 let h=`<div class="qh"><b>Question ${S.i+1} of ${n}</b>${S.mode=='mock'?'<span class="timer" id="tm">--:--</span>':''}<span><button class="btn g" id="fin">${P?'Finish & report':'Submit test'}</button></span></div><div class="bar"><i style="width:${(S.i+1)/n*100}%"></i></div>
 <div class="card" style="margin-top:12px"><div class="row" style="margin:0"><span class="pill l${q.l}">${LV[q.l]}</span><span class="pill">${esc(q.s)}</span></div>${body(q)}`;
 q.o.forEach((o,i)=>{let c='opt';if(done){if(i==q.a)c+=' ok';else if(i==a)c+=' bad'}else if(a==i)c+=' sel';if(g.includes(i))c+=' gone';h+=`<button class="${c}" data-o="${i}" ${done||g.includes(i)?'disabled':''}><span class="bub">${L[i]}</span><span>${esc(o)}</span></button>`});
 if(hs>0&&!done)h+=`<div class="hint">💡 Hint: this is from <b>${esc(q.s)}</b> — ${esc(q.t||'review this chapter')}.${hs>1?' Two wrong options have been crossed out.':''}</div>`;
 if(done)h+=sol(q);
 h+=`<div class="nav"><button class="btn g" id="pv" ${S.i?'':'disabled'}>← Previous</button>${P?`<button class="btn g" id="ht" ${done||hs>1?'disabled':''}>💡 Hint ${hs?'(2/2)'.replace('2/2',hs+'/2'):''}</button>`:`<button class="btn g" id="fl">${S.flag[S.i]?'⚑ Unmark':'⚐ Mark for review'}</button><button class="btn g" id="cl" ${a==null?'disabled':''}>Clear</button>`}<button class="btn" id="nx" ${S.i<n-1?'':'disabled'}>Next →</button></div></div>`;
 if(S.mode=='mock')h+=`<div class="pal">${S.qs.map((x,i)=>`<button data-j="${i}" class="${S.ans[i]!=null?'a':''} ${S.flag[i]?'f':''} ${i==S.i?'c':''}">${i+1}</button>`).join('')}</div><p class="mut">Blue = answered · Orange = marked · Outlined = current</p>`;
 app.innerHTML=h;if(S.mode=='mock')tick();
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{S.ans[S.i]=+b.dataset.o;quiz()});
 app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;quiz();scrollTo(0,0)});
 $('#pv').onclick=()=>{S.i--;quiz();scrollTo(0,0)};$('#nx').onclick=()=>{S.i++;quiz();scrollTo(0,0)};
 const ht=$('#ht');if(ht)ht.onclick=()=>{S.hint[S.i]=(S.hint[S.i]||0)+1;quiz()};
 const fl=$('#fl');if(fl)fl.onclick=()=>{S.flag[S.i]=!S.flag[S.i];quiz()};
 const cl=$('#cl');if(cl)cl.onclick=()=>{delete S.ans[S.i];quiz()};
 $('#fin').onclick=()=>{const u=n-Object.keys(S.ans).length;if(!P&&!confirm(u?`${u} question(s) are unanswered. Submit anyway?`:'Submit your test?'))return;if(P&&!Object.keys(S.ans).length)return home();finish()}}
function finish(){stop();const qs=S.qs,att=[],ch={},lv=[[0,0],[0,0],[0,0]];let sc=0,at=0;
 const used=S.mode=='practice'?qs.map((q,i)=>i).filter(i=>S.ans[i]!=null):qs.map((q,i)=>i);
 const R=used.map(i=>({q:qs[i],a:S.ans[i],ok:S.ans[i]==qs[i].a}));
 R.forEach(r=>{const q=r.q,key=q.k+'|'+q.s;ch[key]=ch[key]||[0,0];ch[key][1]++;lv[q.l][1]++;if(r.a!=null)at++;if(r.ok){sc++;ch[key][0]++;lv[q.l][0]++}});
 const tot=R.length,p=pct(sc,tot),acc=pct(sc,at),secs=Math.round((Date.now()-S.start)/1000);
 const H=ls.get('cmce_h',[]);H.unshift({t:S.title,d:Date.now(),sc,tot,pct:p});ls.set('cmce_h',H.slice(0,50));
 if(S.mode!='practice'||at){const C=ls.get('cmce_c',{});R.filter(r=>r.a!=null).forEach(r=>{const key=r.q.k+'|'+r.q.s;C[key]=C[key]||[0,0];C[key][1]++;if(r.ok)C[key][0]++});ls.set('cmce_c',C)}
 S.R=R;S.mode='report';S.sum={sc,tot,p,acc,at,secs,ch,lv,title:S.title};report('all')}
function report(f){const{sc,tot,p,acc,at,secs,ch,lv,title}=S.sum,R=S.R;
 const msg=p>=80?'Excellent — exam ready.':p>=60?'Good progress. Review the weak chapters below.':p>=40?'Needs work. Revise the solutions and retry.':'Start with Easy level and read each solution carefully.';
 const col=p>=60?'var(--ok)':p>=40?'var(--wn)':'var(--bad)';
 let h=`<div class="card"><h2 style="margin-top:0;text-align:center">${esc(title)}</h2><div class="ring" style="background:conic-gradient(${col} ${p*3.6}deg,var(--sf2) 0)"><div>${p}%</div></div><p style="text-align:center;font-weight:600">${msg}</p>
 <div class="rg"><div class="stat"><b>${sc}/${tot}</b><small>Score (1 mark each)</small></div><div class="stat"><b>${acc}%</b><small>Accuracy (of attempted)</small></div><div class="stat"><b>${at}</b><small>Attempted</small></div><div class="stat"><b>${tot-at}</b><small>Skipped</small></div><div class="stat"><b>${at-sc}</b><small>Wrong</small></div><div class="stat"><b>${Math.floor(secs/60)}m ${secs%60}s</b><small>Time taken</small></div></div>
 <h3>By level</h3>${lv.map((v,i)=>v[1]?`<div class="br"><span>${LV[i]}</span><div class="bar"><i style="width:${pct(v[0],v[1])}%"></i></div><b>${v[0]}/${v[1]}</b></div>`:'').join('')}
 <h3>By chapter</h3>${Object.entries(ch).sort((a,b)=>pct(a[1][0],a[1][1])-pct(b[1][0],b[1][1])).map(([k,v])=>`<div class="br"><span>${esc(k.split('|')[1])}</span><div class="bar"><i style="width:${pct(v[0],v[1])}%"></i></div><b>${v[0]}/${v[1]}</b></div>`).join('')}
 <div class="row"><button class="btn" id="rw" ${at==sc&&tot==at?'disabled':''}>Retry wrong &amp; skipped</button><button class="btn g" id="hm">Back to home</button></div></div>
 <h2>Review &amp; solutions</h2><div class="row" style="margin-bottom:8px">${[['all','All'],['w','Wrong'],['s','Skipped'],['r','Correct']].map(([k,t])=>`<button class="btn ${f==k?'':'g'}" data-f="${k}">${t}</button>`).join('')}</div>`;
 R.forEach((r,i)=>{const c=r.a==null?'s':r.ok?'r':'w';if(f!='all'&&f!=c)return;const q=r.q;
  h+=`<div class="card rv ${c}"><div class="row" style="margin:0"><b>Q${i+1}</b><span class="pill l${q.l}">${LV[q.l]}</span><span class="pill">${esc(q.s)}</span></div>${body(q)}<p>Your answer: <b>${r.a==null?'Skipped':L[r.a]+') '+esc(q.o[r.a])}</b></p>${sol(q)}</div>`});
 app.innerHTML=h;scrollTo(0,0);$('#hm').onclick=home;
 $('#rw').onclick=()=>{const w=R.filter(r=>!r.ok).map(r=>r.q);startPractice(w,'Retry · '+title)};
 app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>report(b.dataset.f))}
home();
</script></body></html>
