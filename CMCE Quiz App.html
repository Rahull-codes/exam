e) that allows faster row lookup. SELECTs with indexed columns are significantly faster. However, indexes slow down INSERT/UPDATE/DELETE (index must be maintained) and consume extra storage.",1],["dbms","Indexes, ACID, Storage Engines & Schema","Indexes · ACID Properties · Database Instance vs Schema · MySQL Storage Engines","What does 'Atomicity' mean in ACID properties?","","",["All transactions execute simultaneously","A transaction is treated as a single unit — either all operations succeed or none do","Data is accurate and consistent","Transactions execute in isolation from each other"],1,"Atomicity ensures a transaction is 'all or nothing'. If any part of the transaction fails, the entire transaction is rolled back. Example: in a bank transfer, both debit and credit must succeed — partial execution is not allowed.",2],["dbms","Indexes, ACID, Storage Engines & Schema","Indexes · ACID Properties · Database Instance vs Schema · MySQL Storage Engines","What does 'Isolation' in ACID mean?","","",["Data is stored in isolated tables","Concurrent transactions execute as if they were serial — changes are not visible until committed","Data persists after system failures","Transactions maintain database consistency rules"],1,"Isolation ensures concurrent transactions don't interfere with each other. Each transaction sees a consistent snapshot of the database. SQL defines isolation levels: READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, SERIALIZABLE.",3],["dbms","Indexes, ACID, Storage Engines & Schema","Indexes · ACID Properties · Database Instance vs Schema · MySQL Storage Engines","What is the difference between InnoDB and MyISAM storage engines in MySQL?","","",["InnoDB supports ACID transactions and foreign keys; MyISAM does not","MyISAM supports transactions; InnoDB does not","InnoDB is faster for reads; MyISAM is for writes","No difference — both support foreign keys"],0,"InnoDB: supports ACID transactions, foreign keys, row-level locking, crash recovery. MyISAM: no transaction support, no foreign keys, table-level locking, faster for read-heavy workloads. InnoDB is the default MySQL engine since version 5.5.",4],["dbms","Indexes, ACID, Storage Engines & Schema","Indexes · ACID Properties · Database Instance vs Schema · MySQL Storage Engines","What is the difference between a Database Schema and a Database Instance?","","",["They are the same","Schema is the structure/design; Instance is the actual data at a point in time","Instance is the structure; Schema is the data","Schema contains only tables; Instance contains indexes too"],1,"Schema: the logical structure/blueprint (table names, columns, types, constraints, relationships) — it rarely changes. Instance: the actual data values stored in the database at a given moment — it changes constantly with DML operations.",5],["dbms","Indexes, ACID, Storage Engines & Schema","Indexes · ACID Properties · Database Instance vs Schema · MySQL Storage Engines","Which type of index is automatically created when you define a PRIMARY KEY?","","",["Secondary Index","Composite Index","Clustered Index","Full-Text Index"],2,"In InnoDB, the primary key creates a clustered index — the table data is physically organized (stored) in primary key order. Each InnoDB table has exactly one clustered index. Secondary indexes store pointers to the clustered index.",6],["dbms","Indexes, ACID, Storage Engines & Schema","Indexes · ACID Properties · Database Instance vs Schema · MySQL Storage Engines","What does 'Durability' in ACID mean?","","",["Transactions last forever without rollback","Once a transaction is committed, the changes persist even after system failures","Data is duplicated for durability","Transactions cannot be rolled back after a timeout"],1,"Durability guarantees that committed transactions survive system crashes, power failures, or errors. MySQL achieves this through the transaction log (redo log in InnoDB) — committed changes are written to durable storage before confirmation.",7],["dbms","Indexes, ACID, Storage Engines & Schema","Indexes · ACID Properties · Database Instance vs Schema · MySQL Storage Engines","What is a UNIQUE index?","","",["An index on the primary key only","An index that enforces uniqueness of values in the indexed column(s)","An index that covers all columns","The fastest type of index"],1,"A UNIQUE index ensures no two rows have the same value in the indexed column(s) (NULLs are an exception — multiple NULLs are allowed). It combines the performance benefits of indexing with the constraint of uniqueness.",8],["dbms","Indexes, ACID, Storage Engines & Schema","Indexes · ACID Properties · Database Instance vs Schema · MySQL Storage Engines","What is a Composite Index?","","",["An index made of multiple separate indexes","An index on multiple columns combined","An index created automatically","A full-text search index"],1,"A composite (multi-column) index covers multiple columns: CREATE INDEX idx ON table(col1, col2). The 'leftmost prefix' rule applies — the index is useful for queries on (col1), (col1, col2), but NOT on (col2) alone.",9],["dbms","Indexes, ACID, Storage Engines & Schema","Indexes · ACID Properties · Database Instance vs Schema · MySQL Storage Engines","What is 'Consistency' in ACID?","","",["All reads return the same data","A transaction brings the database from one valid state to another, respecting all defined rules","All transactions commit at the same time","Data is stored consistently in multiple locations"],1,"Consistency ensures a transaction brings the database from one valid state to another valid state. All data integrity rules (constraints, triggers, cascades) must be satisfied before and after the transaction. A transaction that violates integrity rules is rolled back.",10],["dbms","Stored Procedures","Introduction to Stored Procedures · IN/OUT/INOUT Parameters · Benefits","What is a Stored Procedure in MySQL?","","",["A saved SELECT query","A precompiled set of SQL statements stored in the database that can be executed by name","A table that stores procedure results","A trigger that fires on data changes"],1,"A stored procedure is a precompiled group of SQL statements saved in the database. It can accept parameters, perform logic, and return results. Called with CALL procedure_name(args). Reduces network traffic and improves performance through precompilation.",1],["dbms","Stored Procedures","Introduction to Stored Procedures · IN/OUT/INOUT Parameters · Benefits","What is the correct syntax to create a stored procedure in MySQL?","","",["CREATE PROCEDURE name AS BEGIN ... END","DELIMITER // CREATE PROCEDURE name() BEGIN ... END //","MAKE PROCEDURE name() { ... }","STORED PROCEDURE name() BEGIN ... END"],1,"MySQL requires changing the DELIMITER (e.g., to //) before writing a procedure, so semicolons inside the procedure body don't confuse the client. The CREATE PROCEDURE syntax: DELIMITER // CREATE PROCEDURE name() BEGIN ... END // DELIMITER ;",2],["dbms","Stored Procedures","Introduction to Stored Procedures · IN/OUT/INOUT Parameters · Benefits","What does an IN parameter in a stored procedure do?","","",["Returns a value from the procedure to the caller","Passes a value into the procedure (read-only inside the procedure)","Passes a value in and returns a modified value out","Declares a local variable"],1,"IN parameter: value is passed INTO the procedure. Changes to it inside the procedure do NOT affect the caller's variable. It is read-only from the caller's perspective. This is the default parameter type if not specified.",3],["dbms","Stored Procedures","Introduction to Stored Procedures · IN/OUT/INOUT Parameters · Benefits","What does an OUT parameter do?","","",["Reads a value from the caller","Sends a value FROM the procedure back to the caller","Passes a value in and out","Prints output to the screen"],1,"OUT parameter: the procedure writes a value to it, which the caller can read after the procedure executes. The caller passes a user variable (@var) as the OUT argument. The initial value passed in is ignored by the procedure.",4],["dbms","Stored Procedures","Introduction to Stored Procedures · IN/OUT/INOUT Parameters · Benefits","What does an INOUT parameter do?","","",["Only reads a value","Only writes a value","Both reads the caller's value AND can send a modified value back","Creates a bidirectional stream"],2,"INOUT parameter combines IN and OUT: the procedure can read the value passed in by the caller AND modify it. The modified value is visible to the caller after the procedure executes. The caller must pass a user variable (not a literal).",5],["dbms","Stored Procedures","Introduction to Stored Procedures · IN/OUT/INOUT Parameters · Benefits","How do you call a stored procedure named 'get_salary' with employee_id 101?","","",["EXECUTE get_salary(101)","RUN get_salary(101)","CALL get_salary(101);","INVOKE get_salary WITH (101)"],2,"CALL procedure_name(arguments); is the MySQL syntax to execute a stored procedure. Example: CALL get_salary(101); or with OUT parameter: CALL get_bonus(101, @result); SELECT @result;",6],["dbms","Stored Procedures","Introduction to Stored Procedures · IN/OUT/INOUT Parameters · Benefits","Which benefit does a stored procedure NOT provide?","","",["Reduced network traffic","Code reusability","Automatic query optimization for all queries","Security through controlled access"],2,"Stored procedures reduce network traffic (only CALL is sent), enable code reuse, and improve security (grant EXECUTE without table access). However, they do NOT automatically optimize all queries — the SQL inside still needs proper indexing and query design.",7],["dbms","Stored Procedures","Introduction to Stored Procedures · IN/OUT/INOUT Parameters · Benefits","What is the DELIMITER command used for in MySQL stored procedures?","","",["To define the end of a database name","To change the statement terminator so semicolons inside the procedure don't end the CREATE statement prematurely","To separate columns in output","To delimit table names from column names"],1,"MySQL client uses ; to end statements. Inside a procedure body, multiple ; exist. DELIMITER // changes the terminator to // temporarily, so the entire CREATE PROCEDURE...END is sent as one unit. Then DELIMITER ; restores it.",8],["dbms","Stored Procedures","Introduction to Stored Procedures · IN/OUT/INOUT Parameters · Benefits","Can a stored procedure return multiple result sets?","","",["No, only functions can","Yes, by including multiple SELECT statements","Only with OUT parameters","Only with RETURN statements"],1,"A stored procedure can contain multiple SELECT statements, each producing a separate result set. The calling application receives multiple result sets. This is different from functions, which return a single scalar value.",9],["dbms","Stored Procedures","Introduction to Stored Procedures · IN/OUT/INOUT Parameters · Benefits","What is the difference between a Stored Procedure and a Function in MySQL?","","",["No difference","Procedures are called with CALL and may not return a value; Functions must return a value and can be used in SQL expressions","Functions use CALL; Procedures use RETURN","Procedures cannot have parameters"],1,"Stored Procedure: called with CALL, can have IN/OUT/INOUT params, may return 0 or more result sets. Function: called like a built-in function in SQL expressions (SELECT my_func()), MUST return a single scalar value using RETURN. Functions cannot use OUT/INOUT.",10],["dbms","Flow Control & Conditional Statements","LOOP · WHILE · REPEAT · IF/IF-ELSE · CASE in Stored Procedures","What is the syntax of a WHILE loop in MySQL stored procedures?","","",["WHILE (condition) { statements }","WHILE condition DO statements END WHILE;","WHILE condition LOOP statements END LOOP;","DO WHILE condition THEN statements END;"],1,"MySQL WHILE loop syntax: WHILE condition DO statement(s); END WHILE; The condition is checked BEFORE each iteration. If the condition is initially false, the loop body never executes.",1],["dbms","Flow Control & Conditional Statements","LOOP · WHILE · REPEAT · IF/IF-ELSE · CASE in Stored Procedures","What is the key difference between WHILE and REPEAT loops in MySQL?","","",["WHILE is faster","WHILE checks condition before execution; REPEAT checks condition after (executes at least once)","REPEAT checks condition before execution; WHILE checks after","REPEAT is only for cursors"],1,"WHILE: checks condition BEFORE executing the body (like a pre-test loop). REPEAT: executes the body first, then checks the condition UNTIL it is TRUE (like do-while). REPEAT always executes at least once.",2],["dbms","Flow Control & Conditional Statements","LOOP · WHILE · REPEAT · IF/IF-ELSE · CASE in Stored Procedures","What is the syntax of the REPEAT loop in MySQL?","","",["REPEAT statements UNTIL condition END REPEAT;","REPEAT DO statements WHILE condition END;","LOOP statements REPEAT UNTIL condition;","REPEAT { statements } UNTIL (condition);"],0,"MySQL REPEAT loop syntax: REPEAT statement(s); UNTIL condition END REPEAT; The loop repeats UNTIL the condition becomes TRUE (note: opposite of WHILE which loops WHILE the condition is TRUE).",3],["dbms","Flow Control & Conditional Statements","LOOP · WHILE · REPEAT · IF/IF-ELSE · CASE in Stored Procedures","What is the purpose of the LOOP construct in MySQL?","","",["A loop that auto-exits after 10 iterations","An infinite loop that must be exited with LEAVE","A loop that works only with cursors","A loop that replaces WHILE and REPEAT"],1,"The basic LOOP is an infinite loop with no built-in exit condition. You must use LEAVE label; to exit it. It is more flexible for complex exit conditions. ITERATE label; skips to the next iteration (like 'continue' in other languages).",4],["dbms","Flow Control & Conditional Statements","LOOP · WHILE · REPEAT · IF/IF-ELSE · CASE in Stored Procedures","What does the IF-ELSEIF-ELSE construct look like in MySQL?","","",["IF cond THEN ... ELSIF cond THEN ... ELSE ... END IF;","IF cond THEN ... ELSEIF cond THEN ... ELSE ... END IF;","IF (cond) { ... } ELSEIF (cond) { ... } ELSE { ... }","IF cond BEGIN ... ELSEIF cond BEGIN ... END"],1,"MySQL IF syntax: IF condition THEN statements; ELSEIF condition THEN statements; ELSE statements; END IF; Note: it's ELSEIF (one word) in MySQL, not ELSIF (Oracle) or ELSE IF (two words, used in some languages).",5],["dbms","Flow Control & Conditional Statements","LOOP · WHILE · REPEAT · IF/IF-ELSE · CASE in Stored Procedures","What is the MySQL CASE statement syntax in stored procedures?","","",["CASE val WHEN v1 THEN s1; ELSE s2; END CASE;","SWITCH(val) { CASE v1: s1; DEFAULT: s2; }","SELECT CASE val WHEN v1 THEN s1 END","CASE val: v1 DO s1; DEFAULT DO s2; END"],0,"MySQL procedural CASE: CASE case_value WHEN val1 THEN statement1; WHEN val2 THEN statement2; ELSE default_statement; END CASE; There is also a searched CASE: CASE WHEN condition1 THEN ... END CASE. This is different from CASE in SELECT (which is an expression).",6],["dbms","Flow Control & Conditional Statements","LOOP · WHILE · REPEAT · IF/IF-ELSE · CASE in Stored Procedures","What does LEAVE do in a MySQL loop?","","",["Skips to the next iteration","Exits the labeled loop or block","Ends the stored procedure","Commits the current transaction"],1,"LEAVE label; exits the labeled loop (LOOP, WHILE, or REPEAT) or BEGIN...END block. It's equivalent to 'break' in other languages. Labels are defined as: label_name: LOOP ... LEAVE label_name; END LOOP label_name;",7],["dbms","Flow Control & Conditional Statements","LOOP · WHILE · REPEAT · IF/IF-ELSE · CASE in Stored Procedures","What does ITERATE do in a MySQL loop?","","",["Exits the loop","Skips the remaining statements in the current iteration and goes to the next iteration","Restarts the loop from the beginning","Creates a nested loop"],1,"ITERATE label; skips the rest of the current iteration and jumps back to the loop condition check (like 'continue' in other languages). It can only be used inside LOOP, REPEAT, or WHILE loops.",8],["dbms","Flow Control & Conditional Statements","LOOP · WHILE · REPEAT · IF/IF-ELSE · CASE in Stored Procedures","In a stored procedure, what is a local variable and how is it declared?","","",["VARIABLE v INT; declared anywhere in the procedure","DECLARE v INT DEFAULT 0; declared at the beginning of the BEGIN...END block","SET @v = 0; can be declared anywhere","LOCAL v INT; declared before BEGIN"],1,"Local variables in stored procedures: DECLARE variable_name datatype [DEFAULT value]; They must be declared at the START of a BEGIN...END block, before any other statements. They are only accessible within that block. User variables (@var) are session-scoped.",9],["dbms","Flow Control & Conditional Statements","LOOP · WHILE · REPEAT · IF/IF-ELSE · CASE in Stored Procedures","A WHILE loop condition is checked and is FALSE on the first check. How many times does the loop body execute?","","",["Once","Zero times","Infinite times","Once then exits"],1,"A WHILE loop is a pre-test loop — the condition is checked BEFORE executing the body. If the condition is FALSE initially, the body never executes (0 times). This contrasts with REPEAT which executes the body at least once (post-test).",10],["dbms","Functions & Built-in MySQL Functions","User-Defined Functions · String/Numeric/Date Built-in Functions · ITERATE/LEAVE","Which MySQL built-in function returns the length of a string in characters?","","",["SIZE(str)","LENGTH(str)","CHAR_LENGTH(str)","STRLEN(str)"],2,"CHAR_LENGTH(str) returns the number of characters. LENGTH(str) returns the number of BYTES (differs for multi-byte charsets like UTF-8 where one character can be multiple bytes). For ASCII strings, both return the same value.",1],["dbms","Functions & Built-in MySQL Functions","User-Defined Functions · String/Numeric/Date Built-in Functions · ITERATE/LEAVE","What does the UPPER() function do?","","",["Returns the ASCII value of the first character","Converts a string to uppercase","Returns the maximum value in a column","Truncates a string"],1,"UPPER(str) (or UCASE()) converts all characters in a string to uppercase. LOWER(str) (or LCASE()) converts to lowercase. Example: UPPER('hello') returns 'HELLO'. These are useful for case-insensitive comparisons.",2],["dbms","Functions & Built-in MySQL Functions","User-Defined Functions · String/Numeric/Date Built-in Functions · ITERATE/LEAVE","What is the output of: SELECT SUBSTRING('Database', 1, 4);","","",["'Data'","'base'","'Database'","'Dat'"],0,"SUBSTRING(str, pos, len) extracts len characters starting at position pos. In MySQL, string positions start at 1 (not 0). SUBSTRING('Database', 1, 4) extracts 4 chars from position 1: 'Data'.",3],["dbms","Functions & Built-in MySQL Functions","User-Defined Functions · String/Numeric/Date Built-in Functions · ITERATE/LEAVE","Which function returns the current date and time in MySQL?","","",["GETDATE()","NOW()","SYSDATE()","CURDATE()"],1,"NOW() returns the current date and time as 'YYYY-MM-DD HH:MM:SS'. CURDATE() returns only the date. CURTIME() returns only the time. GETDATE() is SQL Server syntax. SYSDATE() also works in MySQL but differs slightly from NOW() inside stored procedures.",4],["dbms","Functions & Built-in MySQL Functions","User-Defined Functions · String/Numeric/Date Built-in Functions · ITERATE/LEAVE","What does ROUND(3.14159, 2) return?","","",["3.14","3.15","3.1","3"],1,"ROUND(number, decimals) rounds to the specified decimal places. 3.14159 rounded to 2 decimal places: the third decimal is 1, so we round to 3.14. Wait — the third decimal is 1 which is less than 5, so 3.14159 rounds to 3.14. Actually ROUND(3.14159, 2) = 3.14. The answer is A) 3.14.",5],["dbms","Functions & Built-in MySQL Functions","User-Defined Functions · String/Numeric/Date Built-in Functions · ITERATE/LEAVE","What is a user-defined function (UDF) in MySQL?","","",["A built-in aggregate function","A function created by the user that must return a single scalar value","A function that returns multiple rows","A stored procedure with a return type"],1,"A UDF (user-defined function) is created with CREATE FUNCTION. It MUST return a single scalar value using RETURN. Functions can be used in SQL expressions (SELECT my_func(x)) unlike procedures. They are deterministic or non-deterministic.",6],["dbms","Functions & Built-in MySQL Functions","User-Defined Functions · String/Numeric/Date Built-in Functions · ITERATE/LEAVE","Which function calculates the difference between two dates in MySQL?","","",["DATE_SUBTRACT(d1, d2)","DATEDIFF(d1, d2)","DATE_DIFF(d1, d2)","DAYS_BETWEEN(d1, d2)"],1,"DATEDIFF(date1, date2) returns date1 - date2 in days. Example: DATEDIFF('2024-12-31', '2024-01-01') returns 365. TIMESTAMPDIFF(unit, dt1, dt2) allows different units (MONTH, YEAR, HOUR, etc.).",7],["dbms","Functions & Built-in MySQL Functions","User-Defined Functions · String/Numeric/Date Built-in Functions · ITERATE/LEAVE","What does the CONCAT() function do?","","",["Counts the number of strings","Joins multiple strings into one","Compares two strings","Splits a string by a delimiter"],1,"CONCAT(str1, str2, ...) joins multiple strings. Example: CONCAT('Hello', ' ', 'World') returns 'Hello World'. If any argument is NULL, CONCAT returns NULL. Use CONCAT_WS(separator, str1, str2) to join with a separator and skip NULLs.",8],["dbms","Functions & Built-in MySQL Functions","User-Defined Functions · String/Numeric/Date Built-in Functions · ITERATE/LEAVE","What does FLOOR(4.9) return?","","",["5","4.9","4","5.0"],2,"FLOOR(x) returns the largest integer not greater than x (rounds DOWN). FLOOR(4.9) = 4. CEIL()/CEILING(x) rounds UP — CEIL(4.1) = 5. ROUND() rounds to nearest. TRUNCATE(x, d) truncates (doesn't round) to d decimal places.",9],["dbms","Functions & Built-in MySQL Functions","User-Defined Functions · String/Numeric/Date Built-in Functions · ITERATE/LEAVE","What is a deterministic function in MySQL?","","",["A function that always runs faster","A function that always returns the same result for the same input values","A function that can modify tables","A function with no parameters"],1,"DETERMINISTIC means the function always returns the same output for the same inputs (no side effects). Example: ABS(-5) always returns 5. NOT DETERMINISTIC functions may return different results (e.g., NOW()). MySQL requires declaring this when creating functions.",10],["dbms","Cursors","Cursor Types · DECLARE/OPEN/FETCH/CLOSE · Real-time Use Cases","What is a cursor in MySQL stored procedures?","","",["A mouse pointer in MySQL Workbench","A database object that allows row-by-row processing of a SELECT result set","A type of index","A stored query result cache"],1,"A cursor is a pointer to a result set that allows processing rows one at a time. While SQL is set-based (operates on all rows), cursors allow procedural row-by-row processing when needed for complex row-level logic.",1],["dbms","Cursors","Cursor Types · DECLARE/OPEN/FETCH/CLOSE · Real-time Use Cases","What is the correct order of cursor operations?","","",["OPEN → DECLARE → FETCH → CLOSE","DECLARE → FETCH → OPEN → CLOSE","DECLARE → OPEN → FETCH → CLOSE","FETCH → OPEN → DECLARE → CLOSE"],2,"Cursor lifecycle: DECLARE cursor_name CURSOR FOR select_stmt; (define it), OPEN cursor_name; (execute query, populate result set), FETCH cursor_name INTO var1, var2; (get next row), CLOSE cursor_name; (release resources). Always close cursors when done.",2],["dbms","Cursors","Cursor Types · DECLARE/OPEN/FETCH/CLOSE · Real-time Use Cases","What is an ASENSITIVE cursor?","","",["A cursor that is insensitive to changes","A cursor that may or may not reflect changes made to the underlying table after it is opened","A cursor with extra sensitivity for NULL values","A cursor that reads data backwards"],1,"ASENSITIVE cursor: the server may or may not make a copy of the result set — it might reflect changes to the underlying data. INSENSITIVE cursor: always makes a copy (snapshot) at OPEN time, unaffected by subsequent data changes. MySQL cursors are typically ASENSITIVE by default.",3],["dbms","Cursors","Cursor Types · DECLARE/OPEN/FETCH/CLOSE · Real-time Use Cases","What does 'NOT FOUND' condition handler do in cursor processing?","","",["Raises an error when no rows exist","Sets a flag variable to exit the cursor loop when FETCH returns no more rows","Closes the cursor automatically","Restarts the cursor from the beginning"],1,"When FETCH reaches the last row, MySQL raises 'NOT FOUND' condition (SQLSTATE '02000'). You declare a handler: DECLARE CONTINUE HANDLER FOR NOT FOUND SET done = TRUE; This sets the flag variable, allowing the loop to exit gracefully.",4],["dbms","Cursors","Cursor Types · DECLARE/OPEN/FETCH/CLOSE · Real-time Use Cases","MySQL cursors are READ ONLY. What does this mean?","","",["The cursor can only be used for reading table metadata","You cannot UPDATE or DELETE rows directly through the cursor","The cursor cannot be used inside procedures","The cursor can only access views"],1,"MySQL cursors are READ-ONLY — you cannot use them to update the current row directly (no 'WHERE CURRENT OF cursor' as in some databases). To update while iterating, fetch the primary key and execute a separate UPDATE statement.",5],["dbms","Cursors","Cursor Types · DECLARE/OPEN/FETCH/CLOSE · Real-time Use Cases","What does NONSCROLLABLE mean for a MySQL cursor?","","",["The cursor cannot be opened","The cursor can only move forward (FETCH moves to next row only, cannot go back)","The cursor ignores NULL values","The cursor processes rows in random order"],1,"MySQL cursors are NONSCROLLABLE (forward-only). FETCH always moves to the next row sequentially. You cannot FETCH PRIOR, FETCH FIRST, or position the cursor arbitrarily. Some databases support scrollable cursors, but MySQL does not.",6],["dbms","Cursors","Cursor Types · DECLARE/OPEN/FETCH/CLOSE · Real-time Use Cases","What happens if you FETCH from a cursor after all rows have been processed?","","",["It returns NULL for all variables","The NOT FOUND condition is triggered (SQLSTATE 02000)","An error terminates the procedure","The cursor loops back to the first row"],1,"When FETCH is called on an exhausted cursor (no more rows), MySQL raises SQLSTATE 02000 (NOT FOUND condition). Without a handler, this causes the procedure to terminate with an error. With a NOT FOUND handler, you can set a flag and exit gracefully.",7],["dbms","Cursors","Cursor Types · DECLARE/OPEN/FETCH/CLOSE · Real-time Use Cases","Where must a cursor be DECLARED in a MySQL stored procedure?","","",["Anywhere in the procedure body","At the beginning of the BEGIN...END block, after variable declarations","After the OPEN statement","Outside the procedure"],1,"In MySQL procedures, the order inside BEGIN...END must be: 1) DECLARE variables, 2) DECLARE cursors, 3) DECLARE handlers, 4) Executable statements. Cursors must be declared before handlers and before executable code.",8],["dbms","Cursors","Cursor Types · DECLARE/OPEN/FETCH/CLOSE · Real-time Use Cases","What is the purpose of CLOSE cursor_name?","","",["Deletes the cursor permanently","Releases the cursor's result set and frees associated resources","Commits the transaction","Resets the cursor to the first row"],1,"CLOSE cursor_name; releases the cursor's result set and associated memory. It's good practice to always close cursors. A cursor is implicitly closed when the procedure ends, but explicit CLOSE is recommended for resource management.",9],["dbms","Cursors","Cursor Types · DECLARE/OPEN/FETCH/CLOSE · Real-time Use Cases","In what real-world scenario would a cursor be appropriate over a set-based operation?","","",["Simple SELECT queries","Row-by-row processing where each row's action depends on complex logic from the previous row","INSERT operations","Aggregate calculations"],1,"Cursors are appropriate when processing requires complex row-by-row logic that cannot be expressed as a single set-based SQL statement — e.g., computing running totals based on previous row values, complex conditional logic per row, or generating dynamic SQL per row.",10],["dbms","Triggers","BEFORE/AFTER Triggers · NEW/OLD Variables · Real-time Use Cases","What is a trigger in MySQL?","","",["A scheduled job that runs at set times","A stored program that automatically executes in response to a DML event on a table","A constraint that prevents invalid data","A user-defined function that fires on SELECT"],1,"A trigger is a stored program that fires automatically when a specified DML event (INSERT, UPDATE, DELETE) occurs on a table. Triggers are defined with timing (BEFORE/AFTER) and event (INSERT/UPDATE/DELETE).",1],["dbms","Triggers","BEFORE/AFTER Triggers · NEW/OLD Variables · Real-time Use Cases","What is the difference between a BEFORE and AFTER trigger?","","",["BEFORE triggers fire daily; AFTER triggers fire weekly","BEFORE fires before the DML statement executes; AFTER fires after the statement completes","AFTER triggers cannot modify data; BEFORE can","No functional difference"],1,"BEFORE trigger fires BEFORE the DML operation — useful for validation and modifying NEW values before they're saved. AFTER trigger fires AFTER the operation — useful for audit logging and cascading updates. BEFORE triggers can cancel the operation by causing an error.",2],["dbms","Triggers","BEFORE/AFTER Triggers · NEW/OLD Variables · Real-time Use Cases","What does the NEW keyword refer to in a MySQL trigger?","","",["A new table created by the trigger","The new values being inserted or updated (not available in DELETE triggers)","The new database connection","A new transaction started by the trigger"],1,"NEW.column_name refers to the new row values in INSERT and UPDATE triggers. In INSERT triggers, NEW contains the values being inserted. In UPDATE triggers, NEW contains the updated values. DELETE triggers only have OLD (no NEW since no new values).",3],["dbms","Triggers","BEFORE/AFTER Triggers · NEW/OLD Variables · Real-time Use Cases","What does the OLD keyword refer to in a MySQL trigger?","","",["An archived version of the table","The original values before an UPDATE or DELETE (not available in INSERT triggers)","Old database connections","Previously committed data"],1,"OLD.column_name refers to the original row values before modification. Available in UPDATE triggers (values before the update) and DELETE triggers (values being deleted). INSERT triggers only have NEW (no OLD since no previous values exist).",4],["dbms","Triggers","BEFORE/AFTER Triggers · NEW/OLD Variables · Real-time Use Cases","How many triggers can fire for a single event on a table in MySQL 5.7+?","","",["Only one trigger per event","Multiple triggers can exist for the same event/timing combination","Maximum two triggers","Unlimited but only one fires"],1,"Since MySQL 5.7.2, multiple triggers can be defined for the same table, event, and timing (e.g., multiple BEFORE INSERT triggers). They fire in the order they were created. Use FOLLOWS/PRECEDES to control order in MySQL 5.7.2+.",5],["dbms","Triggers","BEFORE/AFTER Triggers · NEW/OLD Variables · Real-time Use Cases","Which trigger type is most appropriate for an audit log that records changes?","","",["BEFORE INSERT","AFTER DELETE","BEFORE UPDATE","AFTER UPDATE"],3,"AFTER UPDATE (or AFTER INSERT/AFTER DELETE) is best for audit logs because the data change has already been committed to the main table. You record OLD values (what changed from) and NEW values (what changed to) in the audit table.",6],["dbms","Triggers","BEFORE/AFTER Triggers · NEW/OLD Variables · Real-time Use Cases","Can a trigger call a stored procedure?","","",["No, triggers cannot call procedures","Yes, triggers can call stored procedures","Only AFTER triggers can call procedures","Only if the procedure has no parameters"],1,"Yes, MySQL triggers can call stored procedures using CALL procedure_name(args). However, there are restrictions: the called procedure cannot return result sets (no SELECT that returns data), cannot use transactions (COMMIT/ROLLBACK), and cannot use dynamic SQL.",7],["dbms","Triggers","BEFORE/AFTER Triggers · NEW/OLD Variables · Real-time Use Cases","What syntax creates an AFTER INSERT trigger in MySQL?","","",["CREATE TRIGGER t AFTER INSERT FOR TABLE emp BEGIN ... END","CREATE TRIGGER t AFTER INSERT ON emp FOR EACH ROW BEGIN ... END","TRIGGER t INSERT AFTER ON emp BEGIN ... END","CREATE AFTER TRIGGER t ON emp FOR INSERT BEGIN ... END"],1,"MySQL trigger syntax: CREATE TRIGGER trigger_name {BEFORE|AFTER} {INSERT|UPDATE|DELETE} ON table_name FOR EACH ROW BEGIN ... END; FOR EACH ROW is mandatory in MySQL (only row-level triggers are supported, not statement-level).",8],["dbms","Triggers","BEFORE/AFTER Triggers · NEW/OLD Variables · Real-time Use Cases","Can you use a BEFORE trigger to prevent an INSERT from happening?","","",["No, triggers cannot prevent DML operations","Yes, by raising an error with SIGNAL SQLSTATE in the BEFORE trigger","Only AFTER triggers can cancel operations","Yes, by using ROLLBACK inside the trigger"],1,"A BEFORE trigger can cancel the DML operation by raising an error: SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Invalid data'; This causes the triggering statement to fail and roll back. ROLLBACK inside a trigger is not allowed directly.",9],["dbms","Triggers","BEFORE/AFTER Triggers · NEW/OLD Variables · Real-time Use Cases","What is a real-world use case for a BEFORE UPDATE trigger?","","",["Sending email notifications","Validating and auto-correcting data before it is saved (e.g., normalizing phone number format)","Recording deleted records","Replicating data to another server"],1,"BEFORE UPDATE triggers are ideal for data validation and transformation: ensuring new values meet business rules, auto-formatting data (e.g., SET NEW.phone = REGEXP_REPLACE(NEW.phone, '[^0-9]', '')), or setting automatic timestamps before the row is saved.",10],["dbms","Error Handling & Exceptions","Handler Types · DECLARE HANDLER · SIGNAL · Exception Handling in Procedures","What is the purpose of error handling in MySQL stored procedures?","","",["To speed up query execution","To gracefully manage runtime errors and prevent unexpected procedure termination","To log all SQL queries automatically","To prevent users from running stored procedures"],1,"Error handling in stored procedures allows graceful management of runtime errors (constraint violations, not-found conditions, etc.) without abrupt termination. Proper handling provides meaningful error messages and ensures data consistency.",1],["dbms","Error Handling & Exceptions","Handler Types · DECLARE HANDLER · SIGNAL · Exception Handling in Procedures","What are the two types of handler ACTIONS in MySQL?","","",["RAISE and IGNORE","CONTINUE and EXIT","RETRY and ABORT","CATCH and THROW"],1,"MySQL handler actions: CONTINUE — executes the handler then continues execution from the statement AFTER the one that caused the error. EXIT — executes the handler then exits the BEGIN...END block where the handler was declared.",2],["dbms","Error Handling & Exceptions","Handler Types · DECLARE HANDLER · SIGNAL · Exception Handling in Procedures","What is the syntax for declaring an EXIT handler for SQLEXCEPTION?","","",["CATCH EXCEPTION THEN SET msg = 'Error'; END CATCH","DECLARE EXIT HANDLER FOR SQLEXCEPTION SET msg = 'Error';","HANDLE SQLEXCEPTION EXIT BEGIN SET msg = 'Error'; END","ON EXCEPTION EXIT DO SET msg = 'Error';"],1,"MySQL handler syntax: DECLARE {CONTINUE|EXIT} HANDLER FOR {condition} statement; Conditions can be: SQLEXCEPTION (any SQL error), SQLWARNING (any warning), NOT FOUND (no rows), or specific SQLSTATE values. The statement can be a single statement or a BEGIN...END block.",3],["dbms","Error Handling & Exceptions","Handler Types · DECLARE HANDLER · SIGNAL · Exception Handling in Procedures","What does SQLEXCEPTION represent as a handler condition?","","",["Only constraint violations","Any SQL error condition (SQLSTATE classes 01-09 are warnings; 02 is NOT FOUND; others are exceptions)","Only syntax errors","Database connection errors only"],1,"SQLEXCEPTION is a shorthand for any SQLSTATE class that is NOT a warning (not '01xxx') and NOT a NOT FOUND condition (not '02xxx'). It catches most runtime SQL errors like constraint violations, duplicate keys, etc.",4],["dbms","Error Handling & Exceptions","Handler Types · DECLARE HANDLER · SIGNAL · Exception Handling in Procedures","How do you raise a custom error in MySQL stored procedures?","","",["THROW 'Error message'","RAISE EXCEPTION 'Error'","SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Custom error';","ERROR('Custom error')"],2,"SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'message'; raises a custom exception. SQLSTATE '45000' is the user-defined unhandled exception class. You can also signal specific MySQL error numbers or standard SQLSTATE codes.",5],["dbms","Error Handling & Exceptions","Handler Types · DECLARE HANDLER · SIGNAL · Exception Handling in Procedures","What is RESIGNAL used for in MySQL?","","",["Re-opening a cursor","Re-raising the current exception (or a modified version) from within a handler","Restarting a transaction","Re-compiling a stored procedure"],1,"RESIGNAL (re-signal) re-raises the current exception from within an error handler, optionally modifying the error information. It's used when you want to add information to an error and re-raise it to a higher level handler.",6],["dbms","Error Handling & Exceptions","Handler Types · DECLARE HANDLER · SIGNAL · Exception Handling in Procedures","What is the SQLSTATE '23000' used for?","","",["Not Found","Integrity constraint violation (e.g., duplicate primary key)","Division by zero","Deadlock"],1,"SQLSTATE '23000' represents integrity constraint violations — like inserting a duplicate primary key, violating a NOT NULL constraint, or a foreign key constraint violation. You can catch it specifically: DECLARE CONTINUE HANDLER FOR SQLSTATE '23000' ...",7],["dbms","Error Handling & Exceptions","Handler Types · DECLARE HANDLER · SIGNAL · Exception Handling in Procedures","In what order should DECLARE statements appear in a MySQL stored procedure body?","","",["Handlers → Variables → Cursors","Variables → Cursors → Handlers","Cursors → Variables → Handlers","Any order"],1,"MySQL requires this strict order in a BEGIN...END block: 1) DECLARE variables, 2) DECLARE cursors, 3) DECLARE handlers, 4) Executable statements. Placing them out of order causes a syntax error.",8],["dbms","Error Handling & Exceptions","Handler Types · DECLARE HANDLER · SIGNAL · Exception Handling in Procedures","What does a CONTINUE handler do after handling an exception?","","",["Exits the current BEGIN...END block","Continues execution from the statement immediately after the one that triggered the error","Restarts the entire stored procedure","Commits the current transaction"],1,"After a CONTINUE handler executes, control returns to the statement FOLLOWING the one that caused the error. This allows the procedure to continue running despite the error. Contrast with EXIT handler, which exits the current BEGIN...END block.",9],["dbms","Error Handling & Exceptions","Handler Types · DECLARE HANDLER · SIGNAL · Exception Handling in Procedures","How do you retrieve the error message from a caught exception in MySQL?","","",["GET DIAGNOSTICS CONDITION 1 @msg = MESSAGE_TEXT;","CATCH MESSAGE INTO @msg","GET ERROR MESSAGE INTO @msg","SELECT LAST_ERROR() INTO @msg"],0,"GET DIAGNOSTICS CONDITION 1 @var = MESSAGE_TEXT; retrieves the error message after an exception is caught. GET DIAGNOSTICS CONDITION 1 @code = RETURNED_SQLSTATE, @msg = MESSAGE_TEXT; gets both the SQLSTATE and message.",10],["dbms","Introduction to NoSQL Databases","NoSQL Features · Structured/Unstructured Data · CAP Theorem · BASE Model · NoSQL Categories","What does CAP theorem state?","","",["A distributed system can guarantee all three: Consistency, Availability, and Partition tolerance","A distributed system can guarantee at most two of: Consistency, Availability, and Partition tolerance","Consistency is more important than Availability in all systems","All databases must be either ACID or BASE"],1,"CAP theorem (Brewer's theorem): In a distributed system, you can only guarantee TWO of the three properties simultaneously: Consistency (all nodes see same data), Availability (every request gets a response), Partition tolerance (system works despite network partitions).",1],["dbms","Introduction to NoSQL Databases","NoSQL Features · Structured/Unstructured Data · CAP Theorem · BASE Model · NoSQL Categories","What does BASE stand for in NoSQL database design?","","",["Basic Available, Scalable, Elastic","Basically Available, Soft state, Eventually consistent","Binary Aware, Structured, Efficient","Balanced, Accessible, Secure, Extensible"],1,"BASE: Basically Available (system appears available most of the time), Soft state (state may change over time without input — eventual consistency), Eventually consistent (given no new updates, data will eventually become consistent). BASE contrasts with ACID.",2],["dbms","Introduction to NoSQL Databases","NoSQL Features · Structured/Unstructured Data · CAP Theorem · BASE Model · NoSQL Categories","Which type of NoSQL database is Redis an example of?","","",["Document Store","Column-Oriented","Graph Database","Key-Value Store"],3,"Redis is a Key-Value store — data is stored as key-value pairs with extremely fast in-memory access. Other key-value stores: Amazon DynamoDB, Riak. Document stores: MongoDB, CouchDB. Column-oriented: Cassandra. Graph: Neo4j.",3],["dbms","Introduction to NoSQL Databases","NoSQL Features · Structured/Unstructured Data · CAP Theorem · BASE Model · NoSQL Categories","What is semi-structured data?","","",["Data with a strictly defined schema","Data that doesn't conform to a rigid schema but has some organizational structure (tags, markers)","Data stored only in memory","Data with exactly half the fields NULL"],1,"Semi-structured data has some organizational structure (self-describing with tags/markers) but doesn't conform to a rigid relational schema. Examples: JSON, XML, YAML. Unlike structured data (tables) or unstructured data (plain text, images, videos).",4],["dbms","Introduction to NoSQL Databases","NoSQL Features · Structured/Unstructured Data · CAP Theorem · BASE Model · NoSQL Categories","Which NoSQL database type is best for social network relationship analysis?","","",["Key-Value Store","Document Store","Column-Oriented Database","Graph Database"],3,"Graph databases store data as nodes (entities) and edges (relationships with properties). They excel at traversing complex relationships — social networks (friends of friends), recommendation engines, fraud detection, and knowledge graphs.",5],["dbms","Introduction to NoSQL Databases","NoSQL Features · Structured/Unstructured Data · CAP Theorem · BASE Model · NoSQL Categories","What is a Document Store database?","","",["A database for storing Word documents and PDFs","A NoSQL database that stores data as semi-structured documents (JSON/BSON)","A key-value store with large values","A database organized by rows and columns"],1,"Document stores (MongoDB, CouchDB) store data as documents (typically JSON/BSON). Each document can have a different structure (schema-flexible). Documents are grouped in collections. This is different from a column-family or key-value store.",6],["dbms","Introduction to NoSQL Databases","NoSQL Features · Structured/Unstructured Data · CAP Theorem · BASE Model · NoSQL Categories","What advantage does a Column-Oriented database have over a row-oriented database for analytics?","","",["Faster for individual row lookups","Faster for aggregate queries on specific columns (reads only relevant columns, not entire rows)","Better for OLTP transactions","Smaller total storage size"],1,"Column-oriented databases (Cassandra, HBase) store each column separately. For analytics (SELECT avg(salary), SUM(revenue)), only the relevant column's data is read — much faster than reading entire rows. Row-oriented is better for OLTP (full row access).",7],["dbms","Introduction to NoSQL Databases","NoSQL Features · Structured/Unstructured Data · CAP Theorem · BASE Model · NoSQL Categories","Which choice does a CP system make according to CAP theorem?","","",["Consistency + Availability (sacrifices Partition tolerance)","Consistency + Partition tolerance (sacrifices Availability during partitions)","Availability + Partition tolerance (sacrifices Consistency)","All three equally"],1,"CP (Consistency + Partition tolerance) systems sacrifice Availability during network partitions — if nodes can't communicate, the system refuses to answer rather than returning potentially inconsistent data. Examples: HBase, MongoDB (in some configs), Zookeeper.",8],["dbms","Introduction to NoSQL Databases","NoSQL Features · Structured/Unstructured Data · CAP Theorem · BASE Model · NoSQL Categories","What makes NoSQL databases 'schema-flexible'?","","",["They don't store any data structure information","Documents/records in the same collection can have different fields without a predefined schema","They automatically convert all data to strings","They use dynamic SQL generation"],1,"NoSQL databases are schema-flexible (schema-less): documents in the same collection can have different fields. You can add new fields without altering a schema. This is ideal for evolving data structures but requires application-level validation.",9],["dbms","Introduction to NoSQL Databases","NoSQL Features · Structured/Unstructured Data · CAP Theorem · BASE Model · NoSQL Categories","What is horizontal scaling (scale-out)?","","",["Adding more CPU/RAM to an existing server","Adding more servers to distribute the load","Increasing disk storage on one server","Upgrading the database software version"],1,"Horizontal scaling (scale-out): adding more servers/nodes to distribute data and load. NoSQL databases are designed for this. Vertical scaling (scale-up): upgrading hardware of existing server (more RAM/CPU). Horizontal scaling is generally cheaper and more fault-tolerant.",10],["dbms","MongoDB","MongoDB Features · CRUD · Documents · Collections · Operators · Indexing","In MongoDB, what is the equivalent of a table in RDBMS?","","",["Document","Schema","Collection","Record"],2,"RDBMS to MongoDB analogies: Table → Collection, Row/Record → Document, Column → Field, Primary Key → _id field. A collection is a group of MongoDB documents (analogous to rows). Collections don't enforce a fixed schema.",1],["dbms","MongoDB","MongoDB Features · CRUD · Documents · Collections · Operators · Indexing","What is BSON in MongoDB?","","",["A query language for MongoDB","Binary JSON — the binary-encoded format MongoDB uses to store documents","A type of MongoDB index","A MongoDB command-line tool"],1,"BSON (Binary JSON) is MongoDB's internal storage format. It extends JSON with additional types: Date, ObjectId, Binary, Int32, Int64, Decimal128. BSON is more space-efficient and faster to parse than text JSON.",2],["dbms","MongoDB","MongoDB Features · CRUD · Documents · Collections · Operators · Indexing","What is the _id field in MongoDB?","","",["An optional user-defined field","A mandatory unique identifier for every document (auto-generated as ObjectId if not provided)","The first field in every document","An index on the first field"],1,"Every MongoDB document must have an _id field — it is the primary key. If not provided on insert, MongoDB auto-generates a 12-byte ObjectId. The _id must be unique within a collection. A unique index is automatically created on _id.",3],["dbms","MongoDB","MongoDB Features · CRUD · Documents · Collections · Operators · Indexing","Which MongoDB command inserts a single document into a collection?","","",["db.collection.add({...})","db.collection.insertOne({...})","db.collection.create({...})","db.collection.push({...})"],1,"db.collection.insertOne({doc}) inserts a single document. db.collection.insertMany([{doc1}, {doc2}]) inserts multiple documents. The old db.collection.insert() still works but is deprecated. Always use insertOne/insertMany.",4],["dbms","MongoDB","MongoDB Features · CRUD · Documents · Collections · Operators · Indexing","Which MongoDB command finds all documents where age is greater than 25?","","",["db.col.find({age: > 25})","db.col.find({age: {$gt: 25}})","db.col.find(age > 25)","db.col.select({age: {gt: 25}})"],1,"MongoDB query operators use $ prefix: $gt (greater than), $lt (less than), $gte (>=), $lte (<=), $ne (not equal), $eq (equal). Syntax: {field: {$operator: value}}. Example: db.users.find({age: {$gt: 25}}) — finds users older than 25.",5],["dbms","MongoDB","MongoDB Features · CRUD · Documents · Collections · Operators · Indexing","What is UPSERT in MongoDB?","","",["Update and Restart operation","A combined update that inserts a new document if no matching document exists","Delete and re-insert a document","Update all fields simultaneously"],1,"UPSERT = Update + Insert. If a matching document exists, update it; if not, insert a new one. In MongoDB: db.col.updateOne(filter, update, {upsert: true}). Prevents duplicate key errors when you're unsure if a document exists.",6],["dbms","MongoDB","MongoDB Features · CRUD · Documents · Collections · Operators · Indexing","Which MongoDB operator is used to update a specific field value?","","",["$set","$update","$modify","$change"],0,"$set is MongoDB's update operator: db.col.updateOne({_id: 1}, {$set: {name: 'Alice'}}). It modifies only the specified field(s) without affecting others. $unset removes a field. $inc increments a numeric field. $push adds to an array.",7],["dbms","MongoDB","MongoDB Features · CRUD · Documents · Collections · Operators · Indexing","What does db.collection.find().sort({age: -1}) do?","","",["Sorts by age in ascending order","Sorts by age in descending order","Removes the age field","Finds documents with age = -1"],1,"In MongoDB's sort(), 1 means ascending, -1 means descending. sort({age: -1}) sorts documents from highest to lowest age. sort({age: 1}) sorts ascending. You can sort by multiple fields: sort({dept: 1, age: -1}).",8],["dbms","MongoDB","MongoDB Features · CRUD · Documents · Collections · Operators · Indexing","What is a MongoDB Index and why is it useful?","","",["A JSON field that stores metadata","A data structure that improves query performance by allowing efficient data retrieval","A reference from one document to another","A collection-level schema validator"],1,"MongoDB indexes (like RDBMS indexes) are special data structures (B-Tree by default) that store a small portion of collection data in sorted order. They dramatically improve query performance. Without indexes, MongoDB does a full collection scan (COLLSCAN).",9],["dbms","MongoDB","MongoDB Features · CRUD · Documents · Collections · Operators · Indexing","What does the $lookup operator do in MongoDB aggregation?","","",["Searches for a document by _id","Performs a LEFT OUTER JOIN with another collection","Looks up an index definition","Finds the maximum value in a field"],1,"$lookup in the aggregation pipeline performs a LEFT OUTER JOIN with another collection. It adds matching documents from another collection as an embedded array. This is MongoDB's way of joining collections — analogous to SQL's LEFT JOIN.",10],["java","Introduction to Java","Introduction to Java · Features of Java · JVM Architecture · JDK and its Usage · Structure of Java Class ·","Which of the following best describes the 'Write Once, Run Anywhere' (WORA) principle of Java?","","",["Java source code can be reused in multiple projects without modification.","Java bytecode compiled on one platform can run on any platform that has a compatible JVM.","Java programs do not require recompilation when migrated to a different OS.","Both B and C"],3,"Java achieves platform independence by compiling source code (.java) into bytecode (.class), which runs on any JVM regardless of the underlying OS. The JVM handles OS-specific execution, so no recompilation is needed on migration — making both B and C correct.",1],["java","Introduction to Java","Introduction to Java · Features of Java · JVM Architecture · JDK and its Usage · Structure of Java Class ·","Which memory area in JVM stores class-level (static) variables and method bytecode?","","",["Heap Memory","Stack Memory","Method Area (Metaspace)","Program Counter Register"],2,"The Method Area (called Metaspace from Java 8 onwards) stores class-level data including static variables, constant pool, method bytecodes, and field/method information. Heap is for objects; Stack is for method frames; PC Register tracks current instruction.",2],["java","Introduction to Java","Introduction to Java · Features of Java · JVM Architecture · JDK and its Usage · Structure of Java Class ·","What is the correct order of Java program execution stages?","","",["Source Code → JVM → Bytecode → JIT → Machine Code","Source Code → Compiler (javac) → Bytecode → JVM → Machine Code","Source Code → JDK → JRE → Bytecode → Machine Code","Source Code → Bytecode → Compiler → JVM → Machine Code"],1,"The javac compiler converts .java source files to .class bytecode files. The JVM then interprets or JIT-compiles the bytecode into platform-specific machine code at runtime. JDK contains javac; JRE contains JVM.",3],["java","Introduction to Java","Introduction to Java · Features of Java · JVM Architecture · JDK and its Usage · Structure of Java Class ·","Which of the following is NOT a feature of Java?","","",["Platform Independence","Pointers for direct memory access","Automatic Garbage Collection","Multithreading support"],1,"Java deliberately eliminated explicit pointer manipulation (a C/C++ feature) to improve security and robustness. Java uses references instead of raw pointers. All other options — platform independence, garbage collection, and multithreading — are core Java features.",4],["java","Introduction to Java","Introduction to Java · Features of Java · JVM Architecture · JDK and its Usage · Structure of Java Class ·","What is the difference between JDK, JRE, and JVM?","","",["JDK ⊃ JRE ⊃ JVM (JDK includes JRE which includes JVM)","JVM ⊃ JRE ⊃ JDK","They are three independent tools with no containment relationship","JRE ⊃ JDK ⊃ JVM"],0,"JVM is the runtime engine executing bytecode. JRE = JVM + core libraries needed to run Java programs. JDK = JRE + development tools (javac compiler, javadoc, jdb debugger, etc.). So JDK is the superset required for developing Java applications.",5],["java","Introduction to Java","Introduction to Java · Features of Java · JVM Architecture · JDK and its Usage · Structure of Java Class ·","What is the default value of a primitive `boolean` instance variable in Java?","","",["null","0","false","true"],2,"Java automatically initializes instance (and static) variables to default values. boolean → false, int/short/byte/long → 0, float/double → 0.0, char → '\\u0000', reference types → null. Local variables are NOT initialized by default.",6],["java","Introduction to Java","Introduction to Java · Features of Java · JVM Architecture · JDK and its Usage · Structure of Java Class ·","Which primitive data type in Java is used to store a single 16-bit Unicode character?","","",["byte","short","char","int"],2,"char is a 16-bit unsigned primitive type representing a Unicode character (range: '\\u0000' to '\\uffff'). Unlike C/C++, Java's char is 2 bytes to support full Unicode. It can hold values 0–65535.",7],["java","Introduction to Java","Introduction to Java · Features of Java · JVM Architecture · JDK and its Usage · Structure of Java Class ·","What is the size and range of the `long` primitive data type in Java?","","",["32-bit; -2^31 to 2^31-1","64-bit; -2^63 to 2^63-1","64-bit; 0 to 2^64-1","32-bit; -2^32 to 2^32-1"],1,"long is a 64-bit signed two's complement integer. Its range is -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807. long literals are suffixed with 'L' (e.g., 100L). int is 32-bit with range -2^31 to 2^31-1.",8],["java","Introduction to Java","Introduction to Java · Features of Java · JVM Architecture · JDK and its Usage · Structure of Java Class ·","Given the following code, which component of JVM is responsible for loading the class `Hello`? `java Hello`","","",["Execution Engine","Class Loader Subsystem","Garbage Collector","JIT Compiler"],1,"The Class Loader Subsystem is responsible for Loading, Linking (verification, preparation, resolution), and Initialization of classes. When you run 'java Hello', the Bootstrap ClassLoader or Application ClassLoader locates and loads Hello.class into Method Area.",9],["java","Introduction to Java","Introduction to Java · Features of Java · JVM Architecture · JDK and its Usage · Structure of Java Class ·","What will happen if a Java source file contains two public classes?","public class A { }\npublic class B { }","",["Both classes compile successfully into separate .class files","Compilation error: a file can have only one public class, and the filename must match it","Runtime error when both classes are instantiated","Only class A compiles; class B is ignored"],1,"Java enforces that a source file can contain at most one public class, and the filename must exactly match that public class name. Having two public classes in one file causes a compile-time error. Non-public classes can coexist in the same file but this is discouraged.",10],["java","Basic Programming Concepts","Java Tokens · Variables & Methods · Data Type Compatibility · Operators · Control Statements · 1-D &","Which of the following is NOT a valid Java token category?","","",["Identifier","Literal","Pointer","Operator"],2,"Java tokens are the smallest meaningful units: Keywords, Identifiers, Literals, Operators, Separators, and Comments. 'Pointer' is not a token category because Java does not support pointers. This is a key difference from C/C++.",1],["java","Basic Programming Concepts","Java Tokens · Variables & Methods · Data Type Compatibility · Operators · Control Statements · 1-D &","What is the output of the following code?","int x = 5;\nSystem.out.println(x++ + ++x);","",["10","11","12","13"],2,"x++ uses the current value (5) then increments x to 6. ++x pre-increments x from 6 to 7, then uses 7. So the expression evaluates to 5 + 7 = 12. Post-increment returns original value; pre-increment returns incremented value.",2],["java","Basic Programming Concepts","Java Tokens · Variables & Methods · Data Type Compatibility · Operators · Control Statements · 1-D &","Which implicit (widening) conversion is NOT automatically performed by Java?","","",["int to long","float to double","double to float","byte to int"],2,"Java performs automatic widening conversions (smaller → larger type): byte→short→int→long→float→double. Narrowing conversions (larger → smaller, e.g. double to float) require an explicit cast because data loss may occur.",3],["java","Basic Programming Concepts","Java Tokens · Variables & Methods · Data Type Compatibility · Operators · Control Statements · 1-D &","What does the following ternary expression evaluate to?","int a = 10, b = 20;\nint result = (a > b) ? a : b;\nSystem.out.println(result);","",["10","20","0","Compilation error"],1,"The ternary operator ?: evaluates the condition (a > b), which is false (10 > 20 is false). Therefore it returns the false-branch value: b = 20. The ternary operator is a shorthand for if-else.",4],["java","Basic Programming Concepts","Java Tokens · Variables & Methods · Data Type Compatibility · Operators · Control Statements · 1-D &","What is the output of the following switch statement?","int x = 2;\nswitch(x) {\ncase 1: System.out.print(\"One\");\ncase 2: System.out.print(\"Two\");\ncase 3: System.out.print(\"Three\");\ndefault: System.out.print(\"Default\");\n}","",["Two","TwoThree","TwoThreeDefault","Default"],2,"Without break statements, Java's switch falls through all subsequent cases after a match. x=2 matches case 2, then execution falls through case 3 and default, printing 'TwoThreeDefault'. Always use break to prevent fall-through unless intentional.",5],["java","Basic Programming Concepts","Java Tokens · Variables & Methods · Data Type Compatibility · Operators · Control Statements · 1-D &","Which loop is guaranteed to execute its body at least once?","","",["for loop","while loop","do-while loop","enhanced for loop"],2,"The do-while loop evaluates its condition AFTER executing the body, ensuring at least one execution. for and while loops check the condition before the first iteration, so they may execute zero times. Enhanced for (for-each) also checks collection first.",6],["java","Basic Programming Concepts","Java Tokens · Variables & Methods · Data Type Compatibility · Operators · Control Statements · 1-D &","What is the output of this code snippet?","int[] arr = new int[5];\nSystem.out.println(arr[0] + \" \" + arr.length);","",["null 5","0 5","0 4","Compilation Error"],1,"new int[5] creates an array of 5 integers, all initialized to default value 0. arr[0] is 0. arr.length is 5 (not 4 — length is the total capacity, index runs 0–4). Note: length is a field, not a method, for arrays.",7],["java","Basic Programming Concepts","Java Tokens · Variables & Methods · Data Type Compatibility · Operators · Control Statements · 1-D &","What happens when you access an array index out of bounds in Java?","int[] arr = {1, 2, 3};\nSystem.out.println(arr[5]);","",["Compile-time error","Returns 0 (default value)","Throws ArrayIndexOutOfBoundsException at runtime","Returns null"],2,"Java performs runtime bounds checking on arrays. Accessing index 5 on a 3-element array (valid indices: 0–2) throws ArrayIndexOutOfBoundsException. This is a safety feature that prevents buffer overflows (a common C/C++ vulnerability).",8],["java","Basic Programming Concepts","Java Tokens · Variables & Methods · Data Type Compatibility · Operators · Control Statements · 1-D &","How do you correctly declare and initialize a 2D array in Java with 3 rows and 4 columns?","","",["int arr[3][4] = new int;","int[][] arr = new int[3][4];","int arr = new int[3,4];","int[3][4] arr = new int[][];"],1,"The correct syntax for a 2D array declaration is: type[][] varName = new type[rows][cols]. Java arrays are actually arrays of arrays (jagged arrays are possible). int[][] is the preferred style over int arr[][].",9],["java","Basic Programming Concepts","Java Tokens · Variables & Methods · Data Type Compatibility · Operators · Control Statements · 1-D &","What is the result of the following bitwise operation?","int a = 6; // binary: 0110\nint b = 3; // binary: 0011\nSystem.out.println(a & b);\nSystem.out.println(a | b);\nSystem.out.println(a ^ b);","",["2, 7, 5","3, 6, 5","2, 7, 4","3, 7, 5"],0,"Bitwise AND (&): 0110 & 0011 = 0010 = 2. Bitwise OR (|): 0110 | 0011 = 0111 = 7. Bitwise XOR (^): 0110 ^ 0011 = 0101 = 5. XOR returns 1 only when bits differ.",10],["java","Object Oriented Programming Concepts","Introduction to OOP · Classes & Objects · Encapsulation · Abstraction · Inheritance · Polymorphism","Which OOP principle is demonstrated when a class hides its internal data using private fields and exposes only public methods?","","",["Abstraction","Encapsulation","Inheritance","Polymorphism"],1,"Encapsulation bundles data (fields) and behavior (methods) together while restricting direct access to internal state. It is achieved using access modifiers (private fields + public getters/setters). Abstraction hides complexity; Encapsulation hides data.",1],["java","Object Oriented Programming Concepts","Introduction to OOP · Classes & Objects · Encapsulation · Abstraction · Inheritance · Polymorphism","What is the output of the following code?","class Animal {\nvoid sound() { System.out.println(\"Generic Sound\"); }\n}\nclass Dog extends Animal {\nvoid sound() { System.out.println(\"Bark\"); }\n}\npublic class Test {\npublic static void main(String[] args) {\nAnimal a = new Dog();\na.sound();\n}\n}","",["Generic Sound","Bark","Compilation Error","Runtime Error"],1,"This demonstrates Runtime Polymorphism (dynamic dispatch). Although the reference type is Animal, the actual object is Dog. JVM resolves the method call at runtime based on the actual object type, so Dog's sound() is called — this is method overriding.",2],["java","Object Oriented Programming Concepts","Introduction to OOP · Classes & Objects · Encapsulation · Abstraction · Inheritance · Polymorphism","Which of the following correctly distinguishes Abstraction from Encapsulation?","","",["Abstraction focuses on hiding implementation details; Encapsulation focuses on hiding data","They are the same concept with different names","Abstraction uses private fields; Encapsulation uses abstract classes","Abstraction is a compile-time concept; Encapsulation is a runtime concept"],0,"Abstraction = 'what an object does' (hiding HOW it works, exposing only the interface) via abstract classes and interfaces. Encapsulation = 'data protection' (hiding WHAT data it holds) via access modifiers. Both reduce complexity but address different concerns.",3],["java","Object Oriented Programming Concepts","Introduction to OOP · Classes & Objects · Encapsulation · Abstraction · Inheritance · Polymorphism","How many objects are created in memory by the following statement?","Animal a1 = new Dog();\nAnimal a2 = new Dog();","",["1","2","3","4"],1,"Each 'new' keyword creates one object on the heap. Two 'new Dog()' calls create 2 Dog objects. a1 and a2 are reference variables (stored on the stack) pointing to these objects. References are not objects — they are pointers to objects.",4],["java","Object Oriented Programming Concepts","Introduction to OOP · Classes & Objects · Encapsulation · Abstraction · Inheritance · Polymorphism","Which keyword is used to create an object in Java?","","",["create","object","new","alloc"],2,"The 'new' keyword allocates memory on the heap for a new object and invokes the constructor to initialize it. It returns a reference to the newly created object. Unlike C++, Java has no delete keyword — memory is managed by the garbage collector.",5],["java","Object Oriented Programming Concepts","Introduction to OOP · Classes & Objects · Encapsulation · Abstraction · Inheritance · Polymorphism","Which of the following is NOT an OOP principle?","","",["Encapsulation","Compilation","Inheritance","Polymorphism"],1,"The four fundamental OOP principles are: Encapsulation, Abstraction, Inheritance, and Polymorphism (EAIP). Compilation is a process of converting source code to bytecode, not an OOP principle.",6],["java","Object Oriented Programming Concepts","Introduction to OOP · Classes & Objects · Encapsulation · Abstraction · Inheritance · Polymorphism","In Java, a class can directly inherit from how many classes?","","",["Multiple classes (like C++)","Only one class","Only two classes","Unlimited classes"],1,"Java supports single inheritance for classes — a class can only extend one superclass. This avoids the 'diamond problem' of C++. Multiple inheritance is supported through interfaces (a class can implement multiple interfaces).",7],["java","Object Oriented Programming Concepts","Introduction to OOP · Classes & Objects · Encapsulation · Abstraction · Inheritance · Polymorphism","What is the default parent class of every Java class?","","",["Class","Object","Base","Root"],1,"Every Java class implicitly extends java.lang.Object if no explicit superclass is defined. Object provides fundamental methods: toString(), equals(), hashCode(), getClass(), clone(), finalize(), wait(), notify(), notifyAll().",8],["java","Object Oriented Programming Concepts","Introduction to OOP · Classes & Objects · Encapsulation · Abstraction · Inheritance · Polymorphism","Which type of polymorphism is achieved through method overloading?","","",["Runtime polymorphism (Dynamic dispatch)","Compile-time polymorphism (Static binding)","Interface polymorphism","Abstract polymorphism"],1,"Method overloading is resolved at compile time based on method signature (name + parameter types/count). This is compile-time/static polymorphism. Method overriding is resolved at runtime based on actual object type — runtime/dynamic polymorphism.",9],["java","Object Oriented Programming Concepts","Introduction to OOP · Classes & Objects · Encapsulation · Abstraction · Inheritance · Polymorphism","Which of the following best represents 'IS-A' and 'HAS-A' relationships?","class Engine { }\nclass Car extends Vehicle {\nEngine engine = new Engine();\n}","",["Car IS-A Engine; Car HAS-A Vehicle","Car IS-A Vehicle; Car HAS-A Engine","Car HAS-A Vehicle; Vehicle IS-A Engine","No IS-A or HAS-A relationship exists"],1,"Inheritance (extends) establishes IS-A: Car IS-A Vehicle. Composition/Aggregation (containing a reference) establishes HAS-A: Car HAS-A Engine. IS-A uses inheritance; HAS-A uses association/composition.",10],["java","Static Variables, Methods & Reference Types","Static Variables & Methods · Reference Data Types · Primitive vs Reference · Static vs Reference Variables","What is the key characteristic of a static variable in Java?","","",["Each object gets its own copy","It is shared among all instances of a class","It can only be accessed inside the class","It is stored on the stack memory"],1,"Static variables (class variables) belong to the class, not to any instance. Only one copy exists in the Method Area (Metaspace), shared by all objects. Instance variables, in contrast, have separate copies per object stored in the heap.",1],["java","Static Variables, Methods & Reference Types","Static Variables & Methods · Reference Data Types · Primitive vs Reference · Static vs Reference Variables","What is the output of the following code?","class Counter {\nstatic int count = 0;\nCounter() { count++; }\n}\npublic class Test {\npublic static void main(String[] args) {\nCounter c1 = new Counter();\nCounter c2 = new Counter();\nCounter c3 = new Counter();\nSystem.out.println(Counter.count);\n}\n}","",["0","1","3","Compilation Error"],2,"static int count is shared. Each constructor call increments the same count variable. After 3 object creations, count = 3. Notice: Counter.count is accessed via class name (recommended for static members), not through an object reference.",2],["java","Static Variables, Methods & Reference Types","Static Variables & Methods · Reference Data Types · Primitive vs Reference · Static vs Reference Variables","Which of the following statements about static methods is INCORRECT?","","",["Static methods can be called without creating an object","Static methods can access instance variables directly","Static methods can be overloaded","static main method is the entry point of a Java application"],1,"Static methods belong to the class and are called before any object may exist. They cannot directly access instance (non-static) variables or methods because instance members require an object. They can only directly access other static members.",3],["java","Static Variables, Methods & Reference Types","Static Variables & Methods · Reference Data Types · Primitive vs Reference · Static vs Reference Variables","What is the primary difference between primitive data types and reference data types in Java?","","",["Primitives store actual values; references store memory addresses (object locations)","Primitives are stored on heap; references are stored on stack","Primitives can be null; references cannot","Reference types have smaller memory footprint"],0,"Primitives (int, double, char, etc.) store the actual value in the stack. Reference types (objects, arrays, Strings) store a reference (memory address pointing to the heap where the object lives). This is why reference variables can be null — they may not point to any object.",4],["java","Static Variables, Methods & Reference Types","Static Variables & Methods · Reference Data Types · Primitive vs Reference · Static vs Reference Variables","What is the output of this code?","class Test {\nstatic int x = 10;\npublic static void main(String[] args) {\nTest t = null;\nSystem.out.println(t.x);\n}\n}","",["NullPointerException","10","0","Compilation Error"],1,"Although t is null, accessing a static variable through a reference variable does NOT throw NPE. Java resolves static members at compile time based on the declared type (Test), not the actual object. The compiler replaces t.x with Test.x. However, accessing instance members on null WOULD throw NPE.",5],["java","Static Variables, Methods & Reference Types","Static Variables & Methods · Reference Data Types · Primitive vs Reference · Static vs Reference Variables","When can you call a static method of another class without importing it (assuming different package)?","","",["Never — you always need to import","Using the fully qualified class name: ClassName.methodName()","Only if the method is public","Static methods cannot be called from other classes"],1,"Static methods can be called using ClassName.methodName() with the fully qualified name (packageName.ClassName.methodName()) without import. Import statements are just shortcuts that allow you to use the simple class name. Public access is still required.",6],["java","Static Variables, Methods & Reference Types","Static Variables & Methods · Reference Data Types · Primitive vs Reference · Static vs Reference Variables","What is the default value of a reference variable that is declared as an instance variable but not initialized?","","",["0","empty string \"\"","null","undefined"],2,"Uninitialized instance reference variables default to null in Java. null means the reference doesn't point to any object. Attempting to use a null reference (e.g., calling a method on it) throws a NullPointerException.",7],["java","Static Variables, Methods & Reference Types","Static Variables & Methods · Reference Data Types · Primitive vs Reference · Static vs Reference Variables","Which of the following correctly accesses a static method from another class?","class MathUtil {\npublic static int square(int n) { return n * n; }\n}","",["MathUtil mu = new MathUtil(); mu.square(5);","MathUtil.square(5);","new MathUtil.square(5);","Both A and B"],3,"Static methods can be called via ClassName.methodName() (recommended) OR through an object reference (not recommended but valid Java). Both compile and work. However, calling static methods via instance reference generates a warning in IDEs as it's misleading.",8],["java","Static Variables, Methods & Reference Types","Static Variables & Methods · Reference Data Types · Primitive vs Reference · Static vs Reference Variables","In which memory area are static variables stored in Java?","","",["Heap Memory","Stack Memory","Method Area / Metaspace","Native Method Stack"],2,"Static variables are class-level data stored in the Method Area (Metaspace in Java 8+). The heap stores object instances. The stack stores local variables and method call frames. Static variables are created when the class is loaded and destroyed when it's unloaded.",9],["java","Static Variables, Methods & Reference Types","Static Variables & Methods · Reference Data Types · Primitive vs Reference · Static vs Reference Variables","What is the output of the following?","class A {\nint x = 10;\nstatic int y = 20;\n}\npublic class Test {\npublic static void main(String[] args) {\nA a1 = new A();\nA a2 = new A();\na1.x = 100;\na1.y = 200;\nSystem.out.println(a2.x + \" \" + a2.y);\n}\n}","",["10 20","100 200","10 200","100 20"],2,"x is an instance variable — each object has its own copy. Changing a1.x to 100 doesn't affect a2.x (still 10). y is static — shared by all instances. Changing a1.y to 200 affects the class-level y, so a2.y is also 200.",10],["java","Constructors, Pass by Value vs Reference & Memory","Constructors · Initializing Reference Variables · Pass by Value vs Reference · Re-assigning References · Heap","What is the purpose of a constructor in Java?","","",["To destroy an object after use","To initialize an object when it is created","To declare static variables","To define the class structure"],1,"A constructor is a special method called automatically when an object is created using 'new'. It initializes the object's state. Constructors have the same name as the class and no return type (not even void). If not defined, Java provides a default no-arg constructor.",1],["java","Constructors, Pass by Value vs Reference & Memory","Constructors · Initializing Reference Variables · Pass by Value vs Reference · Re-assigning References · Heap","Which statement about Java's argument passing is CORRECT?","","",["Java passes objects by reference","Java is strictly pass-by-value for all types","Java passes primitives by reference and objects by value","Java uses pass-by-reference for reference types"],1,"Java is ALWAYS pass-by-value. For primitives, the value itself is copied. For objects, the VALUE of the reference (memory address) is copied — not the object itself. This means you can modify the object's contents but cannot make the original reference variable point to a new object.",2],["java","Constructors, Pass by Value vs Reference & Memory","Constructors · Initializing Reference Variables · Pass by Value vs Reference · Re-assigning References · Heap","What is the output of the following code?","class Box {\nint size;\n}\nvoid changeSize(Box b) {\nb.size = 100; // modifies object\nb = new Box(); // re-assigns local copy\nb.size = 999;\n}\n// In main:\nBox box = new Box();\nbox.size = 10;\nchangeSize(box);\nSystem.out.println(box.size);","",["10","100","999","0"],1,"The reference value is copied to parameter b. b.size=100 modifies the original object (both box and b point to same object). Then b=new Box() creates a new object and makes the LOCAL copy b point to it — but box still points to the original. So box.size = 100.",3],["java","Constructors, Pass by Value vs Reference & Memory","Constructors · Initializing Reference Variables · Pass by Value vs Reference · Re-assigning References · Heap","Where are local variables and method call information stored in JVM?","","",["Heap Memory","Stack Memory","Method Area","PC Register"],1,"Stack memory stores: method call frames, local variables (including primitive values), and reference variable names (but the actual object is on the heap). Each thread has its own stack. Stack is LIFO — frames are pushed on method call and popped on return.",4],["java","Constructors, Pass by Value vs Reference & Memory","Constructors · Initializing Reference Variables · Pass by Value vs Reference · Re-assigning References · Heap","What is a default constructor?","","",["A constructor with default parameter values","A no-argument constructor automatically provided by the compiler if no constructor is defined","A constructor that sets all fields to default values explicitly","The first constructor defined in a class"],1,"If you don't define ANY constructor, Java compiler inserts a default no-arg constructor. However, if you define any constructor (even a parameterized one), the compiler no longer provides the default. You must explicitly define the no-arg constructor if needed alongside parameterized ones.",5],["java","Constructors, Pass by Value vs Reference & Memory","Constructors · Initializing Reference Variables · Pass by Value vs Reference · Re-assigning References · Heap","What happens to a constructor's return type in Java?","","",["It returns the class type implicitly","It must be declared void","Constructors have no return type declaration at all","It returns an int (0 for success)"],2,"Constructors are unique in that they have NO return type — not even void. If you add a return type (even void), it becomes a regular method, not a constructor. The compiler identifies constructors by same name as class AND absence of a return type.",6],["java","Constructors, Pass by Value vs Reference & Memory","Constructors · Initializing Reference Variables · Pas
