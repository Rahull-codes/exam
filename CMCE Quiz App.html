structor ~A() runs, printing 'D'. Output is 'CD'. Destructor is always called in reverse order of construction.",4],["cpp","Constructors and Destructor","Constructors · Parameterized · Multiple Constructors · Copy Constructor · Destructor · Inner Class","Which of the following is TRUE about destructors in C++?","","",["Destructors can be overloaded","Destructors take parameters","A class can have only one destructor","Destructors have a return type"],2,"A class can have exactly ONE destructor. It cannot be overloaded (no parameters allowed), has no return type, and its name is the class name prefixed with ~. It is called automatically when the object goes out of scope or is deleted.",5],["cpp","Constructors and Destructor","Constructors · Parameterized · Multiple Constructors · Copy Constructor · Destructor · Inner Class","What is dynamic initialization of objects?","","",["Initializing objects using default constructor only","Initializing objects at runtime using values computed during program execution","Using static members to initialize objects","Creating objects using new keyword"],1,"Dynamic initialization means the initial values for objects are determined at runtime (e.g., from user input or computed values), not compile-time. Constructors support this by accepting arguments when creating objects dynamically.",6],["cpp","Constructors and Destructor","Constructors · Parameterized · Multiple Constructors · Copy Constructor · Destructor · Inner Class","What is a constructor initializer list used for?","","",["To call functions before construction","To initialize member variables before the constructor body executes","To destroy objects","To overload the constructor"],1,"Initializer lists (ClassName() : member(value) { }) initialize members before the constructor body runs. Required for: const members, reference members, and base class constructors. More efficient than assignment inside the body.",7],["cpp","Constructors and Destructor","Constructors · Parameterized · Multiple Constructors · Copy Constructor · Destructor · Inner Class","If no constructor is defined, C++ provides which constructor automatically?","","",["Parameterized constructor","Copy constructor and default constructor","Only the destructor","Static constructor"],1,"If no constructor is defined, C++ automatically provides: a default constructor (no arguments) and a copy constructor (member-wise copy). If you define ANY constructor, the compiler no longer provides the default constructor automatically.",8],["cpp","Constructors and Destructor","Constructors · Parameterized · Multiple Constructors · Copy Constructor · Destructor · Inner Class","What is a shallow copy versus a deep copy in context of copy constructors?","","",["Shallow copies pointer addresses; deep copy copies the actual data pointed to","Deep copy copies pointer addresses; shallow copy copies actual data","Both copy pointer addresses","Both copy actual data"],0,"Shallow copy (default) copies pointer values — both objects point to same memory (dangerous if one deletes it). Deep copy allocates new memory and copies the actual data, making the new object fully independent. Deep copy must be implemented manually.",9],["cpp","Constructors and Destructor","Constructors · Parameterized · Multiple Constructors · Copy Constructor · Destructor · Inner Class","What is an inner class (nested class) in C++?","","",["A class defined inside another class","A class derived from another class","A class with only private members","A class with no constructors"],0,"A nested (inner) class is a class defined inside another class. The inner class has access to the outer class's static members but not the outer class's object members (unless passed explicitly). It is useful for helper/implementation classes.",10],["cpp","Inheritance – Extending Classes","Single · Multiple · Multilevel · Hierarchical · Hybrid Inheritance · Virtual Base Class","What is single inheritance?","","",["A class derived from multiple base classes","A class derived from exactly one base class","A class that cannot be inherited","A class with a single member"],1,"Single inheritance means a derived class inherits from exactly one base class. Example: class B : public A { }; This is the simplest form of inheritance and the most commonly used.",1],["cpp","Inheritance – Extending Classes","Single · Multiple · Multilevel · Hierarchical · Hybrid Inheritance · Virtual Base Class","What is the 'diamond problem' in C++ inheritance?","","",["A class inheriting from two classes that share a common base class","A class with four levels of inheritance","Multiple overloaded constructors","Circular class definitions"],0,"The diamond problem occurs when class D inherits from B and C, both of which inherit from A. D gets two copies of A's members — causing ambiguity. C++ solves this using virtual base classes: class B : virtual public A;",2],["cpp","Inheritance – Extending Classes","Single · Multiple · Multilevel · Hierarchical · Hybrid Inheritance · Virtual Base Class","Which inheritance access mode makes public members of base class become private in the derived class?","","",["public","protected","private","restricted"],2,"With private inheritance (class D : private B), all public and protected members of B become private in D. With protected inheritance, they become protected. With public inheritance, they retain their access level.",3],["cpp","Inheritance – Extending Classes","Single · Multiple · Multilevel · Hierarchical · Hybrid Inheritance · Virtual Base Class","In multilevel inheritance A→B→C, when an object of C is created, the constructor call order is?","","",["C→B→A","A→B→C","B→A→C","Random"],1,"In multilevel inheritance, constructors are called from the most base class upward: A's constructor first, then B's, then C's. Destructors are called in reverse order: C→B→A. This ensures proper initialization of base parts first.",4],["cpp","Inheritance – Extending Classes","Single · Multiple · Multilevel · Hierarchical · Hybrid Inheritance · Virtual Base Class","What is a virtual base class used for?","","",["To make all member functions virtual","To prevent a class from being instantiated","To prevent duplicate copies of a base class in multiple inheritance","To enable runtime polymorphism"],2,"Virtual base classes solve the diamond problem. When a base class is declared virtual (class B : virtual public A), only ONE shared copy of A's members exists in derived classes, preventing ambiguity in multiple inheritance scenarios.",5],["cpp","Inheritance – Extending Classes","Single · Multiple · Multilevel · Hierarchical · Hybrid Inheritance · Virtual Base Class","What is hierarchical inheritance?","","",["One derived class inheriting from multiple base classes","Multiple derived classes inheriting from a single base class","A chain of single inheritance","A class inheriting from itself"],1,"In hierarchical inheritance, multiple derived classes share a single base class. Example: Dog, Cat, Bird all inherit from Animal. This models real-world 'is-a' relationships where multiple types share common characteristics.",6],["cpp","Inheritance – Extending Classes","Single · Multiple · Multilevel · Hierarchical · Hybrid Inheritance · Virtual Base Class","Which of the following is TRUE about the protected access specifier in inheritance?","","",["Protected members are inaccessible in derived classes","Protected members behave like private outside the class but are accessible in derived classes","Protected members are public to all","Protected members can only be accessed via pointers"],1,"Protected members are like private members — inaccessible to outside code — but unlike private, they ARE accessible to derived class member functions. This makes protected the appropriate specifier for members meant to be inherited but not publicly exposed.",7],["cpp","Inheritance – Extending Classes","Single · Multiple · Multilevel · Hierarchical · Hybrid Inheritance · Virtual Base Class","What is hybrid inheritance?","","",["Inheritance between classes in different files","A combination of two or more types of inheritance","Inheriting from abstract classes only","Runtime inheritance"],1,"Hybrid inheritance combines two or more types (e.g., multiple + multilevel). It often leads to the diamond problem, which is resolved using virtual base classes. Hybrid inheritance models complex real-world relationships.",8],["cpp","Inheritance – Extending Classes","Single · Multiple · Multilevel · Hierarchical · Hybrid Inheritance · Virtual Base Class","Can a derived class access private members of its base class directly?","","",["Yes, always","Yes, only through protected keyword","No, private members of the base class are not accessible in the derived class","Only via static methods"],2,"Private members of a base class are NOT accessible in derived classes. Only public and protected members are inherited and accessible in derived classes. This enforces encapsulation even within inheritance hierarchies.",9],["cpp","Inheritance – Extending Classes","Single · Multiple · Multilevel · Hierarchical · Hybrid Inheritance · Virtual Base Class","What is the correct syntax for multiple inheritance in C++?","","",["class C : A, B { };","class C : public A, public B { };","class C extends A, B { };","class C inherits A and B { };"],1,"Multiple inheritance syntax: class C : public A, public B { }; Each base class can have its own access specifier. Without the specifier, it defaults to private. The 'extends' keyword is Java syntax, not C++.",10],["cpp","Polymorphism","Function Overloading · Operator Overloading · Friend Functions · Constant Functions","Which of the following correctly overloads the + operator for a class?","","",["int operator+(int a) { }","Complex operator+(Complex c) { }","void add operator(Complex c) { }","operator Complex +(Complex c) { }"],1,"Operator overloading: return_type operator symbol(parameters). For a Complex class, operator+ returns a Complex and takes a Complex as argument. The 'operator' keyword followed by the symbol defines the overloaded function.",1],["cpp","Polymorphism","Function Overloading · Operator Overloading · Friend Functions · Constant Functions","Which operators CANNOT be overloaded in C++?","","",["+ - * /",":: .* . ?:","<< >> []","== != >= <="],1,"The following operators cannot be overloaded: :: (scope resolution), .* (pointer-to-member), . (member access), ?: (ternary). Most other operators can be overloaded. sizeof and typeid also cannot be overloaded.",2],["cpp","Polymorphism","Function Overloading · Operator Overloading · Friend Functions · Constant Functions","What is a friend function in C++?","","",["A member function of a derived class","A non-member function granted access to private and protected members of a class","A function that calls another function","A static member function"],1,"A friend function is declared with the 'friend' keyword inside a class but is NOT a member function. It has access to all private and protected members. Friend functions are used for operator overloading (like << and >>) requiring access to internals.",3],["cpp","Polymorphism","Function Overloading · Operator Overloading · Friend Functions · Constant Functions","What is a const member function?","","",["A function that returns a constant value","A function that cannot modify any data member of the class","A function declared with const parameters only","A static member function"],1,"A const member function (void display() const) guarantees it will NOT modify any data members of the class. It can be called on const objects. The const appears after the parameter list. Non-const functions cannot be called on const objects.",4],["cpp","Polymorphism","Function Overloading · Operator Overloading · Friend Functions · Constant Functions","What is the output?","void show(int x) { cout << \"int\"; }\nvoid show(double x) { cout << \"double\"; }\nshow(3.14);","",["int","double","Compilation Error","intdouble"],1,"3.14 is a double literal in C++. The compiler selects the best matching overloaded function — show(double x) is the exact match. This is compile-time polymorphism through function overloading.",5],["cpp","Polymorphism","Function Overloading · Operator Overloading · Friend Functions · Constant Functions","Which operator overloading requires the function to be a friend (not a member)?","","",["[]","->","<< (stream insertion)","()"],2,"The << and >> operators are typically overloaded as friend functions because the left operand is ostream/istream (not the class itself). If it were a member function, the class object would need to be on the left side of <<.",6],["cpp","Polymorphism","Function Overloading · Operator Overloading · Friend Functions · Constant Functions","What is compile-time polymorphism achieved through?","","",["Virtual functions","Function overloading and operator overloading","Abstract classes","Dynamic binding"],1,"Compile-time (static) polymorphism is resolved at compile time through function overloading and operator overloading. The compiler determines which function to call based on the arguments. Runtime polymorphism uses virtual functions and is resolved at runtime.",7],["cpp","Polymorphism","Function Overloading · Operator Overloading · Friend Functions · Constant Functions","Can a friend function be inherited?","","",["Yes, always inherited","No, friendship is not inherited","Yes, only with public inheritance","Yes, only if declared in the public section"],1,"Friendship is NOT inherited in C++. If class A declares class B as a friend, B's derived classes do NOT automatically become friends of A. Friendship must be explicitly declared and is not transitive or inherited.",8],["cpp","Polymorphism","Function Overloading · Operator Overloading · Friend Functions · Constant Functions","Overloading the ++ operator as a prefix (++obj) vs postfix (obj++) — how do you distinguish them?","","",["Prefix takes no parameter; postfix takes a dummy int parameter","Prefix takes an int parameter; postfix takes no parameter","Both take the same parameters","Use different function names"],0,"Prefix ++: T operator++() — no parameter. Postfix ++: T operator++(int) — dummy int parameter (the value passed is ignored). The compiler passes 0 for the dummy int. This convention distinguishes the two forms syntactically.",9],["cpp","Polymorphism","Function Overloading · Operator Overloading · Friend Functions · Constant Functions","What is the output?","class Num {\nint x;\npublic:\nNum(int v): x(v){}\nNum operator+(Num b){ return Num(x + b.x); }\nvoid show(){ cout << x; }\n};\nNum a(3), b(4);\n(a+b).show();","",["3","4","7","34"],2,"a+b calls operator+ on a with b as argument. x + b.x = 3 + 4 = 7. A temporary Num object with x=7 is returned. .show() prints 7. This demonstrates operator overloading returning a new object.",10],["cpp","Virtual Functions and Abstract Classes","Runtime Polymorphism · Virtual Functions · Pure Virtual · Casts · Abstract Classes","What keyword is used to declare a virtual function in C++?","","",["abstract","override","virtual","interface"],2,"The virtual keyword before a member function declaration enables runtime polymorphism. When called through a base class pointer/reference, the derived class version is called (dynamic dispatch). Example: virtual void draw();",1],["cpp","Virtual Functions and Abstract Classes","Runtime Polymorphism · Virtual Functions · Pure Virtual · Casts · Abstract Classes","What is a pure virtual function?","","",["A virtual function with an empty body {}","A virtual function assigned = 0, making the class abstract","A virtual function that cannot be overridden","A static virtual function"],1,"A pure virtual function: virtual void draw() = 0; has no implementation in the base class. It forces derived classes to provide an implementation. A class with at least one pure virtual function is an abstract class and cannot be instantiated.",2],["cpp","Virtual Functions and Abstract Classes","Runtime Polymorphism · Virtual Functions · Pure Virtual · Casts · Abstract Classes","What is an abstract class in C++?","","",["A class with all private members","A class with at least one pure virtual function that cannot be instantiated","A class with no member functions","A class that inherits from multiple classes"],1,"An abstract class contains at least one pure virtual function (= 0). It defines an interface — a contract that derived classes must fulfill. Objects of abstract classes cannot be created, but pointers/references to them can be used for polymorphism.",3],["cpp","Virtual Functions and Abstract Classes","Runtime Polymorphism · Virtual Functions · Pure Virtual · Casts · Abstract Classes","What is dynamic_cast used for?","","",["Casting between unrelated types","Safe downcasting in inheritance hierarchies at runtime","Converting int to double","Removing const qualification"],1,"dynamic_cast performs safe runtime downcasting (base class pointer to derived class pointer) in polymorphic class hierarchies. If the cast fails, it returns nullptr (for pointers) or throws std::bad_cast (for references). Requires RTTI.",4],["cpp","Virtual Functions and Abstract Classes","Runtime Polymorphism · Virtual Functions · Pure Virtual · Casts · Abstract Classes","What is static_cast used for?","","",["Runtime type checking","Compile-time type conversion between compatible types","Removing const qualification","Casting between unrelated pointer types"],1,"static_cast performs compile-time type conversions — no runtime checking. Used for: numeric conversions (int to double), upcasting in inheritance, and void* conversions. It is safer than C-style casts but less safe than dynamic_cast.",5],["cpp","Virtual Functions and Abstract Classes","Runtime Polymorphism · Virtual Functions · Pure Virtual · Casts · Abstract Classes","What does const_cast do?","","",["Converts between numeric types","Adds or removes the const/volatile qualifier","Converts base class to derived class","Converts between unrelated pointer types"],1,"const_cast is the only C++ cast that can add or remove const (or volatile) qualification. It is used when you have a const pointer/reference and need to pass it to a function that doesn't accept const. Modifying a truly const object via const_cast is undefined behavior.",6],["cpp","Virtual Functions and Abstract Classes","Runtime Polymorphism · Virtual Functions · Pure Virtual · Casts · Abstract Classes","What is a vptr (virtual pointer) in C++?","","",["A user-defined pointer to a virtual function","A hidden pointer added by the compiler to objects of classes with virtual functions","A pointer to a virtual base class","A smart pointer"],1,"For classes with virtual functions, the compiler adds a hidden vptr (virtual table pointer) to each object. It points to the vtable (virtual table) — a table of function pointers for virtual functions. This enables runtime dispatch (dynamic binding).",7],["cpp","Virtual Functions and Abstract Classes","Runtime Polymorphism · Virtual Functions · Pure Virtual · Casts · Abstract Classes","If a derived class does NOT override a pure virtual function, what happens?","","",["The base class version is called","The derived class also becomes abstract","Compilation succeeds with a warning","The function is ignored"],1,"If a derived class inherits a pure virtual function and does NOT provide an implementation, the derived class also becomes abstract. Objects of that derived class cannot be instantiated. All pure virtual functions must be overridden to make a class concrete.",8],["cpp","Virtual Functions and Abstract Classes","Runtime Polymorphism · Virtual Functions · Pure Virtual · Casts · Abstract Classes","What is the output?","class Base {\npublic:\nvirtual void show() { cout << \"Base\"; }\n};\nclass Der : public Base {\npublic:\nvoid show() { cout << \"Der\"; }\n};\nBase* p = new Der();\np->show();","",["Base","Der","BaseDer","Compilation Error"],1,"p is a Base pointer pointing to a Der object. Because show() is virtual, the call is resolved at runtime based on the actual object type (Der), not the pointer type. Der::show() is called, printing 'Der'. This is runtime polymorphism.",9],["cpp","Virtual Functions and Abstract Classes","Runtime Polymorphism · Virtual Functions · Pure Virtual · Casts · Abstract Classes","What is reinterpret_cast used for?","","",["Safe numeric conversions","Low-level bit-pattern reinterpretation between unrelated pointer types","Removing const from a pointer","Upcasting in inheritance"],1,"reinterpret_cast performs dangerous low-level casts — it reinterprets the bit pattern of a value as another type. Example: casting int* to char*. It is platform-dependent and should be used sparingly. No runtime or compile-time safety checks.",10],["cpp","Exception Handling","throw · try/catch · Re-throwing · Custom Exception Classes","What is the purpose of exception handling in C++?","","",["To speed up program execution","To handle runtime errors gracefully without crashing the program","To catch compile-time errors","To prevent memory leaks"],1,"Exception handling (try-catch-throw) provides a mechanism to detect and handle runtime errors gracefully. Instead of crashing, the program can catch the exception, handle it, and continue or terminate cleanly.",1],["cpp","Exception Handling","throw · try/catch · Re-throwing · Custom Exception Classes","What is the correct order of exception handling keywords?","","",["catch → try → throw","try → throw → catch","throw → catch → try","try → catch → throw"],1,"The flow is: try block contains code that might throw, throw raises an exception, catch block handles it. The throw occurs inside the try block (directly or in called functions) and is caught by the matching catch handler.",2],["cpp","Exception Handling","throw · try/catch · Re-throwing · Custom Exception Classes","What does 'catch(...)' mean in C++?","","",["Catches only integer exceptions","Catches all types of exceptions","Catches pointer exceptions only","Syntax error"],1,"catch(...) is the catch-all handler — it catches any exception regardless of type. It should be the LAST catch block. It's used as a safety net to handle unexpected exception types that don't match earlier specific catch blocks.",3],["cpp","Exception Handling","throw · try/catch · Re-throwing · Custom Exception Classes","What is re-throwing an exception?","","",["Throwing a new exception","Using 'throw;' inside a catch block to propagate the same exception to an outer handler","Ignoring the caught exception","Throwing an integer value"],1,"Re-throwing: inside a catch block, bare 'throw;' (no operand) re-throws the currently caught exception to the next enclosing try-catch. This allows partial handling at one level while propagating to outer handlers.",4],["cpp","Exception Handling","throw · try/catch · Re-throwing · Custom Exception Classes","What happens if an exception is thrown but not caught?","","",["The program continues normally","The exception is silently ignored","std::terminate() is called, typically aborting the program","The exception is automatically handled by the OS"],2,"If an exception propagates out of all try blocks without being caught, std::terminate() is called (which by default calls std::abort()), abruptly ending the program. No stack unwinding occurs after terminate() is called.",5],["cpp","Exception Handling","throw · try/catch · Re-throwing · Custom Exception Classes","How do you create a custom exception class in C++?","","",["By using the exception keyword","By deriving a class from std::exception and overriding what()","By using catch with a user type","Custom exceptions are not supported in C++"],1,"Custom exceptions are created by inheriting from std::exception (or its subclasses like std::runtime_error) and overriding the what() method to return an error message. This integrates with the standard exception hierarchy.",6],["cpp","Exception Handling","throw · try/catch · Re-throwing · Custom Exception Classes","What is the output?","try {\nthrow 42;\n} catch(int e) {\ncout << \"Caught: \" << e;\n}","",["Caught: 42","Error: 42","Compilation Error","Program crashes"],0,"throw 42 throws an int exception with value 42. catch(int e) catches integer exceptions and binds the value to e. The output is 'Caught: 42'. C++ can throw and catch values of any type.",7],["cpp","Exception Handling","throw · try/catch · Re-throwing · Custom Exception Classes","In what order are catch blocks evaluated?","","",["Last to first","First matching block is used (top to bottom)","Most specific to least specific automatically","Alphabetically by exception type"],1,"Catch blocks are evaluated top-to-bottom. The FIRST matching handler is used. Therefore, put more specific catch blocks before more general ones. If catch(...) comes first, it catches everything, making subsequent specific catches unreachable.",8],["cpp","Exception Handling","throw · try/catch · Re-throwing · Custom Exception Classes","What is stack unwinding in C++ exception handling?","","",["Freeing stack memory before main() starts","Automatic destruction of local objects as the call stack unwinds when an exception propagates","Manually freeing heap memory in a catch block","Reversing the order of function calls"],1,"When an exception is thrown, C++ unwinds the stack — destructors for all local objects created in the try block (and functions called from it) are called automatically. This ensures proper cleanup (RAII principle) during exception propagation.",9],["cpp","Exception Handling","throw · try/catch · Re-throwing · Custom Exception Classes","Which standard exception is thrown for out-of-range access on std::vector?","","",["std::overflow_error","std::invalid_argument","std::out_of_range","std::runtime_error"],2,"std::vector::at() throws std::out_of_range if the index is invalid. Note: operator[] does NOT throw — it causes undefined behavior. std::out_of_range is derived from std::logic_error, which is derived from std::exception.",10],["cpp","Managing Console I/O Operations","C++ Streams · Stream Classes · Formatted & Unformatted I/O · Manipulators","Which object is used for standard output in C++?","","",["cin","cerr","cout","clog"],2,"cout (character output) is the standard output stream connected to the console. cin is for input. cerr is for error output (unbuffered). clog is for log output (buffered). All are defined in .",1],["cpp","Managing Console I/O Operations","C++ Streams · Stream Classes · Formatted & Unformatted I/O · Manipulators","What is the difference between cerr and clog?","","",["No difference","cerr is unbuffered (immediate output); clog is buffered","clog is unbuffered; cerr is buffered","cerr is for input; clog is for output"],1,"cerr outputs immediately without buffering — critical for error messages that must appear even if the program crashes. clog is buffered like cout — output may be held until the buffer is flushed. Both are error/log streams.",2],["cpp","Managing Console I/O Operations","C++ Streams · Stream Classes · Formatted & Unformatted I/O · Manipulators","What does the 'setw(10)' manipulator do?","","",["Sets the width of the output to 10 characters","Sets the precision to 10 decimal places","Sets the fill character to width 10","Sets the base to 10 (decimal)"],0,"setw(n) from sets the field width for the next output operation to n characters. The output is right-aligned by default (left-aligned with setiosflags(ios::left)). The width applies only to the next single output operation.",3],["cpp","Managing Console I/O Operations","C++ Streams · Stream Classes · Formatted & Unformatted I/O · Manipulators","What is the output?","cout << setprecision(3) << 3.14159;","",["3.14159","3.14","3.1","3"],1,"setprecision(3) sets the output precision to 3 significant digits. 3.14159 rounded to 3 significant digits is 3.14. Include for setprecision. Use fixed manipulator with setprecision to control decimal places specifically.",4],["cpp","Managing Console I/O Operations","C++ Streams · Stream Classes · Formatted & Unformatted I/O · Manipulators","Which manipulator outputs a hexadecimal number?","","",["dec","oct","hex","bin"],2,"The hex manipulator (from ) formats integers in base 16 (hexadecimal). oct formats in base 8. dec formats in base 10 (default). There is no bin manipulator in standard C++ (use bitset for binary output).",5],["cpp","Managing Console I/O Operations","C++ Streams · Stream Classes · Formatted & Unformatted I/O · Manipulators","What is the insertion operator in C++ I/O?","","",[">>","<<","->","::"],1,"<< is the insertion (output) operator used with cout: cout << value. >> is the extraction (input) operator used with cin: cin >> variable. These operators are overloaded to work with standard streams.",6],["cpp","Managing Console I/O Operations","C++ Streams · Stream Classes · Formatted & Unformatted I/O · Manipulators","What is unformatted I/O in C++?","","",["I/O without any data","Character-by-character I/O functions like get(), put(), getline()","I/O using printf and scanf","I/O using file streams"],1,"Unformatted I/O doesn't perform type conversions. Functions: cin.get() reads one char, cin.getline() reads a line, cout.put() writes one char. These work at character level without skipping whitespace or formatting.",7],["cpp","Managing Console I/O Operations","C++ Streams · Stream Classes · Formatted & Unformatted I/O · Manipulators","What does 'endl' do in C++?","","",["Ends the program","Outputs a newline character and flushes the output buffer","Outputs a null character","Only flushes the buffer without newline"],1,"endl inserts a newline ('\\n') AND flushes the output buffer. Just using '\\n' is faster because it doesn't flush. Use endl when you need immediate output (e.g., before a crash or waiting for user input). For performance loops, prefer '\\n'.",8],["cpp","Managing Console I/O Operations","C++ Streams · Stream Classes · Formatted & Unformatted I/O · Manipulators","What does cin.ignore() do?","","",["Clears all input from the buffer","Ignores the next character(s) in the input stream","Disables cin for further input","Converts input to uppercase"],1,"cin.ignore(n, delim) extracts and discards up to n characters or until delim is found. Commonly used as cin.ignore() after cin >> to discard the leftover newline before getline(). Without it, getline sees the leftover '\\n' and reads an empty line.",9],["cpp","Managing Console I/O Operations","C++ Streams · Stream Classes · Formatted & Unformatted I/O · Manipulators","Which of the following reads an entire line including spaces from cin?","","",["cin >> str;","cin.get(str);","getline(cin, str);","cin.read(str);"],2,"getline(cin, str) reads an entire line including spaces until it hits '\\n'. cin >> str stops at whitespace. cin.get(str) is for char arrays (C-style). getline is the correct C++ way to read full lines into std::string.",10],["cpp","File Handling in C++","File Streams · ifstream/ofstream/fstream · Read/Write Operations","Which header file is required for file handling in C++?","","",["","","",""],2,"provides the classes for file handling: ifstream (input), ofstream (output), fstream (both). It is part of the C++ standard library. is the C-style file handling with FILE*, fopen(), etc.",1],["cpp","File Handling in C++","File Streams · ifstream/ofstream/fstream · Read/Write Operations","Which class is used to read from a file in C++?","","",["ofstream","fstream","ifstream","iostream"],2,"ifstream (input file stream) is used to read from files. ofstream is for writing. fstream can do both read and write. Always check if the file opened successfully: if(!file) { /* error */ }",2],["cpp","File Handling in C++","File Streams · ifstream/ofstream/fstream · Read/Write Operations","Which file opening mode appends data to an existing file without deleting its content?","","",["ios::in","ios::trunc","ios::app","ios::ate"],2,"ios::app (append mode) opens the file and positions the write pointer at the end. New data is added after existing content. ios::trunc (default with ofstream) deletes existing content. ios::ate moves to end but allows repositioning.",3],["cpp","File Handling in C++","File Streams · ifstream/ofstream/fstream · Read/Write Operations","What is the output behavior of this code?","ofstream file(\"test.txt\");\nfile << \"Hello\";\nfile.close();","",["Reads 'Hello' from test.txt","Writes 'Hello' to test.txt (creates or overwrites)","Appends 'Hello' to test.txt","Compilation Error"],1,"ofstream with a filename opens the file for writing. If the file doesn't exist, it's created. If it exists, content is overwritten (ios::trunc is default). 'Hello' is written using <<. file.close() flushes and closes the file.",4],["cpp","File Handling in C++","File Streams · ifstream/ofstream/fstream · Read/Write Operations","How do you check if a file was opened successfully?","","",["if(file == true)","if(file.is_open())","if(file.exists())","if(!file.fail())"],1,"file.is_open() returns true if the file is open. Alternatively: if(!file) { error; } works because stream objects evaluate to false if they're in a failed state. Always check file open status before reading/writing.",5],["cpp","File Handling in C++","File Streams · ifstream/ofstream/fstream · Read/Write Operations","What does the seekg() function do in C++ file handling?","","",["Seeks to a position in output stream","Moves the get (read) pointer to a specified position","Counts the number of characters in a file","Gets the file name"],1,"seekg(position, origin) moves the read (get) pointer. Origins: ios::beg (beginning), ios::cur (current), ios::end (end). Example: file.seekg(0, ios::end) moves to end to get file size. seekp() is for the write (put) pointer.",6],["cpp","File Handling in C++","File Streams · ifstream/ofstream/fstream · Read/Write Operations","Which function reads one character at a time from a file?","","",["file.read()","file.get()","file.getline()","file.fetch()"],1,"file.get() reads a single character from the file stream. file.getline() reads a whole line. file.read(buf, n) reads n raw bytes into a buffer (binary mode). There is no file.fetch() in C++.",7],["cpp","File Handling in C++","File Streams · ifstream/ofstream/fstream · Read/Write Operations","What is binary file mode in C++?","","",["Reading files as base-2 numbers","Reading/writing raw bytes without text translation (newline, etc.)","Encrypting file content","Compressing file data"],1,"ios::binary mode reads/writes raw bytes without any text translation (on Windows, \\n is not translated to \\r\\n). Used for non-text data (images, structs, etc.). Example: fstream file('data.bin', ios::binary | ios::in);",8],["cpp","File Handling in C++","File Streams · ifstream/ofstream/fstream · Read/Write Operations","What does eof() return?","","",["The position of the end-of-file","true if the last read operation reached the end of the file","The size of the file","true if the file is empty"],1,"file.eof() returns true when the end-of-file flag is set (after a read attempt reaches EOF). Correct usage: while(getline(file, line)) — checking eof() BEFORE reading can lead to bugs since eof is set AFTER the failing read.",9],["cpp","File Handling in C++","File Streams · ifstream/ofstream/fstream · Read/Write Operations","What is the correct way to read an entire file line by line?","","",["while(file >> line) cout << line;","while(getline(file, line)) cout << line;","while(!file.eof()) { file >> line; cout << line; }","for(line in file) cout << line;"],1,"while(getline(file, line)) reads one line per iteration and the loop exits when getline returns false (at EOF). Option A reads word by word (stops at whitespace). Option C can process the last line twice due to eof() behavior. Option D is Python syntax.",10],["cpp","Templates","Function Templates · Class Templates · Template Parameters","What is a template in C++?","","",["A pre-written class in the standard library","A blueprint for creating generic functions or classes that work with any data type","A design pattern for inheritance","A macro that generates code"],1,"Templates allow writing generic code that works with any data type. The compiler generates specific versions (instantiations) for each type used. This is the foundation of generic programming in C++.",1],["cpp","Templates","Function Templates · Class Templates · Template Parameters","What is the correct syntax for a function template?","","",["generic T add(T a, T b) { }","template T add(T a, T b) { return a+b; }","template T add(T a, T b) { return a+b; }","T template add(T a, T b) { return a+b; }"],1,"Function template syntax: template return_type function_name(T params). 'typename' (or 'class' — interchangeable here) introduces the type parameter T. The compiler generates specific versions when the function is called with specific types.",2],["cpp","Templates","Function Templates · Class Templates · Template Parameters","What is template instantiation?","","",["Defining a template","The compiler generating a specific version of a template for a particular type","Calling a template function","Inheriting from a template class"],1,"Template instantiation is when the compiler generates actual code for a specific type. For template void show(T x), calling show(5) instantiates show and show(3.14) instantiates show. This happens at compile time.",3],["cpp","Templates","Function Templates · Class Templates · Template Parameters","What is a class template?","","",["A class in the standard library","A template that generates a family of classes parameterized by type","An abstract class","A class that can only use int types"],1,"A class template generates a family of classes for different types. Example: template class Stack { T data[100]; }; Then Stack, Stack etc. are distinct classes generated by the compiler.",4],["cpp","Templates","Function Templates · Class Templates · Template Parameters","Can templates have non-type parameters?","","",["No, templates only accept type parameters","Yes, templates can accept non-type parameters like integers","Only function templates can have non-type parameters","Non-type parameters are only allowed in C++20"],1,"Templates can have non-type parameters. Example: template class Array { T data[SIZE]; }; Then Array creates an array of 10 ints. The non-type parameter (SIZE=10) is a compile-time constant.",5],["cpp","Templates","Function Templates · Class Templates · Template Parameters","What is template specialization?","","",["Using a template with a specific type argument","Providing a specific implementation of a template for a particular type","Inheriting from a template class","A template with only one parameter"],1,"Template specialization provides a custom implementation for a specific type. Example: template<> void show(char x) { } provides specialized behavior for char. The compiler uses the specialization when T=char and the generic version otherwise.",6],["cpp","Templates","Function Templates · Class Templates · Template Parameters","What is the output? template<typename T>","T square(T x){ return x*x; }\ncout << square(4);","",["4","8","16","2"],2,"square(4) instantiates square since 4 is an int. Returns 4*4 = 16. If called with square(3.0), it instantiates square returning 9.0. Templates are resolved at compile time based on argument types.",7],["cpp","Templates","Function Templates · Class Templates · Template Parameters","What is the difference between 'typename' and 'class' in template parameters?","","",["'class' only accepts class types; 'typename' accepts all types","They are interchangeable in most contexts for template parameters","'typename' only works in C++14 and later","'class' makes the parameter a non-type parameter"],1,"In template parameter lists, 'typename' and 'class' are interchangeable: template is identical to template. The only difference is in dependent contexts inside templates where 'typename' is required to specify a type.",8],["cpp","Templates","Function Templates · Class Templates · Template Parameters","Can a template function be overloaded?","","",["No, templates cannot be overloaded","Yes, template functions can be overloaded like regular functions","Only with different number of template parameters","Only class templates can be overloaded"],1,"Template functions can be overloaded — you can have multiple templates with the same name but different parameters, and you can have both template and non-template overloads. The compiler selects the best match. Non-template overloads take priority over templates when both match.",9],["cpp","Templates","Function Templates · Class Templates · Template Parameters","What is variadic template in C++11?","","",["A template with variable runtime parameters","A template that accepts a variable number of type parameters","A template specialized for vector types","A template that generates variable-length arrays"],1,"Variadic templates (C++11): template accept any number of type arguments. Example: template void print(Args... args). The ... is a parameter pack. This is the basis for std::tuple and std::make_shared.",10],["cpp","STL and RTTI","STL · Vector · Stack · Queue · Map · RTTI · typeid · dynamic_cast","What does STL stand for in C++?","","",["Standard Type Library","Standard Template Library","System Template Library","Static Template Library"],1,"STL stands for Standard Template Library. It provides generic, reusable data structures (containers: vector, list, map, etc.) and algorithms (sort, find, etc.) and iterators that work with these containers.",1],["cpp","STL and RTTI","STL · Vector · Stack · Queue · Map · RTTI · typeid · dynamic_cast","Which STL container provides dynamic array functionality?","","",["list","deque","vector","array"],2,"std::vector is a dynamic array that resizes automatically. It provides O(1) random access (operator[]), O(1) amortized push_back, and contiguous memory storage. Include to use it.",2],["cpp","STL and RTTI","STL · Vector · Stack · Queue · Map · RTTI · typeid · dynamic_cast","What is the output?","vector<int> v = {1,2,3};\nv.push_back(4);\ncout << v.size();","",["3","4","1","Compilation Error"],1,"v starts with 3 elements {1,2,3}. push_back(4) adds 4 at the end, making 4 elements. v.size() returns 4 (of type size_t). The output is 4.",3],["cpp","STL and RTTI","STL · Vector · Stack · Queue · Map · RTTI · typeid · dynamic_cast","Which STL container implements LIFO (Last In First Out)?","","",["queue","vector","map","stack"],3,"std::stack implements LIFO. push() adds to top, pop() removes from top, top() peeks at top. std::queue is FIFO (First In First Out). Include for stack.",4],["cpp","STL and RTTI","STL · Vector · Stack · Queue · Map · RTTI · typeid · dynamic_cast","Which STL container maps unique keys to values?","","",["vector","list","map","stack"],2,"std::map stores key-value pairs with unique, sorted keys. Access via map[key]. Average O(log n) operations (implemented as red-black tree). std::unordered_map offers average O(1) with hash table but unsorted keys.",5],["cpp","STL and RTTI","STL · Vector · Stack · Queue · Map · RTTI · typeid · dynamic_cast","What is RTTI in C++?","","",["Real-Time Template Interface","Run-Time Type Information — mechanism to determine type of an object at runtime","Runtime Template Instantiation","Register Type Table Interface"],1,"RTTI (Run-Time Type Information) allows programs to determine the type of an object at runtime. Enabled with virtual functions. Key mechanisms: typeid() operator and dynamic_cast. RTTI can be disabled by compiler flags for performance.",6],["cpp","STL and RTTI","STL · Vector · Stack · Queue · Map · RTTI · typeid · dynamic_cast","What does typeid() return?","","",["An integer representing the type","A std::type_info object with type information","The size of the type","A string with the variable name"],1,"typeid(expression) returns a reference to a std::type_info object. typeid(x).name() returns an implementation-defined string (may be mangled). typeid(*ptr) with a polymorphic pointer returns the actual derived type at runtime.",7],["cpp","STL and RTTI","STL · Vector · Stack · Queue · Map · RTTI · typeid · dynamic_cast","What is the difference between std::map and std::unordered_map?","","",["map is unordered; unordered_map is sorted","map is sorted (O(log n) ops); unordered_map uses hash table (O(1) average ops)","unordered_map doesn't allow duplicate keys","No difference"],1,"std::map is implemented as a balanced BST (red-black tree) — keys are always sorted, O(log n) for insert/find. std::unordered_map uses hash table — keys unsorted, O(1) average for insert/find but O(n) worst case with collisions.",8],["cpp","STL and RTTI","STL · Vector · Stack · Queue · Map · RTTI · typeid · dynamic_cast","What does std::queue::front() return?","","",["The last element","The first element (next to be dequeued)","The largest element","The middle element"],1,"std::queue is FIFO. front() returns the element at the front (the oldest, next to be removed with pop()). back() returns the newest element. push() adds to back, pop() removes from front.",9],["cpp","STL and RTTI","STL · Vector · Stack · Queue · Map · RTTI · typeid · dynamic_cast","Which STL algorithm sorts a vector in C++?","","",["vector.sort()","std::sort(v.begin(), v.end())","std::order(v)","v.arrange()"],1,"std::sort() from sorts a range defined by iterators. std::sort(v.begin(), v.end()) sorts in ascending order. For descending: std::sort(v.begin(), v.end(), greater()). There is no .sort() method on vector.",10],["dbms","Introduction to DBMS","DBMS Basics · Terminology · Types of DBMS · MySQL Clients","What does DBMS stand for?","","",["Data Backup Management System","Database Management System","Data Block Memory Storage","Digital Base Management Software"],1,"DBMS stands for Database Management System — software that enables users to define, create, maintain, and control access to a database. Examples include MySQL, Oracle, PostgreSQL, and MongoDB.",1],["dbms","Introduction to DBMS","DBMS Basics · Terminology · Types of DBMS · MySQL Clients","Which of the following is a characteristic of a Relational DBMS?","","",["Data stored as documents in JSON format","Data stored in tables (relations) with rows and columns","Data stored as key-value pairs","Data stored as graph nodes and edges"],1,"Relational DBMS (RDBMS) organizes data into tables (relations) consisting of rows (tuples) and columns (attributes). MySQL, Oracle, and PostgreSQL are classic examples. Relationships between tables are established using foreign keys.",2],["dbms","Introduction to DBMS","DBMS Basics · Terminology · Types of DBMS · MySQL Clients","Which type of database is best suited for storing highly connected data like social networks?","","",["Relational Database","Key-Value Store","Graph Database","Column-Oriented Database"],2,"Graph databases (e.g., Neo4j) store data as nodes (entities) and edges (relationships), making them ideal for highly connected data like social networks, recommendation engines, and fraud detection.",3],["dbms","Introduction to DBMS","DBMS Basics · Terminology · Types of DBMS · MySQL Clients","What is MySQL Workbench?","","",["A command-line tool for MySQL","A graphical user interface tool for MySQL database design and administration","A programming language for databases","A storage engine for MySQL"],1,"MySQL Workbench is a visual GUI tool for database architects, developers, and DBAs. It provides data modeling, SQL development, and database administration features. MySQL Monitor (mysql CLI) and MySQL Shell are the command-line alternatives.",4],["dbms","Introduction to DBMS","DBMS Basics · Terminology · Types of DBMS · MySQL Clients","What distinguishes a NoSQL database from a relational database?","","",["NoSQL databases use SQL for queries","NoSQL databases do not use fixed schemas and support unstructured data","NoSQL databases are always slower","NoSQL databases cannot scale horizontally"],1,"NoSQL databases are schema-flexible and designed for unstructured/semi-structured data, horizontal scaling, and high availability. They sacrifice strict ACID compliance for performance and scalability. Examples: MongoDB, Cassandra, Redis.",5],["dbms","Introduction to DBMS","DBMS Basics · Terminology · Types of DBMS · MySQL Clients","In database terminology, what is a 'tuple'?","","",["A column in a table","A single row/record in a relation (table)","A database schema","A primary key constraint"],1,"In relational database terminology, a tuple is a single row in a table (relation). It represents one instance/record. Columns are called attributes, the set of all possible values for an attribute is called a domain.",6],["dbms","Introduction to DBMS","DBMS Basics · Terminology · Types of DBMS · MySQL Clients","Which MySQL client allows you to run JavaScript and Python scripts in addition to SQL?","","",["MySQL Monitor (mysql CLI)","MySQL Workbench","MySQL Shell (mysqlsh)","phpMyAdmin"],2,"MySQL Shell (mysqlsh) supports three modes: SQL mode, JavaScript mode, and Python mode. It is the advanced command-line client for MySQL. The classic MySQL Monitor (mysql) only supports SQL. Workbench is a GUI tool.",7],["dbms","Introduction to DBMS","DBMS Basics · Terminology · Types of DBMS · MySQL Clients","What is the difference between a database and a DBMS?","","",["They are the same thing","A database is the organized collection of data; DBMS is the software that manages it","DBMS is the data; database is the software","A database is only for relational data"],1,"A database is the organized collection of structured data stored persistently. The DBMS is the software system that provides the interface to define, create, query, update, and administer the database. You interact with data THROUGH the DBMS.",8],["dbms","Introduction to DBMS","DBMS Basics · Terminology · Types of DBMS · MySQL Clients","What is an Object-Relational Database?","","",["A database that only stores objects","A relational database extended with object-oriented features like user-defined types","A NoSQL database that uses objects","A database without tables"],1,"Object-Relational DBMS (ORDBMS) combines relational database features with object-oriented concepts — supporting user-defined types, inheritance, and complex data types. PostgreSQL is a prominent example of an ORDBMS.",9],["dbms","Introduction to DBMS","DBMS Basics · Terminology · Types of DBMS · MySQL Clients","Which command in MySQL Monitor is used to show all available databases?","","",["LIST DATABASES;","SELECT * FROM databases;","SHOW DATABASES;","DISPLAY DATABASES;"],2,"SHOW DATABASES; is the MySQL command to list all databases on the server. Similarly, SHOW TABLES; lists tables in the current database. USE database_name; selects the active database.",10],["dbms","Data Models, ERD, Codd's Rules & DDL","Data Models · ERD · Codd's 12 Rules · SQL Categories · DDL","Which data model represents data as it will be physically stored on disk?","","",["Conceptual Model","Logical Model","Physical Model","External Model"],2,"The Physical Model describes HOW data is stored on disk — including file structures, indexes, partitions, and storage allocation. The Conceptual model (ERD) shows WHAT data exists. The Logical model (relational schema) shows the structure without physical details.",1],["dbms","Data Models, ERD, Codd's Rules & DDL","Data Models · ERD · Codd's 12 Rules · SQL Categories · DDL","In an ER Diagram, which shape represents an ENTITY?","","",["Diamond","Ellipse/Oval","Rectangle","Triangle"],2,"In ERD notation: Rectangles represent entities (e.g., Student, Course). Ellipses/Ovals represent attributes. Diamonds represent relationships. Lines connect entities to relationships. Double rectangles denote weak entities.",2],["dbms","Data Models, ERD, Codd's Rules & DDL","Data Models · ERD · Codd's 12 Rules · SQL Categories · DDL","Codd's Rule #1 states that a relational system must represent all information as values in:","","",["Hierarchical trees","Tables (relations)","Files on disk","Key-value pairs"],1,"Codd's Rule #1 — The Information Rule: All information in a relational database must be represented explicitly as values in tables. No other mechanism (like pointers or hierarchies) should be used to represent data.",3],["dbms","Data Models, ERD, Codd's Rules & DDL","Data Models · ERD · Codd's 12 Rules · SQL Categories · DDL","Which DDL command is used to remove a table and all its data permanently?","","",["DELETE","TRUNCATE","DROP","REMOVE"],2,"DROP TABLE removes the entire table structure AND all its data permanently. It cannot be rolled back (DDL auto-commits). TRUNCATE removes all rows but keeps the structure. DELETE (DML) removes rows conditionally and can be rolled back.",4],["dbms","Data Models, ERD, Codd's Rules & DDL","Data Models · ERD · Codd's 12 Rules · SQL Categories · DDL","What does DDL stand for in SQL?","","",["Data Definition Language","Data Delivery Language","Dynamic Data Language","Database Design Layer"],0,"DDL (Data Definition Language) includes commands that define and modify database structure: CREATE (create objects), ALTER (modify structure), DROP (delete objects), TRUNCATE (empty a table). These auto-commit and cannot be rolled back in most systems.",5],["dbms","Data Models, ERD, Codd's Rules & DDL","Data Models · ERD · Codd's 12 Rules · SQL Categories · DDL","Which SQL command adds a new column to an existing table?","","",["CREATE COLUMN","ALTER TABLE ... ADD COLUMN","UPDATE TABLE ... ADD","MODIFY TABLE ... INSERT COLUMN"],1,"ALTER TABLE is used to modify an existing table structure. ALTER TABLE employees ADD COLUMN salary DECIMAL(10,2); adds a new column. Other ALTER operations: MODIFY COLUMN (change type), DROP COLUMN, RENAME COLUMN.",6],["dbms","Data Models, ERD, Codd's Rules & DDL","Data Models · ERD · Codd's 12 Rules · SQL Categories · DDL","In an ERD, what does a 'weak entity' mean?","","",["An entity with no attributes","An entity that cannot be uniquely identified without a related strong entity","An entity with nullable attributes","An entity with only one attribute"],1,"A weak entity does not have a sufficient primary key on its own and depends on a strong (owner) entity for identification. Represented by a double rectangle in ERD. Example: OrderItem depends on Order — an OrderItem's identity requires its Order.",7],["dbms","Data Models, ERD, Codd's Rules & DDL","Data Models · ERD · Codd's 12 Rules · SQL Categories · DDL","Which of the following correctly categorizes SQL commands?","","",["DDL: SELECT; DML: CREATE; DCL: INSERT","DDL: CREATE/ALTER/DROP; DML: INSERT/UPDATE/DELETE; DCL: GRANT/REVOKE","DDL: GRANT; DML: SELECT; DCL: CREATE","DDL: INSERT; DML: DROP; DCL: COMMIT"],1,"Standard SQL categories: DDL (Data Definition Language): CREATE, ALTER, DROP, TRUNCATE. DML (Data Manipulation Language): INSERT, UPDATE, DELETE, SELECT. DCL (Data Control Language): GRANT, REVOKE. TCL (Transaction Control): COMMIT, ROLLBACK, SAVEPOINT.",8],["dbms","Data Models, ERD, Codd's Rules & DDL","Data Models · ERD · Codd's 12 Rules · SQL Categories · DDL","What is a primary key in a relational database?","","",["The first column of a table","A column (or combination) that uniquely identifies each row in a table","A key that references another table","A column that allows NULL values"],1,"A primary key uniquely identifies each row in a table. It must be UNIQUE (no duplicates) and NOT NULL. A table can have only one primary key (though it can be composite — multiple columns). It is the cornerstone of relational integrity.",9],["dbms","Data Models, ERD, Codd's Rules & DDL","Data Models · ERD · Codd's 12 Rules · SQL Categories · DDL","Codd's Rule #0 (the Foundation Rule) states that:","","",["The system must support at least one table","A relational system must manage databases entirely through its relational capabilities","NULL must be supported","The system must support foreign keys"],1,"Codd's Rule #0 (Foundation Rule): For a system to qualify as a relational database management system, it must manage its stored data using only its relational capabilities. A system that bypasses relational features for some operations is not a true RDBMS.",10],["dbms","Normalization & DML","Data Anomalies · Functional Dependency · 1NF/2NF/3NF/BCNF · INSERT/UPDATE/DELETE","What is data redundancy in a database?","","",["Having too many primary keys","Storing the same piece of data in multiple places unnecessarily","Having tables without foreign keys","Using NULL values frequently"],1,"Data redundancy means the same data is stored in multiple places. This wastes storage, creates inconsistency risks (update anomalies), and complicates maintenance. Normalization is the process of reducing redundancy by organizing data efficiently.",1],["dbms","Normalization & DML","Data Anomalies · Functional Dependency · 1NF/2NF/3NF/BCNF · INSERT/UPDATE/DELETE","Which anomaly occurs when deleting a row unintentionally removes other important information?","","",["Insertion Anomaly","Update Anomaly","Deletion Anomaly","Redundancy Anomaly"],2,"A deletion anomaly occurs when removing a record inadvertently deletes other needed data. Example: if a student's only course enrollment is deleted, we lose the student's information entirely if it's stored in the same table. Normalization prevents this.",2],["dbms","Normalization & DML","Data Anomalies · Functional Dependency · 1NF/2NF/3NF/BCNF · INSERT/UPDATE/DELETE","A relation is in 1NF (First Normal Form) if:","","",["It has no partial dependencies","All attributes contain atomic (indivisible) values and each column has unique values","It has no transitive dependencies","Every determinant is a candidate key"],1,"1NF requires: all attribute values are atomic (no multi-valued or composite attributes), each column has a unique name, and the order of rows/columns doesn't matter. Example violation: storing multiple phone numbers in one column.",3],["dbms","Normalization & DML","Data Anomalies · Functional Dependency · 1NF/2NF/3NF/BCNF · INSERT/UPDATE/DELETE","A relation is in 2NF if it is in 1NF and:","","",["Has no transitive dependencies","Has no partial dependencies on the primary key","Every determinant is a candidate key","Has no NULL values"],1,"2NF requires: the relation is in 1NF AND every non-key attribute is FULLY functionally dependent on the ENTIRE primary key (no partial dependencies). Partial dependency exists only when the primary key is composite. If PK is single-column, 1NF implies 2NF.",4],["dbms","Normalization & DML","Data Anomalies · Functional Dependency · 1NF/2NF/3NF/BCNF · INSERT/UPDATE/DELETE","A relation is in 3NF if it is in 2NF and:","","",["Has no partial dependencies","Has no transitive dependencies (no non-key attribute depends on another non-key attribute)","All attributes are candidate keys","Has no multi-valued dependencies"],1,"3NF requires: in 2NF AND no transitive dependencies. A transitive dependency exists when a non-key attribute (A) depends on another non-key attribute (B) which depends on the primary key. Example: StudentID → DeptID → DeptName — DeptName is transitively dependent.",5],["dbms","Normalization & DML","Data Anomalies · Functional Dependency · 1NF/2NF/3NF/BCNF · INSERT/UPDATE/DELETE","What is BCNF (Boyce-Codd Normal Form)?","","",["A weaker form than 3NF","A stronger form of 3NF where every determinant must be a candidate key","Same as 3NF with additional NULL constraints","A form that eliminates multi-valued dependencies"],1,"BCNF (3.5NF) is stricter than 3NF: for every functional dependency X → Y, X must be a superkey (candidate key or its superset). BCNF eliminates all anomalies based on functional dependencies. A relation in BCNF is always in 3NF, but not vice versa.",6],["dbms","Normalization & DML","Data Anomalies · Functional Dependency · 1NF/2NF/3NF/BCNF · INSERT/UPDATE/DELETE","Which DML statement is used to add new rows to a table?","","",["ADD","CREATE","INSERT","APPEND"],2,"INSERT INTO table_name (col1, col2) VALUES (val1, val2); adds new rows to a table. INSERT is DML (Data Manipulation Language) and can be rolled back within a transaction. You can insert multiple rows in one INSERT statement.",7],["dbms","Normalization & DML","Data Anomalies · Functional Dependency · 1NF/2NF/3NF/BCNF · INSERT/UPDATE/DELETE","What is the effect of this SQL?","UPDATE employees SET salary = salary * 1.1 WHERE dept_id = 5;","",["Increases salary by 1.1 for all employees","Increases salary by 10% for employees in department 5","Deletes employees in department 5","Creates a new column salary"],1,"salary * 1.1 multiplies the current salary by 1.1, effectively increasing it by 10%. The WHERE clause restricts the update to only employees in department 5. Without WHERE, ALL rows would be updated — a common mistake.",8],["dbms","Normalization & DML","Data Anomalies · Functional Dependency · 1NF/2NF/3NF/BCNF · INSERT/UPDATE/DELETE","What is the difference between DELETE and TRUNCATE?","","",["No difference","DELETE is DML (logged, can be rolled back, supports WHERE); TRUNCATE is DDL (faster, cannot be rolled back, removes all rows)","TRUNCATE supports WHERE clause; DELETE does not","DELETE removes the table structure; TRUNCATE only removes data"],1,"DELETE (DML): removes rows conditionally with WHERE, is logged row-by-row, can be rolled back. TRUNCATE (DDL): removes ALL rows at once, resets AUTO_INCREMENT, is minimally logged, auto-commits (cannot be rolled back in MySQL). TRUNCATE is faster for large tables.",9],["dbms","Normalization & DML","Data Anomalies · Functional Dependency · 1NF/2NF/3NF/BCNF · INSERT/UPDATE/DELETE","What is a functional dependency?","","",["A dependency between two different databases","When the value of attribute A uniquely determines the value of attribute B (A → B)","When two attributes have the same data type","A foreign key constraint between tables"],1,"Functional dependency A → B means: for any two tuples in a relation, if they have the same value of A, they must have the same value of B. A 'functionally determines' B. Example: StudentID → StudentName (ID uniquely determines the name).",10],["dbms","Data Types, Constraints & Aggregate Functions","MySQL Data Types · Constraints · Aggregate Functions · GROUP BY · HAVING · LIKE · ORDER BY","Which MySQL data type is best for storing a person's age (0-150)?","","",["VARCHAR(3)","FLOAT","TINYINT UNSIGNED","TEXT"],2,"TINYINT UNSIGNED stores values 0-255, perfect for age. TINYINT (signed) stores -128 to 127. Using the smallest appropriate integer type saves storage. FLOAT adds unnecessary floating-point overhead. VARCHAR is for strings.",1],["dbms","Data Types, Constraints & Aggregate Functions","MySQL Data Types · Constraints · Aggregate Functions · GROUP BY · HAVING · LIKE · ORDER BY","Which constraint ensures no two rows have the same value in a column (but allows NULLs)?","","",["PRIMARY KEY","NOT NULL","UNIQUE","CHECK"],2,"UNIQUE constraint ensures all values in a column are distinct. Unlike PRIMARY KEY, UNIQUE allows NULL values (multiple NULLs are permitted in MySQL). A table can have multiple UNIQUE constraints but only one PRIMARY KEY.",2],["dbms","Data Types, Constraints & Aggregate Functions","MySQL Data Types · Constraints · Aggregate Functions · GROUP BY · HAVING · LIKE · ORDER BY","What does the FOREIGN KEY constraint enforce?","","",["Uniqueness of values in a column","Referential integrity — values must exist in the referenced table's primary key","Non-null values","Maximum length of a string"],1,"A FOREIGN KEY enforces referential integrity: the value in the child table's FK column must match an existing value in the parent table's referenced column (usually PK). It prevents orphaned records. Example: orders.customer_id must exist in customers.customer_id.",3],["dbms","Data Types, Constraints & Aggregate Functions","MySQL Data Types · Constraints · Aggregate Functions · GROUP BY · HAVING · LIKE · ORDER BY","What is the output of: SELECT COUNT(*), AVG(salary) FROM employees WHERE dept_id","= 3;","",["Count of all employees and average salary of all employees","Count and average salary of employees in department 3","Count of distinct salaries in dept 3","Syntax error"],1,"COUNT(*) counts all rows (including NULLs) and AVG(salary) computes the average of the salary column. The WHERE clause filters to only department 3 employees BEFORE aggregation. Aggregate functions operate on the filtered result set.",4],["dbms","Data Types, Constraints & Aggregate Functions","MySQL Data Types · Constraints · Aggregate Functions · GROUP BY · HAVING · LIKE · ORDER BY","What is the difference between WHERE and HAVING?","","",["No difference","WHERE filters rows before grouping; HAVING filters groups after GROUP BY aggregation","HAVING filters rows before grouping; WHERE filters after","WHERE is for numbers; HAVING is for strings"],1,"WHERE filters individual rows BEFORE GROUP BY is applied. HAVING filters groups AFTER GROUP BY aggregation. You cannot use aggregate functions in WHERE. Example: SELECT dept, AVG(salary) FROM emp GROUP BY dept HAVING AVG(salary) > 50000;",5],["dbms","Data Types, Constraints & Aggregate Functions","MySQL Data Types · Constraints · Aggregate Functions · GROUP BY · HAVING · LIKE · ORDER BY","Which query finds all employees whose name starts with 'Jo'?","","",["WHERE name = 'Jo%'","WHERE name LIKE 'Jo%'","WHERE name STARTS WITH 'Jo'","WHERE name CONTAINS 'Jo'"],1,"LIKE 'Jo%' uses the % wildcard (matches any sequence of characters). So 'Jo%' matches 'John', 'Joseph', 'Jones', etc. _ (underscore) matches exactly one character. LIKE is case-insensitive by default in MySQL with the default collation.",6],["dbms","Data Types, Constraints & Aggregate Functions","MySQL Data Types · Constraints · Aggregate Functions · GROUP BY · HAVING · LIKE · ORDER BY","What does SELECT DISTINCT do?","","",["Sorts the results","Removes duplicate rows from the result set","Counts unique values","Filters NULL values"],1,"SELECT DISTINCT eliminates duplicate rows from the result. Example: SELECT DISTINCT dept FROM employees; returns each department name only once, even if multiple employees are in the same department.",7],["dbms","Data Types, Constraints & Aggregate Functions","MySQL Data Types · Constraints · Aggregate Functions · GROUP BY · HAVING · LIKE · ORDER BY","Which clause sorts query results in descending order?","","",["ORDER BY column ASC","SORT BY column DESC","ORDER BY column DESC","GROUP BY column DESC"],2,"ORDER BY column DESC sorts results in descending order (highest to lowest / Z to A). ASC (ascending) is the default. You can sort by multiple columns: ORDER BY dept ASC, salary DESC (first by dept ascending, then by salary descending within each dept).",8],["dbms","Data Types, Constraints & Aggregate Functions","MySQL Data Types · Constraints · Aggregate Functions · GROUP BY · HAVING · LIKE · ORDER BY","What does the CHECK constraint do?","","",["Checks if a foreign key exists","Validates that column values satisfy a specified condition","Checks for duplicate values","Verifies the data type of a column"],1,"CHECK constraint validates that values in a column meet a specified condition. Example: CHECK (age >= 18 AND age <= 65) or CHECK (salary > 0). MySQL 8.0.16+ enforces CHECK constraints. Earlier versions parsed but didn't enforce them.",9],["dbms","Data Types, Constraints & Aggregate Functions","MySQL Data Types · Constraints · Aggregate Functions · GROUP BY · HAVING · LIKE · ORDER BY","Which aggregate function returns the number of rows where the column value is NOT NULL?","","",["COUNT(*)","COUNT(column_name)","SUM(column_name)","MAX(column_name)"],1,"COUNT(column_name) counts non-NULL values in that column. COUNT(*) counts ALL rows (including NULLs). So COUNT(salary) and COUNT(*) differ if any salary is NULL. SUM and MAX don't count — they compute mathematical results.",10],["dbms","Relational Algebra & Joins","Selection · Projection · Union · Joins (Inner/Outer/Natural/Cross) · AUTO_INCREMENT","What does the Projection operation in Relational Algebra do?","","",["Filters rows based on a condition","Selects specific columns from a relation","Combines two relations","Removes duplicate rows"],1,"Projection (π) selects specific columns (attributes) from a relation, discarding the others. It corresponds to SELECT col1, col2 in SQL (not SELECT *). Selection (σ) filters rows (corresponds to WHERE clause).",1],["dbms","Relational Algebra & Joins","Selection · Projection · Union · Joins (Inner/Outer/Natural/Cross) · AUTO_INCREMENT","What is an INNER JOIN?","","",["Returns all rows from both tables","Returns only rows with matching values in both tables","Returns all rows from the left table","Returns all rows from the right table"],1,"INNER JOIN returns only the rows where the join condition is satisfied in BOTH tables. Non-matching rows from either table are excluded. It is the most common join type and is the default when you write just JOIN.",2],["dbms","Relational Algebra & Joins","Selection · Projection · Union · Joins (Inner/Outer/Natural/Cross) · AUTO_INCREMENT","Which JOIN returns all rows from the left table and matched rows from the right table (NULLs for non-matches)?","","",["INNER JOIN","RIGHT JOIN","LEFT JOIN","CROSS JOIN"],2,"LEFT JOIN (LEFT OUTER JOIN) returns ALL rows from the left table. For rows in the left table with no match in the right table, NULL is returned for right-table columns. RIGHT JOIN does the opposite (all rows from right table).",3],["dbms","Relational Algebra & Joins","Selection · Projection · Union · Joins (Inner/Outer/Natural/Cross) · AUTO_INCREMENT","What does UNION do in SQL?","","",["Joins two tables horizontally","Combines result sets of two SELECT statements vertically, removing duplicates","Combines result sets keeping all duplicates","Finds the intersection of two result sets"],1,"UNION combines results from two SELECT queries (with same number/compatible columns) and removes duplicate rows. UNION ALL keeps duplicates and is faster. Both selects must have the same number of columns in the same order.",4],["dbms","Relational Algebra & Joins","Selection · Projection · Union · Joins (Inner/Outer/Natural/Cross) · AUTO_INCREMENT","What is a CROSS JOIN?","","",["A join based on a common foreign key","A join that returns the Cartesian product of two tables (every combination)","A join that returns only non-matching rows","A join between three tables"],1,"CROSS JOIN produces the Cartesian product — every row of the first table combined with every row of the second. If table A has 5 rows and B has 4 rows, the result has 20 rows. Use with care as it produces very large results without a WHERE clause.",5],["dbms","Relational Algebra & Joins","Selection · Projection · Union · Joins (Inner/Outer/Natural/Cross) · AUTO_INCREMENT","What is a NATURAL JOIN?","","",["A join using explicit ON clause","A join that automatically joins on all columns with the same name in both tables","A join using column position","A join that returns distinct rows only"],1,"NATURAL JOIN automatically joins on all columns that share the same name in both tables. It implicitly performs an INNER JOIN on those common columns. It can be dangerous if tables accidentally share column names — use explicit JOIN ... ON for clarity.",6],["dbms","Relational Algebra & Joins","Selection · Projection · Union · Joins (Inner/Outer/Natural/Cross) · AUTO_INCREMENT","What does AUTO_INCREMENT do in MySQL?","","",["Automatically updates a column when a row is modified","Automatically generates a unique integer value for a column when a new row is inserted","Automatically indexes all columns","Automatically creates foreign keys"],1,"AUTO_INCREMENT generates unique sequential integers automatically for a column (usually the primary key). When you insert without specifying the AUTO_INCREMENT column, MySQL assigns the next value. The counter starts at 1 by default and increments by 1.",7],["dbms","Relational Algebra & Joins","Selection · Projection · Union · Joins (Inner/Outer/Natural/Cross) · AUTO_INCREMENT","What is the SQL syntax for an INNER JOIN using the standard SQL syntax?","","",["FROM t1, t2 WHERE t1.id = t2.id","FROM t1 INNER JOIN t2 ON t1.id = t2.id","FROM t1 JOIN t2 USING t1.id = t2.id","FROM t1, t2 HAVING t1.id = t2.id"],1,"Standard SQL JOIN syntax: SELECT ... FROM table1 INNER JOIN table2 ON table1.key = table2.fk; The old implicit join syntax (FROM t1, t2 WHERE t1.id=t2.id) still works but is less readable and makes outer joins harder to express.",8],["dbms","Relational Algebra & Joins","Selection · Projection · Union · Joins (Inner/Outer/Natural/Cross) · AUTO_INCREMENT","Which SQL command copies the structure of an existing table without copying the data?","","",["CREATE TABLE new AS SELECT * FROM old WHERE 1=1","CREATE TABLE new LIKE old","COPY TABLE old TO new","CLONE TABLE old AS new"],1,"CREATE TABLE new_table LIKE existing_table; copies the table structure (columns, data types, indexes, constraints) without copying data. CREATE TABLE new AS SELECT * FROM old; copies both structure and data. There is no COPY or CLONE command in standard MySQL.",9],["dbms","Relational Algebra & Joins","Selection · Projection · Union · Joins (Inner/Outer/Natural/Cross) · AUTO_INCREMENT","What is the result of a LEFT JOIN when there is no matching row in the right table?","","",["The row from the left table is excluded","The row from the left table is included with NULL values for right-table columns","An error is raised","The row is duplicated"],1,"In a LEFT JOIN, every row from the left table appears in the result. When no matching row exists in the right table, the right table's columns are filled with NULL. This is useful to find unmatched records: WHERE right_table.id IS NULL.",10],["dbms","Subqueries, TCL, DCL & Views","Subquery · Correlated Subquery · EXISTS · COMMIT/ROLLBACK · GRANT/REVOKE · Views","What is a subquery in SQL?","","",["A query that runs on a subserver","A query nested inside another SQL query","A stored procedure","A query that uses JOINs"],1,"A subquery is a SELECT statement embedded within another SQL statement (SELECT, INSERT, UPDATE, DELETE). It is enclosed in parentheses. The inner query executes first and its result is used by the outer query.",1],["dbms","Subqueries, TCL, DCL & Views","Subquery · Correlated Subquery · EXISTS · COMMIT/ROLLBACK · GRANT/REVOKE · Views","What makes a correlated subquery different from a regular subquery?","","",["It executes only once","It references columns from the outer query and executes once for each row of the outer query","It can only be used in the WHERE clause","It always uses the IN operator"],1,"A correlated subquery references columns from the outer query. It executes ONCE PER ROW of the outer query (not just once). This makes it potentially slow for large datasets. Example: Find employees earning more than their department average.",2],["dbms","Subqueries, TCL, DCL & Views","Subquery · Correlated Subquery · EXISTS · COMMIT/ROLLBACK · GRANT/REVOKE · Views","What does the EXISTS operator do?","","",["Checks if a column exists in a table","Returns TRUE if the subquery returns at least one row","Checks if a value exists in a column","Checks if a table exists in the database"],1,"EXISTS returns TRUE if the subquery returns one or more rows, FALSE if empty. It is often more efficient than IN for large datasets because it stops processing as soon as the first matching row is found.",3],["dbms","Subqueries, TCL, DCL & Views","Subquery · Correlated Subquery · EXISTS · COMMIT/ROLLBACK · GRANT/REVOKE · Views","What happens when you execute ROLLBACK in a transaction?","","",["Saves all changes permanently","Undoes all changes made since the last COMMIT or SAVEPOINT","Creates a backup of the database","Deletes the transaction log"],1,"ROLLBACK undoes all uncommitted changes in the current transaction, restoring the database to its state before the transaction began (or since the last COMMIT/SAVEPOINT). It is used for error recovery.",4],["dbms","Subqueries, TCL, DCL & Views","Subquery · Correlated Subquery · EXISTS · COMMIT/ROLLBACK · GRANT/REVOKE · Views","What is a SAVEPOINT in SQL transactions?","","",["A full database backup point","A named point within a transaction to which you can partially rollback","A point where the transaction auto-commits","A snapshot of the entire database"],1,"SAVEPOINT name; creates a named marker within a transaction. ROLLBACK TO SAVEPOINT name; undoes only changes made AFTER that savepoint (not the entire transaction). This allows partial rollbacks within complex transactions.",5],["dbms","Subqueries, TCL, DCL & Views","Subquery · Correlated Subquery · EXISTS · COMMIT/ROLLBACK · GRANT/REVOKE · Views","Which DCL command gives a user permission to run SELECT on a table?","","",["ALLOW SELECT ON table TO user;","GRANT SELECT ON table TO user;","PERMIT SELECT ON table TO user;","ENABLE SELECT ON table FOR user;"],1,"GRANT privilege ON object TO user; gives database privileges. Example: GRANT SELECT, INSERT ON employees TO 'alice'@'localhost'; REVOKE removes privileges. DCL (Data Control Language) manages access control in databases.",6],["dbms","Subqueries, TCL, DCL & Views","Subquery · Correlated Subquery · EXISTS · COMMIT/ROLLBACK · GRANT/REVOKE · Views","What is a VIEW in SQL?","","",["A physical copy of a table","A virtual table based on a stored SELECT query","An index on a table","A temporary table"],1,"A VIEW is a virtual table defined by a SELECT query. It does not store data itself (unless it's a materialized view). Views provide security (hide complex queries/columns), simplicity, and logical data independence.",7],["dbms","Subqueries, TCL, DCL & Views","Subquery · Correlated Subquery · EXISTS · COMMIT/ROLLBACK · GRANT/REVOKE · Views","What is the difference between a Simple View and a Complex View?","","",["No difference","Simple view is based on one table without GROUP BY/functions; Complex view involves joins/aggregates/multiple tables","Simple views can be updated; Complex views always can too","Complex views are faster"],1,"Simple views: based on a single table, no aggregate functions or GROUP BY, generally updatable (DML operations can pass through). Complex views: involve JOINs, GROUP BY, aggregates, DISTINCT, UNION — generally NOT updatable directly.",8],["dbms","Subqueries, TCL, DCL & Views","Subquery · Correlated Subquery · EXISTS · COMMIT/ROLLBACK · GRANT/REVOKE · Views","What does GRANT OPTION allow a user to do?","","",["Grant themselves more privileges","Grant their own privileges to other users","Revoke other users' privileges","Override the admin's privileges"],1,"WITH GRANT OPTION allows the grantee to pass their received privileges to other users. Example: GRANT SELECT ON table TO user WITH GRANT OPTION; Now 'user' can also GRANT SELECT on that table to others.",9],["dbms","Subqueries, TCL, DCL & Views","Subquery · Correlated Subquery · EXISTS · COMMIT/ROLLBACK · GRANT/REVOKE · Views","Which of the following is TRUE about a correlated subquery vs. a regular subquery?","","",["Correlated subquery executes once; regular executes per row","Regular subquery executes once; correlated executes per row of outer query","Both execute exactly once","Both execute per row"],1,"Regular (non-correlated) subquery is independent of the outer query and executes only once. Correlated subquery references the outer query and re-executes for each row processed by the outer query, making it potentially slower but more powerful.",10],["dbms","Indexes, ACID, Storage Engines & Schema","Indexes · ACID Properties · Database Instance vs Schema · MySQL Storage Engines","What is the primary benefit of an INDEX in a database?","","",["Reduces storage space","Speeds up data retrieval (SELECT queries) at the cost of slower writes","Enforces data integrity","Automatically backs up data"],1,"An index creates a separate data structure (typically a B-Tre
